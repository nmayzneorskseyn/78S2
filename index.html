мей, мәмілені жай мүлік сату ретінде рәсімдемек болды.","procedure":"Мәміленің заңдылығына дау туып, тараптар соттан арнайы шектеулер мен рұқсаттар талап етілетінін анықтауды сұрады.","questions":[{"num":1,"type":"single","q":"Стратегиялық объектіні иеліктен шығарғанда алдымен не тексеріледі?","options":["Сатушының басқа клиенттері","Мүліктің логотипі","Сатушының жарнама шығыны","Объектіге қолданылатын арнайы құқықтық режим","Сатып алушы кеңсесінің ауданы","Тараптардың қызметкерлер саны"],"answer":[3],"explanation":"Нақты шешім материалдық құқықтағы құқықтар мен міндеттерді, ал процессуалдық бөлікте талаптың негізін және ұсынылған дәлелдемелерді бағалауға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі және қолданылатын арнайы заңдар."},{"num":2,"type":"multi","q":"Мәмілені құқықтық бағалауда қандай мән-жайлар маңызды?","options":["Сатушының әлеуметтік желідегі белсенділігі","Заңда белгіленген шектеулер","Қажетті келісімдердің бар-жоғы","Сатып алушының кеңсе жиһазы","Компанияның жарнама жоспары","Объектінің құқықтық мәртебесі","Басшының жеке оқу орны"],"answer":[1,2,5],"explanation":"Нақты шешім материалдық құқықтағы құқықтар мен міндеттерді, ал процессуалдық бөлікте талаптың негізін және ұсынылған дәлелдемелерді бағалауға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі және қолданылатын арнайы заңдар."},{"num":3,"type":"single","q":"Сот мәмілені бағалағанда қандай мәселені анықтауы тиіс?","options":["Арнайы заң талаптарының сақталғанын","Компанияның кеңсе орналасқан ауданын","Тараптардың өзге қызметкерлер санын","Басшының жеке табысын","Сатып алушының басқа келісімдерін","Сатушының басқа өнімдері туралы жарнаманы"],"answer":[0],"explanation":"Нақты шешім материалдық құқықтағы құқықтар мен міндеттерді, ал процессуалдық бөлікте талаптың негізін және ұсынылған дәлелдемелерді бағалауға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі және қолданылатын арнайы заңдар."},{"num":4,"type":"multi","q":"Қандай құжаттар құқықтық режимді бағалауға көмектеседі?","options":["Кеңсе дизайны туралы акт","Басшының жеке сапар билеттері","Сатушының басқа клиенттермен хаттары","Объектінің құқықтық мәртебесін растайтын деректер","Заң талап ететін келісімдер туралы құжаттар","Қызметкерлердің еңбек демалысы тізімі","Мәміле туралы шарт жобасы","Компанияның жарнамалық материалдары"],"answer":[3,4,6],"explanation":"Нақты шешім материалдық құқықтағы құқықтар мен міндеттерді, ал процессуалдық бөлікте талаптың негізін және ұсынылған дәлелдемелерді бағалауға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі және қолданылатын арнайы заңдар."}]},{"id":41,"title":"Жұмыс және қызмет","material":"«Самал» ЖШС мердігерге дүкен сөрелерін жасап орнатуды тапсырды. Мердігер жұмысты аяқтағанын айтты, бірақ тапсырыс беруші сөрелердің өлшемі шартқа сай емес екенін анықтады.","procedure":"Мердігер толық ақыны талап етіп сотқа жүгінді. Тапсырыс беруші кемшіліктерді көрсетіп, қабылдау актісіне қол қоймағанын мәлімдеді.","questions":[{"num":1,"type":"single","q":"Бұл шарт бойынша мердігердің негізгі міндеті қандай?","options":["Мердігердің міндеті сөрелерді уақытша пайдалануға беру","Мердігердің міндеті тапсырыс берушіге еңбек күшін ұсыну","Шартқа сай дайын сөрелерді жасап, нәтижесін тапсыру","Мердігердің міндеті сөрелерге материал жеткізумен шектеледі","Мердігердің міндеті жобаны мақұлдаған сәтте аяқталады","Мердігердің міндеті дайын сөрелерді сақтау қызметін көрсету"],"answer":[2],"explanation":"Мердігерлік бойынша орындаушы келісілген жұмыс нәтижесін жасауға және тапсыруға міндеттенеді; материал жеткізу немесе кеңес беру бұл міндетті алмастырмайды.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":2,"type":"multi","q":"Жұмыс нәтижесі мен қызмет көрсетуді ажыратуға қандай белгілер көмектеседі?","options":["Жұмыстың орындалуы ғана орындаушының уақыт жұмсауымен өлшенеді","Нәтижені қабылдау және кемшілігін тексеру мүмкіндігі","Жұмыстың нәтижесі тапсырыс берушінің қабылдауына жатпайды","Жұмыстың келісілген заттай нәтижесінің болуы","Жұмыстың нәтижесі шарт талаптарына сәйкес тексерілмейді","Жұмыс пен қызметтің айырмасы ғана ақы төлеу мерзіміне байланысты","Қызмет көрсетуде әрдайым дербес материалдық нәтиже жасалады"],"answer":[1,3],"explanation":"Жұмыс шартында заттай нәтижені қабылдау және оның кемшіліктерін анықтау мүмкіндігі маңызды; орындаушының мәртебесі мен төлем тәсілі мұны шешпейді.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":3,"type":"single","q":"Сот ең алдымен қай мән-жайды анықтауы керек?","options":["Сөрелердің өлшемін келісу кезіндегі болжамды шығындарды","Мердігердің орындауға кеткен жалпы шығындарын","Сөрелерге жұмсалған материалдардың нарықтық бағасын","Жасалған сөрелердің шарттағы өлшемдерге сәйкестігін","Мердігердің жобалау жұмысына жұмсаған уақытын","Тапсырыс берушінің сөрелерді пайдаланған уақытын"],"answer":[3],"explanation":"Ақы туралы талапты шешу үшін сот орындалған жұмыстың келісілген өлшемдер мен сапаға сай келуін анықтауы қажет.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":4,"type":"multi","q":"Сөрелердің шарттағы өлшемнен ауытқығанын қандай деректер нақты тексеруге мүмкіндік береді?","options":["Мердігердің қабылдауды талап еткен біржақты хабарламасы","Сөрелердің өлшемдері көрсетілген шарт қосымшасы","Орындалған жұмысты тексеру актісі","Өлшеусіз жасалған аяқталу туралы жалпы анықтама","Жұмыстың болжамды бағасын көрсеткен бастапқы ұсыныс","Тапсырыс берушінің ғана жалпы наразылық хаты","Мердігердің өлшемдерді өзі таңдағаны туралы түсінігі","Кемшіліктер туралы тараптардың хат алмасуы"],"answer":[1,2,7],"explanation":"Шарт қосымшасы талап етілетін өлшемдерді, тексеру актісі нақты нәтижені, хат алмасу тараптардың кемшілікке көзқарасын көрсетеді.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."}]},{"id":42,"title":"Интеллектуалдық қызмет нәтижелері","material":"Дизайнер компанияға логотип жасап, дайын файлды жіберді. Шартта файлды тапсыру көрсетілген, бірақ айрықша құқықтың берілуі туралы нақты талап жоқ. Компания логотипті басқа ұйымға сатпақ.","procedure":"Дизайнер айрықша құқықтың берілмегенін айтып, сотқа талап қойды. Компания файл үшін ақша төлегенін алға тартты.","questions":[{"num":1,"type":"single","q":"Дайын файлды тапсыру өздігінен нені білдірмейді?","options":["Файлды алу айрықша құқықты үшінші тұлғаға өткізуге жеткілікті","Файлды беру құқықты барлық тәсілмен пайдалануға рұқсат береді","Файлды жіберу автордың барлық мүліктік құқығын тоқтатады","Файл үшін төлем айрықша құқықты мерзімсіз береді","Логотипке айрықша құқықтың толық берілгенін","Файлды қабылдау құқық берудің жазбаша талабын алмастырады"],"answer":[4],"explanation":"Дайын файлды алу айрықша құқықтың толық ауысқанын білдірмейді; құқық беру мәмілесінің мазмұны жеке анықталады.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":2,"type":"multi","q":"Айрықша құқықтың шарт бойынша берілген көлемін анықтауға қандай талаптар тікелей қатысты?","options":["Айрықша құқықты беру туралы шарт талаптары","Логотипті көрсетуге арналған формат талаптары","Дизайн қызметінің бағасын төлеу мерзімі","Дизайн жұмысының кезең-кезеңімен орындалу кестесі","Логотип файлын жеткізу туралы техникалық талап","Логотипті пайдалану тәсілдері туралы келісім","Дайын файлды қабылдау рәсімінің ұзақтығы"],"answer":[0,5],"explanation":"Айрықша құқықты беру көлемі мен рұқсат етілген пайдалану тәсілдері тараптардың құқықтық келісіміне байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":3,"type":"single","q":"Сотта құқықтың берілуін қай құжат тікелей растай алады?","options":["Дизайнердің файлды жібергені туралы электрондық хаты","Логотип үшін төлем жасалғанын көрсететін түбіртек","Айрықша құқықты беру туралы тараптардың келісімі","Компанияның логотипті жариялаған скриншоты","Файлды қабылдау туралы техникалық хабарлама","Компанияның логотипті баспаға тапсырған шоты"],"answer":[2],"explanation":"Файл үшін төлем немесе оны қабылдау құқығын беру туралы келісімді өздігінен алмастырмайды.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":4,"type":"multi","q":"Дауды шешу үшін сот қандай жайттарды тексеруі тиіс?","options":["Даулы пайдаланудың келісімге сәйкестігін","Файлдың сақталу орнын және көшірме санын","Дизайнердің басқа тапсырыстарының бағасын","Құқық беру туралы келісімнің бар-жоғын","Компанияның логотипке жұмсаған жарнама шығынын","Логотиптің маркетингтік тиімділігін","Құқық берудің нақты көлемін","Файлды жіберудің техникалық форматын"],"answer":[0,3,6],"explanation":"Сот құқық беру келісімінің болуын, оның көлемін және даулы пайдаланудың келісілген шектен шыққан-шықпағанын тексереді.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."}]},{"id":43,"title":"Ақпарат. Қызметтік және коммерциялық құпия","material":"Компания қызметкеріне клиенттер базасына қолжетімділік берді. Компания деректерге қолжетімділікті шектеп, құпиялылық міндетін жазбаша бекіткен. Қызметкер базаны бәсекелеске жіберді.","procedure":"Компания залалды өтеуді талап етті. Қызметкер ақпараттың ашық болғанын айтып, құпия режимінің бар екеніне дау айтты.","questions":[{"num":1,"type":"single","q":"Құпия ақпарат режимін бағалауда қай белгі маңызды?","options":["Ақпаратқа қолжетімділікті шектеу шараларының енгізілуі","Қызметкердің деректерді күнделікті қолдануы","Ақпараттың электрондық файл түрінде болуы","Базадағы клиенттердің көп болуы","Ақпараттың компания серверінде сақталуы","Деректердің бір бөлімге ғана қажет болуы"],"answer":[0],"explanation":"Құпия режимі ақпаратты қорғауға бағытталған нақты қолжетімділік шектеулерімен сипатталады; файл форматы өздігінен жеткіліксіз.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":2,"type":"multi","q":"Коммерциялық құпия туралы дауда қандай жағдайлар ескеріледі?","options":["Құпиялылықты сақтау жөніндегі қабылданған шаралар","Ақпараттың бірнеше жыл бойы сақталуы","Ақпараттың маркетинг үшін пайдаланылуы","Ақпараттың файл атауының құпия болуы","Ақпараттың жалпыға қолжетімді еместігі","Ақпараттың электрондық кестеде берілуі","Ақпараттың ғана компания компьютерінде болуы"],"answer":[0,4],"explanation":"Коммерциялық құпияға қатысты ақпараттың жалпыға ашық еместігі және оны қорғау шаралары маңызды.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":3,"type":"single","q":"Компанияның талабына тікелей қатысты не анықталады?","options":["Қызметкердің құпия деректерді үшінші тұлғаға берген-бермегені","Базаның компанияның жұмысында қанша уақыт қолданылғанын","Базадағы клиенттердің орташа сатып алу бағасын","Компанияның деректерді қанша рет жаңартқанын","Базаның жалпы көлемі мен жолдар санын","Қызметкердің деректерді өз компьютерінде ашқанын"],"answer":[0],"explanation":"Залал талабы бойынша мәліметтің кімге, қашан және қандай негізде берілгені анықталады.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":4,"type":"multi","q":"Құпия режимі мен ақпаратты үшінші тұлғаға беруді дәлелдеуде қай құжаттар шешуші?","options":["Деректерді үшінші тұлғаға жіберу жазбалары","Базаның ішкі резервтік көшірмелер тізімі","Ақпаратқа қолжетімділік ережелері","Компанияның базаны жаңарту жөніндегі нұсқаулығы","Құпиялылық туралы қол қойылған міндеттеме","Қызметкердің ақпаратпен жұмыс істеген уақыт есебі","Деректер базасының бастапқы құрылымын сипаттау","Клиенттер деректерін сақтау жүйесінің сипаттамасы"],"answer":[0,2,4],"explanation":"Құпиялылық міндеттемесі, қолжетімділік ережесі және жіберу жазбалары құқық бұзушылық пен құпия режимін байланыстырады.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."}]},{"id":44,"title":"Материалдық емес игіліктер және жеке құқықтар","material":"Клиника пациенттің суретін және емделу деректерін оның келісімінсіз әлеуметтік желіге жариялады. Пациент суретті алып тастауды және құқықтарының бұзылғанын тануды талап етті.","procedure":"Клиника жарияланым жарнамалық мақсатта жасалғанын айтты. Пациент соттан материалды жоюды және моральдық зиянды өтеуді сұрады.","questions":[{"num":1,"type":"single","q":"Пациенттің қандай құқығына тікелей қол сұғылған?","options":["Пациенттің медициналық ұйымды еркін таңдау құқығына","Пациенттің шарт бағасын келісу құқығына","Пациенттің медициналық қызмет үшін ақы төлеу құқығына","Пациенттің емдеу мерзімін өзгерту құқығына","Пациенттің дәрігерді ауыстыру құқығына","Жеке өмірі мен өз бейнесін қорғау құқығына"],"answer":[5],"explanation":"Адамның бейнесі мен медициналық мәліметтері жеке өмірге қатысты қорғалатын игіліктер; жарнамалық мақсат оларды еркін жариялауға негіз болмайды.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":2,"type":"multi","q":"Пациенттің рұқсатынсыз жарияланған фото мен емдеу мәліметтеріне байланысты қандай құқықтар қорғалады?","options":["Клиниканың жаңа пациенттерді қабылдау құқығы","Адамның өз бейнесін пайдалануға қатысты құқығы","Клиниканың жарнама дизайнын өзгерту құқығы","Клиниканың емдеу бағасын жариялау мүмкіндігі","Клиниканың өз қызметін жарнамалау еркіндігі","Клиниканың жұмыс кестесін хабарлау құқығы","Жеке өмір туралы мәліметтердің құпиялығы"],"answer":[1,6],"explanation":"Дауда бейнені пайдалану құқығы мен жеке өмір құпиялығы қорғалады, клиниканың жарнамалық еркіндігі бұл құқықтарды жоймайды.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":3,"type":"single","q":"Жарияланымға келісім болған-болмағанын кімнің дәлелі анықтай алады?","options":["Пациентке қызмет көрсетілгені туралы шарт","Пациенттің тиісті келісімін көрсететін құжат","Клиниканың жарнама жариялау туралы бұйрығы","Пациенттің емдеу ақысын төлегені туралы түбіртек","Клиниканың әлеуметтік желідегі жарияланымы","Пациенттің клиникаға барғаны туралы тіркеу жазбасы"],"answer":[1],"explanation":"Жариялауға келісімнің нақты мазмұны мен берілуі туралы құжат жарияланымның заңдылығын бағалауға қатысты.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":4,"type":"multi","q":"Сот қай мәселелерді жеке-жеке бағалауы тиіс?","options":["Клиниканың басқа пациенттермен шарттарын","Материалды алып тастау туралы талапты","Жариялауға заңды негіздің бар-жоғын","Пациенттің қызмет ақысын қайта есептеуді","Клиниканың жарнама келісімін тоқтатуды","Жарнаманың көрілім санына сәйкес ақы есептеуді","Клиниканың жарнамалық шығындарын өтеуді","Моральдық зиянды өтеу негіздерін"],"answer":[1,2,7],"explanation":"Сот жариялаудың заңды негізін, құқық бұзуды тоқтату тәсілін және моральдық зиян талаптарының негізін бөлек бағалайды.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."}]},{"id":45,"title":"Мәміле ұғымы және заңи факт","material":"Сатушы сатып алушыға қоймадағы генераторды 900 мың теңгеге сатуға жазбаша ұсыныс жіберді. Сатып алушы баға мен затқа келісетінін хабарлады. Кейін сатушы ұсыныстан бас тартты.","procedure":"Сатып алушы шарт жасалғанын айтып, генераторды беруді талап етті. Сатушы хат алмасу тек алдын ала келіссөз болғанын мәлімдеді.","questions":[{"num":1,"type":"single","q":"Ұсыныс пен қабылдау сәйкес келсе, ол қандай құқықтық нәтиже беруі мүмкін?","options":["Ұсыныс тараптардың келісіміне құқықтық салдар бермейді","Қабылдау шарттың елеулі талаптарын өздігінен өзгертеді","Ұсыныс ғана жеткізу аяқталған соң мәмілеге айналады","Ұсыныс шарт жасасу міндетін барлық жағдайда жояды","Қабылдау сатушыға қарсы жаңа ұсыныс ретінде ғана танылады","Тараптар арасында шарттың жасалуына негіз болады"],"answer":[5],"explanation":"Ұсыныс пен оған сәйкес қабылдау шарт жасасуға негіз бола алады; бұл хат алмасудың нақты мазмұнына байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":2,"type":"multi","q":"Мәміленің жасалғанын бағалауда не маңызды?","options":["Сатып алушының өзге жабдық сатып алу тарихы","Қабылдаудың ұсыныс талаптарына сәйкес келуі","Генератордың техникалық қызмет көрсету құны","Сатушының ұсынысты жіберген байланыс арнасының түрі","Сатып алушының генераторды кейін пайдаланатын жері","Ұсыныста елеулі талаптардың жеткілікті айқын болуы","Сатушының басқа генераторларға берген жеңілдіктері"],"answer":[1,5],"explanation":"Шарттың жасалуын ұсыныстың айқындығы мен қабылдаудың сәйкес келуі анықтайды; басқа сауда бағалары шешуші емес.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":3,"type":"single","q":"Сот алдымен қандай мәселені шешуі тиіс?","options":["Сатушының өзге генераторларға қойған бағасын","Тараптардың хат алмасуынан шарт жасалған-жасалмағанын","Генератордың жөндеу мерзімін және кепілдігін","Сатушының қоймада қанша генератор сақтайтынын","Сатып алушының басқа сатушылармен келіссөзін","Сатып алушының генераторды пайдаланатын мақсатын"],"answer":[1],"explanation":"Сот тараптардың елеулі талаптар бойынша келісімге келген-келмегенін хабарламалар мазмұны арқылы анықтайды.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":4,"type":"multi","q":"Осы хат алмасуда ұсыныс пен қабылдаудың болғанын анықтауға қандай деректер тікелей қажет?","options":["Сатушының жазбаша ұсынысы","Хабарламалардың жіберілген уақыты туралы деректер","Сатушының басқа клиентке жасаған ұсынысы","Генератордың техникалық қызмет көрсету нұсқаулығы","Сатушының ішкі бағалау әдістемесі","Сатып алушының бұрынғы сатып алу шарттары","Генератордың нарықтағы балама модельдері","Сатып алушының қабылдау туралы жауабы"],"answer":[0,1,7],"explanation":"Ұсыныс, қабылдау және олардың жіберілген уақыты шарттың жасалуын бағалауға тікелей қатысты.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."}]},{"id":46,"title":"Мәмілелердің түрлері","material":"«Арай» ЖШС ғимаратты жалға алу туралы шарт жасады; ай сайын ақы төлеу міндеті бар. Кейін екі тарап жалдау ақысын төмендету туралы қосымша келісімге қол қойды.","procedure":"Жалға беруші бастапқы бағамен берешек өндіргісі келді. Жалға алушы екіжақты қосымша келісімді ұсынды.","questions":[{"num":1,"type":"single","q":"Қосымша келісім тараптардың қандай әрекеті болып саналады?","options":["Жалға берушінің біржақты баға хабарламасы","Бұрынғы шарт талаптарын екіжақты өзгерту мәмілесі","Жалдау шартын үшінші тұлғаға беру мәмілесі","Жалдау шартын сыйға тарту мәмілесіне айналдыру","Жалдау нысанасын меншікке беру мәмілесі","Бұрынғы шартты бір тараптың үнсіз тоқтатуы"],"answer":[1],"explanation":"Тараптардың өзара келісімімен жалдау ақысын өзгерту бұрынғы шарттың талабын өзгертуге бағытталған екіжақты мәміле.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":2,"type":"multi","q":"Бұл жағдайда мәмілелердің қандай белгілері көрінеді?","options":["Жалдау шартының екіжақты мәміле болуы","Бағаны өзгерту тараптардың өзара келісімін қажет етпейді","Жалдау шарты ғана жалға алушыға міндет жүктейді","Жалдау шарты міндетті түрде біржақты мәміле болып табылады","Бағаны өзгерту келісімінің екі тарап еркімен жасалуы","Қосымша келісім ғана жалға берушінің еркін білдіреді","Қосымша келісім шарттың өзінен тәуелсіз жасалады"],"answer":[0,4],"explanation":"Екі тараптың өзара келісімі бастапқы шартта да, оны өзгерту жөніндегі қосымша келісімде де маңызды.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":3,"type":"single","q":"Сот қандай бағаны негізге алуды бағалауы тиіс?","options":["Қолданыстағы екіжақты қосымша келісімдегі бағаны","Жалға берушінің ішкі есептегі жоспарлы бағаны","Жалға беруші кейін талап еткен біржақты бағаны","Алғашқы шарттағы өзгертілгенге дейінгі бағаны","Ғимараттың нарықтық бағалауынан шыққан бағаны","Сол ғимараттағы өзге жалға алушылардың бағасын"],"answer":[0],"explanation":"Жарамды қосымша келісім қолданыста болса, төлем осы келісімнің қолданылатын кезеңдегі шарттарына сай есептеледі.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":4,"type":"multi","q":"Төмендетілген жалдау ақысы қай уақыттан және қандай негізде қолданылатынын анықтауда не маңызды?","options":["Жалға берушінің ішкі баға бекіту ережелері","Сол ғимараттағы өзге жалдау шарттарының бағасы","Ғимаратты тәуелсіз бағалаушының жалпы есебі","Келісімнің шартта көзделген нысанда жасалуы","Жалға берушінің бұрынғы баға туралы хабарламасы","Ғимаратты жалға берудің бастапқы ұсыныс бағасы","Келісімге екі тараптың қол қоюы","Келісімнің қай кезеңге қолданылатыны"],"answer":[3,6,7],"explanation":"Сот келісімнің қол қойылуын, қолданылу кезеңін және талап етілетін нысанның сақталуын тексереді.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."}]},{"id":47,"title":"Мәміленің жарамдылық шарттары","material":"Кәмелетке толған азамат өзіне тиесілі автокөлікті сатуға келісімге қол қойды. Сатып алушы қол қою кезінде сатушыға күш көрсетемін деп қорқытқан; бұл туралы хаттар сақталған.","procedure":"Сатушы мәмілені жарамсыз деп тануды сұрады. Сатып алушы қолтаңба бар екенін және шарттың жазбаша жасалғанын айтты.","questions":[{"num":1,"type":"single","q":"Қорқыту ықпалымен жасалған мәміле туралы қандай қорытынды орынды?","options":["Сатып алушының төлемі қорқытуды заңдастырады","Жазбаша нысан сақталғандықтан қысымның құқықтық мәні жоқ","Қорқыту мәмілені барлық жағдайда өздігінен жарамсыз етеді","Мәмілені даулау үшін заңда көзделген негіз туындауы мүмкін","Көлікті беру қорқыту фактісін жоққа шығарады","Қолтаңба болғандықтан ерік білдіру дауланбайды"],"answer":[3],"explanation":"Қорқыту ерік білдіру бостандығына әсер етуі мүмкін; қол қоюдың өзі мәмілені даулау құқығын жоймайды.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":2,"type":"multi","q":"Қорқыту салдарынан сатушының еркі бұзылғанын бағалауда қандай жайттар маңызды?","options":["Көліктің тіркеу куәлігіндегі деректер","Тарап еркінің еркін қалыптасуы","Сатып алушының көлік бағасын төлеу тәсілі","Сатып алушының автокөлікті сақтандыруы","Сатушының көлікті меншікке алған мерзімі","Қорқыту фактісінің мәміле жасауға ықпалы","Автокөліктің техникалық жарамдылық деңгейі"],"answer":[1,5],"explanation":"Ерік білдірудің еркіндігі мен қорқытудың мәміле жасауға ықпалы жарамдылыққа тікелей қатысты.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":3,"type":"single","q":"Сотқа қандай талап қою даудың мәніне сәйкес келеді?","options":["Көлікті тіркеуден мәңгі алып тастау туралы талабын","Сатып алушыны кәсіпкерлік тіркеуден шығару талабын","Көлік өндірушісінен айыппұл өндіру туралы талабын","Сатып алушының көлік құнын төмендету туралы талабын","Қорқыту негізінде мәмілені жарамсыз деп тану туралы талап","Сатушының өзге мәмілелерін тоқтату туралы талабын"],"answer":[4],"explanation":"Сатушы қорқытуға байланысты мәмілені жарамсыз деп тану туралы талап қоя алады; негіз бен мерзім сотта тексеріледі.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":4,"type":"multi","q":"Сот қандай дәлелдемелерді салыстырып бағалауы тиіс?","options":["Сатып алушының төлем қабілеттілігін","Тараптардың бұрынғы шарттарын","Шартқа қол қойылған уақыт пен жағдайды","Көліктің нарықтық бағасы туралы есепті","Көліктің техникалық жай-күйі туралы актіні","Көліктің сақтандыру тарихын","Тараптардың қорқытуға қатысты түсініктемелерін","Қорқыту мазмұны бар хаттарды"],"answer":[2,6,7],"explanation":"Хаттар, мәміле жағдайы және тарап түсініктемелері қорқыту фактісін бағалау үшін өзара салыстырылады.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."}]},{"id":48,"title":"Мәміленің жарамсыздығы және салдары","material":"Азамат өз пәтерін сату шартын жасады. Кейін сот мәмілені заңда көзделген негіз бойынша жарамсыз деп таныды, ал сатып алушы пәтерге көшіп үлгерген және ақшаны төлеген.","procedure":"Сатушы пәтерді қайтаруды, сатып алушы төленген ақшаны қайтаруды талап етті. Тараптар мәміле жарамсыздығының мүліктік салдарына қатысты дауласты.","questions":[{"num":1,"type":"single","q":"Жарамсыз мәміленің жалпы мүліктік салдарының бірі қандай?","options":["Тараптардың барлық басқа мәмілелерін тоқтату","Сатушыға өзге мүлікпен өтемақы беру","Тараптардың алғанын өзара қайтаруы","Пәтерді үшінші тұлғаға міндетті сату","Пәтерді сатып алушыда, ақшаны сатушыда қалдыру","Сатып алушы төлеген ақшаны бюджетке аудару"],"answer":[2],"explanation":"Мәміле жарамсыздығының жалпы салдары ретінде тараптар мәміле бойынша алғанын қайтаруы мүмкін; арнайы ерекшеліктер тексеріледі.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":2,"type":"multi","q":"Екіжақты қайтару міндетінің көлемін анықтау үшін қандай мән-жайлар қажет?","options":["Пәтерге болашақта сұраныстың өзгеру болжамы","Тараптардың бұрынғы сатып алу мәмілелері","Пәтердің басқа аудандағы нарықтық бағасы","Сатып алушының болашақта пәтерді жалға беру ниеті","Қайтарудың заттай мүмкіндігі немесе құнын өтеу мәселесі","Сатушының өзге жылжымайтын мүлкі туралы мәлімет","Тараптардың мәміле бойынша нақты не алғаны"],"answer":[4,6],"explanation":"Қайтару тәсілі нақты берілген мүлік пен ақшаға және заттай қайтару мүмкіндігіне байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":3,"type":"single","q":"Сот қандай мәселені бірінші кезекте негіздеуі керек?","options":["Сатушының өзге жылжымайтын мүлкін","Мәміле жарамсыздығының қолданылатын құқықтық салдарын","Тараптардың басқа мәмілелерін","Пәтердің бұрынғы жалдау кірісін","Пәтердің қазіргі нарықтық бағасын ғана","Сатып алушының бұрынғы мүліктік жағдайын"],"answer":[1],"explanation":"Сот мәміле жарамсыздығының нақты қолданылатын салдарын анықтамайынша қайтару көлемін негіздей алмайды.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":4,"type":"multi","q":"Мүліктік салдарды есептеу үшін не тексеріледі?","options":["Пәтерді беру фактісі","Тараптардың өзге мүлік мәмілелерін","Сатып алушының бұрынғы банк операцияларын","Сатушының басқа жылжымайтын мүлкін","Пәтердің бұрынғы жарнама құнын","Мәміле бойынша алынған мүліктің қайтарылу мүмкіндігі","Пәтердің көршілес үйлердегі бағасын","Ақшаның нақты төленген мөлшері"],"answer":[0,5,7],"explanation":"Мүлікті беру, ақша төлеу және заттай қайтару мүмкіндігі реституция көлемін анықтауға қатысты.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."}]},{"id":49,"title":"Өкілдік: ұғымы және субъектілері","material":"Кәсіпкер компанияға құрал-жабдық сатып алу үшін өкіліне жазбаша сенімхат берді. Сенімхатта белгілі бір модельді 3 млн теңгеден аспайтын бағаға алу көрсетілген. Өкіл 4 млн теңгеге шарт жасады.","procedure":"Компания төлемді кәсіпкерден талап етті. Кәсіпкер өкілдің өкілеттік шегінен асқанын айтты, кейін мәмілені мақұлдамаған.","questions":[{"num":1,"type":"single","q":"Өкілдің 4 млн теңгелік мәмілесі қандай мәселе туғызады?","options":["Берілген өкілеттік шегінен шығу мәселесін","Сенімхаттың мерзімін өздігінен ұзарту құқығын","Сенімхат берушінің басқа мәмілелерін өзгерту құқығын","Өкілдің мәмілені өз атынан жасау құқығын","Кәсіпкердің шартқа қатысуын толық тоқтату құқығын","Өкілдің өкілеттікті басқа тұлғаға шексіз беру құқығын"],"answer":[0],"explanation":"Сенімхаттағы 3 млн теңгелік шектен асып жасалған шарт өкіл өкілеттігінің көлемі туралы мәселе туғызады.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":2,"type":"multi","q":"4 млн теңгелік мәміленің кәсіпкерге міндеттеме туғызуын анықтауда не шешуші?","options":["Өкілдің бұған дейін жасаған өзге мәмілелері","Өкілдің мәмілеге дейінгі кәсіби тәжірибесі","Сатушының тауарды жеткізуге жұмсаған шығыны","Кәсіпкердің басқа жеткізушілермен шарттары","Өкілдік берушінің кейінгі мақұлдауының бар-жоғы","Сатушының ұқсас жабдықтарға қолданатын бағасы","Сенімхатта белгіленген өкілеттік көлемі"],"answer":[4,6],"explanation":"Өкілеттік шегі және кейінгі мақұлдау фактісі мәміленің өкілдік берушіге құқықтық салдарын анықтауға әсер етеді.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":3,"type":"single","q":"Кәсіпкер мәмілені мақұлдамаған болса, сот нені тексеруі керек?","options":["Өкілдің сатып алу туралы ауызша ниетін","Кәсіпкердің басқа сатып алуларын","Компанияның басқа клиенттермен шарттарын","Компанияның бұрынғы сатылымдарының бағасын","Өкілдің өзге тауарларға қатысты тәжірибесін","Өкілдің нақты өкілеттігі мен мәміленің сол шекке сәйкестігін"],"answer":[5],"explanation":"Сот сенімхат мәтінін, мәміле бағасын және кейінгі мақұлдаудың бар-жоғын тексеруге тиіс.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":4,"type":"multi","q":"Өкілеттік туралы дауда қай дәлелдемелер маңызды?","options":["Кәсіпкердің басқа жабдықтарға тапсырысын","Құрал-жабдықты сатып алу шарты","Өкілдің өзге сатып алушылармен хаттарын","Сенімхаттың мәтіні","Компанияның басқа клиенттерге берген шоттарын","Компанияның осы тауарды сатып алған бағасын","Өкілдің өзге жеткізу шарттарын","Кейінгі мақұлдауға қатысты хат алмасу"],"answer":[1,3,7],"explanation":"Сенімхат, шарт және кейінгі хат алмасу өкілеттік пен мақұлдау туралы негізгі дәлелдемелер.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."}]},{"id":50,"title":"Өкілдіктің ұқсас қатынастардан айырмашылығы","material":"Жылжымайтын мүлік агенті пәтер сатушысы мен сатып алушысын таныстырды, көрсетілім өткізді және құжаттарды жеткізді. Сатушы агентке сатып алу-сату шартын өз атынан жасауға өкілеттік бермеген.","procedure":"Агент сатып алушыға пәтерді саттым деп қолхат берді. Сатып алушы агенттің қолхатына сүйеніп, сатушыдан пәтерді беруді талап етті.","questions":[{"num":1,"type":"single","q":"Агенттің көрсетілім өткізуі нені өздігінен білдірмейді?","options":["Делдалдың сатып алушыға кеңес беруін","Делдалдың сатып алушыға объектіні таныстыруын","Делдалдың пәтерді көрсетілімге дайындауын","Делдалдың сатушыға клиент тауып беруін","Сатушы атынан сату мәмілесін жасау өкілеттігін","Делдалдың пәтер туралы ақпарат жеткізуін"],"answer":[4],"explanation":"Объектіні көрсету мен тараптарды таныстыру агентке сатушы атынан сату мәмілесін жасау өкілеттігін өздігінен бермейді.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":2,"type":"multi","q":"Өкілдікке тән, ал жай делдалдық қызметке тән емес қандай белгілер бар?","options":["Делдалдың объектіні сатып алушыға көрсетуі","Өкілдің әрекеті құқықтық салдарды өкілдік беруші үшін туындатуы","Делдалдың сатушыға клиент іздеп беруі","Делдалдың тараптар арасында ақпарат жеткізуі","Өкілдің басқа тұлға атынан құқықтық әрекет жасауы","Делдалдың тараптарды бір-бірімен таныстыруы","Делдалдың сату шарттарын түсіндіруі"],"answer":[1,4],"explanation":"Өкіл құқықтық әрекетті өкілдік берушінің атынан жасайды; делдал тараптарды байланыстырып, ақпарат жеткізумен шектелуі мүмкін.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":3,"type":"single","q":"Сатушыға міндеттеме жүктеу үшін сот нені анықтауы тиіс?","options":["Агенттің қанша пәтер көрсеткенін","Агенттің кеңсе жалдау мерзімін","Агентке сатушы атынан мәміле жасау өкілеттігі берілген-берілмегенін","Сатып алушының өзге пәтерлерді көргенін","Агенттің делдалдық ақысының нарықтық бағасын","Агенттің жарнаманы қай сайтта жариялағанын"],"answer":[2],"explanation":"Сот агенттің сатушы атынан мәміле жасауға нақты өкілеттігі болған-болмағанын анықтайды.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."},{"num":4,"type":"multi","q":"Сот қандай деректерге сүйеніп агенттің мәртебесін бағалайды?","options":["Сатып алушының өзге объектілерді көру тізімін","Агенттің басқа пәтерлерді көрсету актілерін","Сатушы мен агент арасындағы келісімді","Агенттің делдалдық қызмет тарифін","Агенттің қолхатындағы әрекет мазмұнын","Берілген сенімхаттың бар-жоғын","Сатушының пәтерді жарнамалау шығындарын","Агенттің жарнама қызметінің есебін"],"answer":[2,4,5],"explanation":"Сатушы мен агент келісімі, сенімхат және қолхат мазмұны агенттің өкілеттігін анықтауға қатысты.","basis":"ҚР Азаматтық кодексі (Жалпы және Ерекше бөлімдер), ҚР Азаматтық процестік кодексі; қажет болса арнайы заңдар. Нақты бап пен редакция жеке тексеріледі."}]},{"id":51,"title":"Пайда болу негіздеріне қарай өкілдік түрлері","material":"Компания филиалының басшысы компанияның бұйрығымен жеткізу шарттарын келіседі. Басқа жағдайда кәмелетке толмаған баланың анасы баласының мүлкіне қатысты заңда көзделген өкіл ретінде әрекет етеді. Үшінші жағдайда кәсіпкер өз өкілімен шарт жасайды.","procedure":"Үш мәміле бойынша өкілеттіктің пайда болу негізі дауланды. Сот әр өкілдің өкілеттігі қай негізден туындағанын және оның шегін анықтауы керек.","questions":[{"num":1,"type":"single","q":"Баланың анасының өкілдігі қандай негізден туындайды?","options":["Коммерциялық өкілдің шарттық өкілдігі","Ұйым басшысының әкімшілік актісінен туындайтын өкілдік","Кәсіпкерлік шарттан туындайтын өкілдік","Сенімхаттан туындайтын ерікті өкілдік","Заң актілерінде көзделген өкілдік","Сенім ауысуынан туындайтын өкілдік"],"answer":[4],"explanation":"Негізгі құқықтық тұжырым: Заң актілерінде көзделген өкілдік. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Үш жағдайдағы өкілдік негіздерін дұрыс сәйкестендіретін тұжырымдарды таңдаңыз.","options":["Баланың анасына өкілдік ету үшін коммерциялық сенімхат қажет","Ата-ананың баланы өкілдеуі заңнан туындайды","Басшының өкілеттігі ұйымның әкімшілік актісінен туындауы мүмкін","Кәсіпкердің өкілі міндетті түрде заң актісіне сүйенеді","Ұйым басшысының өкілеттігі ғана туыстық қатынастан туындайды","Ата-ананың өкілдігі ұйымның ішкі бұйрығымен пайда болады","Басшының өкілеттігі барлық жағдайда азаматтық-құқықтық шарттан туындайды"],"answer":[1,2],"explanation":"Негізгі құқықтық тұжырым: Басшының өкілеттігі ұйымның әкімшілік актісінен туындауы мүмкін; Ата-ананың баланы өкілдеуі заңнан туындайды. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот өкілдік негізін анықтау үшін нені салыстырады?","options":["Ана мен баланың қатынасын коммерциялық өкілдікке теңестіруді","Әр өкілдің өкілеттігін туындатқан нақты құқықтық негізді","Компания басшысының өкілеттігін ғана сенім ауысуымен түсіндіруді","Өкілдің жеке тәжірибесін өкілеттік негізі ретінде қарауды","Барлық өкілдің өкілеттігін бірдей шарттық негізден туындады деп тануды","Кәсіпкердің тапсырмасын заңды өкілдік деп автоматты тануды"],"answer":[1],"explanation":"Негізгі құқықтық тұжырым: Әр өкілдің өкілеттігін туындатқан нақты құқықтық негізді. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Өкілеттік негізін дәлелдеуге қандай құжаттар тікелей қатысты?","options":["Кәсіпкер мен өкіл арасындағы өкілеттік беретін құжат","Баланың ата-анасы екенін растайтын құжат","Ата-ананың өзге мәмілелеріне берілген сенімхаттар","Басшының басқа ұйымдардағы еңбек шарттары","Ұйым басшысын тағайындау туралы акт","Өкілдердің өкілеттіктен тыс әрекеттеріне арналған жарнама","Кәсіпкердің өкілімен қатысы жоқ жеткізу шарттары","Үш мәміленің біреуіне қатысты нарықтық бағалау есебі"],"answer":[0,1,4],"explanation":"Негізгі құқықтық тұжырым: Кәсіпкер мен өкіл арасындағы өкілеттік беретін құжат; Баланың ата-анасы екенін растайтын құжат; Ұйым басшысын тағайындау туралы акт. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."}]},{"id":52,"title":"Өкілдіктің басқа да түрлері","material":"Сот шешімімен әрекетке қабілетсіз деп танылған азаматтың мүддесін қорғаншысы қорғайды. Сауда компаниясы тұрақты келіссөздер үшін коммерциялық өкілді тартады. Тағы бір адам еш өкілеттігі болмаса да сатушы атынан шарт жасайды.","procedure":"Тараптар өкілдің әрекеті кімге құқықтық салдар туғызатыны жөнінде дауласты. Сот заңды өкілдікті, коммерциялық өкілдікті және өкілеттіксіз әрекетті ажыратуы керек.","questions":[{"num":1,"type":"single","q":"Қорғаншының әрекеті өкілдіктің қай түріне жатады?","options":["Мүлікті басқарудың тапсырма шартына","Сенім ауысуымен берілген өкілеттікке","Өкілеттігі жоқ тұлғаның делдалдық әрекетіне","Әрекетке қабілетсіз адамның заңды өкілдігіне","Кәсіпкердің шарттық коммерциялық өкілдігіне","Ұйым басшысының әкімшілік өкілдігіне"],"answer":[3],"explanation":"Негізгі құқықтық тұжырым: Әрекетке қабілетсіз адамның заңды өкілдігіне. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Берілген жағдайларға қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Қорғаншы әрекетіне өкілеттік шегі қолданылмайды","Коммерциялық өкілдің өкілеттігі заңды өкілдікпен бірдей","Коммерциялық өкіл өкілеттігі берілген кәсіпкер атынан мәміле жасай алады","Өкілеттіксіз жасалған мәміле міндетті түрде өкілдік берушіні байланыстырады","Қорғаншының өкілеттігі кәсіпкерлік шарттан ғана туындайды","Коммерциялық өкіл барлық жағдайда сенімхатсыз шексіз әрекет етеді","Қорғаншы заңда белгіленген шекте әрекет етеді"],"answer":[2,6],"explanation":"Негізгі құқықтық тұжырым: Коммерциялық өкіл өкілеттігі берілген кәсіпкер атынан мәміле жасай алады; Қорғаншы заңда белгіленген шекте әрекет етеді. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Өкілеттіксіз тұлға жасаған шарт бойынша сот нені тексереді?","options":["Өкілеттіксіз әрекетті қорғаншылықтың салдары деп қарауды","Өкілдік беруші мәмілені кейін мақұлдаған-мақұлдамағанын","Мәмілені мақұлдауды ғана үшінші тұлғаның еркімен байланыстыруды","Мәмілені жасасқан орын өкілеттік береді деп тануды","Өкілдің басқа мәмілелерін осы мәмілені мақұлдау деп есептеуді","Өкілдің кәсіпкерлік тіркелуін мақұлдау орнына жеткілікті деп санауды"],"answer":[1],"explanation":"Негізгі құқықтық тұжырым: Өкілдік беруші мәмілені кейін мақұлдаған-мақұлдамағанын. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Өкілдік түрлерін анықтауда қандай деректер қажет?","options":["Қорғаншылықты белгілейтін құжаттар","Мәмілені мақұлдауға қатысы жоқ бұрынғы хаттар","Коммерциялық өкілдің басқа клиенттерімен есептері","Қорғаншының жеке мүліктік шарттары","Коммерциялық өкілдің өкілеттік құжаты","Мәмілеге қатыспаған тұлғаның өкілеттік құжаты","Мәмілені кейін мақұлдау туралы дәлелдер","Өкілдің өзге мәмілелері бойынша сенімхаттар"],"answer":[0,4,6],"explanation":"Негізгі құқықтық тұжырым: Коммерциялық өкілдің өкілеттік құжаты; Мәмілені кейін мақұлдау туралы дәлелдер; Қорғаншылықты белгілейтін құжаттар. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."}]},{"id":53,"title":"Сенімхат түсінігі","material":"Кәсіпкер бухгалтеріне жеткізушіден тауар алуға өкілеттік беретін жазбаша сенімхат жасады. Бухгалтер кәсіпкердің атынан қабылдау актісіне қол қойды. Жеткізуші сенімхаттың заңдық мәніне күмән келтірді.","procedure":"Жеткізуші тауар құнын өндіріп алуға талап қойды. Кәсіпкер бухгалтердің өкілеттігі жеткіліксіз болғанын айтты. Сот сенімхаттың мазмұны мен қол қою өкілеттігін зерттейді.","questions":[{"num":1,"type":"single","q":"Сенімхаттың негізгі құқықтық мақсаты қандай?","options":["Өкілге дербес меншік құқығын беру","Өкілдің өз атынан міндеттеме қабылдауын бекіту","Сенім білдірушінің барлық мүлкін өкілге беру","Тараптардың арасындағы қарыз шартын рәсімдеу","Басқа тұлғаға үшінші тұлғалар алдында өкілдік ету өкілеттігін беру","Сенім білдірушінің барлық міндетін өкілге аудару"],"answer":[4],"explanation":"Негізгі құқықтық тұжырым: Басқа тұлғаға үшінші тұлғалар алдында өкілдік ету өкілеттігін беру. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Сенімхат бойынша өкілдіктің белгілерін таңдаңыз.","options":["Өкілдің өкілеттігі берілген құжаттың шегімен анықталады","Сенімхат өкілді мәміленің дербес тарабына айналдырады","Өкілдің өкілеттігі үшінші тұлғаның келісімімен ғана пайда болады","Сенімхат барлық жағдайда екі тараптың қол қоюын қажет етеді","Сенімхат берілген соң сенім білдіруші мәміле жасай алмайды","Өкіл сенімхаттан тыс барлық мәмілені еркін жасай алады","Өкіл сенім білдірушінің атынан әрекет етеді"],"answer":[0,6],"explanation":"Негізгі құқықтық тұжырым: Өкілдің өкілеттігі берілген құжаттың шегімен анықталады; Өкіл сенім білдірушінің атынан әрекет етеді. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот ең алдымен қандай мәселені шешеді?","options":["Өкілдің қолтаңбасын сенімхатсыз жеткілікті деп тануды","Тауарды қабылдау әрекетін кез келген қызметкер жасай алады деуді","Қабылдау актісіне қол қоюды өкілдің жеке міндеті деп тануды","Бухгалтерге тауарды қабылдау актісіне қол қою өкілеттігі берілген-берілмегенін","Сенімхаттағы өкілеттікті шарттан тәуелсіз кеңейтуді","Бухгалтердің қызметтік атауын шексіз өкілеттік деп есептеуді"],"answer":[3],"explanation":"Негізгі құқықтық тұжырым: Бухгалтерге тауарды қабылдау актісіне қол қою өкілеттігі берілген-берілмегенін. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Өкілеттікті бағалауда қандай деректер маңызды?","options":["Жеткізушінің өзге сатып алушыларымен шарттары","Кәсіпкердің басқа тауарларға қатысты сенімхаттары","Даулы қабылдау актісінің мазмұны","Бухгалтердің өзге өкілдік әрекеттері туралы есептері","Бухгалтердің өзге қызметкерлерге берген тапсырмалары","Тауарды қабылдауға қатысы жоқ төлем құжаттары","Сенімхаттың түпнұсқасы немесе тиісті көшірмесі","Сенімхатта көрсетілген әрекеттердің көлемі"],"answer":[2,6,7],"explanation":"Негізгі құқықтық тұжырым: Сенімхаттың түпнұсқасы немесе тиісті көшірмесі; Даулы қабылдау актісінің мазмұны; Сенімхатта көрсетілген әрекеттердің көлемі. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."}]},{"id":54,"title":"Сенімхатқа қойылатын талаптар. Сенімхат нысаны","material":"Азамат досына жылжымайтын мүлікке қатысты тіркеу әрекеттерін жүргізу үшін қарапайым қолхат берді. Өкіл осы құжатпен арнайы нысан талап етілетін әрекетті орындамақ болды. Құжатта берілген күні де көрсетілмеген.","procedure":"Тіркеуші орган құжатты қабылдамады. Азамат бас тартуға шағымданып, қолхаттың өзі жеткілікті екенін айтты. Дауда сенімхаттың нысаны мен міндетті деректемелері қаралады.","questions":[{"num":1,"type":"single","q":"Берілген күні көрсетілмеген сенімхатқа қандай баға беріледі?","options":["Құжатты тіркеуші қабылдаса жарамды болып саналады","Құжаттағы мерзім жасалған күнді алмастырады","Тараптар кейін келіссе бастапқы кемшілік жойылады","Өкілдің қол қойған күні жасалған күнге теңестіріледі","Мұндай сенімхат жарамсыз болып есептеледі","Нотариус кейін растаған күн құжаттың бастапқы күні болады"],"answer":[4],"explanation":"Негізгі құқықтық тұжырым: Мұндай сенімхат жарамсыз болып есептеледі. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Сенімхаттың нысанын бағалауда қандай талаптар маңызды?","options":["Нотариаттық куәландыру талап етілсе де тараптар оны алып тастай алады","Міндетті нысан сақталмаса да құжат автоматты жарамды болады","Жазбаша құжаттың орнына кез келген ауызша тапсырма жарайды","Заң талап ететін жағдайларда нотариаттық куәландырудың болуы","Жасалған күннің болмауын өкілдің қолтаңбасы алмастырады","Сенімхаттың жазбаша ресімделуі","Нотариаттық куәландыру барлық сенімхатқа бірдей міндетті"],"answer":[3,5],"explanation":"Негізгі құқықтық тұжырым: Заң талап ететін жағдайларда нотариаттық куәландырудың болуы; Сенімхаттың жазбаша ресімделуі. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Құжатты қабылдамау жөніндегі дауда негізгі мәселе қандай?","options":["Өкілдің құжатты ұсынуын міндетті деректемелердің орнына қоюды","Міндетті нотариаттық нысанды қолхатпен алмастыруды","Даулы әрекетке қажетті нысан мен сенімхат деректемелерінің сақталуы","Нысанның сақталуын ғана өкілдің ауызша түсінігімен бағалауды","Жасалған күнді мүліктің тіркелген күнімен алмастыруды","Тіркеушінің қабылдамауын сенімхаттың жарамдылығы деп тануды"],"answer":[2],"explanation":"Негізгі құқықтық тұжырым: Даулы әрекетке қажетті нысан мен сенімхат деректемелерінің сақталуы. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Сот қандай деректерді зерттеуі тиіс?","options":["Өкілдің басқа жылжымайтын мүлік мәмілелері","Өкіл орындағысы келген әрекетке қойылатын талаптарды","Тапсырылған құжаттың нысанын","Басқа мүлікке берілген өкілеттік құжаттары","Сенімхатта жасалған күннің бар-жоғын","Өкілдің бұрынғы нотариаттық іс-әрекеттері","Құжаттағы міндетті деректемелерге қатысы жоқ шарттар","Өтініш берушінің өзге тіркеу өтініштері"],"answer":[1,2,4],"explanation":"Негізгі құқықтық тұжырым: Өкіл орындағысы келген әрекетке қойылатын талаптарды; Сенімхатта жасалған күннің бар-жоғын; Тапсырылған құжаттың нысанын. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."}]},{"id":55,"title":"Сенімхат мазмұны","material":"Кәсіпкер өкіліне кеңсе жабдығын сатып алуға сенімхат берді. Сенімхатта сатып алу бағасының шегі 2 млн теңге деп жазылған. Өкіл 3 млн теңгеге шарт жасап, тауарды қабылдады.","procedure":"Сатушы кәсіпкерден 3 млн теңге талап етті. Кәсіпкер өкілдің баға шегінен асқанын және мәмілені кейін мақұлдамағанын мәлімдеді.","questions":[{"num":1,"type":"single","q":"Сенімхаттағы 2 млн теңгелік шек нені білдіреді?","options":["Сенімхаттың қолданылу мерзімін анықтайды","Өкілдің барлық сатып алуына ортақ борыш мөлшерін белгілейді","Өкілдің жеке мүліктік жауапкершілігін автоматты шектейді","Тауардың кепілдік құнын анықтайды","Сатушыға мәміленің бағасын өздігінен өзгертуге құқық береді","Өкілдің сатып алу өкілеттігінің көлемін шектейді"],"answer":[5],"explanation":"Негізгі құқықтық тұжырым: Өкілдің сатып алу өкілеттігінің көлемін шектейді. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Өкілеттіктің шегін бағалауда не ескеріледі?","options":["Мәміле түрі өкілеттік көлемін анықтауға әсер етпейді","Өкіл сенімхаттағы баға шегін еркін өзгерте алады","Сенімхатта көрсетілген баға шектеуі","Сенімхатта көрсетілген мәміле түрі","Өкілдік берушінің мақұлдауы ешқашан есепке алынбайды","Өкілдің жеке келісімі сенімхаттағы шекті алмастырады","Сатушының келісімі өкілге қосымша өкілеттік береді"],"answer":[2,3],"explanation":"Негізгі құқықтық тұжырым: Сенімхатта көрсетілген мәміле түрі; Сенімхатта көрсетілген баға шектеуі. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Кәсіпкерді шартпен байланыстыру мәселесінде сот нені анықтайды?","options":["Өкілеттіктен асқан мәміленің кейін мақұлданған-мақұлданбағанын","Сенімхаттағы шекті тараптардың ауызша бағасымен алмастыруды","Өкілдің мәміле жасасқанын мақұлдауға теңестіруді","Өкілдің өкілеттігін сатып алу бағасына қарамастан шексіз деп есептеуді","Кәсіпкердің үнсіздігін кез келген жағдайда мақұлдау деп тануды","Сатушының шартқа қол қоюын кәсіпкердің мақұлдауы деп тануды"],"answer":[0],"explanation":"Негізгі құқықтық тұжырым: Өкілеттіктен асқан мәміленің кейін мақұлданған-мақұлданбағанын. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Дауды шешуге қандай құжаттар тікелей қатысты?","options":["Баға шегі жазылған сенімхат","Өкілдің басқа жеткізушілерге жазған хаттары","Өкілдің басқа мәмілелеріне арналған сенімхат","Кейінгі мақұлдау жөніндегі хат алмасу","Сатушының өзге сатып алушылармен шарттары","Кәсіпкердің өзге мүліктерге берген тапсырмалары","3 млн теңгелік сатып алу шарты","Сатып алу нысанасына қатысы жоқ есептер"],"answer":[0,3,6],"explanation":"Негізгі құқықтық тұжырым: 3 млн теңгелік сатып алу шарты; Кейінгі мақұлдау жөніндегі хат алмасу; Баға шегі жазылған сенімхат. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."}]},{"id":56,"title":"Сенімхат мерзімі","material":"Азамат 2024 жылғы 10 қаңтарда өкіліне автокөлік сатуға сенімхат берді. Құжатта қолданылу мерзімі көрсетілмеген. Өкіл 2025 жылғы желтоқсанда көлікті сатуға әрекет жасады.","procedure":"Сатып алушы сенімхаттың мерзімі бітпегенін айтты. Азамат мерзімі көрсетілмеген сенімхаттың әрекеті туралы дауласты. Сот жасалған күн мен қолданылу мерзімін салыстырады.","questions":[{"num":1,"type":"single","q":"Мерзімі көрсетілмеген сенімхаттың жалпы қолданылу уақыты қандай?","options":["Мәміле жасалғанға дейінгі кез келген мерзім","Берілген күнінен бастап үш жыл","Берілген күнінен бастап екі жыл","Берілген күнінен бастап алты ай","Берілген күнінен бастап бір жыл","Өкілдің алғашқы әрекетінен бастап бір жыл"],"answer":[4],"explanation":"Негізгі құқықтық тұжырым: Берілген күнінен бастап бір жыл. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Мерзімді анықтауға қандай мән-жайлар тікелей әсер етеді?","options":["Сенім білдірушінің басқа сенімхаттары осы мерзімді ұзартады","Сатып алушының келісімі сенімхаттың мерзімін белгілейді","Сенімхаттың жасалған күні","Мәміленің бағасы сенімхаттың мерзімін анықтайды","Сенімхатта мерзімнің көрсетілген-көрсетілмегені","Өкілдің құжатты алған күні мерзімнің басталуын анықтайды","Өкілдің алғашқы әрекеті жасалған күнді алмастырады"],"answer":[2,4],"explanation":"Негізгі құқықтық тұжырым: Сенімхаттың жасалған күні; Сенімхатта мерзімнің көрсетілген-көрсетілмегені. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"2025 жылғы желтоқсандағы мәміле үшін сот нені тексереді?","options":["Мерзімнің аяқталуын ғана сенімхат кері қайтарылғанда ғана тануды","Автокөлік сатылмағандықтан мерзім аяқталмаған деп есептеуді","Өкілдің бұрынғы мәмілелері мерзімді жаңартты деп тануды","Сенімхаттың осы күні әлі күшінде болған-болмағанын","Сатып алушының келісімімен өкілеттік мерзімін өзгертуге болады деуді","Өкілдің 2025 жылы әрекет еткенін мерзімнің ұзартылуы деп тануды"],"answer":[3],"explanation":"Негізгі құқықтық тұжырым: Сенімхаттың осы күні әлі күшінде болған-болмағанын. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Сенімхаттың мерзіміне қатысты қандай дәлелдер маңызды?","options":["Автокөліктің бұрынғы тіркеу күндері","Көліктің техникалық байқау мерзімі","Өкілдің өзге тапсырмаларды орындау мерзімі","Сатып алушының басқа сенімхаттарының мерзімі","Өкілдің өзге мәмілелерінің жасалған күндері","Құжаттағы қолданылу мерзімі туралы талап","Құжаттағы жасалған күн","Мәміле жасалған нақты күн"],"answer":[5,6,7],"explanation":"Негізгі құқықтық тұжырым: Құжаттағы қолданылу мерзімі туралы талап; Мәміле жасалған нақты күн; Құжаттағы жасалған күн. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."}]},{"id":57,"title":"Сенімхат түрлері","material":"Кәсіпкер өкіліне қоймадан тауар алуға бір жолғы сенімхат, ал басқа өкіліне белгілі кезең бойы тауар жеткізушілермен мәміле жасауға сенімхат берді. Үшінші өкілге бірнеше әртүрлі мүліктік әрекет жасау өкілеттігі берілген.","procedure":"Жеткізуші екінші өкілдің өкілеттігін тек бір қабылдау актісімен шектегісі келді. Сот сенімхаттағы әрекеттер көлемін анықтайды.","questions":[{"num":1,"type":"single","q":"Бір нақты тауар партиясын алуға берілген сенімхат қалай сипатталады?","options":["Әртүрлі өкілеттікті қамтитын жалпы сенімхат","Заң актісіне негізделген өкілдік","Басқа өкілге берілген сенім ауысуы","Тұрақты коммерциялық өкілдік","Бір жолғы әрекетті орындауға берілген сенімхат","Бірнеше мәмілеге арналған арнайы сенімхат"],"answer":[4],"explanation":"Негізгі құқықтық тұжырым: Бір жолғы әрекетті орындауға берілген сенімхат. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Сенімхат түрлерін ажыратуда қандай белгілер маңызды?","options":["Өкілдің қызмет ақысы сенімхат түрін анықтайды","Сенімхат түрі тауардың нарықтық құнымен анықталады","Әрбір сенімхат міндетті түрде бір ғана әрекетке беріледі","Өкілеттік берілген әрекеттердің ауқымы","Жалпы сенімхатта нақты өкілеттік шегі болмайды","Сенімхатта көзделген әрекеттердің қайталану мүмкіндігі","Арнайы сенімхат барлық мүлікті шектеусіз басқаруға беріледі"],"answer":[3,5],"explanation":"Негізгі құқықтық тұжырым: Өкілеттік берілген әрекеттердің ауқымы; Сенімхатта көзделген әрекеттердің қайталану мүмкіндігі. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот екінші өкілдің өкілеттігін қалай анықтайды?","options":["Бір қабылдау актісі барлық болашақ өкілеттікті жояды деуді","Бірінші өкілдің сенімхат көлемін екіншісіне қолдануды","Жеткізушінің келісімін өкілеттіктің дербес негізі деп тануды","Үшінші өкілдің өкілеттігін барлық өкілге теңестіруді","Өкілдің жеке тәжірибесін сенімхат мәтінінен жоғары қоюды","Сенімхатта көрсетілген әрекеттер мен олардың көлеміне сүйенеді"],"answer":[5],"explanation":"Негізгі құқықтық тұжырым: Сенімхатта көрсетілген әрекеттер мен олардың көлеміне сүйенеді. Берілген жағдайдағы , өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Сенім ауысуының заңдылығын бағалауда не маңызды?","options":["Екінші өкілге бастапқыдан кең өкілеттік беруге болады","Сенім ауысуы бастапқы сенімхаттан тәуелсіз жасалады","Сенім ауысуына берілген рұқсат нысан талаптарын алмастырады","Бастапқы сенімхаттың сенім ауысуына мүмкіндік беруі","Өкілдің өзге тапсырмалары сенім ауысуына рұқсат береді","Сатушының келісімі бастапқы сенімхаттың шегін өзгертеді","Қайта берілген өкілеттіктің бастапқы шектен аспауы"],"answer":[3,6],"explanation":"Негізгі құқықтық тұжырым: Қайта берілген өкілеттіктің бастапқы шектен аспауы; Бастапқы сенімхаттың сенім ауысуына мүмкіндік беруі. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот қандай мәселені анықтауы керек?","options":["Сенім ауысуын өкілдің жеке міндеттемесі деп тануды","Сатушының мәмілені қабылдауын сенім ауысуына теңестіруді","Екінші өкілдің өз қалауы өкілеттікке жеткілікті деп тануды","Бастапқы сенімхаттың мерзімін екінші құжатпен ұзартуды","Екінші өкілге өкілеттік заңда көзделген тәртіппен берілген-берілмегенін","Бастапқы өкілеттік шегінен асып берілген тапсырманы жарамды деуді"],"answer":[4],"explanation":"Негізгі құқықтық тұжырым: Екінші өкілге өкілеттік заңда көзделген тәртіппен берілген-берілмегенін. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Сенім ауысуының дәлелдемелеріне не жатады?","options":["Екінші өкілдің басқа тауарларды сатып алуы","Өкілеттікті беру туралы хабарлау деректері","Бастапқы сенімхатқа қатысы жоқ құжаттар","Сенім ауысуын ресімдеген құжат","Екінші өкілдің  Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."}]},{"id":60,"title":"Сенімхаттың тоқтатылуының салдары","material":"Азамат өкіліне автокөлігін сатуға сенімхат берді, кейін сенімхатты кері қайтарды. Өкіл бұл туралы білді, бірақ сатып алушыға хабарламады. Сатып алушы сенімхаттың тоқтағанын білмегенін айтты.","procedure":"Сатып алушы шартты орындауды талап етті. Азамат сенімхат тоқтаған соң жасалған мәміле өзіне міндет жүктемейтінін айтты. Сот үшінші тұлғаның хабардарлығын да бағалауы керек.","questions":[{"num":1,"type":"single","q":"Сенімхат тоқтаған соң өкілдің негізгі міндеті қандай?","options":["Өзіне берілген өкілеттіктің тоқтағанын ескеріп, өкілдік әрекеттерді тоқтату","Тоқтаған сенімхатты жаңа өкілге өздігінен беру","Өкілеттік мерзімін өкілдің өзі жаңарту","Тоқтатылған сенімхатпен жаңа шарттар жасауды жалғастыру","Өкілдік берушінің хабарламасын елемей өкілеттікті сақтау","Өкілдік берушінің мүлкін өз атынан басқаруды жалғастыру"],"answer":[0],"explanation":"Негізгі құқықтық тұжырым: Өзіне берілген өкілеттіктің тоқтағанын ескеріп, өкілдік әрекеттерді тоқтату. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Үшінші тұлғамен жасалған мәміленің салдарын бағалауда не маңызды?","options":["Өкілдің жеке пікірі тоқтатудың күшін анықтайды","Өкілдің сенімхаттың тоқтағанын білуі","Өкілдің хабардарлығы мәміленің салдарына әсер етпейді","Үшінші тұлға хабардар болмаса да барлық құқық міндетті түрде жойылады","Сенімхат тоқтаған соң барлық бұрынғы мәміле жойылады","Үшінші тұлғаның тоқтау туралы білген-білмегені","Үшінші тұлғаның хабардарлығы ешқандай құқықтық мәнге ие емес"],"answer":[1,5],"explanation":"Негізгі құқықтық тұжырым: Өкілдің сенімхаттың тоқтағанын білуі; Үшінші тұлғаның тоқтау туралы білген-білмегені. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот қандай мән-жайды жеке анықтауы керек?","options":["Өкілдің басқа өкілдік тапсырмаларын","Өкілдің басқа сатып алушыларға айтқан сөздерін","Сатып алушы мәміле кезінде өкілеттіктің тоқтағанын білді ме","Сатып алушының өзге мәмілелеріндегі хабардарлығын","Сатып алушының басқа сенімхаттар туралы білімін","Көліктің бұрынғы тіркеу құжаттарын"],"answer":[2],"explanation":"Негізгі құқықтық тұжырым: Сатып алушы мәміле кезінде өкілеттіктің тоқтағанын білді ме. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Тараптардың хабардарлығын анықтауға қандай дәлелдер көмектеседі?","options":["Көліктің бұрынғы сатып алу құжаттары","Сатып алушының басқа сатушылармен хат алмасуы","Сенімхатты кері қайтарып алу туралы құжат","Хабарламалардың жеткізілген уақыты туралы деректер","Өкілдің өзге сенімхаттары бойынша хабарламалар","Өкілдің басқа клиенттерге жіберген ескертулері","Сенім білдірушінің басқа мүлікке тапсырмалары","Өкіл мен сатып алушыға жіберілген хабарламалар"],"answer":[2,3,7],"explanation":"Негізгі құқықтық тұжырым: Өкіл мен сатып алушыға жіберілген хабарламалар; Сенімхатты кері қайтарып алу туралы құжат; Хабарламалардың жеткізілген уақыты туралы деректер. Берілген жағдайдағы өкілеттік, құжаттың мазмұны және әрекеттің жасалған уақыты бойынша бағаланады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), өкілдік және сенімхат туралы ережелер; ҚР Азаматтық процестік кодексі."}]},{"id":61,"title":"Субъективтік азаматтық құқықтардың жүзеге асырылуы түсінігі. Азаматтық құқықтарды жүзеге асырудың түрлері. Азаматтық құқықтарды жүзеге асырудың шегі. Азаматтық құқықтарды жүзеге асырудан бас тарту.","material":"Азамат өзіне тиесілі қойманы жалға беруге шешім қабылдады. Көршісі жалға беруге қарсы болды, бірақ оның заңмен қорғалатын құқығына нақты кедергі келтірілген жоқ. Кейін азамат қоймаға кіретін ортақ жолды өз еркімен бөгеп, көршінің өтуіне кедергі жасады.","procedure":"Көрші жолға кедергіні жою туралы талап қойды. Қойма иесі мүлікті өз қалауы бойынша пайдалануға құқылы екенін айтты. Сот құқықты жүзеге асырудың шегін және басқа тұлғаның мүддесін анықтайды.","questions":[{"num":1,"type":"single","q":"Қойманы жалға беру әрекеті қандай құқықты жүзеге асыруға жатады?","options":["Жалға алу шартын жасасумен қойманы иесіз мүлікке айналдыруды","Қойманы жалға беру арқылы өзге меншік иесінің құқығын жоюды","Меншік иесінің мүлкін пайдалану және оған билік ету құқығын іске асыру","Қойманы жалға беру арқылы сервитутты біржақты тоқтатуды","Жалға алушының өз атынан қоймаға меншік құқығын алуын","Жалға алушының құқығын тіркеусіз меншік құқығына айналдыруды"],"answer":[2],"explanation":"Дұрыс жауап: Меншік иесінің мүлкін пайдалану және оған билік ету құқығын іске асыру. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Азаматтық құқықтарды жүзеге асыру туралы дұрыс тұжырымдарды таңдаңыз.","options":["Көршінің өту құқығы меншік иесінің шешімімен бірден жойылады","Меншік иесі көршінің құқықтарын ескермей әрекет ете алады","Ортақ жолға кедергі қою құқықты адал жүзеге асыруға жатады","Құқықты жүзеге асыру басқа тұлғаларға зиян келтіруге рұқсат береді","Құқық иесі өз құқығын заң шегінде жүзеге асырады","Құқықты жүзеге асыру өзге адамдардың құқықтарын бұзбауға тиіс","Құқықты жүзеге асыру шектері тараптардың еркімен толық жойылады"],"answer":[4,5],"explanation":"Дұрыс жауап: Құқықты жүзеге асыру өзге адамдардың құқықтарын бұзбауға тиіс; Құқық иесі өз құқығын заң шегінде жүзеге асырады. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот қойма иесінің жолды бөгеген әрекетін қалай бағалайды?","options":["Жолды бөгеген сәттен бастап сервитутты жойған әрекет ретінде","Жолды бөгегені үшін көршінің құқығын тоқтататын әрекет ретінде","Өзге тұлғаның құқықтарына кедергі келтіретін әрекет ретінде","Өтуге кедергіні меншік құқығын қорғаудың міндетті тәсілі ретінде","Ортақ жолға кедергіні көршінің келісімі ретінде","Жолды бөгеген сәттен бастап жолға жеке меншік алу ретінде"],"answer":[2],"explanation":"Дұрыс жауап: Өзге тұлғаның құқықтарына кедергі келтіретін әрекет ретінде. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Жолды ашу туралы талапты қарауда не маңызды?","options":["Жолды пайдалануға қатысы жоқ қойма құжаттары","Өтуге нақты кедергі жасалғаны","Қоймаға жасалған өзге сақтандыру шарттары","Меншік иесінің өзге жер учаскелеріне билік ету құжаттары","Жолды пайдалануға қатысты құқықтың бар-жоғы","Кедергіні жоюдың талап етілетін тәсілі","Көршінің басқа учаскелерге өту құқықтары","Қойманы жалға беру шартының басқа шарттардағы бағасы"],"answer":[1,4,5],"explanation":"Дұрыс жауап: Кедергіні жоюдың талап етілетін тәсілі; Өтуге нақты кедергі жасалғаны; Жолды пайдалануға қатысты құқықтың бар-жоғы. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":62,"title":"Құқықты теріс пайдалану түсінігі.","material":"Екі көршінің жер учаскелері ортақ өтетін жолға жалғасады. Бір меншік иесі көршісін келісімге мәжбүрлеу мақсатында жолға ауыр бетон блоктар қойып, өзіне пайда әкелмейтін кедергі жасады.","procedure":"Көрші соттан кедергіні жоюды сұрады. Жауапкер өз жеріне меншік құқығын алға тартты. Сот құқықты теріс пайдалану белгілерін зерттейді.","questions":[{"num":1,"type":"single","q":"Құқықты теріс пайдаланудың осы кейстегі ықтимал белгісі қандай?","options":["Өту жолын екі меншік иесінің келісімімен белгілеуден","Жерге құқықты заңда белгіленген тәртіппен тіркеуден","Жер учаскесін рұқсат етілген мақсатқа сай пайдаланудан","Жерді меншік иесінің күнделікті пайдалануынан","Құқықты басқа тұлғаға негізсіз кедергі келтіру мақсатында пайдалану","Көршінің жерге қатысты сервитутын заңды орындаудан"],"answer":[4],"explanation":"Дұрыс жауап: Құқықты басқа тұлғаға негізсіз кедергі келтіру мақсатында пайдалану. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Құқықты теріс пайдалануды анықтауға қандай мән-жайлар әсер етеді?","options":["Бөтен құқыққа кедергі келтіру әрқашан меншік құқығын қорғайды","Меншік құқығы бар адамның кез келген әрекеті адал деп танылады","Құқықты теріс пайдалану үшін әрекеттің салдары ескерілмейді","Әрекеттің өзге тұлғаға зиян келтіруге бағытталуы","Кедергінің мақсаты құқықты теріс пайдалануды анықтауға әсер етпейді","Өзгенің құқығына зиян келтіру құқықты жүзеге асыру шегі емес","Кедергінің құқықты адал жүзеге асыру шегінен шығуы"],"answer":[3,6],"explanation":"Дұрыс жауап: Әрекеттің өзге тұлғаға зиян келтіруге бағытталуы; Кедергінің құқықты адал жүзеге асыру шегінен шығуы. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Жауапкердің меншік құқығына сілтемесі неліктен жеткіліксіз?","options":["Меншік құқығы бар тұлғаның әрекеті ешқашан шектелмейді","Жер иесінің әрекетіне азаматтық құқық қағидалары қолданылмайды","Құқықты теріс пайдалану меншік құқығының міндетті белгісі","Өзге адамның өту құқығы сотта зерттелуге жатпайды","Меншік құқығын жүзеге асыру өзгенің құқықтарын бұзуға негіз бола алмайды","Жер иесінің әрекеті меншік құқығын автоматты түрде жояды"],"answer":[4],"explanation":"Дұрыс жауап: Меншік құқығын жүзеге асыру өзгенің құқықтарын бұзуға негіз бола алмайды. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Сот құқықты теріс пайдалануды бағалағанда нені тексереді?","options":["Блоктардың қойылған нақты орнын","Жер иесінің өзге сервитут шарттарының мәтіндері","Кедергі жасаудың мақсаты мен салдарын","Көршінің өзге жер даулары бойынша сот шешімдері","Бөгелген жолға қатысы жоқ жерге құқық құжаттары","Көршінің басқа учаскелеріне қатысты құқықтық негіздер","Жер иесінің басқа жолдарды пайдалану келісімдері","Көршінің жолды пайдалану құқығын"],"answer":[0,2,7],"explanation":"Дұрыс жауап: Кедергі жасаудың мақсаты мен салдарын; Блоктардың қойылған нақты орнын; Көршінің жолды пайдалану құқығын. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":63,"title":"Азаматтық құқықтарды қорғау түсінігі. Азаматтық құқықтық субъективті қорғау.","material":"Компанияның мүлкіне қатысты жалған құжат жасалып, үшінші тұлға өзін меншік иесі деп көрсетіп, мүлікті басқаруға кірісті. Компания құжаттың жалғандығын біліп, өз құқығын қорғауға жүгінді.","procedure":"Компания сотқа меншік құқығын тану және заңсыз әрекеттерді тоқтату туралы талап берді. Жауапкер құжатқа сүйеніп қарсы уәж келтірді.","questions":[{"num":1,"type":"single","q":"Компанияның сотқа жүгінуі нені білдіреді?","options":["Бұзылған немесе даулы азаматтық құқықты қорғау тәсілін қолдануды","Мүлікке меншік құқығын жауапкерге ерікті түрде өткізуді","Мүлікті басқаруға жауапкерге жаңа өкілеттік беруді","Компанияның даулы құқықтан бас тартуын рәсімдеуді","Даулы мүлікті иесіз деп тануды сұрауды","Жауапкердің жалған құжатын меншік құқығы деп тануды"],"answer":[0],"explanation":"Дұрыс жауап: Бұзылған немесе даулы азаматтық құқықты қорғау тәсілін қолдануды. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Азаматтық құқықтарды қорғау туралы дұрыс тұжырымдарды таңдаңыз.","options":["Құқық бұзушылыққа әкелетін әрекеттерді тоқтату талап етілуі мүмкін","Құқықты қорғау үшін меншік құқығынан бас тарту қажет","Жалған құжат құқықты танудың жеткілікті дәлелі болады","Мүлікке құқықты қорғау ғана жауапкердің келісімімен мүмкін","Даулы құқықты тану қорғау тәсілдерінің бірі болуы мүмкін","Заңсыз әрекетті тоқтатуды талап ету азаматтық қорғауға жатпайды","Даулы құқықты сот тәртібімен тану қорғау тәсілі емес"],"answer":[0,4],"explanation":"Дұрыс жауап: Құқық бұзушылыққа әкелетін әрекеттерді тоқтату талап етілуі мүмкін; Даулы құқықты тану қорғау тәсілдерінің бірі болуы мүмкін. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот қандай негізгі дауды шешеді?","options":["Жауапкердің басқа мүліктерге қатысты құқықтарының көлемін","Мүліктің нарықтық бағасын ғана","Жалған құжатты жасаған тұлғаның басқа мәмілелерін","Мүлікке құқық кімге тиесілі және ол бұзылған ба","Компанияның өзге мүліктеріне қатысты құқықтарын","Компанияның басқа шарттарын орындау сапасын"],"answer":[3],"explanation":"Дұрыс жауап: Мүлікке құқық кімге тиесілі және ол бұзылған ба. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Компанияның құқығын қорғау үшін қандай дәлелдер қажет?","options":["Жауапкердің өзге мүліктерді пайдалану актілері","Жауапкердің мүлікке қатысты нақты әрекеттері","Мүлікке құқықты растайтын құжаттар","Даулы құжаттың жасалу жағдайлары","Компанияның өзге мүлікке берген сенімхаттары","Компанияның даулы мүлікке қатысы жоқ құжаттары","Даулы мүлікке қатысы жоқ тіркеу құжаттары","Жауапкердің өзге мүліктерге меншік куәліктері"],"answer":[1,2,3],"explanation":"Дұрыс жауап: Жауапкердің мүлікке қатысты нақты әрекеттері; Даулы құжаттың жасалу жағдайлары; Мүлікке құқықты растайтын құжаттар. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":64,"title":"Азаматтық құқықты қорғаудың тәсілдері мен нысандары.","material":"Мердігер тапсырыс берушінің құрылғысын шартсыз ұстап қалды және оны қайтарудан бас тартты. Тапсырыс беруші құрылғының өзіне тиесілі екенін және оны пайдалана алмай отырғанын көрсетті.","procedure":"Тапсырыс беруші соттан құрылғыны қайтаруды және келтірілген залалды өтеуді сұрады. Сот талаптардың құқықты қорғаудың қандай тәсілдеріне жататынын бағалайды.","questions":[{"num":1,"type":"single","q":"Құрылғыны заңсыз иеленуден қайтару туралы талап қай қорғау тәсіліне жатады?","options":["Құрылғыға кепіл құқығын автоматты түрде орнатуға","Құрылғыға меншік құқығын мердігерге тануға","Құрылғыны ортақ меншікке айналдыруға","Құрылғыны жалға алу шартын ұзартуды талап етуге","Құрылғыны мердігердің меншігіне өтеусіз беруге","Мүлікті бөтеннің заңсыз иеленуінен талап етіп алуға"],"answer":[5],"explanation":"Дұрыс жауап: Мүлікті бөтеннің заңсыз иеленуінен талап етіп алуға. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Осы дауда қолданылуы мүмкін қорғау тәсілдерін таңдаңыз.","options":["Құрылғыны ұстап қалу негізін зерттемей заңды деп тану","Құрылғыға қатысты тапсырыс берушінің құқығын тоқтату","Мүлікті заңсыз иеленуден қайтаруды талап ету","Құрылғыны мердігерге меншікке беру туралы талап","Дәлелденген залалды өтеуді талап ету","Құрылғыны мердігердің өз мүлкі деп тіркеу","Құрылғыны қайтарудан бас тартуды заңды деп тану"],"answer":[2,4],"explanation":"Дұрыс жауап: Дәлелденген залалды өтеуді талап ету; Мүлікті заңсыз иеленуден қайтаруды талап ету. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Залалды өтеу талабын қарауда сот нені анықтайды?","options":["Залалды талапкердің дәлелінсіз толық өндіріп алуды","Залалдың мөлшерін құрылғы бағасымен автоматты теңестіруді","Залалды мердігердің өзге шарттарымен есептеуді","Залалдың болуы, мөлшері және құқық бұзушылықпен байланысын","Залал мөлшерін мердігердің жеке пікірімен анықтауды","Залал мен құқық бұзушылық байланысын тексермеуді"],"answer":[3],"explanation":"Дұрыс жауап: Залалдың болуы, мөлшері және құқық бұзушылықпен байланысын. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру ше
