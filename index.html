ын қалай анықтайды?","options":["Талапкердің мүлікті қайтаруды емес, пайдалануға кедергіні жоюды сұрағанын анықтайды","Көршінің әрекеті кез келген жағдайда шарттық дау болып табылады","Жауапкердің кедергі жасауы міндетті түрде меншік құқығын өткізеді","Кедергіні жою талабы мүлікті қайтару талабымен бірдей","Талапкердің мүлікті иеленуі құқықтық мәнге ие емес","Пәтерді пайдалануға кедергі жасау меншік құқығын автоматты тоқтатады"],"answer":[0],"explanation":"Құқықтық негіз: ҚР АК 259, 260, 264, 265-баптар. Талапкердің мүлікті қайтаруды емес, пайдалануға кедергіні жоюды сұрағанын анықтайды. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 259, 260, 264, 265-баптар"},{"num":4,"type":"multi","q":"Сот қандай дәлелдемелерді зерттейді?","options":["Кедергінің пәтерді пайдалануға әсері","Көршінің басқа мекенжайлары","Дәліздің бұрынғы жөндеу сметасы","Пәтерге құқықты растайтын құжат","Көршінің басқа тұрғындармен шарттары","Пәтердің нарықтық құны","Дәлізге қойылған кедергінің дәлелдері","Талапкердің өзге пәтерлері туралы құжат"],"answer":[0,3,6],"explanation":"Құқықтық негіз: ҚР АК 259, 260, 264, 265-баптар. Кедергінің пәтерді пайдалануға әсері Пәтерге құқықты растайтын құжат Дәлізге қойылған кедергінің дәлелдері. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 259, 260, 264, 265-баптар"}]},{"id":88,"title":"Меншік құқығын тану туралы талап. Меншік құқығын тану туралы талап бойынша талап қоюшы мен жауапкер.","material":"Азамат сатып алу-сату шарты бойынша гараж алғанын айтады. Басқа тұлға гараж өзіне тиесілі екенін көрсетіп, тіркеу құжаттарына сүйенеді. Екі тарап та меншік құқығын мәлімдейді.","procedure":"Талапкер меншік құқығын тануды сұрады. Сот тараптардың құқық белгілейтін құжаттарын, меншік құқығының пайда болу негізін және жауапкердің қарсы уәждерін тексереді.","questions":[{"num":1,"type":"single","q":"Меншік құқығын тану туралы талаптың негізгі мақсаты қандай?","options":["Талапкердің меншік құқығын ерікті тоқтату","Гаражды кез келген тұлғадан жалға алу","Гаражды міндетті түрде мемлекет меншігіне беру","Гаражды кепілге қою құқығын беру","Жауапкердің өзге мүліктерін тәркілеу","Даулы мүлікке талапкердің меншік құқығы бар екенін сот тәртібімен бекіту"],"answer":[5],"explanation":"Құқықтық негіз: ҚР АК 259-бап. Даулы мүлікке талапкердің меншік құқығы бар екенін сот тәртібімен бекіту. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 259-бап"},{"num":2,"type":"multi","q":"Осы талап бойынша тараптарды анықтайтын тұжырымдарды таңдаңыз.","options":["Жауапкер ретінде тек мемлекеттік орган қатыса алады","Талапкер өз меншік құқығын тануды сұрайды","Меншік құқығын тану талаптары тек шартсыз қатынастарда болады","Жауапкердің қарсылығы құқықты тану ісінде қаралмайды","Талапкер мүлікке құқығы жоқ тұлға болуға міндетті","Талапкердің құқығы сотта еш дәлелденбейді","Жауапкер талапкердің мәлімделген құқығын даулаушы тұлға болуы мүмкін"],"answer":[1,6],"explanation":"Құқықтық негіз: ҚР АК 259-бап. Талапкер өз меншік құқығын тануды сұрайды Жауапкер талапкердің мәлімделген құқығын даулаушы тұлға болуы мүмкін. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 259-бап"},{"num":3,"type":"single","q":"Сот ең алдымен қандай мәселені шешеді?","options":["Гаражды пайдаланған тұлға автоматты меншік иесі болады","Тіркеу құжаттары әрқашан даусыз және тексерілмейді","Құқық белгілейтін құжаттардың қайшылығы зерттелмейді","Тараптардың бірінің ауызша мәлімдемесі барлық құжаттан жоғары","Гаражға меншік құқығының заңды негізде кімге тиесілі екенін","Талапкердің басқа мүлікке құқығы гаражға құқықты дәлелдейді"],"answer":[4],"explanation":"Құқықтық негіз: ҚР АК 259-бап. Гаражға меншік құқығының заңды негізде кімге тиесілі екенін. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 259-бап"},{"num":4,"type":"multi","q":"Қандай дәлелдемелер қаралады?","options":["Гаражға қатысы жоқ банк операциялары","Талапкердің өзге мүліктерінің тізімі","Гараждың жарнамалық бағасы","Жауапкердің басқа жердегі мекенжайы","Мүлікке құқықты тіркеу туралы деректер","Тараптардың басқа гараждарға шарттары","Сатып алу-сату шарты","Тараптардың құқыққа қатысты қарсы дәлелдері"],"answer":[4,6,7],"explanation":"Құқықтық негіз: ҚР АК 259-бап. Мүлікке құқықты тіркеу туралы деректер Сатып алу-сату шарты Тараптардың құқыққа қатысты қарсы дәлелдері. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 259-бап"}]},{"id":89,"title":"Виндикациялық талап. Адал алушы мен арам ниетті иеленушіден мүлікті талап етіп алдыру. Заттарды заңсыз иеленуден қайтарып алу кезiнде есеп айырысу. Ақша мен бағалы қағаздарды талап етiп алдыруды шектеу.","material":"Азаматтың сирек кездесетін сағаты ұрланып, кейін нарықта үшінші тұлғаға сатылды. Сатып алушы сағатты ақылы түрде адал сатып алғанын айтады. Меншік иесі оны қайтаруды талап етті.","procedure":"Сот сағаттың иесінің еркінен тыс иеліктен шыққанын, сатып алушының адалдығын, сағаттың дараланғанын және қайтару шарттарын тексереді.","questions":[{"num":1,"type":"single","q":"Виндикациялық талаптың нысанасы қандай?","options":["Меншік құқығын шартпен ерікті тоқтату","Мүлікті пайдаланғаны үшін тек айыппұл өндіру","Дараланған мүлікті бөтеннің заңсыз иеленуінен қайтару","Иеліктен айырмайтын кез келген кедергіні жою","Мүлікке кепіл құқығын автоматты белгілеу","Жаңа затқа авторлық құқықты тану"],"answer":[2],"explanation":"Құқықтық негіз: ҚР АК 260, 261, 263-баптар. Дараланған мүлікті бөтеннің заңсыз иеленуінен қайтару. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 260, 261, 263-баптар"},{"num":2,"type":"multi","q":"Адал алушыдан мүлікті талап ету кезінде қандай мән-жайлар маңызды?","options":["Ақылы сатып алу барлық жағдайда мүлікті қайтаруға кедергі","Мүліктің меншік иесінің еркінен тыс иеліктен шыққаны","Мүліктің иеден қалай шыққаны ескерілмейді","Сатып алушының адалдығы құқықтық мәнге ие емес","Мүліктің даралануы талап қоюда маңызды емес","Адал сатып алушы мүлікті кез келген жағдайда қайтарады","Сатып алушының мүлікті ақылы әрі адал алған-алмағаны"],"answer":[1,6],"explanation":"Құқықтық негіз: ҚР АК 260, 261, 263-баптар. Мүліктің меншік иесінің еркінен тыс иеліктен шыққаны Сатып алушының мүлікті ақылы әрі адал алған-алмағаны. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 260, 261, 263-баптар"},{"num":3,"type":"single","q":"Сағатты заңсыз иеленген тұлғадан қайтару кезінде алынған табыстар бойынша қандай ереже қолданылады?","options":["Арам ниетті иеленушіден бүкіл заңсыз иелену кезеңінде алған не алуға тиіс табыс талап етілуі мүмкін","Адал иеленушіден барлық кезең үшін табыс міндетті түрде өндіріліп алынады","Табысқа қатысты талап мүлікті қайтару талабымен ешқашан байланысты болмайды","Табыс туралы есеп айырысу тек шарт тараптарына қатысты жүргізіледі","Иеленушінің адалдығы табысты қайтару мәселесінде ескерілмейді","Меншік иесі иеленушіден табысты қандай да бір негізсіз өндіреді"],"answer":[0],"explanation":"ҚР АК 263-бабы заңсыз иеленушіден табыстарды қайтару мен қажетті шығындарды өтеудің адалдыққа байланысты тәртібін белгілейді. Арам ниетті иеленушіден бүкіл заңсыз иелену кезеңінде алған не алуға тиіс табыс талап етілуі мүмкін.","basis":"ҚР АК 260, 261, 263-баптар"},{"num":4,"type":"multi","q":"Сағатты қайтару кезінде адал және арам ниетті иеленушіге қатысты есеп айырысуды анықтауға қандай деректер қажет?","options":["Иеленушінің басқа мүліктерге салған инвестициялары","Мүлікті сақтауға жұмсалған қажетті шығындардың дәлелдері","Сағаттың өзге сатушылардағы жарнамалық құны","Талапкердің басқа мүлікке құқық белгілейтін құжаттары","Сатып алушының басқа сағаттарға берген бағалары","Сатушының өзге тауарларына қатысты шарттары","Мүліктен алынған немесе алынуға тиіс табыстың көлемі","Иеленушінің мүлікті заңсыз иеленуін білген немесе білуге тиіс болған уақыты"],"answer":[1,6,7],"explanation":"ҚР АК 263-бабы заңсыз иеленушіден табыстарды қайтару мен қажетті шығындарды өтеудің адалдыққа байланысты тәртібін белгілейді. Мүлікті сақтауға жұмсалған қажетті шығындардың дәлелдері; Мүліктен алынған немесе алынуға тиіс табыстың көлемі; Иеленушінің мүлікті заңсыз иеленуін білген немесе білуге тиіс болған уақыты.","basis":"ҚР АК 260, 261, 263-баптар"}]},{"id":90,"title":"Негаторлық талап. Негаторлық талап бойынша талап қоюшы мен жауапкер. Негаторлық талаптың пәні мен негіздері. Негаторлық талапты қанағаттандырудың жағдаяттары.","material":"Үй иесі өз үйінде тұрады. Көршісі үйге кіретін жалғыз жолды қоршаумен жауып, иесінің үйге қатынауын қиындатты. Үй иесі мүлікті иелену құқығын жоғалтқан жоқ.","procedure":"Үй иесі кедергіні жою туралы талап қойды. Сот талапкердің құқықтық титулын, кедергінің бар-жоғын және жауапкер әрекетінің заңдылығын зерттейді.","questions":[{"num":1,"type":"single","q":"Негаторлық талаптың негізгі нысанасы қандай?","options":["Үйді міндетті түрде сату","Үйге меншік құқығын ерікті тоқтату","Үйге кепіл құқығын белгілеу","Мүлікті иеленуден айырмайтын құқық бұзушылықты жою","Мүлікті мемлекет мұқтажына иеліктен шығару","Мүлікті бөтеннің заңсыз иеленуінен қайтару"],"answer":[3],"explanation":"Құқықтық негіз: ҚР АК 264, 265-баптар. Мүлікті иеленуден айырмайтын құқық бұзушылықты жою. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 264, 265-баптар"},{"num":2,"type":"multi","q":"Негаторлық талапты қанағаттандыру үшін не маңызды?","options":["Негаторлық талап тек шарттық берешекті өндіруге арналған","Жауапкердің әрекетінің заңдылығы қаралмайды","Кедергі болмаса да талап автоматты қанағаттандырылады","Меншік иесінің құқықтық титулы дәлелденбейді","Негаторлық талап үшін талапкердің мүлікті иеленуі тоқтауы керек","Талапкердің мүлікке тиісті құқығының болуы","Жауапкердің пайдалануға кедергі келтіретін әрекетінің болуы"],"answer":[5,6],"explanation":"Құқықтық негіз: ҚР АК 264, 265-баптар. Талапкердің мүлікке тиісті құқығының болуы Жауапкердің пайдалануға кедергі келтіретін әрекетінің болуы. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 264, 265-баптар"},{"num":3,"type":"single","q":"Талапкердің үйді иеленіп отырғаны талап түріне қалай әсер етеді?","options":["Иелену сақталғандықтан кедергіні жою туралы талап қаралады","Мүлікті иеленіп отырған тұлға тек виндикациялық талап бере алады","Кедергіні жою талабы міндетті түрде мүлікті қайтаруды қамтиды","Үй иесінің иелігі сақталса құқық бұзушылық болуы мүмкін емес","Көршінің қоршауы мүлікке меншік құқығын өткізеді","Үйді пайдалану кедергісі меншік құқығын автоматты тоқтатады"],"answer":[0],"explanation":"Құқықтық негіз: ҚР АК 264, 265-баптар. Иелену сақталғандықтан кедергіні жою туралы талап қаралады. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 264, 265-баптар"},{"num":4,"type":"multi","q":"Сот қандай дәлелдемелерді зерттейді?","options":["Талапкердің өзге мүліктеріне шарттары","Үйдің бұрынғы коммуналдық шығындары","Көршінің басқа аулаға салған қоршауы","Кедергінің құқыққа әсерін көрсететін деректер","Үйдің жарнамалық нарықтық бағасы","Жолға қойылған қоршаудың дәлелдері","Үйге меншік құқығын растайтын құжаттар","Көршінің өзге үйге құжаттары"],"answer":[3,5,6],"explanation":"Құқықтық негіз: ҚР АК 264, 265-баптар. Кедергінің құқыққа әсерін көрсететін деректер Жолға қойылған қоршаудың дәлелдері Үйге меншік құқығын растайтын құжаттар. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 264, 265-баптар"}]},{"id":91,"title":"Меншiк иесiнiң құқықтарын және басқа заттық құқықтарды бұзатын мемлекеттік органдар мен лауазымды адамдар құжаттарының жарамсыздығы туралы талаптар.","material":"Жер учаскесінің иесі әкімдіктің учаскеге кіруге тыйым салатын шешімін алды. Шешімнің заңды негізі көрсетілмеген және жер учаскесіне қатысты меншік құқығы сақталған. Иесі акт оның құқықтарын бұзатынын мәлімдеді.","procedure":"Меншік иесі құжатты жарамсыз деп тануды және бұзылған құқықты қалпына келтіруді сұрап сотқа жүгінді. Мемлекеттік орган актінің заңдылығын негіздеуге тиіс.","questions":[{"num":1,"type":"single","q":"Осы жағдайға қатысты негізгі құқықтық ереже қайсы?","options":["Мемлекеттік органның шешімі меншік құқығын ешбір негізсіз жояды","Актінің мазмұны құқықтық бағалауға әсер етпейді","Меншік иесі құқық бұзылғанда сотқа жүгіне алмайды","Мемлекеттік органның кез келген шешімі меншік құқығын автоматты тоқтатады","Актінің заңдылығын сотта тексеруге болмайды","Меншік құқығын бұзатын заңсыз актіні жарамсыз деп тану талабын қою"],"answer":[5],"explanation":"ҚР АК 267-бап; қолданылатын іс жүргізу заңнамасы. Меншік құқығын бұзатын заңсыз актіні жарамсыз деп тану талабын қою. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 267-бап; қолданылатын іс жүргізу заңнамасы"},{"num":2,"type":"multi","q":"Кейсті материалдық құқық бойынша дұрыс бағалайтын тұжырымдарды таңдаңыз.","options":["Мемлекеттік органның шешімі меншік құқығын ешбір негізсіз жояды","Актінің заңдылығын сотта тексеруге болмайды","Актінің мазмұны құқықтық бағалауға әсер етпейді","Мемлекеттік орган шешімінің құқықтық негізін тексеру","Меншік иесі құқық бұзылғанда сотқа жүгіне алмайды","Мемлекеттік органның кез келген шешімі меншік құқығын автоматты тоқтатады","Актінің меншік иесінің құқығына әсерін анықтау"],"answer":[3,6],"explanation":"ҚР АК 267-бап; қолданылатын іс жүргізу заңнамасы. Актінің меншік иесінің құқығына әсерін анықтау Мемлекеттік орган шешімінің құқықтық негізін тексеру. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 267-бап; қолданылатын іс жүргізу заңнамасы"},{"num":3,"type":"single","q":"Сот дауды шешкенде қай құқықтық қорытындыға сүйенуі тиіс?","options":["Актінің мазмұны құқықтық бағалауға әсер етпейді","Меншік иесі құқық бұзылғанда сотқа жүгіне алмайды","Мемлекеттік органның шешімі меншік құқығын ешбір негізсіз жояды","Актінің заңдылығын сотта тексеруге болмайды","Меншік құқығын бұзатын заңсыз актіні жарамсыз деп тану талабын қою","Мемлекеттік органның кез келген шешімі меншік құқығын автоматты тоқтатады"],"answer":[4],"explanation":"ҚР АК 267-бап; қолданылатын іс жүргізу заңнамасы. Меншік құқығын бұзатын заңсыз актіні жарамсыз деп тану талабын қою. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 267-бап; қолданылатын іс жүргізу заңнамасы"},{"num":4,"type":"multi","q":"Даулы жағдайды қарау кезінде қандай мәселелер дәлелденуі керек?","options":["Меншік иесі құқық бұзылғанда сотқа жүгіне алмайды","Актінің заңдылығын сотта тексеруге болмайды","Мемлекеттік органның шешімі меншік құқығын ешбір негізсіз жояды","Меншік құқығын бұзатын заңсыз актіні жарамсыз деп тану талабын қою","Мемлекеттік органның кез келген шешімі меншік құқығын автоматты тоқтатады","Актінің меншік иесінің құқығына әсерін анықтау","Актінің мазмұны құқықтық бағалауға әсер етпейді","Мемлекеттік орган шешімінің құқықтық негізін тексеру"],"answer":[3,5,7],"explanation":"ҚР АК 267-бап; қолданылатын іс жүргізу заңнамасы. Актінің меншік иесінің құқығына әсерін анықтау Мемлекеттік орган шешімінің құқықтық негізін тексеру Меншік құқығын бұзатын заңсыз актіні жарамсыз деп тану талабын қою. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 267-бап; қолданылатын іс жүргізу заңнамасы"}]},{"id":92,"title":"Меншiк иесi емес адамның заттық құқығын қорғау.","material":"Мемлекеттік кәсіпорынға ғимарат шаруашылық жүргізу құқығымен бекітілген. Үшінші тұлға ғимаратқа заңсыз кіріп, кәсіпорынның пайдалануына кедергі келтірді. Кәсіпорын меншік иесі емес екенін мойындайды.","procedure":"Кәсіпорын заттық құқығын қорғауды сұрады. Жауапкер тек меншік иесі талап қоя алады деп қарсылық білдірді.","questions":[{"num":1,"type":"single","q":"Осы жағдайға қатысты негізгі құқықтық ереже қайсы?","options":["Кедергі келтіруші тұлға ғимаратқа автоматты меншік алады","Шаруашылық жүргізу құқығы ешбір соттық қорғауға жатпайды","Заттық құқық тек мүлік сатылған жағдайда қорғалады","Заңды негізде мүлікті иеленетін меншік иесі емес тұлғаның заттық құқығын қорғау","Кәсіпорын тек меншік иесінің атынан ғана әрқашан талап қояды","Меншік иесі емес тұлғаның заттық құқығы қорғалмайды"],"answer":[3],"explanation":"ҚР АК 265-бап. Заңды негізде мүлікті иеленетін меншік иесі емес тұлғаның заттық құқығын қорғау. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 265-бап"},{"num":2,"type":"multi","q":"Кейсті материалдық құқық бойынша дұрыс бағалайтын тұжырымдарды таңдаңыз.","options":["Шаруашылық жүргізу құқығы ешбір соттық қорғауға жатпайды","Үшінші тұлғаның кедергі жасағанын анықтау","Заттық құқық тек мүлік сатылған жағдайда қорғалады","Кедергі келтіруші тұлға ғимаратқа автоматты меншік алады","Кәсіпорынның мүлікке заңды титулын тексеру","Кәсіпорын тек меншік иесінің атынан ғана әрқашан талап қояды","Меншік иесі емес тұлғаның заттық құқығы қорғалмайды"],"answer":[1,4],"explanation":"ҚР АК 265-бап. Кәсіпорынның мүлікке заңды титулын тексеру Үшінші тұлғаның кедергі жасағанын анықтау. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 265-бап"},{"num":3,"type":"single","q":"Сот дауды шешкенде қай құқықтық қорытындыға сүйенуі тиіс?","options":["Шаруашылық жүргізу құқығы ешбір соттық қорғауға жатпайды","Заңды негізде мүлікті иеленетін меншік иесі емес тұлғаның заттық құқығын қорғау","Меншік иесі емес тұлғаның заттық құқығы қорғалмайды","Кәсіпорын тек меншік иесінің атынан ғана әрқашан талап қояды","Кедергі келтіруші тұлға ғимаратқа автоматты меншік алады","Заттық құқық тек мүлік сатылған жағдайда қорғалады"],"answer":[1],"explanation":"ҚР АК 265-бап. Заңды негізде мүлікті иеленетін меншік иесі емес тұлғаның заттық құқығын қорғау. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 265-бап"},{"num":4,"type":"multi","q":"Даулы жағдайды қарау кезінде қандай мәселелер дәлелденуі керек?","options":["Кәсіпорын тек меншік иесінің атынан ғана әрқашан талап қояды","Үшінші тұлғаның кедергі жасағанын анықтау","Меншік иесі емес тұлғаның заттық құқығы қорғалмайды","Заңды негізде мүлікті иеленетін меншік иесі емес тұлғаның заттық құқығын қорғау","Кәсіпорынның мүлікке заңды титулын тексеру","Кедергі келтіруші тұлға ғимаратқа автоматты меншік алады","Шаруашылық жүргізу құқығы ешбір соттық қорғауға жатпайды","Заттық құқық тек мүлік сатылған жағдайда қорғалады"],"answer":[1,3,4],"explanation":"ҚР АК 265-бап. Кәсіпорынның мүлікке заңды титулын тексеру Үшінші тұлғаның кедергі жасағанын анықтау Заңды негізде мүлікті иеленетін меншік иесі емес тұлғаның заттық құқығын қорғау. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 265-бап"}]},{"id":93,"title":"Міндеттемелік құқықтың ұғымы мен жүйесі.","material":"Жеткізуші мен сатып алушы тауар жеткізу және ақысын төлеу туралы шарт жасады. Жеткізуші тауарды беруге, сатып алушы ақысын төлеуге міндеттенді. Кейін төлем мерзімі жөнінде дау туындады.","procedure":"Сатып алушы мен жеткізуші міндеттеменің мазмұнын және орындалу шарттарын сотта талқылады.","questions":[{"num":1,"type":"single","q":"Осы жағдайға қатысты негізгі құқықтық ереже қайсы?","options":["Шарт жасалғанда тараптар ешқандай міндеттеме алмайды","Міндеттемелік құқық барлық заттық құқықты тоқтатады","Міндеттемелік қатынаста борышкердің міндеті болмайды","Кредитордың талап ету құқығы мен борышкердің орындау міндетін реттейтін құқықтық қатынас","Міндеттемелік қатынаста кредитор талап қою құқығын иеленбейді","Міндеттемелік құқық тек мүліктің меншік иесін анықтайды"],"answer":[3],"explanation":"ҚР АК 268, 272-баптар. Кредитордың талап ету құқығы мен борышкердің орындау міндетін реттейтін құқықтық қатынас. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 268, 272-баптар"},{"num":2,"type":"multi","q":"Кейсті материалдық құқық бойынша дұрыс бағалайтын тұжырымдарды таңдаңыз.","options":["Міндеттемелік қатынаста кредитор талап қою құқығын иеленбейді","Міндеттемелік қатынаста борышкердің міндеті болмайды","Міндеттемелік құқық тек мүліктің меншік иесін анықтайды","Міндеттемеде талап ету құқығы мен орындау міндеті болады","Шарт жасалғанда тараптар ешқандай міндеттеме алмайды","Шарттық міндеттеме тараптардың келісімінен туындауы мүмкін","Міндеттемелік құқық барлық заттық құқықты тоқтатады"],"answer":[3,5],"explanation":"ҚР АК 268, 272-баптар. Міндеттемеде талап ету құқығы мен орындау міндеті болады Шарттық міндеттеме тараптардың келісімінен туындауы мүмкін. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 268, 272-баптар"},{"num":3,"type":"single","q":"Сот дауды шешкенде қай құқықтық қорытындыға сүйенуі тиіс?","options":["Шарт жасалғанда тараптар ешқандай міндеттеме алмайды","Міндеттемелік қатынаста борышкердің міндеті болмайды","Міндеттемелік құқық барлық заттық құқықты тоқтатады","Міндеттемелік құқық тек мүліктің меншік иесін анықтайды","Міндеттемелік қатынаста кредитор талап қою құқығын иеленбейді","Кредитордың талап ету құқығы мен борышкердің орындау міндетін реттейтін құқықтық қатынас"],"answer":[5],"explanation":"ҚР АК 268, 272-баптар. Кредитордың талап ету құқығы мен борышкердің орындау міндетін реттейтін құқықтық қатынас. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 268, 272-баптар"},{"num":4,"type":"multi","q":"Даулы жағдайды қарау кезінде қандай мәселелер дәлелденуі керек?","options":["Міндеттемелік қатынаста кредитор талап қою құқығын иеленбейді","Міндеттемеде талап ету құқығы мен орындау міндеті болады","Шарт жасалғанда тараптар ешқандай міндеттеме алмайды","Міндеттемелік құқық барлық заттық құқықты тоқтатады","Міндеттемелік құқық тек мүліктің меншік иесін анықтайды","Міндеттемелік қатынаста борышкердің міндеті болмайды","Шарттық міндеттеме тараптардың келісімінен туында талап ете алмайды"],"answer":[1,2],"explanation":"ҚР АК 268, 272-баптар. Мердігер шартта көрсетілген жұмысты орындауға міндетті Тапсырыс беруші тиісінше орындалуын талап етуге құқылы. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 268, 272-баптар"},{"num":3,"type":"single","q":"Сот дауды шешкенде қай құқықтық қорытындыға сүйенуі тиіс?","options":["Борышкер шартқа қарамастан жұмысты өз қалауымен тоқтатады","Міндеттеме тараптардың міндеттерін айқындамайды","Жұмысты орындамау шарттық міндеттемеге әсер етпейді","Борышкердің белгілі әрекетті жасау міндеті және кредитордың оны талап ету құқығы","Міндеттеме тек затқа меншік құқығын тіркеуден тұрады","Кредитор борышкерден ешбір әрекетті талап ете алмайды"],"answer":[3],"explanation":"ҚР АК 268, 272-баптар. Борышкердің белгілі әрекетті жасау міндеті және кредитордың оны талап ету құқығы. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 268, 272-баптар"},{"num":4,"type":"multi","q":"Даулы жағдайды қарау кезінде қандай мәселелер дәлелденуі керек?","options":["Міндеттеме тек затқа меншік құқығын тіркеуден тұрады","Мердігер шартта көрсетілген жұмысты орындауға міндетті","Міндеттеме тараптардың міндеттерін айқындамайды","Борышкердің белгілі әрекетті жасау міндеті және кредитордың оны талап ету құқығы","Борышкер шартқа қарамастан жұмысты өз қалауымен тоқтатады","Кредитор борышкерден ешбір әрекетті талап ете алмайды","Жұмысты орындамау шарттық міндеттемеге әсер етпейді","Тапсырыс беруші тиісінше орындалуын талап етуге құқылы"],"answer":[1,3,7],"explanation":"ҚР АК 268, 272-баптар. Мердігер шартта көрсетілген жұмысты орындауға міндетті Тапсырыс беруші тиісінше орындалуын талап етуге құқылы Борышкердің белгілі әрекетті жасау міндеті және кредитордың оны талап ету құқығы. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 268, 272-баптар"}]},{"id":95,"title":"Міндеттеменің пайда болу негіздері (шарттар, бір жақты мәмілелер, әкімшілік актілер, әкімшілік акт және оның негізінде жасалған шарт (күрделі заңды құрам), зиян келтіру (деликттер) және басқа да құқыққа қайшы әрекеттер, оқиғалар).","material":"Азамат дүкеннен техника сатып алды және оны жеткізу шарты жасалды. Бөлек жағдайда курьер бөтен адамның мүлкін бүлдіріп, зиян келтірді. Тараптар екі түрлі міндеттеменің негізін таласты.","procedure":"Сот бір міндеттеменің шарттан, екіншісінің зиян келтіруден туындауын анықтауға тиіс.","questions":[{"num":1,"type":"single","q":"Осы жағдайға қатысты негізгі құқықтық ереже қайсы?","options":["Зиян келтіру ешқашан азаматтық міндеттеме туғызбайды","Барлық міндеттеме міндетті түрде бір ғана шарттан пайда болады","Міндеттеменің пайда болуы заңдық фактілерге тәуелді емес","Шарт пен зиян келтіру міндеттеменің дербес пайда болу негіздері бола алады","Міндеттемелер тек мемлекеттік актіден туындайды","Шарт жасалғанда тараптарда құқықтар мен міндеттер болмайды"],"answer":[3],"explanation":"ҚР АК 7, 271-баптар. Шарт пен зиян келтіру міндеттеменің дербес пайда болу негіздері бола алады. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 7, 271-баптар"},{"num":2,"type":"multi","q":"Кейсті материалдық құқық бойынша дұрыс бағалайтын тұжырымдарды таңдаңыз.","options":["Зиянды өтеу міндеттемесі құқыққа қайшы зиян келтіруден туындауы мүмкін","Жеткізу міндеттемесі шарттан туындай алады","Зиян келтіру ешқашан азаматтық міндеттеме туғызбайды","Барлық міндеттеме міндетті түрде бір ғана шарттан пайда болады","Міндеттемелер тек мемлекеттік актіден туындайды","Шарт жасалғанда тараптарда құқықтар мен міндеттер болмайды","Міндеттеменің пайда болуы заңдық фактілерге тәуелді емес"],"answer":[0,1],"explanation":"ҚР АК 7, 271-баптар. Жеткізу міндеттемесі шарттан туындай алады Зиянды өтеу міндеттемесі құқыққа қайшы зиян келтіруден туындауы мүмкін. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 7, 271-баптар"},{"num":3,"type":"single","q":"Сот дауды шешкенде қай құқықтық қорытындыға сүйенуі тиіс?","options":["Шарт пен зиян келтіру міндеттеменің дербес пайда болу негіздері бола алады","Зиян келтіру ешқашан азаматтық міндеттеме туғызбайды","Міндеттеменің пайда болуы заңдық фактілерге тәуелді емес","Шарт жасалғанда тараптарда құқықтар мен міндеттер болмайды","Міндеттемелер тек мемлекеттік актіден туындайды","Барлық міндеттеме міндетті түрде бір ғана шарттан пайда болады"],"answer":[0],"explanation":"ҚР АК 7, 271-баптар. Шарт пен зиян келтіру міндеттеменің дербес пайда болу негіздері бола алады. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 7, 271-баптар"},{"num":4,"type":"multi","q":"Даулы жағдайды қарау кезінде қандай мәселелер дәлелденуі керек?","options":["Міндеттемелер тек мемлекеттік актіден туындайды","Жеткізу міндеттемесі шарттан туындай алады","Зиянды өтеу міндеттемесі құқыққа қайшы зиян келтіруден туындауы мүмкін","Шарт жасалғанда тараптарда құқықтар мен міндеттер болмайды","Міндеттеменің пайда болуы заңдық фактілерге тәуелді емес","Зиян келтіру ешқашан азаматтық міндеттеме туғызбайды","Шарт пен зиян келтіру міндеттеменің дербес пайда болу негіздері бола алады","Барлық міндеттеме міндетті түрде бір ғана шарттан пайда болады"],"answer":[1,2,6],"explanation":"ҚР АК 7, 271-баптар. Жеткізу міндеттемесі шарттан туындай алады Зиянды өтеу міндеттемесі құқыққа қайшы зиян келтіруден туындауы мүмкін Шарт пен зиян келтіру міндеттеменің дербес пайда болу негіздері бола алады. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 7, 271-баптар"}]},{"id":96,"title":"Міндеттемелік құқықтық қатынас субъектілері. Міндеттемедегі тұлғалардың көптігі. Міндеттемедегі тұлғалардың ауысуы.","material":"Екі борышкер несие берушіге 600 000 теңге төлеуге міндеттенді. Шартта олардың жауапкершілігі ортақтасып екені нақты жазылған. Борышкерлердің бірі өз үлесін ғана төлеуге дайын екенін айтты.","procedure":"Кредитор борыштың бүкіл сомасын борышкерлердің бірінен талап етті. Сот ортақтас міндеттеменің шарттық негізін тексереді.","questions":[{"num":1,"type":"single","q":"Осы жағдайға қатысты негізгі құқықтық ереже қайсы?","options":["Бір борышкердің төлеуі қалғандарына ешбір жағдайда әсер етпейді","Ортақтас міндеттемеде кредитор борыштың толық сомасын борышкерлердің бірінен талап ете алады","Кредитор ортақтас борышкердің біріне талап қоя алмайды","Көп борышкердің қатысуы міндеттемені автоматты тоқтатады","Көп тұлғалы міндеттеме азаматтық құқықта танылмайды","Ортақтас борышкерлердің әрқайсысы барлық жағдайда тек тең үлес төлейді"],"answer":[1],"explanation":"ҚР АК 269, 286–289-баптар. Ортақтас міндеттемеде кредитор борыштың толық сомасын борышкерлердің бірінен талап ете алады. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 269, 286–289-баптар"},{"num":2,"type":"multi","q":"Кейсті материалдық құқық бойынша дұрыс бағалайтын тұжырымдарды таңдаңыз.","options":["Бір борышкердің төлеуі қалғандарына ешбір жағдайда әсер етпейді","Ортақтас борышкерлердің әрқайсысы барлық жағдайда тек тең үлес төлейді","Ортақтас жауапкершілік заңнан немесе шарттан туындауы мүмкін","Кредитор ортақтас борышкердің біріне талап қоя алмайды","Бір міндеттемеде бірнеше борышкер қатыса алады","Көп тұлғалы міндеттеме азаматтық құқықта танылмайды","Көп борышкердің қатысуы міндеттемені автоматты тоқтатады"],"answer":[2,4],"explanation":"ҚР АК 269, 286–289-баптар. Бір міндеттемеде бірнеше борышкер қатыса алады Ортақтас жауапкершілік заңнан немесе шарттан туындауы мүмкін. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 269, 286–289-баптар"},{"num":3,"type":"single","q":"Сот дауды шешкенде қай құқықтық қорытындыға сүйенуі тиіс?","options":["Ортақтас борышкерлердің әрқайсысы барлық жағдайда тек тең үлес төлейді","Ортақтас міндеттемеде кредитор борыштың толық сомасын борышкерлердің бірінен талап ете алады","Кредитор ортақтас борышкердің біріне талап қоя алмайды","Көп тұлғалы міндеттеме азаматтық құқықта танылмайды","Б раптардың келісіміне тәуелді емес","Борышкер шарттағы санды әрқашан өздігінен өзгерте алады","Міндеттемені шарт талаптары мен заңға сәйкес тиісінше орындау"],"answer":[3,4,7],"explanation":"ҚР АК 272, 274-баптар. Тауар саны шартта көрсетілген көлемге сай болуы керек Орындау мерзімі шарт пен заң талаптарына сай бағаланады Міндеттемені шарт талаптары мен заңға сәйкес тиісінше орындау. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 272, 274-баптар"}]},{"id":99,"title":"Міндеттемені орындаудан бір жақты бас тартуға жол бермеу.","material":"Қызмет көрсетуші клиентпен бір жылдық қызмет шартын жасады. Үш айдан кейін қызмет бағасын өздігінен екі есе көтеріп, төлем жасалмаса шартты тоқтататынын хабарлады. Шартта мұндай құқық көрсетілмеген.","procedure":"Клиент бағаның біржақты өзгеруіне қарсы болды. Сот шарт пен заңда біржақты өзгертуге негіз бар-жоғын тексереді.","questions":[{"num":1,"type":"single","q":"Осы жағдайға қатысты негізгі құқықтық ереже қайсы?","options":["Біржақты өзгерту туралы ереже заңда мүлде жоқ","Біржақты бас тартуға барлық шартта шектеусіз рұқсат етіледі","Заңда немесе шартта көзделмесе міндеттемені біржақты өзгертуге не орындаудан бас тартуға болмайды","Клиенттің келісімі ешбір жағдайда құқықтық мәнге ие емес","Шартта жазылған баға міндеттеменің мазмұнына кірмейді","Қызмет көрсетуші бағаны кез келген уақытта негізсіз өзгерте алады"],"answer":[2],"explanation":"ҚР АК 273-бап. Заңда немесе шартта көзделмесе міндеттемені біржақты өзгертуге не орындаудан бас тартуға болмайды. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 273-бап"},{"num":2,"type":"multi","q":"Кейсті материалдық құқық бойынша дұрыс бағалайтын тұжырымдарды таңдаңыз.","options":["Шартта жазылған баға міндеттеменің мазмұнына кірмейді","Клиенттің келісімі ешбір жағдайда құқықтық мәнге ие емес","Біржақты өзгерту туралы ереже заңда мүлде жоқ","Қызмет көрсетуші бағаны кез келген уақытта негізсіз өзгерте алады","Шарттағы біржақты өзгертуге қатысты ережелер ескеріледі","Заңда көзделген ерекшеліктер болса олар қолданылуы мүмкін","Біржақты бас тартуға барлық шартта шектеусіз рұқсат етіледі"],"answer":[4,5],"explanation":"ҚР АК 273-бап. Шарттағы біржақты өзгертуге қатысты ережелер ескеріледі Заңда көзделген ерекшеліктер болса олар қолданылуы мүмкін. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 273-бап"},{"num":3,"type":"single","q":"Сот дауды шешкенде қай құқықтық қорытындыға сүйенуі тиіс?","options":["Шартта жазылған баға міндеттеменің мазмұнына кірмейді","Қызмет көрсетуші бағаны кез келген уақытта негізсіз өзгерте алады","Заңда немесе шартта көзделмесе міндеттемені біржақты өзгертуге не орындаудан бас тартуға болмайды","Клиенттің келісімі ешбір жағдайда құқықтық мәнге ие емес","Біржақты бас тартуға барлық шартта шектеусіз рұқсат етіледі","Біржақты өзгерту туралы ереже заңда мүлде жоқ"],"answer":[2],"explanation":"ҚР АК 273-бап. Заңда немесе шартта көзделмесе міндеттемені біржақты өзгертуге не орындаудан бас тартуға болмайды. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 273-бап"},{"num":4,"type":"multi","q":"Даулы жағдайды қарау кезінде қандай мәселелер дәлелденуі керек?","options":["Шартта жазылған баға міндеттеменің мазмұнына кірмейді","Біржақты бас тартуға барлық шартта шектеусіз рұқсат етіледі","Заңда көзделген ерекшеліктер болса олар қолданылуы мүмкін","Шарттағы біржақты өзгертуге қатысты ережелер ескеріледі","Клиенттің келісімі ешбір жағдайда құқықтық мәнге ие емес","Заңда немесе шартта көзделмесе міндеттемені біржақты өзгертуге не орындаудан бас тартуға болмайды","Қызмет көрсетуші бағаны кез келген уақытта негізсіз өзгерте алады","Біржақты өзгерту туралы ереже заңда мүлде жоқ"],"answer":[2,3,5],"explanation":"ҚР АК 273-бап. Шарттағы біржақты өзгертуге қатысты ережелер ескеріледі Заңда көзделген ерекшеліктер болса олар қолданылуы мүмкін Заңда немесе шартта көзделмесе міндеттемені біржақты өзгертуге не орындаудан бас тартуға болмайды. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 273-бап"}]},{"id":100,"title":"Міндеттемені бөлшектеп орындау.","material":"Жеткізуші 100 дана құрылғыны бір күнде беруге міндеттенді. Шартта бөлшектеп жеткізу көзделмеген. Жеткізуші 30 құрылғы әкеліп, қалғанын кейін жеткізетінін айтты.","procedure":"Сатып алушы 30 құрылғыны қабылдаудан бас тартты. Сот шартта, заңда, іскерлік айналым әдетінде немесе міндеттеме мәнінде бөлшектеп орындауға негіз бар-жоғын тексереді.","questions":[{"num":1,"type":"single","q":"Осы жағдайға қатысты негізгі құқықтық ереже қайсы?","options":["Кредитор барлық жағдайда кез келген бөлікті қабылдауға міндетті","Бөлшектеп орындауға қатысты шарт ережелері ескерілмейді","Заңда, шартта немесе міндеттеме мәнінде өзгеше көзделмесе кредитор бөлшектеп орындауды қабылдамауға құқылы","Борышкер шартқа қарамастан әрқашан өз қалауы бойынша бөледі","Ішінара жеткізу міндеттемені толық орындаған болып саналады","Міндеттеменің мәні бөлшектеп орындауға ешқашан әсер етпейді"],"answer":[2],"explanation":"ҚР АК 274-бап. Заңда, шартта немесе міндеттеме мәнінде өзгеше көзделмесе кредитор бөлшектеп орындауды қабылдамауға құқылы. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 274-бап"},{"num":2,"type":"multi","q":"Кейсті материалдық құқық бойынша дұрыс бағалайтын тұжырымдарды таңдаңыз.","options":["Іскерлік айналым әдеттері мен міндеттеменің мәні ескерілуі мүмкін","Кредитор барлық жағдайда кез келген бөлікті қабылдауға міндетті","Міндеттеменің мәні бөлшектеп орындауға ешқашан әсер етпейді","Борышкер шартқа қарамастан әрқашан өз қалауы бойынша бөледі","Ішінара жеткізу міндеттемені толық орындаған болып саналады","Бөлшектеп орындауға қатысты шарт ережелері ескерілмейді","Шарттың бөлшектеп орындауға қатысты талаптары ескеріледі"],"answer":[0,6],"explanation":"ҚР АК 274-бап. Шарттың бөлшектеп орындауға қатысты талаптары ескеріледі Іскерлік айналым әдеттері мен міндеттеменің мәні ескерілуі мүмкін. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 274-бап"},{"num":3,"type":"single","q":"Сот дауды шешкенде қай құқықтық қорытындыға сүйенуі тиіс?","options":["Бөлшектеп орындауға қатысты шарт ережелері ескерілмейді","Борышкер шартқа қарамастан әрқашан өз қалауы бойынша бөледі","Міндеттеменің мәні бөлшектеп орындауға ешқашан әсер етпейді","Кредитор барлық жағдайда кез келген бөлікті қабылдауға міндетті","Заңда, шартта немесе міндеттеме мәнінде өзгеше көзделмесе кредитор бөлшектеп орындауды қабылдамауға құқылы","Ішінара жеткізу міндеттемені толық орындаған болып саналады"],"answer":[4],"explanation":"ҚР АК 274-бап. Заңда, шартта немесе міндеттеме мәнінде өзгеше көзделмесе кредитор бөлшектеп орындауды қабылдамауға құқылы. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 274-бап"},{"num":4,"type":"multi","q":"Даулы жағдайды қарау кезінде қандай мәселелер дәлелденуі керек?","options":["Ішінара жеткізу міндеттемені толық орындаған болып саналады","Борышкер шартқа қарамастан әрқашан өз қалауы бойынша бөледі","Міндеттеменің мәні бөлшектеп орындауға ешқашан әсер етпейді","Заңда, шартта немесе міндеттеме мәнінде өзгеше көзделмесе кредитор бөлшектеп орындауды қабылдамауға құқылы","Бөлшектеп орындауға қатысты шарт ережелері ескерілмейді","Шарттың бөлшектеп орындауға қатысты талаптары ескеріледі","Кредитор барлық жағдайда кез келген бөлікті қабылдауға міндетті","Іскерлік айналым әдеттері мен міндеттеменің мәні ескерілуі мүмкін"],"answer":[3,5,7],"explanation":"ҚР АК 274-бап. Шарттың бөлшектеп орындауға қатысты талаптары ескеріледі Іскерлік айналым әдеттері мен міндеттеменің мәні ескерілуі мүмкін Заңда, шартта немесе міндеттеме мәнінде өзгеше көзделмесе кредитор бөлшектеп орындауды қабылдамауға құқылы. Нақты жағдайдағы шарт, құқықтық негіз және дәлелдемелер ескеріледі.","basis":"ҚР АК 274-бап"}]},{"id":101,"title":"Міндеттеменің орныдалуын қамтамасыз ету түсінігі. Міндеттеменің орындалуын қамтамасыз ету тәсілдері.","material":"Құрылыс компаниясы тапсырыс берушімен шарт жасасты. Тараптар орындауды қамтамасыз ету үшін банктің кепілдігін, тұрақсыздық айыбын және мүлік кепілін талқылады.","procedure":"Мердігер мерзімді өткізіп алды. Тапсырыс беруші соттан шартта жазылған тұрақсыздық айыбын өндіріп алуды сұрады. Жауапкер негізгі міндеттеменің жарамсыздығын мәлімдеді. Сот негізгі міндеттеменің және қамтамасыз ету келісімінің құқықтық мәртебесін жеке тексереді.","questions":[{"num":1,"type":"single","q":"Міндеттемені қамтамасыз ету тәсіліне не жатады?","options":["Қамтамасыз ету негізгі борышты автоматты тоқтатады","Міндеттемені қамтамасыз ету шарттың орындалуын алмастырады","Қамтамасыз ету тәсілі әрқашан тек кепілден тұрады","Қамтамасыз ету туралы келісім негізгі міндеттемені жарамсыз етеді","Қамтамасыз ету кредитордың талап ету құқығын жояды","Тұрақсыздық айыбы"],"answer":[5],"explanation":"ҚР АК 292-бап. Тұрақсыздық айыбы. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 292-бап"},{"num":2,"type":"multi","q":"Қамтамасыз ету туралы келісімді бағалауда не маңызды?","options":["Қамтамасыз ету туралы келісім негізгі міндеттемені жарамсыз етеді","Таңдалған қамтамасыз ету тәсілі","Міндеттемені қамтамасыз ету шарттың орындалуын алмастырады","Негізгі міндеттеменің мазмұны","Қамтамасыз ету тәсілі әрқашан тек кепілден тұрады","Қамтамасыз ету негізгі борышты автоматты тоқтатады","Заң талап ететін нысан"],"answer":[1,3,6],"explanation":"ҚР АК 292-бап. Таңдалған қамтамасыз ету тәсілі; Негізгі міндеттеменің мазмұны; Заң талап ететін нысан. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 292-бап"},{"num":3,"type":"single","q":"Сот іс бойынша қандай негізгі құқықтық мәселені шешуі тиіс?","options":["Қамтамасыз ету кредитордың талап ету құқығын жояды","Негізгі міндеттеменің және қамтамасыз ету келісімінің бар-жоғын","Қамтамасыз ету негізгі борышты автоматты тоқтатады","Қамтамасыз ету туралы келісім негізгі міндеттемені жарамсыз етеді","Міндеттемені қамтамасыз ету шарттың орындалуын алмастырады","Қамтамасыз ету тәсілі әрқашан тек кепілден тұрады"],"answer":[1],"explanation":"ҚР АК 292-бап. Негізгі міндеттеменің және қамтамасыз ету келісімінің бар-жоғын. Бұл қорытынды материалдық құқық нормалары мен іс бойынша ұсынылған дәлелдемелер негізінде жасалады.","basis":"ҚР АК 292-бап"},{"num":4,"type":"multi","q":"Сот дауды шешу үшін қандай дәлелдемелерді зерттеуі керек?","options":["Қамтамасыз ету келісімінің мазмұны","Басқа банктердің кепілдік тарифтері","Мердігердің басқа құрылыс объектілері","Негізгі шарттың және оның бұзылуының дәлелдері","Тараптардың өзге шарттарының құны","Талап етілген соманың есеп-қисабы","Тапсырыс берушінің өзге сатып алулары","Басқа мердігердің шартындағы айып мөлшері"],"answer":[0,3,5],"explanation":"ҚР АК 292-бап. Дәлелдеуге жататын мән-жайлар: Негізгі шарттың және оның бұзылуының дәлелдері; Қамтамасыз ету келісімінің мазмұны; Талап етілген соманың есеп-қисабы. Құжаттар сотта қатыстылығы, жол берілуі және анықтығы тұрғысынан бағаланады.","basis":"ҚР АК 292-бап"}]},{"id":102,"title":"Тұрақсыздық айыбы түсінігі. Тұрақсыздық айыбы туралы келсімі нысаны. Тұрақсыздық айыбын орнатудың әдістері. Тұрақсыздық айыбы түрлері.","material":"Жеткізуші тауарды кешіктірді. Шартта әр кешіккен күн үшін тұрақсыздық айыбы көзделген, бірақ бұл ереже тараптардың жазбаша келісімінде бекітілген.","procedure":"Кредитор кешігу үшін айыпты есептеп, сотқа талап қойды. Борышкер есептеу кезеңін және айып мөлшерін даулады. Сот жазбаша келісім мен нақты кешігу күндерін салыстырады.","questions":[{"num":1,"type":"single","q":"Кредитор қандай талапты қарастыра алады?","options":["Тұрақсыздық айыбының мөлшерін сот ешқашан бағаламайды","Тұрақсыздық айыбы борышты толық орындаудың орнына автоматты жүреді","Айып сомасы шартта көрсетілмесе де еркін өндіріліп алынады","Тұрақсыздық айыбы туралы ауызша келісім әрқашан жеткілікті","Тұрақсыздық айыбы міндеттеме бұзылмаса да міндетті төленеді","Келісілген тұрақсыздық айыбын өндіріп алу"],"answer":[5],"explanation":"ҚР АК 293–297-баптар. Келісілген тұрақсыздық айыбын өндіріп алу. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 293–297-баптар"},{"num":2,"type":"multi","q":"Тұрақсыздық айыбы жөнінде не тексеріледі?","options":["Айып сомасы шартта көрсетілмесе де еркін өндіріліп алынады","Тұрақсыздық айыбы туралы ауызша келісім әрқашан жеткілікті","Тұрақсыздық айыбы міндеттеме бұзылмаса да міндетті төленеді","Келісімнің жазбаша нысаны","Тұрақсыздық айыбының мөлшерін сот ешқашан бағаламайды","Айыпты есептеу тәртібі","Міндеттеменің бұзылу фактісі"],"answer":[3,5,6],"explanation":"ҚР АК 293–297-баптар. Келісімнің жазбаша нысаны; Айыпты есептеу тәртібі; Міндеттеменің бұзылу фактісі. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 293–297-баптар"},{"num":3,"type":"single","q":"Сот іс бойынша қандай негізгі құқықтық мәселені шешуі тиіс?","options":["Тұрақсыздық айыбы міндеттеме бұзылмаса да міндетті төленеді","Тұрақсыздық айыбының мөлшерін сот ешқашан бағаламайды","Айып сомасы шартта көрсетілмесе де еркін өндіріліп алынады","Тұрақсыздық айыбы борышты толық орындаудың орнына автоматты жүреді","Міндеттеменің бұзылғаны және айыптың құқықтық негізі","Тұрақсыздық айыбы туралы ауызша келісім әрқашан жеткілікті"],"answer":[4],"explanation":"ҚР АК 293–297-баптар. Міндеттеменің бұзылғаны және айыптың құқықтық негізі. Бұл қорытынды материалдық құқық нормалары мен іс бойынша ұсынылған дәлелдемелер негізінде жасалады.","basis":"ҚР АК 293–297-баптар"},{"num":4,"type":"multi","q":"Сот дауды шешу үшін қандай дәлелдемелерді зерттеуі керек?","options":["Басқа жеткізушілердің айыппұл мөлшері","Тұрақсыздық айыбы туралы жазбаша келісім","Жеткізушінің басқа тапсырыстары","Міндеттемені орындаудың шарттық мерзімі","Тараптардың өзге мәмілелерінің құны","Тауардың басқа дүкендегі бағасы","Кредитордың өзге шарттары","Нақты кешігу күндері мен есептелген сома"],"answer":[1,3,7],"explanation":"ҚР АК 293–297-баптар. Дәлелдеуге жататын мән-жайлар: Тұрақсыздық айыбы туралы жазбаша келісім; Міндеттемені орындаудың шарттық мерзімі; Нақты кешігу күндері мен есептелген сома. Құжаттар сотта қатыстылығы, жол берілуі және анықтығы тұрғысынан бағаланады.","basis":"ҚР АК 293–297-баптар"}]},{"id":103,"title":"Борышқордың мүлкін ұстап қалу: түсінігі және қолдану шарттары.","material":"Жөндеу шеберханасы тапсырыс берушінің затын жөндеді. Тапсырыс беруші келісілген ақыны төлемей, затты қайтаруды талап етті. Зат шеберхананың заңды иелігінде тұр.","procedure":"Шеберхана затты бермей қойған соң тапсырыс беруші оны қайтару туралы талап қойды. Шеберхана төленбеген жөндеу ақысына байланысты ұстап қалу құқығын алға тартты. Сот заттың заңды иелікке түскенін және берешектің бар-жоғын зерттейді.","questions":[{"num":1,"type":"single","q":"Шеберхана қандай қамтамасыз ету институтын қарастыруы мүмкін?","options":["Борышкердің затын ұстап қалу","Ұстап қалу кредитор заңсыз иеленген кез келген затқа қолданылады","Кредитор өзіне берілмеген затты ұстап қалу үшін алып қоя алады","Ұстап қалу борышкердің мүлігін автоматты меншікке айналдырады","Ұстап қалу кез келген дауда сот шешімін алмастырады","Ұстап қалу шарт пен заңдағы барлық шектеуді жояды"],"answer":[0],"explanation":"ҚР АК, борышқордың мүлкін ұстап қалу туралы ережелер. Борышкердің затын ұстап қалу. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК, борышқордың мүлкін ұстап қалу туралы ережелер"},{"num":2,"type":"multi","q":"Ұстап қалудың заңдылығын анықтауда не ескеріледі?","options":["Заттың кредитордың заңды иелігінде болуы","Кредитор өзіне берілмеген затты ұстап қалу үшін алып қоя алады","Затты қайтару міндетінің болуы","Ұстап қалу кредитор заңсыз иеленген кез келген затқа қолданылады","Ұстап қалу шарт пен заңдағы барлық шектеуді жояды","Ұстап қалу борышкердің мүлігін автоматты меншікке айналдырады","Ұстап қалуға қатысты заң мен шарт"],"answer":[0,2,6],"explanation":"ҚР АК, борышқордың мүлкін ұстап қалу туралы ережелер. Заттың кредитордың заңды иелігінде болуы; Затты қайтару міндетінің болуы; Ұстап қалуға қатысты заң мен шарт. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК, борышқордың мүлкін ұстап қалу туралы ережелер"},{"num":3,"type":"single","q":"Сот іс бойынша қандай негізгі құқықтық мәселені шешуі тиіс?","options":["Ұстап қалу кез келген дауда сот шешімін алмастырады","Ұстап қалу кредитор заңсыз иеленген кез келген затқа қолданылады","Ұстап қалу борышкердің мүлігін автоматты меншікке айналдырады","Заттың кредиторға заңды негізде түскенін","Кредитор өзіне берілмеген затты ұстап қалу үшін алып қоя алады","Ұстап қалу шарт пен заңдағы барлық шектеуді жояды"],"answer":[3],"explanation":"ҚР АК, борышқордың мүлкін ұстап қалу туралы ережелер. Заттың кредиторға заңды негізде түскенін. Бұл қорытынды материалдық құқық нормалары мен іс бойынша ұсынылған дәлелдемелер негізінде жасалады.","basis":"ҚР АК, борышқордың мүлкін ұстап қалу туралы ережелер"},{"num":4,"type":"multi","q":"Сот дауды шешу үшін қандай дәлелдемелерді зерттеуі керек?","options":["Заттың басқа дүкендегі бағасы","Шеберхананың басқа клиенттерінің қарыздары","Төлемнің орындалмағанын растайтын деректер","Заттың шеберханаға заңды берілгенін растайтын құжат","Жөндеу жұмысының ақысы туралы келісім","Тапсырыс берушінің басқа мүліктері","Жөндеушінің өзге жұмыс тапсырыстары","Шеберхананың өзге қызметтерінің тарифтері"],"answer":[2,3,4],"explanation":"ҚР АК, борышқордың мүлкін ұстап қалу туралы ережелер. Дәлелдеуге жататын мән-жайлар: Заттың шеберханаға заңды берілгенін растайтын құжат; Жөндеу жұмысының ақысы туралы келісім; Төлемнің орындалмағанын растайтын деректер. Құжаттар сотта қатыстылығы, жол берілуі және анықтығы тұрғысынан бағаланады.","basis":"ҚР АК, борышқордың мүлкін ұстап қалу туралы ережелер"}]},{"id":104,"title":"Кепілдік және кепілболушылық түсінігі. Кепілдіктің және кепіл болушылықтың негізі және нысаны. Кепіл берушінің және кепіл болушының жауапкершілігі.","material":"Банк қарыз берді. Үшінші тұлға қарыздың қайтарылуын қамтамасыз етуге келісім берді. Құжатта оның жауаптылығының түрі мен көлемі көрсетілген.","procedure":"Банк борышкерден төлем ала алмай, қамтамасыз етушіге талап қойды. Қамтамасыз етуші өзінің кепіл болушы екенін және жауаптылығы қосалқы екенін көрсетті. Сот жазбаша құжаттың нақты мазмұнын анықтайды.","questions":[{"num":1,"type":"single","q":"Бұл қатынаста ең алдымен нені ажырату керек?","options":["Кепілдік пен кепіл болушылықтың құқықтық режимін","Кепілдік пен кепіл болушылықтың жауаптылық режимі бірдей","Кепілдік келісімі жазбаша нысанды қажет етпейді","Кепіл болушы барлық жағдайда негізгі борышкерді алмастырады","Кепіл болушылықтың көлемі шартпен анықталмайды","Кепілдік міндеттемесі негізгі борыштың бар-жоғына тәуелсіз"],"answer":[0],"explanation":"ҚР АК 329–336-баптар. Кепілдік пен кепіл болушылықтың құқықтық режимін. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 329–336-баптар"},{"num":2,"type":"multi","q":"Қамтамасыз етуші тұлғаның жауаптылығын анықтау үшін не маңызды?","options":["Жауаптылықтың заңда белгіленген сипаты","Негізгі борыштың орындалу жағдайы","Кепілдік пен кепіл болушылықтың жауаптылық режимі бірдей","Жазбаша келісімнің мазмұны","Кепілдік келісімі жазбаша нысанды қажет етпейді","Кепілдік міндеттемесі негізгі борыштың бар-жоғына тәуелсіз","Кепіл болушы барлық жағдайда негізгі борышкерді алмастырады"],"answer":[0,1,3],"explanation":"ҚР АК 329–336-баптар. Жауаптылықтың заңда белгіленген сипаты; Негізгі борыштың орындалу жағдайы; Жазбаша келісімнің мазмұны. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 329–336-баптар"},{"num":3,"type":"single","q":"Сот іс бойынша қандай негізгі құқықтық мәселені шешуі тиіс?","options":["Кепілдік келісімі жазбаша нысанды қажет етпейді","Кепіл болушы барлық жағдайда негізгі борышкерді алмастырады","Қамтамасыз етушінің жауаптылығының негізі мен көлемі","Кепілдік міндеттемесі негізгі борыштың бар-жоғына тәуелсіз","Кепіл болушылықтың көлемі шартпен анықталмайды","Кепілдік пен кепіл болушылықтың жауаптылық режимі бірдей"],"answer":[2],"explanation":"ҚР АК 329–336-баптар. Қамтамасыз етушінің жауаптылығының негізі мен көлемі. Бұл қорытынды материалдық құқық нормалары мен іс бойынша ұсынылған дәлелдемелер негізінде жасалады.","basis":"ҚР АК 329–336-баптар"},{"num":4,"type":"multi","q":"Сот дауды шешу үшін қандай дәлелдемелерді зерттеуі керек?","options":["Қамтамасыз етушінің жауаптылық шегі","Қамтамасыз етушінің басқа шарттары","Қамтамасыз етушінің өзге сатып алулары","Банктің басқа клиенттерінің қарыздары","Борышкердің басқа банктердегі шоттары","Негізгі қарыздың мөлшері мен орындалу жағдайы","Банктің басқа өнімдеріне тарифтер","Кепілдік не кепіл болушылық туралы жазбаша құжат"],"answer":[0,5,7],"explanation":"ҚР АК 329–336-баптар. Дәлелдеуге жататын мән-жайлар: Кепілдік не кепіл болушылық туралы жазбаша құжат; Негізгі қарыздың мөлшері мен орындалу жағдайы; Қамтамасыз етушінің жауаптылық шегі. Құжаттар сотта қатыстылығы, жол берілуі және анықтығы тұрғысынан бағаланады.","basis":"ҚР АК 329–336-баптар"}]},{"id":105,"title":"Кепiлпұл ұғымы. Кепiлпұл туралы келiсiм нысаны. Кепiлпұлмен қамтамасыз етiлген мiндеттеменi тоқтатудың және орындамаудың салдары.","material":"Пәтерді сатып алу туралы жазбаша келісімде сатып алушы сатушыға кепілпұл берді. Кейін тараптардың бірі шартты орындаудан бас тартты.","procedure":"Сатушы мәміледен бас тартқан соң сатып алушы кепілпұлдың екі есесін өндіріп алуды сұрады. Сатушы берілген ақшаның жай аванс екенін мәлімдеді. Сот жазбаша келісім мен орындалмауға жауапты тарапты анықтайды.","questions":[{"num":1,"type":"single","q":"Кепілпұлдың салдарын анықтау үшін алдымен не қажет?","options":["Кепілпұл туралы келісім әрқашан ауызша жасалады","Кепілпұлды берген тарап кінәлі болса да ақша міндетті қайтарылады","Кепілпұл кез келген алдын ала төлеммен бірдей саналады","Кепілпұл шарттың орындалмау себебіне тәуелсіз екі еселенеді","Міндеттеменің орындалмауына кім жауапты екенін анықтау","Кепілпұлды алған тарап кінәлі болса да бір еселік сома ғана қайтады"],"answer":[4],"explanation":"ҚР АК 337–338-баптар. Міндеттеменің орындалмауына кім жауапты екенін анықтау. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 337–338-баптар"},{"num":2,"type":"multi","q":"Кепілпұл жөніндегі дауда не тексеріледі?","options":["Кепілпұл туралы келісім әрқашан ауызша жасалады","Кепілпұл туралы келісімнің нысаны","Кепілпұлды берген тарап кінәлі болса да ақша міндетті қайтарылады","Кепілпұл кез келген алдын ала төлеммен бірдей саналады","Ақшаның кепілпұл ретінде берілгені","Орындамауға жауапты тарап","Кепілпұлды алған тарап кінәлі болса да бір еселік сома ғана қайтады"],"answer":[1,4,5],"explanation":"ҚР АК 337–338-баптар. Кепілпұл туралы келісімнің нысаны; Ақшаның кепілпұл ретінде берілгені; Орындамауға жауапты тарап. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 337–338-баптар"},{"num":3,"type":"single","q":"Сот іс бойынша қандай негізгі құқықтық мәселені шешуі тиіс?","options":["Кепілпұлды алған тарап кінәлі болса да бір еселік сома ғана қайтады","Кепілпұлды берген тарап кінәлі болса да ақша міндетті қайтарылады","Орындамауға қай тараптың жауапты екенін","Кепілпұл шарттың орындалмау себебіне тәуелсіз екі еселенеді","Кепілпұл кез келген алдын ала төлеммен бірдей саналады","Кепілпұл туралы келісім әрқашан ауызша жасалады"],"answer":[2],"explanation":"ҚР АК 337–338-баптар. Орындамауға қай тараптың жауапты екенін. Бұл қорытынды материалдық құқық нормалары мен іс бойынша ұсынылған дәлелдемелер негізінде жасалады.","basis":"ҚР АК 337–338-баптар"},{"num":4,"type":"multi","q":"Сот дауды шешу үшін қандай дәлелдемелерді зерттеуі керек?","options":["Пәтердің бұрынғы коммуналдық төлемдері","Кепілпұлдың нақты берілгенін растайтын құжат","Пәтердің өзге жарнамалық бағалары","Шартты орындамауға жауапты тарап туралы дәлелдер","Тараптардың басқа сатып алу шарттары","Ақшаны кепілпұл ретінде беру туралы жазбаша келісім","Сатушының басқа пәтерлермен мәмілелері","Сатып алушының басқа банктегі салымы"],"answer":[1,3,5],"explanation":"ҚР АК 337–338-баптар. Дәлелдеуге жататын мән-жайлар: Ақшаны кепілпұл ретінде беру туралы жазбаша келісім; Кепілпұлдың нақты берілгенін растайтын құжат; Шартты орындамауға жауапты тарап туралы дәлелдер. Құжаттар сотта қатыстылығы, жол берілуі және анықтығы тұрғысынан бағаланады.","basis":"ҚР АК 337–338-баптар"}]},{"id":106,"title":"Кепiл ұғымы. Кепiлдiң пайда болу негiздерi. Кепiл мәнi. Кепiл арқылы қамтамасыз етiлетiн талаптар. Кепiл түрлерi.","material":"Компания несие алу үшін қойма ғимаратын кепілге берді. Тараптар кепіл шартында қамтамасыз етілетін талапты және мүлікті нақты көрсетті.","procedure":"Кредитор қойма кепілін жарамды деп тануды сұрады. Борышкер жылжымайтын мүлік кепілінің мемлекеттік тіркелмегенін көрсетті. Сот кепіл шартын және тіркеу деректерін зерттейді.","questions":[{"num":1,"type":"single","q":"Бұл мәміледегі қамтамасыз ету тәсілі қандай?","options":["Кепілге салынған зат автоматты кредитордың меншігіне өтеді","Кепіл нысанасы анықталмаса да шарт міндетті жарамды","Кепіл берушінің мүлікке құқығы ешқашан тексерілмейді","Кепіл қамтамасыз етілген талаппен байланыспайды","Кепілдің тіркелуі талап етілгенде оны өткізіп жіберуге болады","Мүлік кепілі"],"answer":[5],"explanation":"ҚР АК 299–308-баптар. Мүлік кепілі. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 299–308-баптар"},{"num":2,"type":"multi","q":"Кепілдің жарамдылығын бағалауда не маңызды?","options":["Заңдағы нысан мен тіркеу талаптары","Кепілдің тіркелуі талап етілгенде оны өткізіп жіберуге болады","Кепіл нысанасы анықталмаса да шарт міндетті жарамды","Кепіл нысанасының анықталуы","Кепіл берушінің мүлікке құқығы ешқашан тексерілмейді","Кепіл берушінің мүлікке құқығы","Кепіл қамтамасыз етілген талаппен байланыспайды"],"answer":[0,3,5],"explanation":"ҚР АК 299–308-баптар. Заңдағы нысан мен тіркеу талаптары; Кепіл нысанасының анықталуы; Кепіл берушінің мүлікке құқығы. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 299–308-баптар"},{"num":3,"type":"single","q":"Сот іс бойынша қандай негізгі құқықтық мәселені шешуі тиіс?","options":["Кепіл берушінің мүлікке құқығы ешқашан тексерілмейді","Кепілдің тіркелуі талап етілгенде оны өткізіп жіберуге болады","Кепіл қамтамасыз етілген талаппен байланыспайды","Кепіл нысанасы анықталмаса да шарт міндетті жарамды","Кепілге салынған зат автоматты кредитордың меншігіне өтеді","Кепіл нысанасының және қамтамасыз етілген талаптың айқындалуын"],"answer":[5],"explanation":"ҚР АК 299–308-баптар. Кепіл нысанасының және қамтамасыз етілген талаптың айқындалуын. Бұл қорытынды материалдық құқық нормалары мен іс бойынша ұсынылған дәлелдемелер негізінде жасалады.","basis":"ҚР АК 299–308-баптар"},{"num":4,"type":"multi","q":"Сот дауды шешу үшін қандай дәлелдемелерді зерттеуі керек?","options":["Жылжымайтын мүлік кепілінің тіркелуі туралы деректер","Кепіл шартының мазмұны","Кредитордың басқа қарыз алушылары","Қойманың басқа жалға алушылары","Басқа ғимараттардың нарықтық құны","Компанияның өзге тауарлары","Қоймаға құқық белгілейтін құжаттар","Компанияның өзге жарнамалары"],"answer":[0,1,6],"explanation":"ҚР АК 299–308-баптар. Дәлелдеуге жататын мән-жайлар: Қоймаға құқық белгілейтін құжаттар; Кепіл шартының мазмұны; Жылжымайтын мүлік кепілінің тіркелуі туралы деректер. Құжаттар сотта қатыстылығы, жол берілуі және анықтығы тұрғысынан бағаланады.","basis":"ҚР АК 299–308-баптар"}]},{"id":107,"title":"Кепiл ұстаушының кепiлге салынған нәрсе жөнiндегi құқықтарын қорғау. Кепiлге салынған мүлiктен ақы өндiрiп алу негiздерi. Кепiлге салынған нәрседен ақы өндiрiп алу тәртiбi.","material":"Борышкер кепілмен қамтамасыз етілген қарызды мерзімінде қайтармады. Кредитор кепілдегі мүлік есебінен талабын қанағаттандырмақ.","procedure":"Банк кепілдегі қойманы өндіріп алу туралы талап қойды. Борышкер кешігу елеусіз және талап мөлшері мүлік құнына анық мөлшерлес емес екенін мәлімдеді. Сот берешек мөлшерін, кешігу кезеңін және заңда белгіленген шектеулерді тексереді.","questions":[{"num":1,"type":"single","q":"Кредитор қандай рәсімді қарастыруы тиіс?","options":["Кредитор кепіл мүлкін заңдағы тәртіпсіз өзіне ала алады","Кепіл шартындағы шектеулер өндіріп алуға әсер етпейді","Кепілден өндіріп алу борыш бұзылмаса да басталады","Кепіл мүлкін өндіріп алу кез келген жағдайда тек ауызша өтеді","Кепілге құқықтың болуы соттық бақылауды толық жоққа шығарады","Кепіл нысанасынан өндіріп алудың заңды тәртібін"],"answer":[5],"explanation":"ҚР АК 316–321-баптар. Кепіл нысанасынан өндіріп алудың заңды тәртібін. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 316–321-баптар"},{"num":2,"type":"multi","q":"Өндіріп алу үшін қандай мәселелер маңызды?","options":["Кредитор кепіл мүлкін заңдағы тәртіпсіз өзіне ала алады","Кепіл мүлкін өндіріп алу кез келген жағдайда тек ауызша өтеді","Кепіл шартындағы шектеулер өндіріп алуға әсер етпейді","Кепілден өндіріп алу борыш бұзылмаса да басталады","Кепіл шартының талаптары","Қамтамасыз етілген міндеттеменің бұзылуы","Соттық не соттан тыс тәртіптің заңдылығы"],"answer":[4,5,6],"explanation":"ҚР АК 316–321-баптар. Кепіл шартының талаптары; Қамтамасыз етілген міндеттеменің бұзылуы; Соттық не соттан тыс тәртіптің заңдылығы. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 316–321-баптар"},{"num":3,"type":"single","q":"Сот іс бойынша қандай негізгі құқықтық мәселені шешуі тиіс?","options":["Кепілге құқықтың болуы соттық бақылауды толық жоққа шығарады","Кредитор кепіл мүлкін заңдағы тәртіпсіз өзіне ала алады","Кепілден өндіріп алу борыш бұзылмаса да басталады","Кепіл шартындағы шектеулер өндіріп алуға әсер етпейді","Кепіл мүлкін өндіріп алу кез келген жағдайда тек ауызша өтеді","Өндіріп алуға негіз болатын міндеттеменің бұзылуын"],"answer":[5],"explanation":"ҚР АК 316–321-баптар. Өндіріп алуға негіз болатын міндеттеменің бұзылуын. Бұл қорытынды материалдық құқық нормалары мен іс бойынша ұсынылған дәлелдемелер негізінде жасалады.","basis":"ҚР АК 316–321-баптар"},{"num":4,"type":"multi","q":"Сот дауды шешу үшін қандай дәлелдемелерді зерттеуі керек?","options":["Кепіл мүлкінің шартта көрсетілген құны","Кепіл шарты мен қамтамасыз етілген борыш туралы құжаттар","Мерзімі өткен берешек пен кешігу кезеңінің есебі","Мүліктің өзге аудандардағы жалдау ақысы","Борышкердің өзге мүліктерінің бағасы","Банк қызметкерлерінің жұмыс кестесі","Кредитордың басқа клиенттеріне талаптары","Борышкердің басқа кепілсіз шарттары"],"answer":[0,1,2],"explanation":"ҚР АК 316–321-баптар. Дәлелдеуге жататын мән-жайлар: Кепіл шарты мен қамтамасыз етілген борыш туралы құжаттар; Мерзімі өткен берешек пен кешігу кезеңінің есебі; Кепіл мүлкінің шартта көрсетілген құны. Құжаттар сотта қатыстылығы, жол берілуі және анықтығы тұрғысынан бағаланады.","basis":"ҚР АК 316–321-баптар"}]},{"id":108,"title":"Кепiлдi тоқтату. Кепiлге салынған мүлiкке құқық басқа тұлғаға құқықты мирасқорлық тәртiбiмен көшуi кезiнде кепiлдiң сақталуы. Кепiлге салынған мүлiктi күштеп алу салдары.","material":"Кепілдегі үй басқа тұлғаға заңды мәмілемен берілді. Сатып алушы үйде бұрыннан тіркелген кепіл ауыртпалығы бар екенін кейін анықтады.","procedure":"Жаңа меншік иесі кепілді тоқтатуды сұрады, себебі үйді сатып алған. Кепіл ұстаушы құқық ауысқанда кепіл сақталатынын айтты. Сот кепілдің тіркелуін, құқық ауысуын және тоқтау негіздерін зерттейді.","questions":[{"num":1,"type":"single","q":"Меншік иесі ауысқанда қандай қағида тексеріледі?","options":["Мүлік иесі ауысқанда кепіл әрқашан бірден тоқтайды","Кепіл негізгі міндеттеме орындалса да міндетті сақталады","Мүлікті күштеп алу кепіл құқығына ешбір жағдайда әсер етпейді","Кепілдің тоқтау негіздері заңмен реттелмейді","Кепілдің құқық мирасқорлығы кезінде сақталуы","Мүлікке құқықтың ауысуы кепіл ұстаушының құқығын автоматты жояды"],"answer":[4],"explanation":"ҚР АК 322–324-баптар. Кепілдің құқық мирасқорлығы кезінде сақталуы. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 322–324-баптар"},{"num":2,"type":"multi","q":"Кепілдің жалғасуын не арқылы бағалайды?","options":["Мүлікті күштеп алу кепіл құқығына ешбір жағдайда әсер етпейді","Кепілдің тоқтау негіздері заңмен реттелмейді","Кепіл негізгі міндеттеме орындалса да міндетті сақталады","Мүлік иесі ауысқанда кепіл әрқашан бірден тоқтайды","Кепіл құқығының туындау негізі","Кепілдің тоқтауына қатысты заң талаптары","Мүлікке құқықтың ауысу жағдайы"],"answer":[4,5,6],"explanation":"ҚР АК 322–324-баптар. Кепіл құқығының туындау негізі; Кепілдің тоқтауына қатысты заң талаптары; Мүлікке құқықтың ауысу жағдайы. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 322–324-баптар"},{"num":3,"type":"single","q":"Сот іс бойынша қандай негізгі құқықтық мәселені шешуі тиіс?","options":["Мүлікке құқықтың ауысуы кепіл ұстаушының құқығын автоматты жояды","Кепілдің тоқтауына заңды негіздің бар-жоғын","Кепілдің тоқтау негіздері заңмен реттелмейді","Кепіл негізгі міндеттеме орындалса да міндетті сақталады","Мүлік иесі ауысқанда кепіл әрқашан бірден тоқтайды","Мүлікті күштеп алу кепіл құқығына ешбір жағдайда әсер етпейді"],"answer":[1],"explanation":"ҚР АК 322–324-баптар. Кепілдің тоқтауына заңды негіздің бар-жоғын. Бұл қорытынды материалдық құқық нормалары мен іс бойынша ұсынылған дәлелдемелер негізінде жасалады.","basis":"ҚР АК 322–324-баптар"},{"num":4,"type":"multi","q":"Сот дауды шешу үшін қандай дәлелдемелерді зерттеуі керек?","options":["Сатушының өзге сатып алу шарттары","Үйдің бұрынғы жалдау жарнамасы","Үйге құқықтың жаңа тұлғаға ауысқанын растайтын құжат","Жаңа иенің басқа банктегі шоты","Жаңа иенің басқа үйлерінің бағасы","Кепілдің бастапқы тіркелуі туралы деректер","Кредитордың басқа кепілдері","Кепілдің тоқтау негізіне қатысты құжаттар"],"answer":[2,5,7],"explanation":"ҚР АК 322–324-баптар. Дәлелдеуге жататын мән-жайлар: Кепілдің бастапқы тіркелуі туралы деректер; Үйге құқықтың жаңа тұлғаға ауысқанын растайтын құжат; Кепілдің тоқтау негізіне қатысты құжаттар. Құжаттар сотта қатыстылығы, жол берілуі және анықтығы тұрғысынан бағаланады.","basis":"ҚР АК 322–324-баптар"}]},{"id":109,"title":"Міндеттеменің орындалуының түсінігі.","material":"Борышкер шарт бойынша 500 мың теңгені 10 қазанда кредитордың банктік шотына аударуға міндеттенді. Ақша 10 қазанда шотқа түсті.","procedure":"Кредитор төлем алынбағанын мәлімдеп, 500 мың теңгені қайта өндіріп алуды сұрады. Борышкер банк аударымының үзіндісін ұсынды. Сот ақша тиісті шотқа мерзімінде түскен-түспегенін тексереді.","questions":[{"num":1,"type":"single","q":"Міндеттеменің орындалуын бағалауда шешуші не?","options":["Борышкер шарттағы орындау тәсілін біржақты еркін өзгерте алады","Орындауды растау үшін құжаттардың қажеті болмайды","Төлемнің шартта көрсетілген тәртіппен жасалуы","Төлемнің мерзімі мен алушысы міндеттемеге әсер етпейді","Борышкер кез келген тұлғаға төлесе міндеттеме орындалады","Келісілген соманың бір бөлігі әрқашан толық орындау болады"],"answer":[2],"explanation":"ҚР АК 272–284-баптар. Төлемнің шартта көрсетілген тәртіппен жасалуы. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 272–284-баптар"},{"num":2,"type":"multi","q":"Орындауды растайтын қандай деректер маңызды?","options":["Аударылған сома","Төлем құжаты","Төлем алушының деректемелері","Борышкер кез келген тұлғаға төлесе міндеттеме орындалады","Төлемнің мерзімі мен алушысы міндеттемеге әсер етпейді","Келісілген соманың бір бөлігі әрқашан толық орындау болады","Орындауды растау үшін құжаттардың қажеті болмайды"],"answer":[0,1,2],"explanation":"ҚР АК 272–284-баптар. Аударылған сома; Төлем құжаты; Төлем алушының деректемелері. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 272–284-баптар"},{"num":3,"type":"single","q":"Сот іс бойынша қандай негізгі құқықтық мәселені шешуі тиіс?","options":["Орындауды растау үшін құжаттардың қажеті болмайды","Борышкер кез келген тұлғаға төлесе міндеттеме орындалады","Келісілген соманың бір бөлігі әрқашан толық орындау болады","Борышкер шарттағы орындау тәсілін біржақты еркін өзгерте алады","Төлемнің мерзімі мен алушысы міндеттемеге әсер етпейді","Төлемнің шартқа сай жасалғанын"],"answer":[5],"explanation":"ҚР АК 272–284-баптар. Төлемнің шартқа сай жасалғанын. Бұл қорытынды материалдық құқық нормалары мен іс бойынша ұсынылған дәлелдемелер негізінде жасалады.","basis":"ҚР АК 272–284-баптар"},{"num":4,"type":"multi","q":"Сот дауды шешу үшін қандай дәлелдемелерді зерттеуі керек?","options":["Тараптардың басқа шарттарындағы төлемдер","Ақшаның кредитор шотына түсуі туралы үзінді","Борышкердің өзге мүліктерінің бағасы","Төлем мерзімі мен сомасы көрсетілген шарт","Банктің өзге қызметтерінің тарифтері","Борышкердің өзге банктік карталары","Банк аударымы туралы төлем құжаты","Кредитордың басқа қарыз алушылары"],"answer":[1,3,6],"explanation":"ҚР АК 272–284-баптар. Дәлелдеуге жататын мән-жайлар: Төлем мерзімі мен сомасы көрсетілген шарт; Банк аударымы туралы төлем құжаты; Ақшаның кредитор шотына түсуі туралы үзінді. Құжаттар сотта қатыстылығы, жол берілуі және анықтығы тұрғысынан бағаланады.","basis":"ҚР АК 272–284-баптар"}]},{"id":110,"title":"Міндеттеменің өзгеру негіздері.","material":"Тараптар қызмет көрсету шартының бағасын және орындау мерзімін кейінгі жазбаша келісіммен өзгертті. Екі тарап та жаңа талаптарды қабылдады.","procedure":"Қызмет көрсетуші қосымша келісімді орындаудан бас тартты. Тапсырыс беруші жаңа баға мен мерзімді қолдануды сұрады. Сот келісімнің жасалуын, тараптардың еркін және нысан талаптарын тексереді.","questions":[{"num":1,"type":"single","q":"Міндеттемені өзгертудің қандай негізі көрсетілген?","options":["Міндеттемені өзгерту негізгі шартты әрқашан жарамсыз етеді","Өзгерту туралы келісімнің нысаны құқықтық мәнге ие емес","Бір тарап шартты заңды негізсіз өздігінен өзгерте алады","Тараптардың өзара келісімі","Міндеттемені өзгерту үшін тараптардың келісімі ешқашан қажет емес","Өзгерту тек борышкердің ауызша мәлімдемесімен іске асады"],"answer":[3],"explanation":"ҚР АК 401–404-баптар. Тараптардың өзара келісімі. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 401–404-баптар"},{"num":2,"type":"multi","q":"Өзгерістің заңдылығын бағалауда не тексеріледі?","options":["Өзгерту нысанына қатысты талаптар","Өзгерту туралы келісімнің нысаны құқықтық мәнге ие емес","Өзгерту туралы келісімнің мазмұны","Бір тарап шартты заңды негізсіз өздігінен өзгерте алады","Міндеттемені өзгерту үшін тараптардың келісімі ешқашан қажет емес","Міндеттемені өзгерту негізгі шартты әрқашан жарамсыз етеді","Бастапқы шарттың талаптары"],"answer":[0,2,6],"explanation":"ҚР АК 401–404-баптар. Өзгерту нысанына қатысты талаптар; Өзгерту туралы келісімнің мазмұны; Бастапқы шарттың талаптары. Бұл ереже кейстегі міндеттеменің құқықтық табиғатына және нақты шарттарына қолданылады.","basis":"ҚР АК 401–404-баптар"},{"num":3,"type":"single","q":"Сот іс бойынша қандай негізгі құқықтық мәселені шешуі тиіс?","options":["Бір тарап шартты заңды негізсіз өздігінен өзгерте алады","Өзгерту тек борышкердің ауызша мәлімдемесімен іске асады","Өзгерту туралы келісімнің нысаны құқықтық мәнге ие емес","Міндеттемені өзгерту негізгі шартты әрқашан жарамсыз етеді","Өзгертуге тараптардың келісімі немесе заңды негіз бар-жоғын","Міндеттемені өзгерту үшін тараптардың келісімі ешқашан қажет емес"],"answer":[4],"explanation":"ҚР АК 401–404-баптар. Өзгертуге тараптардың келісімі немесе заңды негіз бар-жоғын. Бұл қорытынды материалдық құқық нормалары мен іс бойынша ұсынылған дәлелдемелер негізінде жасалады.","basis":"ҚР АК 401–404-баптар"},{"num":4,"type":"multi","q":"Сот дауды шешу үшін қандай дәлелдемелерді зерттеуі керек?","options":["Бастапқы қызмет көрсету шарты","Қосымша келісімге тараптардың қол қойғанын растайтын деректер","Басқа компаниялардың қызмет тарифтері","Қызмет көрсетушінің басқа клиенттерінің шарттары","Баға мен мерзімді өзгерткен қосымша келісім","Тапсырыс берушінің өзге қызметтері","Қызмет көрсетушінің бұрынғы жарнамалары","Тараптардың басқа мәмілелеріндегі мерзімдер"],"answer":[0,1,4],"explanation":"ҚР АК 401–404-баптар. Дәлелдеуге жататын мән-жайлар: Бастапқы қызмет көрсету шарты; Баға мен мерзімді өзгерткен қосымша келісім; Қосымша келісімге тараптардың қол қойғанын растайтын деректер. Құжаттар сотта қатыстылығы, жол берілуі және анықтығы тұрғысынан бағаланады.","basis":"ҚР АК 401–404-баптар"}]},{"id":111,"title":"Міндеттемені тоқтатудың түсінігі мен негіздері.","material":"Сатушы сатып алушыға жабдық жеткізуге міндеттенді. Жабдық толық беріліп, сатып алушы оның құнын толық төледі. Кейін сатушы сол төлемді қайтадан талап етті.","procedure":"Сатып алушы банк төлем құжаттарын және қабылдау актісін сотқа ұсынды. Сот міндеттеменің орындалу арқылы тоқтатылғанын анықтайды.","questions":[{"num":1,"type":"single","q":"Міндеттеменің тоқтауына осы жағдайда не негіз болады?","options":["Міндеттеменің тиісінше толық орындалуы","Кредитор жаңа талап қойған сәтте бұрын орындалған міндеттеме қайта туындайды","Шарт бойынша барлық міндеттемелер қабылдау актісіне қол қойылған күні тоқтайды","Ақша аударылған сәттен бастап жеткізу міндеттемесі де орындалды деп саналады","Міндеттеме шарт мерзімі біткенде орындалуына қарамастан тоқтатылады","Төлем туралы хабарлама банк құжатынсыз толық орындауды растайды"],"answer":[0],"explanation":"ҚР АК 367, 368-баптар. Міндеттеменің тиісінше толық орындалуы. Кейсте осы құқықтық негізге сәйкес міндеттеме мен оның орындалуы бағаланады.","basis":"ҚР АК 367, 368-баптар"},{"num":2,"type":"multi","q":"Міндеттеменің тоқтатылуы туралы дұрыс тұжырымдарды таңдаңыз.","options":["Тиісінше орындау міндеттемені тоқтатады","Міндеттеме шарт мерзімі біткенде орындалуына қарамастан тоқтатылады","Төлем туралы хабарлама банк құжатынсыз толық орындауды растайды","Міндеттеме заңда көзделген өзге негіздермен де тоқтауы мүмкін","Жеткізу актісі болмаса төлемнің жасалғаны жеткізуді дәлелдейді","Кредитор жаңа талап қойған сәтте бұрын орындалған міндеттеме қайта туындайды","Міндеттеме борышкердің орындауға ниеті болғандықтан тоқтатылады"],"answer":[0,3],"explanation":"ҚР АК 367, 368-баптар. Тиісінше орындау міндеттемені тоқтатады; Міндеттеме заңда көзделген өзге негіздермен де тоқтауы мүмкін. Бұл талаптар көрсетілген жағдайдағы құқықтық салдарды анықтайды.","basis":"ҚР АК 367, 368-баптар"},{"num":3,"type":"single","q":"Сот қай құқықтық мәселені шешуі керек?","options":["Жабдықтың құны өзгергені бұрынғы міндеттемені қайта қалпына келтіреді","Жеткізу актісі болмаса төлемнің жасалғаны жеткізуді дәлелдейді","Шарттың жасалғанын растау міндеттеменің тоқтағанын дәлелдейді","Міндеттеме борышкердің орындауға ниеті болғандықтан тоқтатылады","Жеткізу мен төлем арқылы міндеттеменің тоқтаған-тоқтамағанын","Төлем туралы хабарлама банк құжатынсыз толық орындауды растайды"],"answer":[4],"explanation":"ҚР АК 367, 368-баптар. Жеткізу мен төлем арқылы міндеттеменің тоқтаған-тоқтамағанын. Сот осы мән-жайды талаптың нысанасына қатысты дәлелдемелермен салыстырады.","basis":"ҚР АК 367, 368-баптар"},{"num":4,"type":"multi","q":"Міндеттеменің тоқтағанын дәлелдеуге қандай құжаттар қатысты?","options":["Шарт бойынша барлық міндеттемелер қабылдау актісіне қол қойылған күні тоқтайды","Сатушының жаңа шот жіберуі бұрынғы төлемді жарамсыз етеді","Жеткізу мен төлем шарттары жазылған келісім","Толық төлемді растайтын банк құжаты","Шарттың жасалғанын растау міндеттеменің тоқтағанын дәлелдейді","Жеткізу актісі болмаса төлемнің жасалғаны жеткізуді дәлелдейді","Жабдықтың құны өзгергені бұрынғы міндеттемені қайта қалпына келтіреді","Тауарды беру туралы қабылдау актісі"],"answer":[2,3,7],"explanation":"ҚР АК 367, 368-баптар. Маңызды дәлелдемелер: Толық төлемді растайтын банк құжаты; Жеткізу мен төлем шарттары жазылған келісім; Тауарды беру туралы қабылдау актісі. Олардың қатыстылығы мен анықтығы істің нақты мән-жайлары арқылы бағаланады.","basis":"ҚР АК 367, 368-баптар"}]},{"id":112,"title":"Міндеттемені тоқтатудың әдістері.","material":"Екі компания бір-біріне ақша төлеуге міндетті: А компаниясы Б компаниясына 400 000 теңге, ал Б компаниясы А компаниясына 250 000 теңге төлеуге тиіс. Екі талап та біртектес және орындалу мерзімі келген. А компаниясы есепке жатқызу туралы мәлімдеді.","procedure":"Б компаниясы есепке жатқызудың заңдылығын даулады. Сот қарсы талаптардың біртектілігін, мерзімін және мәлімдеменің жеткізілгенін тексереді.","questions":[{"num":1,"type":"single","q":"Осы жағдайда міндеттемені тоқтатудың қандай тәсілі қолданылуы мүмкін?","options":["Есепке жатқызу үшін екі талаптың сомасы міндетті тең болуы керек","Мерзімі келмеген кез келген талап біржақты есепке жатқызылады","Қарсы талаптар біртектес болмаса да өзара есепке жатқызылады","Есепке жатқызу негізгі міндеттемені кепілмен қамтамасыз етеді","Есепке жатқызу борышты басқа тұлғаға аударумен бірдей","Біртектес қарсы талаптарды есепке жатқызу"],"answer":[5],"explanation":"ҚР АК 370-бап. Біртектес қарсы талаптарды есепке жатқызу. Кейсте осы құқықтық негізге сәйкес міндеттеме мен оның орындалуы бағаланады.","basis":"ҚР АК 370-бап"},{"num":2,"type":"multi","q":"Есепке жатқызудың шарттарын таңдаңыз.","options":["Қарсы талаптар әртүрлі тұлғаларға тиесілі болса да есепке алынады","Талаптардың біртектес болуы","Мерзімі келмеген кез келген талап біржақты есепке жатқызылады","Есепке жатқызу мәлімдемесі тараптарға жеткізілмесе де күшіне енеді","Қарсы талаптардың орындалу мерзімінің келуі","Есепке жатқызу борышты басқа тұлғаға аударумен бірдей","Есепке жатқызу негізгі міндеттемені кепілмен қамтамасыз етеді"],"answer":[1,4],"explanation":"ҚР АК 370-бап. Қарсы талаптардың орындалу мерзімінің келуі; Талаптардың біртектес болуы. Бұл талаптар көрсетілген жағдайдағы құқықтық салдарды анықтайды.","basis":"ҚР АК 370-бап"},{"num":3,"type":"single","q":"Есепке жатқызу туралы дауда сот нені анықтайды?","options":["Қарсы талаптар әртүрлі тұлғаларға тиесілі болса да есепке алынады","Екі компанияның бір-біріне төлем жасауы есепке жатқызуды жоққа шығарады","Біртектес қарсы талаптардың бар болуы өздігінен есепке жатқызуды аяқтайды","Есепке жатқызу негізгі міндеттемені кепілмен қамтамасыз етеді","Есепке жатқызу мәлімдемесі тараптарға жеткізілмесе де күшіне енеді","Қарсы талаптардың есепке жатқызуға заңды түрде жарамдылығын"],"answer":[5],"explanation":"ҚР АК 370-бап. Қарсы талаптардың есепке жатқызуға заңды түрде жарамдылығын. Сот осы мән-жайды талаптың нысанасына қатысты дәлелдемелермен салыстырады.","basis":"ҚР АК 370-бап"},{"num":4,"type":"multi","q":"Сот қандай дәлелдемелерді тексеруі тиіс?","options":["Екі компанияның бір-біріне төлем жасауы есепке жатқызуды жоққа шығарады","Есепке жатқызу мәлімдемесі тараптарға жеткізілмесе де күшіне енеді","Талаптардың біртектілігін олардың шарттарының атауы ғана анықтайды","Қарсы талаптар біртектес болмаса да өзара есепке жатқызылады","Біртектес қарсы талаптардың бар болуы өздігінен есепке жатқызуды аяқтайды","Екі қарсы талаптың пайда болу негіздері","Есепке жатқызу туралы мәлімдеме","Талаптардың сомасы мен орындалу мерзімі"],"answer":[5,6,7],"explanation":"ҚР АК 370-бап. Маңызды дәлелдемелер: Талаптардың сомасы мен орындалу мерзімі; Екі қарсы талаптың пайда болу негіздері; Есепке жатқызу туралы мәлімдеме. Олардың қатыстылығы мен анықтығы істің нақты мән-жайлары арқылы бағаланады.","basis":"ҚР АК 370-бап"}]},{"id":113,"title":"Азаматтық–құқықтық жауапкершіліктің түсінігі.","material":"Тасымалдаушы шартта белгіленген мерзімде жүкті жеткізбеді. Кешігу салдарынан сатып алушы сақтау қоймасын қосымша жалдауға мәжбүр болды. Сатып алушы шығынды өтеуді талап етті.","procedure":"Тасымалдаушы кешігу өзіне байланысты емес деп қарсылық білдірді. Сот міндеттеменің бұзылуын, залалды және жауаптылық негіздерін зерттейді.","questions":[{"num":1,"type":"single","q":"Азаматтық-құқықтық жауапкершіліктің осы жағдайдағы мәні қандай?","options":["Тасымалдаушы кешіксе залалдың мөлшері дәлелденбей толық өндіріледі","Бұзылған міндеттемеге байланысты заңда көзделген мүліктік салдарды қолдану","Мүліктік жауаптылық үшін шартты бұзу фактісін анықтау қажет емес","Тасымалдаушының жауаптылығы жүктің иесіне меншік құқығын берумен өтеледі","Залал мен кешігу арасындағы байланыс тек шарт бағасымен анықталады","Жауаптылық міндеттемені бұзған тараптың кез келген табысына тең болады"],"answer":[1],"explanation":"ҚР АК 349, 350-баптар. Бұзылған міндеттемеге байланысты заңда көзделген мүліктік салдарды қолдану. Кейсте осы құқықтық негізге сәйкес міндеттеме мен оның орындалуы бағаланады.","basis":"ҚР АК 349, 350-баптар"},{"num":2,"type":"multi","q":"Жауапкершілікті бағалауға қандай мән-жайлар қатысты?","options":["Шығын туралы алдын ала болжам залалдың нақты мөлшерін дәлелдейді","Жауаптылық міндеттемені бұзған тараптың кез келген табысына тең болады","Тасымалдаушының жауаптылығы жүктің иесіне меншік құқығын берумен өтеледі","Міндеттеменің тиісінше орындалмағаны","Міндеттемені бұзу фактісі жауаптылықтың барлық шарттарын алмастырады","Залал мен құқық бұзушылық арасындағы байланыс","Залал мен кешігу арасындағы байланыс тек шарт бағасымен анықталады"],"answer":[3,5],"explanation":"ҚР АК 349, 350-баптар. Міндеттеменің тиісінше орындалмағаны; Залал мен құқық бұзушылық арасындағы байланыс. Бұл талаптар көрсетілген жағдайдағы құқықтық салдарды анықтайды.","basis":"ҚР АК 349, 350-баптар"},{"num":3,"type":"single","q":"Сот жауапкершілік туралы дауда нені анықтайды?","options":["Міндеттемені бұзу фактісі жауаптылықтың барлық шарттарын алмастырады","Тасымалдаушының өзге маршруттағы кешігуі осы даудағы кінәні дәлелдей
