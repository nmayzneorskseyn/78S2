гіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Сотқа берілген талапты негіздеуге қандай дәлелдер қатысты?","options":["Тапсырыс берушінің басқа құрылғыларға шарттары","Залалдың мөлшері мен себептік байланысын растайтын құжаттар","Мердігердің өзге жабдықтарға талаптары","Құрылғыға қатысы жоқ мердігердің қабылдау актілері","Мердігердің өзге құрылғыларға кепілдік құжаттары","Құрылғыға меншік құқығын растайтын деректер","Құрылғыға қатысы жоқ басқа жөндеу актілері","Құрылғының жауапкерде екенін көрсететін дәлелдер"],"answer":[1,5,7],"explanation":"Дұрыс жауап: Залалдың мөлшері мен себептік байланысын растайтын құжаттар; Құрылғының жауапкерде екенін көрсететін дәлелдер; Құрылғыға меншік құқығын растайтын деректер. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":65,"title":"Азаматтық құқықтарды жүзеге асыру мен қорғаудың мерзімдері.  Мерзімдерді есептеу. Мерзімді анықтау.  Уақыт кезеңiмен белгiленетiн мерзiмнiң басталуы. Мерзiмнiң жұмыс iстемейтiн күнде аяқталуы. Мерзiмнiң соңғы күнiнде әрекет жасау тәртібі.","material":"Шартта жабдықты жеткізу мерзімі 2026 жылғы 15 тамыз деп көрсетілді. Тараптар бөлек хабарламаға жауап беру үшін 10 күндік мерзім белгіледі. Соңғы күн демалыс күніне түсті.","procedure":"Тараптар мерзімнің қай күні аяқталатынын және соңғы күні жасалған әрекеттің уақытылы болған-болмағанын таласты. Сот мерзімнің басталуын және аяқталуын есептейді.","questions":[{"num":1,"type":"single","q":"Уақыт кезеңімен белгіленген мерзімнің өтуі жалпы ереже бойынша қашан басталады?","options":["Тараптар кейін келіскен кез келген күні","Мерзім аяқталған күннен кейін","Мерзімнің соңғы жұмыс күнінде","Мерзімді белгілеген күннің өзінде","Құжатқа қол қойылған күннің алдында","Мерзімнің басталуын айқындайтын күннен кейінгі келесі күні"],"answer":[5],"explanation":"Дұрыс жауап: Мерзімнің басталуын айқындайтын күннен кейінгі келесі күні. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Мерзімдерді есептеу туралы дұрыс тұжырымдарды таңдаңыз.","options":["Күнмен белгіленген мерзім оның алдындағы күннен есептеледі","Мерзімнің соңғы күні әрқашан сенбі болып есептеледі","Мерзімнің аяқталуы оның басталуын анықтайды","Кезеңмен белгіленген мерзім соңғы күннен бастап есептеледі","Уақыт кезеңі басталуына негіз болған күннен кейін есептеледі","Соңғы күн жұмыс істемейтін күнге түссе, аяқталу күні ауысуы мүмкін","Жұмыс істемейтін күнге түскен соңғы күн өзгермейді"],"answer":[4,5],"explanation":"Дұрыс жауап: Соңғы күн жұмыс істемейтін күнге түссе, аяқталу күні ауысуы мүмкін; Уақыт кезеңі басталуына негіз болған күннен кейін есептеледі. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Соттың басты міндеті қандай?","options":["Қолданылатын мерзім ережесіне сай соңғы күнді дұрыс анықтау","Мерзімнің басталуын соңғы күнмен бірдей санау","Соңғы күнді шарттағы өзге міндеттемелермен теңестіру","Мерзімнің басын құжатқа дейінгі күнге ауыстыру","Мерзімнің соңғы күнін тараптардың өзге шарттарына қарай белгілеу","Соңғы күннің демалыс екенін есепке алмау"],"answer":[0],"explanation":"Дұрыс жауап: Қолданылатын мерзім ережесіне сай соңғы күнді дұрыс анықтау. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Мерзімді есептеуге қандай мәліметтер қажет?","options":["Белгіленген уақыт кезеңінің ұзақтығы","Осы шартқа қатысы жоқ мерзім есептеулері","Басқа жеткізу шарттарының басталу күндері","Мерзімнің басталуына негіз болған күн","Соңғы күннің жұмыс күні екені","Тараптардың өзге хабарламаларының мерзімі","Басқа тауарларға қойылған жеткізу күндері","Өзге шарттардағы кепілдік мерзімдерінің ұзақтығы"],"answer":[0,3,4],"explanation":"Дұрыс жауап: Белгіленген уақыт кезеңінің ұзақтығы; Мерзімнің басталуына негіз болған күн; Соңғы күннің жұмыс күні екені. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":66,"title":"Азаматтық құқықтағы мерзімнің түрлері.","material":"Компанияның жеткізу шартында нақты күн, кепілдік мерзімі және талап қою мерзіміне қатысты әртүрлі уақыт ережелері көрсетілген. Тараптар осы мерзімдердің құқықтық маңызын шатастырды.","procedure":"Сотта жеткізу күні, кепілдік міндеттемесінің әрекет ету кезеңі және талап қоюдың ескіруі туралы жеке даулар туындады. Сот әр мерзімнің мақсатын ажыратады.","questions":[{"num":1,"type":"single","q":"Шартта нақты күнмен көрсетілген жеткізу уақыты қандай мерзім?","options":["Сот шешіміне шағым беру мерзімі","Талап қоюдың ескіру мерзімі","Кепілдік міндеттемесінің әрекет ету мерзімі","Міндеттемені орындау мерзімі","Сенімхаттың қолданылу мерзімі","Тауардың жарамдылық мерзімі"],"answer":[3],"explanation":"Дұрыс жауап: Міндеттемені орындау мерзімі. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Мерзім түрлерін дұрыс ажырататын тұжырымдарды таңдаңыз.","options":["Жеткізу мерзімі талап қою ескіруін автоматты тоқтатады","Талап қою мерзімі кепілдік мерзімімен әрқашан тең","Жеткізу мерзімі міндеттемені орындау уақытын анықтайды","Міндеттемені орындау мерзімі затқа меншік құқығын анықтайды","Кепілдік мерзімі жеткізу мерзімін толық алмастырады","Кепілдік мерзімі барлық процестік мерзімдерді алмастырады","Кепілдік мерзімі тауар сапасына байланысты құқықтарға әсер етеді"],"answer":[2,6],"explanation":"Дұрыс жауап: Жеткізу мерзімі міндеттемені орындау уақытын анықтайды; Кепілдік мерзімі тауар сапасына байланысты құқықтарға әсер етеді. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Талап қоюдың ескіру мерзіміне қатысты сот нені бағалайды?","options":["Қолданылатын ескіру мерзімін және оның өтуіне қатысты мән-жайларды","Талап қою ескіруін соттың ішкі кестесімен анықтауды","Ескіру мерзімі қолданылуын тараптардың табысына байлауды","Ескіру мерзімін жеткізу күнінен барлық жағдайда бастауға","Талап қою ескіруін шарттың мерзімімен алмастыруды","Кепілдік мерзімін талап қою ескіруімен теңестіруді"],"answer":[0],"explanation":"Дұрыс жауап: Қолданылатын ескіру мерзімін және оның өтуіне қатысты мән-жайларды. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Мерзімдердің түрін ажырату үшін қандай құжаттар қажет?","options":["Басқа жеткізу даулары бойынша мерзім есептері","Өзге тауарлардың кепілдік мерзімі туралы шарттар","Компанияның өзге шарттарындағы жеткізу мерзімдері","Жеткізушінің басқа тауарларға берген кепілдіктері","Кепілдік талаптары көрсетілген құжат","Құқық бұзушылық анықталған күнге қатысты деректер","Жеткізу мерзімі жазылған шарт","Компанияның өзге міндеттемелеріндегі ескіру мерзімдері"],"answer":[4,5,6],"explanation":"Дұрыс жауап: Жеткізу мерзімі жазылған шарт; Құқық бұзушылық анықталған күнге қатысты деректер; Кепілдік талаптары көрсетілген құжат. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":67,"title":"Заттық құқықтың түсінігі мен белгілері.","material":"Азамат өзіне тиесілі жер учаскесін иеленеді, пайдаланады және оған билік етеді. Көршісі осы учаскеден өтуге заңмен белгіленген сервитут құқығын иеленеді. Тараптар сервитутты меншік құқығымен теңестірді.","procedure":"Сот сервитуттың мазмұнын, оның бөтен затқа қатысты құқық екенін және меншік құқығынан айырмашылығын анықтайды.","questions":[{"num":1,"type":"single","q":"Сервитуттың заттық-құқықтық табиғаты неде?","options":["Бөтен жылжымайтын мүлікті шектеулі пайдалану құқығында","Жердің құқықтық мәртебесін өздігінен өзгертуде","Жерге меншік құқығын шартсыз өткізуде","Жер учаскесін меншік иесінің орнына иеленуде","Жерге билік ету өкілеттігін толық иеленуде","Бөтен учаскеге толық меншік құқығын алуда"],"answer":[0],"explanation":"Дұрыс жауап: Бөтен жылжымайтын мүлікті шектеулі пайдалану құқығында. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Заттық құқық белгілерін дұрыс сипаттайтын тұжырымдарды таңдаңыз.","options":["Заттық құқық затпен тікелей байланысты емес","Заттық құқық заңда көзделген тәсілдермен қорғалуы мүмкін","Сервитут жерге толық меншік құқығын береді","Заттық құқық нақты мүлікке тікелей қатысты болады","Заттық құқық ғана шарттық міндеттемеге қатысты болады","Сервитут иесі жерді меншік иесінің орнына сата алады","Сервитут бөтен жерді пайдаланудың шегін белгілемейді"],"answer":[1,3],"explanation":"Дұрыс жауап: Заттық құқық нақты мүлікке тікелей қатысты болады; Заттық құқық заңда көзделген тәсілдермен қорғалуы мүмкін. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот сервитут туралы дауда нені анықтайды?","options":["Сервитутты жерге толық меншік құқығымен теңестіреді","Сервитуттың құқықтық негізі мен пайдалану шегін","Өту құқығын жерді сату құқығына теңестіреді","Сервитуттың негізін меншік иесінің өзге міндеттерімен анықтайды","Сервитуттың шегін жер иесінің өзге шарттарымен анықтайды","Сервитутты көршінің жеке мүлкіне қатысты талап деп санайды"],"answer":[1],"explanation":"Дұрыс жауап: Сервитуттың құқықтық негізі мен пайдалану шегін. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Заттық құқықтың мазмұнын анықтауға не қатысты?","options":["Көршінің басқа жерге қатысты тіркеу актілері","Даулы жерге қатысы жоқ кадастрлық құжаттар","Сервитутты белгілейтін құқықтық негіз","Өзге учаскелерді пайдалану туралы келісімдер","Даулы жерден өтудің нақты тәсілі","Жер учаскесіне меншік құқығы туралы деректер","Жер иесінің өзге жер учаскелеріне құқықтары","Көршінің басқа учаскелеріне арналған сервитуттар"],"answer":[2,4,5],"explanation":"Дұрыс жауап: Даулы жерден өтудің нақты тәсілі; Жер учаскесіне меншік құқығы туралы деректер; Сервитутты белгілейтін құқықтық негіз. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":68,"title":"Заттық құқықтың жүйесі.","material":"Мемлекеттік мекемеге мүлік жедел басқару құқығымен бекітілген. Басқа ұйым мүлікті шаруашылық жүргізу құқығымен пайдаланады. Екі ұйым да осы құқықтарды толық меншік құқығымен теңестірді.","procedure":"Мүлік иесі ұйымдардың мүлікке билік ету шегін дауласты. Сот заттық құқықтардың түрлерін және олардың заңмен белгіленген көлемін ажыратады.","questions":[{"num":1,"type":"single","q":"Жедел басқару құқығы меншік құқығынан қалай ерекшеленеді?","options":["Мүлікті иелену, пайдалану және билік ету өкілеттіктері заңмен шектеледі","Мүлікті бекіту меншік иесін міндетті түрде өзгертеді","Ұйым мүлікке қатысты барлық құқықты иеленеді","Мүлік ұйымның шектеусіз меншігіне өтеді","Ұйым кез келген мүлікті рұқсатсыз иеліктен шығарады","Меншік иесінің құқықтары мүлікті бекіткенде тоқтайды"],"answer":[0],"explanation":"Дұрыс жауап: Мүлікті иелену, пайдалану және билік ету өкілеттіктері заңмен шектеледі. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Заттық құқықтардың жүйесі туралы дұрыс тұжырымдарды таңдаңыз.","options":["Мүлікті бекіту ұйымға шектеусіз сату құқығын береді","Барлық заттық құқықта өкілеттіктер көлемі бірдей","Меншік құқығы заттық құқықтардың негізгі түрлерінің бірі","Шаруашылық жүргізу және жедел басқару құқықтары шектеулі заттық құқықтар болып саналады","Шектеулі заттық құқықта билік етуге шектеу болмайды","Жедел басқару құқығы толық меншік құқығына тең","Шаруашылық жүргізу құқығы меншік иесін ауыстырады"],"answer":[2,3],"explanation":"Дұрыс жауап: Меншік құқығы заттық құқықтардың негізгі түрлерінің бірі; Шаруашылық жүргізу және жедел басқару құқықтары шектеулі заттық құқықтар болып саналады. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот мүлікке билік ету өкілеттігін қалай бағалайды?","options":["Нақты заттық құқық түріне заң белгілеген шектер бойынша","Заттық құқық түрлерінің заңды айырмашылығын ескермейді","Мүлікті бекіту актісін кез келген сатуға рұқсат деп есептейді","Ұйымның қызмет түрін барлық билік етуге рұқсат деп таниды","Мүлікті пайдалану фактісін шектеусіз иелік деп санайды","Мүлікті балансқа енгізуді меншік құқығына теңестіреді"],"answer":[0],"explanation":"Дұрыс жауап: Нақты заттық құқық түріне заң белгілеген шектер бойынша. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Заттық құқық түрін анықтау үшін қандай деректер қажет?","options":["Мүлікке қатысы жоқ билік ету келісімдері","Ұйымның өзге активтеріне меншік құжаттары","Мүлікті бекіту туралы құқықтық құжат","Басқа мүлікті бекіту туралы құжаттар","Басқа ұйымдардың мүлікті бекіту актілері","Ұйымның басқа заттық құқықтары туралы құжаттар","Ұйымның құқықтық мәртебесі","Даулы билік ету әрекетінің мазмұны"],"answer":[2,6,7],"explanation":"Дұрыс жауап: Мүлікті бекіту туралы құқықтық құжат; Даулы билік ету әрекетінің мазмұны; Ұйымның құқықтық мәртебесі. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":69,"title":"Меншік құқығының түсінігі. Объективтік және субъективтік мағынадағы меншік құқығы.","material":"Азамат өз пәтерін иеленіп, оны жалға берді және кейін сатуға шешім қабылдады. Жалға алушы пәтерді пайдаланғандықтан, өзін меншік иесі деп есептеді.","procedure":"Сот пәтерге меншік құқығы кімге тиесілі екенін және жалға алушының шарттық пайдалану құқығының көлемін анықтайды.","questions":[{"num":1,"type":"single","q":"Меншік құқығының субъективтік мазмұнына қандай өкілеттіктер кіреді?","options":["Мүлікті сақтау, жөндеу және сақтандыру","Тіркеу, есепке алу және бағалау","Қабылдау, тексеру және кепілдік беру","Талап қою, өтініш беру және шағымдану","Иелену, пайдалану және билік ету","Жалдау құқығы, пайдалану құқығы және талап ету"],"answer":[4],"explanation":"Дұрыс жауап: Иелену, пайдалану және билік ету. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Меншік құқығының мағыналарын ажырататын тұжырымдарды таңдаңыз.","options":["Объективтік меншік құқығы бір тұлғаның шартын білдіреді","Объективтік меншік құқығы жалдау шартының мазмұнын білдіреді","Субъективтік меншік құқығы ғана мүлікті пайдаланудан тұрады","Субъективтік меншік құқығы жалға алушыға толық өтеді","Объективтік мағынада меншік құқығы құқықтық нормалар жүйесін білдіреді","Меншік құқығының екі мағынасы бірдей құқықтық норма ғана","Субъективтік мағынада меншік құқығы нақты иенің өкілеттіктерін білдіреді"],"answer":[4,6],"explanation":"Дұрыс жауап: Объективтік мағынада меншік құқығы құқықтық нормалар жүйесін білдіреді; Субъективтік мағынада меншік құқығы нақты иенің өкілеттіктерін білдіреді. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Жалға алушының пәтерді шарт бойынша пайдалануы нені білдірмейді?","options":["Уақытша пайдалану құқығы билік ету құқығын толық қамтитынын","Жалға алушы меншік иесінің барлық өкілеттігін алатынын","Пәтерді пайдалану оны иеленуге толық меншік құқығын беретінін","Жалдау ақысы меншік құқығын сатып алу төлемі екенін","Жалға алушының меншік құқығын автоматты түрде иеленгенін","Жалдау шарты меншік құқығын автоматты түрде өткізетінін"],"answer":[4],"explanation":"Дұрыс жауап: Жалға алушының меншік құқығын автоматты түрде иеленгенін. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Сот меншік құқығын анықтағанда қандай дәлелдерді зерттейді?","options":["Тараптардың жалдау шарты","Тараптардың өзге жалдау даулары туралы материалдар","Жалға алушының өзге пәтерлерге жалдау шарттары","Жалға алушының басқа шарттары бойынша төлемдері","Пәтерге меншік құқығын растайтын құжаттар","Жалға берушінің басқа мүліктерге меншік құжаттары","Пәтерге қатысы жоқ басқа тіркеу құжаттары","Пәтерге қатысты даулы билік ету әрекеттері"],"answer":[0,4,7],"explanation":"Дұрыс жауап: Пәтерге қатысты даулы билік ету әрекеттері; Тараптардың жалдау шарты; Пәтерге меншік құқығын растайтын құжаттар. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":70,"title":"Меншік құқығының объектілері мен субъектілері.","material":"Азамат жеке меншігіндегі автокөлігін серіктестіктің балансына тіркеу үшін ұсынды, бірақ меншік құқығын беретін мәміле жасамады. Серіктестік көліктің баланста тұрғанын негізге алып, өзін меншік иесі деп жариялады.","procedure":"Сот көлікке құқық кімге тиесілі екенін, меншік құқығының субъектісін және объектісін анықтайды.","questions":[{"num":1,"type":"single","q":"Осы дауда меншік құқығының объектісі не?","options":["Көлікке қатысты бухгалтерлік есеп жүргізу құқығы","Серіктестіктің заңды тұлға мәртебесі","Көлікке қатысты есептік құнның мөлшері","Нақты автокөлік","Мүлікті балансқа қою туралы ішкі акт","Көлікті тіркеуге ұсынған азаматтың еркі"],"answer":[3],"explanation":"Дұрыс жауап: Нақты автокөлік. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Меншік құқығының субъектілері туралы дұрыс тұжырымдарды таңдаңыз.","options":["Мүлікті есепке алу меншік құқығын беретін мәміле болады","Заңды тұлға заңда көзделген мүлікке меншік иесі бола алады","Жеке тұлға мүліктің меншік иесі бола алады","Көлікті балансқа қою меншік құқығын автоматты өткізеді","Көлікті пайдаланған қызметкер меншік иесіне айналады","Мүлікті пайдалануға беру әрқашан оны сатуға тең","Мүлікке меншік құқығы ғана заңды тұлғаға тиесілі"],"answer":[1,2],"explanation":"Дұрыс жауап: Жеке тұлға мүліктің меншік иесі бола алады; Заңды тұлға заңда көзделген мүлікке меншік иесі бола алады. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Серіктестіктің меншік құқығын дәлелдеуінде не шешуші?","options":["Көлікті пайдалануды меншік құқығын сатып алуға теңестіру","Көлікті сақтауды меншік құқығын беретін мәміле деп тану","Көлікке меншік құқығын өткізетін заңды негіздің болуы","Көлік шығындарын төлеуді меншік құқығын өткізу деп тану","Көлікті балансқа қоюды меншік құқығын беруге теңестіру","Көлікті есепке алуды иеліктен шығару мәмілесі деп тану"],"answer":[2],"explanation":"Дұрыс жауап: Көлікке меншік құқығын өткізетін заңды негіздің болуы. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Сот қандай дәлелдерді тікелей зерттейді?","options":["Меншік құқығын беру туралы мәміленің бар-жоғы","Серіктестіктің басқа мүлікке меншік құжаттары","Азаматтың өзге көліктеріне меншік құжаттары","Автокөліктің меншік құқығына қатысты құжаттары","Көлікті балансқа қоюдың құқықтық негізі","Азаматтың өзге мүлікке билік ету құжаттары","Серіктестіктің өзге көліктерін есепке алу актілері","Көлікке қатысы жоқ сатып алу шарттары"],"answer":[0,3,4],"explanation":"Дұрыс жауап: Көлікті балансқа қоюдың құқықтық негізі; Автокөліктің меншік құқығына қатысты құжаттары; Меншік құқығын беру туралы мәміленің бар-жоғы. Кейс бойынша құқықтық баға нақты құқықтың мазмұнына, оны жүзеге асыру шегіне және дәлелденген мән-жайларға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті азаматтық-құқықтық нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":71,"title":"Меншіктің нысандары.","material":"Азамат жеке қаражатына қойма сатып алды. Қалалық коммуналдық кәсіпорын сол көшедегі басқа қойманы пайдаланады. Кәсіпорын екі қойма да қала аумағында болғандықтан коммуналдық меншік деп мәлімдеді.","procedure":"Азамат сотқа өз қоймасына меншік құқығын тану туралы талап берді. Кәсіпорын мемлекеттік тіркеу деректеріне қарсы уәж келтірді.","questions":[{"num":1,"type":"single","q":"Азамат сатып алған қойма меншік нысаны бойынша қалай сипатталады?","options":["Ортақ мемлекеттік меншік объектісі ретінде","Коммуналдық меншік объектісі ретінде","Республикалық меншік объектісі ретінде","Иесіз жылжымайтын мүлік ретінде","Жеке меншік объектісі ретінде","Мемлекеттік мекеменің жедел басқаруындағы объект ретінде"],"answer":[4],"explanation":"Дұрыс жауап: Жеке меншік объектісі ретінде. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Меншік нысандарына қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Мемлекеттік меншікке жеке меншікке қарағанда шексіз басымдық беріледі","Коммуналдық кәсіпорын кез келген жеке мүлікті өзіне тіркей алады","Даулы мүлікке құқықтың өздігінен пайда болатынын тану","Жеке тұлғаның мүлкі міндетті түрде мемлекет меншігінде болады","Қала аумағындағы барлық мүлік коммуналдық меншікке жатады","Қазақстанда жеке және мемлекеттік меншік танылады","Мемлекеттік меншік республикалық және коммуналдық болып бөлінеді"],"answer":[5,6],"explanation":"Дұрыс жауап: Қазақстанда жеке және мемлекеттік меншік танылады; Мемлекеттік меншік республикалық және коммуналдық болып бөлінеді. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот талапты шешкенде нені анықтайды?","options":["Кәсіпорынның өзге сатып алу шарттарының бағасын","Қаладағы барлық қоймалардың коммуналдық мәртебесін","Азаматтың өзге мүліктерінің мемлекеттік тіркеуін","Қойма орналасқан көшенің коммуналдық шығындарын","Даулы қоймаға меншік құқығының кімге және қандай негізде тиесілі екенін","Кәсіпорын пайдаланатын басқа қойманың жалдау құнын"],"answer":[4],"explanation":"Дұрыс жауап: Даулы қоймаға меншік құқығының кімге және қандай негізде тиесілі екенін. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Қоймаға құқықты дәлелдеуде қандай құжаттар маңызды?","options":["Құқықты мемлекеттік тіркеу туралы мәліметтер","Азаматтың басқа жылжымайтын мүлікке сенімхаттары","Қаладағы басқа нысандардың жалдау шарттары","Қойманы сатып алу шарты","Кәсіпорынның өзге қоймаларға қатысты құжаттары","Көшедегі басқа ғимараттардың салық есептері","Даулы қойманы даралайтын кадастрлық деректер","Кәсіпорынның өзге жылдардағы кіріс есебі"],"answer":[0,3,6],"explanation":"Дұрыс жауап: Қойманы сатып алу шарты; Құқықты мемлекеттік тіркеу туралы мәліметтер; Даулы қойманы даралайтын кадастрлық деректер. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":72,"title":"Азаматтар мен басқа да жеке тұлғалардың меншік құқығының түсінігі мен мазмұны.","material":"Азамат үйін сатып алып, оны жалға берді. Жалға алушы үйде тұрғандықтан, үйді сату туралы шешімді өзі қабылдауға құқылы екенін айтты.","procedure":"Меншік иесі жалға алушының үйді үшінші тұлғаға сату әрекетін тоқтату туралы талап қойды. Сот жалға алу мен меншік құқығын ажыратуы тиіс.","questions":[{"num":1,"type":"single","q":"Үйді сату жөніндегі билік ету құқығы бастапқыда кімге тиесілі?","options":["Үйді уақытша жалға алушыға","Жалдау ақысын қабылдаған делдалға","Үйді жалға алушының туысына","Үйді жөндеген мердігерге","Үйдің меншік иесіне","Үйде тіркелген кез келген тұрғынға"],"answer":[4],"explanation":"Дұрыс жауап: Үйдің меншік иесіне. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Жеке меншік иесінің өкілеттіктерін таңдаңыз.","options":["Мүлікті иелену","Үшінші тұлғаның барлық шарттарын тоқтату","Мүлікке билік ету","Жалға алушының мүлкін өзіне тіркеу","Көршінің мүлкін рұқсатсыз сату","Мемлекеттік тіркеуді өздігінен жою","Мүлікті пайдалану"],"answer":[0,2,6],"explanation":"Дұрыс жауап: Мүлікті иелену; Мүлікті пайдалану; Мүлікке билік ету. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот жалға алушының әрекетін бағалауда қандай мәселені шешеді?","options":["Жалға алушының басқа үйлерде тұрған мерзімін","Жалға алушыда үйді сатуға тиісті өкілеттік болған-болмағанын","Жалға алушының коммуналдық төлемдерінің көлемін","Үйдің басқа аудандардағы нарықтық бағасын","Меншік иесінің басқа мүліктерін пайдалануын","Үйдің бұрынғы жалдау ақысының өсуін"],"answer":[1],"explanation":"Дұрыс жауап: Жалға алушыда үйді сатуға тиісті өкілеттік болған-болмағанын. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Сотта өкілеттікті анықтауға қандай дәлелдер қатысты?","options":["Үйді сатуға берілген өкілеттіктің бар-жоғы","Жалдау шартының мазмұны","Үйдің өзге сатушылардағы жарнамалары","Үйге меншік құқығын растайтын құжат","Жалға алушының басқа пәтерлердегі төлемдері","Меншік иесінің басқа банктік операциялары","Жалға алушының басқа үйге өтініштері","Меншік иесінің өзге көліктеріне құжаттары"],"answer":[0,1,3],"explanation":"Дұрыс жауап: Үйге меншік құқығын растайтын құжат; Жалдау шартының мазмұны; Үйді сатуға берілген өкілеттіктің бар-жоғы. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":73,"title":"Заңды тұлғалар меншік құқығының субъектілері ретінде.","material":"ЖШС өндірістік станокты өз атына сатып алды. Қатысушылардың бірі жарғылық капиталға үлес қосқандықтан, станок жеке өзіне тиесілі деп мәлімдеді.","procedure":"ЖШС станокқа меншік құқығын тануды сұрап сотқа жүгінді. Қатысушы серіктестіктегі үлесін станокқа тікелей меншікпен теңестірді.","questions":[{"num":1,"type":"single","q":"ЖШС өз қаражатына алған станоктың меншік иесі кім?","options":["Станокты жеткізген мердігер","ЖШС директоры жеке тұлға ретінде","Станокты сатып алған заңды тұлға","ЖШС-нің барлық қызметкері ортақ меншік иесі ретінде","ЖШС бухгалтері жеке тұлға ретінде","ЖШС-нің ең ірі қатысушысы"],"answer":[2],"explanation":"Дұрыс жауап: Станокты сатып алған заңды тұлға. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Заңды тұлға мүлкі туралы дұрыс тұжырымдарды таңдаңыз.","options":["Даулы мүлікке құқықтың өздігінен пайда болатынын тану","ЖШС мүлкі барлық қатысушының бөлінген жеке мүлкі болып есептеледі","Заңды тұлға өз атынан мүліктік құқықтарға ие бола алады","Директор заңды тұлғаның барлық мүлкін жеке меншігіне алады","Қатысушының үлесі серіктестіктің нақты затына тікелей меншік емес","Заңды тұлға мүлікке меншік құқығының субъектісі бола алмайды","Қатысушының үлесі ЖШС-нің әр затына жеке меншік береді"],"answer":[2,4],"explanation":"Дұрыс жауап: Заңды тұлға өз атынан мүліктік құқықтарға ие бола алады; Қатысушының үлесі серіктестіктің нақты затына тікелей меншік емес. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот қандай құқықтық мәселені анықтайды?","options":["Қатысушының өзге мүлкіндегі үлесін","Станокқа меншік құқығы ЖШС-ге ме, әлде қатысушыға ма тиесілі екенін","ЖШС-нің өзге қызметкерлеріне төлеген жалақысын","Станок өндірушісінің басқа тапсырыстарын","Директордың бұрынғы еңбек шарттарын","Қатысушының басқа ұйымдардағы үлестерінің құнын"],"answer":[1],"explanation":"Дұрыс жауап: Станокқа меншік құқығы ЖШС-ге ме, әлде қатысушыға ма тиесілі екенін. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"ЖШС-нің меншік құқығын дәлелдеуге не көмектеседі?","options":["Директордың басқа мүліктеріне құжаттары","Қатысушының басқа компаниялардағы үлестері","Станоктың берілуін растайтын құжаттар","ЖШС-нің өзге станоктарды жалға алуы","Қатысушының өзге шарттары","ЖШС-нің заңды тұлға ретіндегі деректері","Станокты сатып алу шарты","Қызметкерлердің жеке банк көшірмелері"],"answer":[2,5,6],"explanation":"Дұрыс жауап: Станокты сатып алу шарты; Станоктың берілуін растайтын құжаттар; ЖШС-нің заңды тұлға ретіндегі деректері. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":74,"title":"Мемлекеттік меншік құқығы.","material":"Қала әкімдігіне қарасты коммуналдық мекемеге спорт залы бекітілді. Мекеме залды жеке тұлғаға сатуға әрекет жасады. Құжаттарда зал коммуналдық меншік ретінде тіркелген.","procedure":"Жергілікті уәкілетті орган сату мәмілесіне дау айтты. Сот мүлік иесін және мекеменің билік ету өкілеттігін тексереді.","questions":[{"num":1,"type":"single","q":"Спорт залы меншік нысаны бойынша қай санатқа жатады?","options":["Коммуналдық мемлекеттік меншікке","Мекеме қызметкерлерінің ортақ меншігіне","Жеке тұлғаның дара меншігіне","Сатып алушының алдын ала меншігіне","ЖШС-нің жеке меншігіне","Республикалық меншіктегі барлық объектілерге"],"answer":[0],"explanation":"Дұрыс жауап: Коммуналдық мемлекеттік меншікке. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Мемлекеттік мүлікке қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Коммуналдық мүлік мемлекеттік меншік нысанына жатады","Мекеме қызметкерлері спорт залын ортақ меншікке алады","Коммуналдық меншікке қатысты билік ету шектеулері болмайды","Мекеме мүлікті пайдаланса, ол міндетті түрде жеке меншікке өтеді","Коммуналдық мекеме мүлікті кез келген жағдайда еркін сата алады","Даулы мүлікке құқықтың өздігінен пайда болатынын тану","Мекемеге мүлік бекіту оның меншік иесіне айналуын білдірмейді"],"answer":[0,6],"explanation":"Дұрыс жауап: Коммуналдық мүлік мемлекеттік меншік нысанына жатады; Мекемеге мүлік бекіту оның меншік иесіне айналуын білдірмейді. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот сату мәмілесіне қатысты нені тексереді?","options":["Мекеменің басқа спорттық іс-шараларын","Залды жалға алған басқа адамдардың санын","Мекеменің спорт залын иеліктен шығаруға заңды өкілеттігі болған-болмағанын","Спорт залының көрші нысандардан қашықтығын","Сатып алушының өзге жылжымайтын мүлік бағаларын","Мекеме қызметкерлерінің еңбек өтілін"],"answer":[2],"explanation":"Дұрыс жауап: Мекеменің спорт залын иеліктен шығаруға заңды өкілеттігі болған-болмағанын. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Мүлік мәртебесін анықтауда қандай құжаттар маңызды?","options":["Мекеменің басқа жылдардағы шығындары","Даулы сату мәмілесінің құжаттары","Мүлікті мекемеге бекіту туралы акт","Қаладағы басқа залдардың жарнамалары","Мекеменің өзге қызмет көрсету шарттары","Сатып алушының басқа мүліктеріне шарттары","Мемлекеттік меншікке тіркеу деректері","Залдағы бұрынғы спорттық іс-шаралар кестесі"],"answer":[1,2,6],"explanation":"Дұрыс жауап: Мемлекеттік меншікке тіркеу деректері; Мүлікті мекемеге бекіту туралы акт; Даулы сату мәмілесінің құжаттары. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":75,"title":"Меншік құқығының пайда болу (тәсілдері) негіздері.","material":"Азамат шеберханада жаңа үстел жасады. Басқа азамат дайын үстелді сатып алу шартымен алды. Үшінші азамат үстелді мұрагерлікпен иеленді. Олар меншік құқығының пайда болу негіздерін салыстырды.","procedure":"Үшінші тұлға бір үстелге өз құқығын мәлімдеді. Сот әр адамның меншік құқығын туындатқан құқықтық фактіні анықтауы тиіс.","questions":[{"num":1,"type":"single","q":"Дайын үстелді сатып алу қандай меншік алу тәсіліне жатады?","options":["Туынды меншік алу тәсіліне","Иесіз мүлікті иелену тәсіліне","Қараусыз жануарды иелену тәсіліне","Өз бетімен құрылыс салу тәсіліне","Бастапқы меншік алу тәсіліне","Олжаны иелену тәсіліне"],"answer":[0],"explanation":"Дұрыс жауап: Туынды меншік алу тәсіліне. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Меншік құқығының пайда болуына қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Жаңа затты заңды түрде жасау бастапқы тәсіл болуы мүмкін","Сатып алу шарты әрқашан бастапқы тәсіл болып саналады","Мұрагерлік жаңа затты жасауға теңестіріледі","Сатып алу шарты бойынша құқықтың ауысуы туынды тәсілге жатады","Затты өз қолымен жасау әрқашан бұрынғы иеден құқық алуды білдіреді","Мұрагерлік құқықтың ауысуы туынды тәсілге жатады","Туынды тәсілде бұрынғы құқық иесінің болуы ескерілмейді"],"answer":[0,3,5],"explanation":"Дұрыс жауап: Жаңа затты заңды түрде жасау бастапқы тәсіл болуы мүмкін; Сатып алу шарты бойынша құқықтың ауысуы туынды тәсілге жатады; Мұрагерлік құқықтың ауысуы туынды тәсілге жатады. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот даулы үстелдің меншік иесін анықтағанда нені бағалайды?","options":["Мұрагердің өзге мүліктерінің бағасын","Сатушының басқа сатып алушыларын","Меншік құқығының пайда болуына негіз болған нақты заңды фактіні","Үстелдің басқа дүкендердегі нарықтық бағасын","Шеберхананың өзге тапсырыстарының санын","Тараптардың басқа жиһазға жұмсаған қаражатын"],"answer":[2],"explanation":"Дұрыс жауап: Меншік құқығының пайда болуына негіз болған нақты заңды фактіні. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Меншік алу негізін дәлелдеуге не көмектеседі?","options":["Тараптардың басқа үстелдерге бағалаулары","Шеберхананың өзге қызметкерлері туралы есеп","Сатушының өзге тауарларына жарнамалар","Жаңа заттың жасалу жағдайларын растайтын деректер","Сатып алу шарты мен беру құжаттары","Мұрагердің басқа дүкендерден сатып алулары","Үстелдің өзге өңірдегі орташа бағасы","Мұрагерлік құқықты растайтын құжаттар"],"answer":[3,4,7],"explanation":"Дұрыс жауап: Сатып алу шарты мен беру құжаттары; Жаңа заттың жасалу жағдайларын растайтын деректер; Мұрагерлік құқықты растайтын құжаттар. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":76,"title":"Меншік құқығының тоқтатылу негіздері.","material":"Азамат көлігін сатып алу шартымен басқа адамға берді. Кейін ескі велосипедіне меншік құқығынан бас тартатынын жариялады. Үшінші жағдайда мүлік заңда белгіленген тәртіппен мәжбүрлеп алынды.","procedure":"Көліктің бұрынғы иесі шарт жасалғаннан кейін де өзін меншік иесі деп мәлімдеді. Сот меншік құқығының тоқтау негіздерін салыстырады.","questions":[{"num":1,"type":"single","q":"Көлікті шарт бойынша басқа тұлғаға өткізу қандай негізге жатады?","options":["Меншік құқығын мұрагерлікпен алуға","Сервитутты белгілеуге","Меншік құқығын сотта тануға","Меншік құқығын иеліктен шығару арқылы тоқтатуға","Жаңа затты жасау арқылы меншік алуға","Иесіз затты бастапқы иеленуге"],"answer":[3],"explanation":"Дұрыс жауап: Меншік құқығын иеліктен шығару арқылы тоқтатуға. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Меншік құқығының тоқтатылу негіздеріне қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Мүлікті басқа тұлғаға иеліктен шығару құқықты тоқтатуы мүмкін","Заңда көзделген жағдайларда мүлік мәжбүрлеп алынуы мүмкін","Меншік иесінің мүліктен бас тартуы заңда көзделген салдар туғызады","Меншік иесі мүлкін сатқанда оның құқығы міндетті түрде сақталады","Меншік құқығынан бас тарту кез келген үшінші тұлғаны бірден иеленуші етеді","Меншік құқығы әрқашан сот шешімімен тоқтайды","Мүлікті иеліктен шығару сатып алушыға құқық бере алмайды"],"answer":[0,1,2],"explanation":"Дұрыс жауап: Мүлікті басқа тұлғаға иеліктен шығару құқықты тоқтатуы мүмкін; Меншік иесінің мүліктен бас тартуы заңда көзделген салдар туғызады; Заңда көзделген жағдайларда мүлік мәжбүрлеп алынуы мүмкін. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот көлікке қатысты нені анықтайды?","options":["Сатушының басқа көліктерді қанша рет сатқанын","Сатушының басқа мүліктеріне кепілін","Тараптардың өзге заттарға қатысты шарттарын","Сатып алушының өзге велосипедтерін","Көліктің бұрынғы жарнамалық бағасын","Меншік құқығының сатып алушыға заңды түрде ауысқан-ауыспағанын"],"answer":[5],"explanation":"Дұрыс жауап: Меншік құқығының сатып алушыға заңды түрде ауысқан-ауыспағанын. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Сотта қандай дәлелдер шешуші болуы мүмкін?","options":["Көлікті сату шарты","Сатып алушының өзге дүкендердегі төлемдері","Тараптардың меншік құқығын өткізуге бағытталған әрекеттері","Көлікті беру және тіркеу деректері","Тараптардың басқа мәмілелерінің мерзімі","Сатушының басқа көлікке жарнамасы","Сатушының өзге мүліктеріне бағалаулар","Көліктің өзге сатушылардағы бағасы"],"answer":[0,2,3],"explanation":"Дұрыс жауап: Көлікті сату шарты; Көлікті беру және тіркеу деректері; Тараптардың меншік құқығын өткізуге бағытталған әрекеттері. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":77,"title":"Ортақ меншік құқығы. Бірлескен қызмет туралы шарт.","material":"Екі кәсіпкер қойманы тең үлеспен сатып алды. Кейін олар үшінші серіктеспен бірлескен қызмет туралы шарт жасасты. Бірінші кәсіпкер қойманы толықтай өз атынан сатуға тырысты.","procedure":"Екінші меншік иесі сатуға қарсы талап берді. Сот ортақ үлестік меншік пен бірлескен қызмет туралы шарттан туатын құқықтарды ажыратуы тиіс.","questions":[{"num":1,"type":"single","q":"Екі кәсіпкердің қоймаға тең үлеспен құқығы қалай аталады?","options":["Дара жеке меншік","Ортақ үлестік меншік","Шаруашылық жүргізу құқығы","Жедел басқару құқығы","Ортақ бірлескен меншік","Жер пайдалану құқығы"],"answer":[1],"explanation":"Дұрыс жауап: Ортақ үлестік меншік. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Ортақ меншікке қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Ортақ меншікке қатысушы өзге қатысушының үлесін иеленеді","Ортақ үлестік меншікте әр қатысушының үлесі анықталады","Бірлескен қызмет шарты барлық мүлікті бір қатысушыға өткізеді","Үлестік меншік әр қатысушының үлесін анықтауға жол бермейді","Бір қатысушы ортақ мүліктің бәрін өз еркімен сата алады","Ортақ мүлікке билік ету заңда белгіленген келісу тәртібін талап етеді","Даулы мүлікке құқықтың өздігінен пайда болатынын тану"],"answer":[1,5],"explanation":"Дұрыс жауап: Ортақ үлестік меншікте әр қатысушының үлесі анықталады; Ортақ мүлікке билік ету заңда белгіленген келісу тәртібін талап етеді. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот қойманы сату әрекетін бағалағанда нені тексереді?","options":["Қойманың басқа аудандардағы бағасын","Үшінші серіктестің басқа мүліктеріне құқықтарын","Басқа ортақ меншік иесінің мүлікті иеліктен шығаруға келісімі болған-болмағанын","Бірінші кәсіпкердің өзге қоймалардағы табысын","Бірінші кәсіпкердің бұрынғы жеткізу шарттарын","Екінші кәсіпкердің басқа тауарларын"],"answer":[2],"explanation":"Дұрыс жауап: Басқа ортақ меншік иесінің мүлікті иеліктен шығаруға келісімі болған-болмағанын. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Дауды шешуге қандай дәлелдер маңызды?","options":["Қойманың көрші ғимараттардан қашықтығы","Қойманың өзге жылдардағы жарнамалары","Кәсіпкерлердің басқа тауарларға шарттары","Үшінші серіктестің басқа қызметкерлері","Қойманы сатып алу және тіркеу құжаттары","Ортақ меншік үлестері туралы деректер","Бірлескен қызмет шартының мазмұны","Кәсіпкерлердің басқа банк өнімдері"],"answer":[4,5,6],"explanation":"Дұрыс жауап: Қойманы сатып алу және тіркеу құжаттары; Ортақ меншік үлестері туралы деректер; Бірлескен қызмет шартының мазмұны. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":78,"title":"Меншiк иесi болып табылмайтын адамдардың заттық құқықтары","material":"Коммуналдық кәсіпорынға ғимарат шаруашылық жүргізу құқығымен берілді. Басқа мекеме өзіне бекітілген мүлікті жедел басқару құқығымен пайдаланады. Екеуі де толық меншік иесі екенін айтты.","procedure":"Мүлік иесі ғимаратқа билік ету шектеріне байланысты талап қойды. Сот шектеулі заттық құқықтардың мазмұнын анықтайды.","questions":[{"num":1,"type":"single","q":"Шаруашылық жүргізу құқығы қандай құқыққа жатады?","options":["Ғимаратқа толық дара меншік құқығына","Тауарды жеткізу жөніндегі міндеттемеге","Меншік иесі емес тұлғаның шектеулі заттық құқығына","Мүлікті иесіз деп тану құқығына","Меншік иесінің жеке мүліктік емес құқығына","Меншік құқығын мұрагерлікпен алуға"],"answer":[2],"explanation":"Дұрыс жауап: Меншік иесі емес тұлғаның шектеулі заттық құқығына. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Шектеулі заттық құқықтарға қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Жедел басқару құқығы заңмен белгіленген шектерде жүзеге асады","Жедел басқару құқығы мүлікті шектеусіз сатуға мүмкіндік береді","Даулы мүлікке құқықтың өздігінен пайда болатынын тану","Шаруашылық жүргізу құқығы меншік иесін міндетті түрде жояды","Шектеулі заттық құқықтар толық меншік құқығына әрқашан тең","Шаруашылық жүргізу құқығы меншік құқығынан бөлек болады","Мүлік бекітілген кез келген ұйым меншік иесіне айналады"],"answer":[0,5],"explanation":"Дұрыс жауап: Шаруашылық жүргізу құқығы меншік құқығынан бөлек болады; Жедел басқару құқығы заңмен белгіленген шектерде жүзеге асады. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот мүлікке билік ету өкілеттігін қалай анықтайды?","options":["Мүліктің нарықтық бағасына қарап толық меншік тану арқылы","Мүлікті пайдалану ұзақтығын толық меншікке теңестіріп","Ұйымға берілген заттық құқықтың түрі мен заңды шектерін тексеру арқылы","Ұйымның өзге шарттарындағы өкілеттікті қолдану арқылы","Ғимаратты жөндеуге жұмсалған соманы негізге алып","Ұйымның қызметкерлер санына қарап"],"answer":[2],"explanation":"Дұрыс жауап: Ұйымға берілген заттық құқықтың түрі мен заңды шектерін тексеру арқылы. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Шектеулі заттық құқықты анықтауға қандай дәлелдер қатысты?","options":["Ғимараттың бұрынғы жарнамалары","Мүлікті ұйымға бекіту туралы акт","Ұйымның басқа ғимараттарға шарттары","Ұйымның өзге тауарларға тапсырыстары","Ұйымның құқықтық мәртебесін растайтын құжаттар","Ғимараттың өзге өңірдегі бағасы","Даулы билік ету мәмілесінің мазмұны","Ұйым қызметкерлерінің жеке мүлкі"],"answer":[1,4,6],"explanation":"Дұрыс жауап: Мүлікті ұйымға бекіту туралы акт; Ұйымның құқықтық мәртебесін растайтын құжаттар; Даулы билік ету мәмілесінің мазмұны. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":79,"title":"Жер пайдалану құқығы.","material":"Жер учаскесі мемлекет меншігінде қалды, ал компанияға белгілі мерзімге жер пайдалану құқығы берілді. Компания жерді өз меншігіне өткен деп есептеп, оны сатуға шарт жасады.","procedure":"Уәкілетті орган мәмілені дауласты. Сот компанияның жерге меншік құқығын емес, жер пайдалану құқығын алған-алмағанын анықтайды.","questions":[{"num":1,"type":"single","q":"Компанияға берілген құқықтың негізгі сипаты қандай?","options":["Жерге автоматты толық меншік құқығы","Жерді барлық үшінші тұлғаға тегін беру","Жерге шектеусіз билік ету құқығы","Жерді заңда белгіленген шектерде пайдалану құқығы","Мемлекет меншігін бірден тоқтату құқығы","Жерді кез келген жағдайда иесіз деп тану"],"answer":[3],"explanation":"Дұрыс жауап: Жерді заңда белгіленген шектерде пайдалану құқығы. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Жер пайдалану құқығына қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Мемлекет меншігіндегі жерді пайдалану меншік иесін өзгертеді","Жер пайдалану құқығының мерзімі құқықтық маңызға ие емес","Жер пайдаланушының өкілеттігі құқық беру негізі мен заңға тәуелді","Жер пайдалану құқығы жерді әрқашан жеке меншікке өткізеді","Даулы мүлікке құқықтың өздігінен пайда болатынын тану","Жер пайдаланушы барлық жағдайда жерді еркін сата алады","Жер пайдалану құқығы жерге меншік құқығынан ерекшеленеді"],"answer":[2,6],"explanation":"Дұрыс жауап: Жер пайдалану құқығы жерге меншік құқығынан ерекшеленеді; Жер пайдаланушының өкілеттігі құқық беру негізі мен заңға тәуелді. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот жерді сату әрекетін бағалауда нені анықтайды?","options":["Компанияның жер учаскесін иеліктен шығаруға заңды құқығы болған-болмағанын","Жерді пайдаланған қызметкерлер санын","Компанияның өзге тауарларға тапсырыстарын","Жердің көрші учаскелерден қашықтығын","Компанияның басқа мүлікке шарттарын","Компанияның басқа жерлердегі қызметін"],"answer":[0],"explanation":"Дұрыс жауап: Компанияның жер учаскесін иеліктен шығаруға заңды құқығы болған-болмағанын. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Жер пайдалану құқығын дәлелдеуге қандай құжаттар қатысты?","options":["Жердің кадастрлық деректері","Компанияның басқа учаскелерге шарттары","Жердің өзге өңірлердегі бағасы","Жердің көрші учаскелердегі жарнамалары","Компания қызметкерлерінің еңбек шарттары","Компанияның басқа банк операциялары","Жер пайдалану құқығының мерзімі мен шектерін көрсететін құжаттар","Жер учаскесіне құқық беру туралы акт"],"answer":[0,6,7],"explanation":"Дұрыс жауап: Жер учаскесіне құқық беру туралы акт; Жердің кадастрлық деректері; Жер пайдалану құқығының мерзімі мен шектерін көрсететін құжаттар. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":80,"title":"Сервитут. Сервитут түрлері.","material":"Екі жер учаскесінің бірі жолға тікелей шықпайды. Көрші учаске арқылы өту үшін жеке сервитут белгіленді. Кейін көрші жер иесі өтетін жолды қоршап тастады.","procedure":"Сервитут иесі өтуге кедергіні жою туралы талап қойды. Сот сервитуттың түрін, көлемін және құқықтық негізін анықтайды.","questions":[{"num":1,"type":"single","q":"Көрші жерден өту үшін белгіленген сервитуттың мәні неде?","options":["Көрші жерді біржола иеліктен шығаруда","Жер иесінің барлық құқығын тоқтатуда","Бөтен жер учаскесін шектеулі мақсатта пайдалану құқығында","Көрші учаскені иесіз деп тануда","Жерді мемлекеттік меншікке өткізуде","Көрші учаскеге толық меншік құқығын алуда"],"answer":[2],"explanation":"Дұрыс жауап: Бөтен жер учаскесін шектеулі мақсатта пайдалану құқығында. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Сервитуттарға қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Сервитут бөтен мүлікті шектеулі пайдалануға мүмкіндік береді","Сервитут белгіленгенде жер иесінің меншігі міндетті түрде тоқтайды","Сервитут иесі бөтен жерді шектеусіз сата алады","Сервитут жерді пайдаланудың кез келген түріне шексіз рұқсат береді","Жария сервитут әрқашан жерді жеке меншікке өткізеді","Сервитут заңда көзделген негіздер бойынша белгіленеді","Сервитут жеке немесе жария сипатта болуы мүмкін"],"answer":[0,5,6],"explanation":"Дұрыс жауап: Сервитут бөтен мүлікті шектеулі пайдалануға мүмкіндік береді; Сервитут заңда көзделген негіздер бойынша белгіленеді; Сервитут жеке немесе жария сипатта болуы мүмкін. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот кедергіні жою туралы талапты қарағанда нені тексереді?","options":["Жолды пайдаланған көліктердің нарықтық құнын","Көршінің басқа мүліктерін сату шарттарын","Сервитут иесінің басқа жерлеріндегі табысын","Жердің бұрынғы жарнамалық бағасын","Жер иесінің өзге учаскелерінің бағасын","Белгіленген сервитуттың мазмұны мен өтуге жасалған нақты кедергіні"],"answer":[5],"explanation":"Дұрыс жауап: Белгіленген сервитуттың мазмұны мен өтуге жасалған нақты кедергіні. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Сервитутты қорғау үшін қандай дәлелдер маңызды?","options":["Көршінің басқа жерлерге қатысты шарттары","Өтуге кедергі жасалғанын растайтын деректер","Сервитут иесінің басқа көліктерінің бағасы","Жер иесінің өзге мүлікке сенімхаттары","Сервитуттың белгілену негізін растайтын құжат","Сервитуттың аумағы мен пайдалану шегі","Жердің өзге аудандардағы жарнамалары","Көршінің басқа кәсіпкерлік табыстары"],"answer":[1,4,5],"explanation":"Дұрыс жауап: Сервитуттың белгілену негізін растайтын құжат; Сервитуттың аумағы мен пайдалану шегі; Өтуге кедергі жасалғанын растайтын деректер. Бұл тұжырым кейстегі мүлікке құқықтың түрі мен нақты өкілеттіктердің көлеміне негізделеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), меншік құқығы және заттық құқықтар туралы нормалар; ҚР Азаматтық процестік кодексі."}]},{"id":81,"title":"Шаруашылық жүргізу құқығы.","material":"Мемлекеттік кәсіпорынға өндірістік цех шаруашылық жүргізу құқығымен бекітілген. Директор меншік иесінің келісімін алмай цехты сатып алу-сату шарты бойынша басқа ұйымға бермек болды. Контрагент кәсіпорынның балансындағы мүлікке толық билік ету құқығы бар деп есептеді.","procedure":"Меншік иесі шартты даулап, цехқа билік ету өкілеттігінің шегін анықтауды сұрады. Сот мүліктің құқықтық режимін, кәсіпорын мәртебесін және келісімнің бар-жоғын зерттейді.","questions":[{"num":1,"type":"single","q":"Шаруашылық жүргізу құқығы қандай құқыққа жатады?","options":["Кәсіпорын директорының жеке меншік құқығына","Меншік иесі емес мемлекеттік кәсіпорынның шектеулі заттық құқығына","Мүлікті тегін пайдалану жөніндегі міндеттемеге","Кәсіпорын қатысушысының корпоративтік құқығына","Мемлекеттік мүлікті жалға алудың шарттық құқығына","Мемлекеттік кәсіпорынның толық меншік құқығына"],"answer":[1],"explanation":"Құқықтық негіз: ҚР АК 195, 196, 199, 200-баптар. Меншік иесі емес мемлекеттік кәсіпорынның шектеулі заттық құқығына. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 195, 196, 199, 200-баптар"},{"num":2,"type":"multi","q":"Дауды шешуде қандай құқықтық мән-жайлар ескеріледі?","options":["Контрагенттің келісімі меншік иесінің келісімін алмастырады","Цехтың мемлекеттік меншікке тиесілігі","Цехтың кәсіпорын балансында болуы меншік құқығын өткізеді","Директордың қызметтік мәртебесі барлық мүлікті еркін сатуға мүмкіндік береді","Мүлікті пайдалану өкілеттігі оны иеліктен шығаруға әрдайым тең","Кәсіпорынның шаруашылық жүргізу құқығының көлемі","Шаруашылық жүргізу құқығы меншік иесінің құқықтарын жояды"],"answer":[1,5],"explanation":"Құқықтық негіз: ҚР АК 195, 196, 199, 200-баптар. Цехтың мемлекеттік меншікке тиесілігі Кәсіпорынның шаруашылық жүргізу құқығының көлемі. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 195, 196, 199, 200-баптар"},{"num":3,"type":"single","q":"Цехты сатудың заңдылығын бағалауда шешуші мәселе қандай?","options":["Мүліктің өндірісте пайдаланылуы меншік құқығын өткізетіні","Кәсіпорынның балансындағы кез келген мүлікті шектеусіз сату құқығы","Контрагенттің сатып алуға дайын болуының жеткіліктілігі","Директордың өкілеттікті өз бетінше кеңейте алуы","Цехты иеліктен шығаруға қажетті меншік иесі келісімінің болуы","Кәсіпорынның тіркелуі барлық мүлікті сату құқығын беретіні"],"answer":[4],"explanation":"Құқықтық негіз: ҚР АК 195, 196, 199, 200-баптар. Цехты иеліктен шығаруға қажетті меншік иесі келісімінің болуы. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 195, 196, 199, 200-баптар"},{"num":4,"type":"multi","q":"Сот қандай дәлелдемелерді зерттеуі тиіс?","options":["Кәсіпорынның өзге ғимараттарына жарнама","Мүлікке қатысты құқық белгілейтін құжаттар","Кәсіпорынның өзге өндірістік шарттары","Даулы сату шарты мен келісім туралы құжаттар","Цехты кәсіпорынға бекіту туралы акт","Контрагенттің өзге мүліктерге бағалау есебі","Директордың басқа мәмілелерге берген тапсырмалары","Цехтың бұрынғы коммуналдық шығындары"],"answer":[1,3,4],"explanation":"Құқықтық негіз: ҚР АК 195, 196, 199, 200-баптар. Мүлікке қатысты құқық белгілейтін құжаттар Даулы сату шарты мен келісім туралы құжаттар Цехты кәсіпорынға бекіту туралы акт. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 195, 196, 199, 200-баптар"}]},{"id":82,"title":"Оралымды басқару құқығы ұғымы мен оның мазмұны.","material":"Мемлекеттік мекемеге қызметтік ғимарат оралымды басқару құқығымен бекітілді. Мекеме басшысы ғимараттың бір бөлігін үшінші тұлғаға ұзақ мерзімге беруге шешім қабылдады. Меншік иесі бұл әрекетке қарсы болды.","procedure":"Үшінші тұлға шарттың орындалуын талап етті. Сот мекеменің құқықтық мәртебесін, мүліктің нысаналы мақсатын және оған билік ету шектеулерін қарайды.","questions":[{"num":1,"type":"single","q":"Оралымды басқару құқығының мазмұны қалай сипатталады?","options":["Мекеменің мүлікке толық жеке меншік құқығы","Ғимаратқа меншік құқығын автоматты иелену","Ғимаратты кез келген шартпен еркін иеліктен шығару","Мекеменің тек қарыз талап ету құқығы","Мүлік иесінің өкілеттігін мекемеге толық өткізу","Мүлікті заң мен меншік иесі белгілеген шектерде иелену, пайдалану және оған билік ету"],"answer":[5],"explanation":"Құқықтық негіз: ҚР АК 202–206-баптар. Мүлікті заң мен меншік иесі белгілеген шектерде иелену, пайдалану және оған билік ету. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 202–206-баптар"},{"num":2,"type":"multi","q":"Мекеменің өкілеттігін бағалауда не ескеріледі?","options":["Мекеменің балансы меншік иесінің құқықтарын тоқтатады","Ғимаратты пайдалану оны сатуға толық құқық береді","Үшінші тұлғаның келісімі барлық рұқсатты алмастырады","Мүлікті беру үшін заңда көзделген шектеулер","Мекеме басшысының қолы заңдағы шектеулерді жояды","Мекеменің оралымды басқару құқығының болуы","Оралымды басқару құқығы меншік құқығымен бірдей"],"answer":[3,5],"explanation":"Құқықтық негіз: ҚР АК 202–206-баптар. Мүлікті беру үшін заңда көзделген шектеулер Мекеменің оралымды басқару құқығының болуы. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 202–206-баптар"},{"num":3,"type":"single","q":"Ғимарат бөлігін беру жөніндегі даудың негізгі мәселесі қандай?","options":["Мекеменің қызмет көрсетуі мүлікке меншік құқығын өткізеді","Басшының өзге шарттардағы өкілеттігі осы мүлікке де шексіз таралады","Ғимаратты ұзақ пайдалану заңдық шектеулерді жояды","Ғимараттың мекеме балансында тұруы оның жеке меншігін дәлелдейді","Мекеменің мүлікті үшінші тұлғаға беруге өкілеттігінің болуы","Үшінші тұлғаның келісімі мүлікті беруге жеткілікті"],"answer":[4],"explanation":"Құқықтық негіз: ҚР АК 202–206-баптар. Мекеменің мүлікті үшінші тұлғаға беруге өкілеттігінің болуы. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 202–206-баптар"},{"num":4,"type":"multi","q":"Сотқа қандай құжаттар қажет?","options":["Ғимараттың жарнамалық фотосуреттері","Ғимаратты бекіту туралы акт","Мекеменің құрылтай және мәртебелік құжаттары","Мекеменің басқа ғимараттарына есептер","Басшының бұрынғы жұмыс тәжірибесі","Үшінші тұлғаның басқа жалдау шарттары","Мүлікті беру туралы шарт пен келісімдер","Мекеменің өзге қызмет көрсету шарттары"],"answer":[1,2,6],"explanation":"Құқықтық негіз: ҚР АК 202–206-баптар. Ғимаратты бекіту туралы акт Мекеменің құрылтай және мәртебелік құжаттары Мүлікті беру туралы шарт пен келісімдер. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 202–206-баптар"}]},{"id":83,"title":"Жер қойнауын пайдалану құқығы.","material":"Компания жер қойнауын пайдалану құқығын тиісті келісімшарт пен рұқсат құжаттары негізінде иеленді. Ол жер қойнауын пайдалану құқығын жер учаскесіне меншік құқығымен теңестіріп, рұқсат етілген аумақтан тыс жерде жұмыстар бастады.","procedure":"Уәкілетті орган жұмысты тоқтатуды талап етті. Компания өз құқығын шектеусіз деп санады. Сот құқықтың пайда болу негізін, аумақтық және қызметтік шектерін тексереді.","questions":[{"num":1,"type":"single","q":"Жер қойнауын пайдалану құқығы нені білдіреді?","options":["Өзге жер пайдаланушылардың құқығын тоқтатуды","Кез келген пайдалы қазбаны шектеусіз иеленуді","Жер учаскесіне толық меншік құқығын","Жер қойнауын мемлекеттік реттеусіз пайдалануды","Барлық аумақта геологиялық жұмыс жүргізу құқығын","Жер қойнауын заңда белгіленген негізде және шектерде пайдалану құқығын"],"answer":[5],"explanation":"Құқықтық негіз: ҚР АК 193, 195-баптар; ҚР Жер қойнауы және жер қойнауын пайдалану туралы кодексі. Жер қойнауын заңда белгіленген негізде және шектерде пайдалану құқығын. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 193, 195-баптар; ҚР Жер қойнауы және жер қойнауын пайдалану туралы кодексі"},{"num":2,"type":"multi","q":"Осы құқықты іске асыруда қандай шектеулер маңызды?","options":["Рұқсат етілген жұмыстардың түрі мен шарттары","Құқық иесі кез келген кен орнында жұмыс істей алады","Қызмет түрін компания біржақты шектеусіз өзгерте алады","Құқықтың болуы экологиялық талаптарды қолданбайды","Жер қойнауын пайдалану құқығы барлық жерге меншік береді","Жер қойнауын пайдалануға берілген құқықтың аумағы","Рұқсат құжатының аумақтық шегі құқықтық мәнге ие емес"],"answer":[0,5],"explanation":"Құқықтық негіз: ҚР АК 193, 195-баптар; ҚР Жер қойнауы және жер қойнауын пайдалану туралы кодексі. Рұқсат етілген жұмыстардың түрі мен шарттары Жер қойнауын пайдалануға берілген құқықтың аумағы. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 193, 195-баптар; ҚР Жер қойнауы және жер қойнауын пайдалану туралы кодексі"},{"num":3,"type":"single","q":"Рұқсат етілмеген аумақтағы жұмыс қалай бағаланады?","options":["Компанияның ішкі шешімі рұқсат құжатын алмастырады","Компанияның құқықты иеленуі кез келген аумақта жұмысқа жеткілікті","Жұмыстың пайдалы болуы аумақтық шектеуді жояды","Құқықты тіркеу барлық шектеуді тоқтатады","Жер учаскесін жалға алу жер қойнауына шексіз құқық береді","Берілген құқық шегінен тыс қызмет жүргізілген-жүргізілмегенін анықтау қажет"],"answer":[5],"explanation":"Құқықтық негіз: ҚР АК 193, 195-баптар; ҚР Жер қойнауы және жер қойнауын пайдалану туралы кодексі. Берілген құқық шегінен тыс қызмет жүргізілген-жүргізілмегенін анықтау қажет. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 193, 195-баптар; ҚР Жер қойнауы және жер қойнауын пайдалану туралы кодексі"},{"num":4,"type":"multi","q":"Сот қандай құжаттарды зерттейді?","options":["Компанияның басқа өңірлердегі жарнамасы","Өзге жобалардың қаржылық есептері","Жүргізілген жұмыстардың орны мен түрі туралы деректер","Компанияның басқа жердегі мүлік тізімі","Басқа компаниялардың лицензиялары","Жер қойнауын пайдалану құқығын растайтын құжат","Рұқсат етілген аумақтың координаттары","Қызметкерлердің еңбек шарттары"],"answer":[2,5,6],"explanation":"Құқықтық негіз: ҚР АК 193, 195-баптар; ҚР Жер қойнауы және жер қойнауын пайдалану туралы кодексі. Жүргізілген жұмыстардың орны мен түрі туралы деректер Жер қойнауын пайдалану құқығын растайтын құжат Рұқсат етілген аумақтың координаттары. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 193, 195-баптар; ҚР Жер қойнауы және жер қойнауын пайдалану туралы кодексі"}]},{"id":84,"title":"Тұрғын үйге заттық құқық.","material":"Азамат өзіне тиесілі пәтерді жалға берді. Жалға алушы шартқа сай тұрып жатқанымен, пәтерді үшінші тұлғаға сату құқығы бар екенін мәлімдеді. Меншік иесі оған қарсылық білдірді.","procedure":"Сотта пәтерге меншік құқығы мен жалдау шарты негізіндегі тұрғын үйді пайдалану құқығының көлемі дауланды.","questions":[{"num":1,"type":"single","q":"Жалға алушының тұрғын үйге қатысты құқығы қандай негізден туындайды?","options":["Тұрғын үйге кепіл құқығының пайда болуынан","Пәтерге меншік құқығын автоматты алудан","Жалға алушының пәтерге мұрагерлік құқығынан","Тұрғын үйді жалдау шарты мен қолданылатын заң нормаларынан","Меншік иесінің барлық өкілеттігін тоқтатудан","Пәтерді өз атынан сатуға берілген заңды өкілдіктен"],"answer":[3],"explanation":"Құқықтық негіз: ҚР АК 188, 194-баптар; ҚР Тұрғын үй қатынастары туралы заң. Тұрғын үйді жалдау шарты мен қолданылатын заң нормаларынан. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 188, 194-баптар; ҚР Тұрғын үй қатынастары туралы заң"},{"num":2,"type":"multi","q":"Меншік құқығы мен пайдалану құқығын ажырататын тұжырымдарды таңдаңыз.","options":["Жалдау ақысы меншік құқығының ауысуын дәлелдейді","Пәтерде тұру меншік иесін автоматты түрде өзгертеді","Жалға алушы пәтерді шарт шегінде пайдалана алады","Жалдау шарты пәтерді кез келген адамға сатуға құқық береді","Жалға алушы пәтерді пайдалану арқылы меншік иесіне айналады","Пәтерге билік ету құқығы меншік иесіне тиесілі болады","Меншік иесі жалдау мерзімінде барлық құқығынан айырылады"],"answer":[2,5],"explanation":"Құқықтық негіз: ҚР АК 188, 194-баптар; ҚР Тұрғын үй қатынастары туралы заң. Жалға алушы пәтерді шарт шегінде пайдалана алады Пәтерге билік ету құқығы меншік иесіне тиесілі болады. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 188, 194-баптар; ҚР Тұрғын үй қатынастары туралы заң"},{"num":3,"type":"single","q":"Жалға алушының пәтерді сатуға өкілеттігі бар-жоғы қалай анықталады?","options":["Жалдау мерзімінің ұзақтығы сату құқығын өздігінен туғызады","Жалға алушының өтініші меншік иесінің келісімін алмастырады","Коммуналдық төлемдерді төлеу меншік құқығын өткізеді","Пәтерді сату құқығын беретін заңды негіздің бар-жоғымен","Жалға алушының пәтерде тіркелуі сату өкілеттігін дәлелдейді","Пәтерге жөндеу жасау оны сату өкілеттігін береді"],"answer":[3],"explanation":"Құқықтық негіз: ҚР АК 188, 194-баптар; ҚР Тұрғын үй қатынастары туралы заң. Пәтерді сату құқығын беретін заңды негіздің бар-жоғымен. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 188, 194-баптар; ҚР Тұрғын үй қатынастары туралы заң"},{"num":4,"type":"multi","q":"Сот қандай дәлелдерді қарайды?","options":["Жалға алушының өзге пәтерлерді қарағаны","Пәтердің жарнамалық фотосуреттері","Жалға берушінің басқа мүлкіне шарттары","Тұрғын үйдің бұрынғы жалдау бағалары","Пәтерге меншік құқығын растайтын құжат","Жалға алушының өзге мекенжайлары","Тұрғын үйді жалдау шарты","Жалға алушының даулы сату әрекеті туралы деректер"],"answer":[4,6,7],"explanation":"Құқықтық негіз: ҚР АК 188, 194-баптар; ҚР Тұрғын үй қатынастары туралы заң. Пәтерге меншік құқығын растайтын құжат Тұрғын үйді жалдау шарты Жалға алушының даулы сату әрекеті туралы деректер. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 188, 194-баптар; ҚР Тұрғын үй қатынастары туралы заң"}]},{"id":85,"title":"Бөтеннің мүлкін өзге де иелену және пайдалану құқығы.","material":"Жер учаскесінің иесі көршісіне өз жері арқылы су құбырын өткізу үшін шектеулі пайдалану құқығын берді. Көрші кейін учаскенің басқа бөлігін қойма ретінде пайдалана бастады.","procedure":"Меншік иесі қойма ретінде пайдалануды тоқтатуды талап етті. Сот бөтен мүлікті шектеулі пайдалану құқығының көлемін анықтайды.","questions":[{"num":1,"type":"single","q":"Көршінің бастапқы құқығы қалай сипатталады?","options":["Жер учаскесіне толық меншік құқығы ретінде","Бөтен жерді белгілі мақсатта шектеулі пайдалану құқығы ретінде","Меншік иесінің барлық өкілеттігін алу ретінде","Жерді үшінші тұлғаға сату құқығы ретінде","Жер учаскесін иесіз мүлікке айналдыру ретінде","Жерді кез келген мақсатта пайдалану құқығы ретінде"],"answer":[1],"explanation":"Құқықтық негіз: ҚР АК 188, 195-баптар. Бөтен жерді белгілі мақсатта шектеулі пайдалану құқығы ретінде. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 188, 195-баптар"},{"num":2,"type":"multi","q":"Бөтен мүлікті пайдалану құқығы туралы дұрыс тұжырымдарды таңдаңыз.","options":["Пайдалану құқығының мақсаты мен көлемі анықталуы тиіс","Көрші пайдалану мақсатын өздігінен шексіз кеңейте алады","Бөтен мүлікті пайдалану меншік құқығын автоматты өткізеді","Су құбырына рұқсат қойма салуға да автоматты құқық береді","Шектеулі пайдалану құқығы бүкіл жерді пайдалануға мүмкіндік береді","Меншік иесінің құқығы шектеулі пайдаланудан толық жойылмайды","Меншік иесінің құқығы сервитут белгіленгенде тоқтайды"],"answer":[0,5],"explanation":"Құқықтық негіз: ҚР АК 188, 195-баптар. Пайдалану құқығының мақсаты мен көлемі анықталуы тиіс Меншік иесінің құқығы шектеулі пайдаланудан толық жойылмайды. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 188, 195-баптар"},{"num":3,"type":"single","q":"Қойма орналастыру әрекетін бағалауда не шешуші?","options":["Қойма орналастыру берілген пайдалану құқығының шегіне кіре ме","Қойманың пайдалы болуы құқық шегін өзгертеді","Су құбырына берілген рұқсат бүкіл жерге билік ету құқығы","Меншік иесінің үнсіздігі барлық әрекетке алдын ала келісім","Көршінің өзге жерлерді пайдалану тәжірибесі жеткілікті","Жерді уақытша иелену қойма салуға әрдайым құқық береді"],"answer":[0],"explanation":"Құқықтық негіз: ҚР АК 188, 195-баптар. Қойма орналастыру берілген пайдалану құқығының шегіне кіре ме. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 188, 195-баптар"},{"num":4,"type":"multi","q":"Сот қандай дәлелдемелерді тексереді?","options":["Су құбыры өндірушісінің жарнамасы","Көршінің басқа шарттары","Жер иесінің басқа мүліктері","Шектеулі пайдалану құқығын белгілейтін құжат","Су құбыры өтетін аумақтың жоспары","Қойма орналастырылған жер туралы дәлелдер","Қойманың нарықтық бағасы","Көршінің өзге құрылыс жобалары"],"answer":[3,4,5],"explanation":"Құқықтық негіз: ҚР АК 188, 195-баптар. Шектеулі пайдалану құқығын белгілейтін құжат Су құбыры өтетін аумақтың жоспары Қойма орналастырылған жер туралы дәлелдер. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 188, 195-баптар"}]},{"id":86,"title":"Меншік құқығын және өзге де заттық құқықтарды қорғау.","material":"Азамат автокөлігін шеберханаға жөндеуге берді. Жөндеу ақысы толық төленіп, тараптардың есеп айырысуы аяқталғанымен, шеберхана көлікті ешбір құқықтық негізсіз қайтарудан бас тартты. Азамат көліктің өзіне тиесілі екенін растайды.","procedure":"Меншік иесі сотқа көлікті қайтару туралы талап қойды. Сот мүліктің даралануын, иеленудің заңдылығын және талапкердің құқықтық титулын зерттейді.","questions":[{"num":1,"type":"single","q":"Меншік иесі көлікті қайтару үшін қандай қорғау тәсілін қолдануы мүмкін?","options":["Мүлікті міндетті түрде мемлекетке беруді","Мүлікті иесіз деп жариялауды","Мүлікті кепілге қою туралы шарт жасауды","Мүлікті бөтеннің заңсыз иеленуінен талап етіп алуды","Меншік құқығын ерікті тоқтатуды","Шеберханаға меншік құқығын тануды"],"answer":[3],"explanation":"Құқықтық негіз: ҚР АК 259–261, 265-баптар. Мүлікті бөтеннің заңсыз иеленуінен талап етіп алуды. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 259–261, 265-баптар"},{"num":2,"type":"multi","q":"Мүлікті қайтару талабында қандай мән-жайлар маңызды?","options":["Шеберхананың мүлікті иеленуі оған автоматты меншік береді","Жауапкердің мүлікті қайтармауы заңды негіз болып саналады","Көлік иесінің талабы үшін меншік құқығы маңызды емес","Жауапкердің мүлікті нақты иеленіп отыруы","Жөндеу қызметін көрсету көлікті сатуға құқық береді","Талапкердің мүлікке құқығының болуы","Көлікке құқықтың бар-жоғын тек шеберхана шешеді"],"answer":[3,5],"explanation":"Құқықтық негіз: ҚР АК 259–261, 265-баптар. Жауапкердің мүлікті нақты иеленіп отыруы Талапкердің мүлікке құқығының болуы. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 259–261, 265-баптар"},{"num":3,"type":"single","q":"Сот талаптың қанағаттандырылуын қалай бағалайды?","options":["Мүлікке құқық пен жауапкердің иелену негізінің дәлелденуіне қарай","Шеберхананың қызмет ақысы барлық жағдайда мүлікті иеленуге жеткілікті","Мүлікті ұстау фактісі талапкердің құқығын жояды","Көліктің шеберханада болуы оның меншік иесін өзгертеді","Көлікті жөндеудің өзі меншік құқығын шеберханаға өткізеді","Талапкердің көлікті бұрын пайдалануы ешқашан ескерілмейді"],"answer":[0],"explanation":"Құқықтық негіз: ҚР АК 259–261, 265-баптар. Мүлікке құқық пен жауапкердің иелену негізінің дәлелденуіне қарай. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 259–261, 265-баптар"},{"num":4,"type":"multi","q":"Қандай дәлелдемелер негізгі болып табылады?","options":["Көліктің шеберханаға берілгенін растайтын акт","Көліктің жарнамалық бағасы","Көліктің басқа өңірдегі нарықтық бағасы","Иесінің өзге мүлікке құжаттары","Көлікті қайтарудан бас тарту туралы деректер","Шеберхананың басқа клиенттері туралы есеп","Жөндеу орнының басқа қызметтері","Автокөлікке құқықты растайтын құжат"],"answer":[0,4,7],"explanation":"Құқықтық негіз: ҚР АК 259–261, 265-баптар. Көліктің шеберханаға берілгенін растайтын акт Көлікті қайтарудан бас тарту туралы деректер Автокөлікке құқықты растайтын құжат. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 259–261, 265-баптар"}]},{"id":87,"title":"Меншік құқығын және өзге де заттық құқықтарды қорғау тәсілдері азаматтық құқықтың жүйесі.","material":"Пәтер иесінің көршісі ортақ дәлізді жауып, пәтерге кіруге кедергі жасады. Пәтер иесі пәтерге иелігін жоғалтқан жоқ, бірақ оны толық пайдалана алмады.","procedure":"Талапкер кедергіні жоюды сұрады. Сот иеліктен айырумен байланысты емес бұзушылық пен мүлікті қайтару талабын ажыратады.","questions":[{"num":1,"type":"single","q":"Бұл жағдайда қандай қорғау тәсілі орынды?","options":["Мүлікті иесіз деп тану талабы","Иеліктен айырмайтын кедергіні жою туралы талап","Мүлікті бөтеннің заңсыз иеленуінен қайтару талабы","Меншік құқығын тоқтату туралы талап","Жерді мәжбүрлеп иеліктен шығару талабы","Кепіл мүлкін өткізу туралы талап"],"answer":[1],"explanation":"Құқықтық негіз: ҚР АК 259, 260, 264, 265-баптар. Иеліктен айырмайтын кедергіні жою туралы талап. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 259, 260, 264, 265-баптар"},{"num":2,"type":"multi","q":"Заттық құқықтарды қорғау тәсілдерін ажырататын тұжырымдарды таңдаңыз.","options":["Негаторлық талап тек ақшалай берешекті өндіріп алуға арналған","Заттық талаптар мүлікке құқықты дәлелдеуді қажет етпейді","Негаторлық талап иеліктен айырмайтын кедергілерді жоюға бағытталады","Виндикациялық талап мүлікті заңсыз иеленуден қайтаруға бағытталады","Виндикациялық талап мүлікті иеленіп отырған иеге қолданылады","Негаторлық талап меншік құқығын міндетті түрде тоқтатады","Виндикациялық талап кез келген шартты жарамсыз етеді"],"answer":[2,3],"explanation":"Құқықтық негіз: ҚР АК 259, 260, 264, 265-баптар. Негаторлық талап иеліктен айырмайтын кедергілерді жоюға бағытталады Виндикациялық талап мүлікті заңсыз иеленуден қайтаруға бағытталады. Нәтиже істің нақты дәлелдері мен заңда көзделген шектеулерге байланысты анықталады.","basis":"ҚР АК 259, 260, 264, 265-баптар"},{"num":3,"type":"single","q":"Сот талаптың нысанас
