ді","Міндеттеменің бұзылуы мен жауаптылықтың заңды негіздерінің бар-жоғын","Шартта жеткізу күні көрсетілмесе кешігу автоматты дәлелденеді","Тасымалдаушының жауаптылығы жүктің иесіне меншік құқығын берумен өтеледі","Шығын туралы алдын ала болжам залалдың нақты мөлшерін дәлелдейді"],"answer":[2],"explanation":"ҚР АК 349, 350-баптар. Міндеттеменің бұзылуы мен жауаптылықтың заңды негіздерінің бар-жоғын. Сот осы мән-жайды талаптың нысанасына қатысты дәлелдемелермен салыстырады.","basis":"ҚР АК 349, 350-баптар"},{"num":4,"type":"multi","q":"Жауапкершілік негіздерін дәлелдеуге не қатысты?","options":["Қоймаға төленген кез келген ақы тасымалдаушыға жүктеледі","Жүктің нақты жеткізілген күні","Кешігуден туған шығынды растайтын құжат","Жүкті жеткізу мерзімі көрсетілген шарт","Мүліктік жауаптылық үшін шартты бұзу фактісін анықтау қажет емес","Шығын туралы алдын ала болжам залалдың нақты мөлшерін дәлелдейді","Шартта жеткізу күні көрсетілмесе кешігу автоматты дәлелденеді","Тасымалдаушының өзге маршруттағы кешігуі осы даудағы кінәні дәлелдейді"],"answer":[1,2,3],"explanation":"ҚР АК 349, 350-баптар. Маңызды дәлелдемелер: Жүкті жеткізу мерзімі көрсетілген шарт; Кешігуден туған шығынды растайтын құжат; Жүктің нақты жеткізілген күні. Олардың қатыстылығы мен анықтығы істің нақты мән-жайлары арқылы бағаланады.","basis":"ҚР АК 349, 350-баптар"}]},{"id":114,"title":"Азаматтық–құқықтық жауапкершіліктің нысаны. Мiндеттеменiң бұзылуынан туындаған залалдардың орнын толтыру.","material":"Мердігер өндірістік қондырғыны келісілген күні орнатпады. Тапсырыс беруші жұмыстың кешігуінен қосымша жалдау ақысы төлеп, жоспарланған кірістен айырылғанын мәлімдеді.","procedure":"Тапсырыс беруші нақты залал мен жіберіп алған пайданы өндіріп алуды талап етті. Сот шығындардың шынайылығын және себептік байланысты тексереді.","questions":[{"num":1,"type":"single","q":"Міндеттемені бұзудан туған залал қандай бөліктерден тұруы мүмкін?","options":["Нақты залал мен жіберіп алған пайдадан","Жіберіп алған пайдаға дәлел ретінде болжамды жоспардың өзі жеткілікті","Залал сомасын анықтауда себептік байланысты тексеру қажет емес","Нақты залал мен жіберіп алған пайда бір ұғым ретінде есептеледі","Кредитордың нақты шығындары пайда болжамымен ғана расталады","Жіберіп алған пайда жоспардағы барлық түсімге тең болып өндіріледі"],"answer":[0],"explanation":"ҚР АК 9, 350-баптар. Нақты залал мен жіберіп алған пайдадан. Кейсте осы құқықтық негізге сәйкес міндеттеме мен оның орындалуы бағаланады.","basis":"ҚР АК 9, 350-баптар"},{"num":2,"type":"multi","q":"Залалды өтеу үшін қандай мән-жайлар маңызды?","options":["Қосымша жалдау ақысы шарт бұзылуына байланыссыз толық өтеледі","Залал сомасын анықтауда себептік байланысты тексеру қажет емес","Жіберіп алған пайдаға дәлел ретінде болжамды жоспардың өзі жеткілікті","Кредитордың нақты шығындары пайда болжамымен ғана расталады","Мердігердің кешігуі барлық болашақ табыстың жоғалуын дәлелдейді","Нақты шығындардың құжатпен расталуы","Жіберіп алған пайданың негізді есептелуі"],"answer":[5,6],"explanation":"ҚР АК 9, 350-баптар. Нақты шығындардың құжатпен расталуы; Жіберіп алған пайданың негізді есептелуі. Бұл талаптар көрсетілген жағдайдағы құқықтық салдарды анықтайды.","basis":"ҚР АК 9, 350-баптар"},{"num":3,"type":"single","q":"Сот жіберіп алған пайда туралы талапты қалай бағалайды?","options":["Қосымша жалдау ақысы шарт бұзылуына байланыссыз толық өтеледі","Мердігердің кешігуі барлық болашақ табыстың жоғалуын дәлелдейді","Ықтимал табыстың негізділігін және бұзушылықпен себептік байланысын тексереді","Жоспарланған кіріс пен алынуы ықтимал таза пайда бірдей деп алынады","Жіберіп алған пайдаға дәлел ретінде болжамды жоспардың өзі жеткілікті","Залалды өтеу туралы талапта шығынды есептеу құжаттары қаралмайды"],"answer":[2],"explanation":"ҚР АК 9, 350-баптар. Ықтимал табыстың негізділігін және бұзушылықпен себептік байланысын тексереді. Сот осы мән-жайды талаптың нысанасына қатысты дәлелдемелермен салыстырады.","basis":"ҚР АК 9, 350-баптар"},{"num":4,"type":"multi","q":"Залал мөлшерін дәлелдеуге не қажет?","options":["Залалды өтеу туралы талапта шығынды есептеу құжаттары қаралмайды","Мердігердің кешігуі барлық болашақ табыстың жоғалуын дәлелдейді","Нақты залал мен жіберіп алған пайда бір ұғым ретінде есептеледі","Жоспарланған кірісті негіздейтін есептер","Қосымша жалдау ақысы туралы құжаттар","Шартты бұзу айыппұлдың мөлшерін нақты залалдың орнына автоматты қояды","Жоспарланған кіріс пен алынуы ықтимал таза пайда бірдей деп алынады","Жұмыстың нақты орындалу мерзімі"],"answer":[3,4,7],"explanation":"ҚР АК 9, 350-баптар. Маңызды дәлелдемелер: Қосымша жалдау ақысы туралы құжаттар; Жұмыстың нақты орындалу мерзімі; Жоспарланған кірісті негіздейтін есептер. Олардың қатыстылығы мен анықтығы істің нақты мән-жайлары арқылы бағаланады.","basis":"ҚР АК 9, 350-баптар"}]},{"id":115,"title":"Мiндеттеменiң бұзылуынан келтiрiлген моральдық нұқсанды өтеу.","material":"Қызмет көрсетуші клиентпен шарт жасасып, оның жеке басына қатысты құпия ақпаратты заңсыз жариялады. Клиент осы әрекеттен моральдық зардап шеккенін мәлімдеді.","procedure":"Клиент моральдық зиянды өтеу туралы талап қойды. Сот құқық бұзушылықтың сипатын және заңда моральдық зиянды өтеуге негіз бар-жоғын тексереді.","questions":[{"num":1,"type":"single","q":"Моральдық зиянды өтеу туралы талапта не маңызды?","options":["Шарттың кез келген бұзылуы моральдық зиянды өтеуге дербес негіз болады","Жан азабының сипатын бағалау моральдық зиян туралы дауға қатыссыз","Заңда көзделген негіздің және жеке мүліктік емес құқықтың бұзылуының болуы","Моральдық зиянның мөлшері жарияланған ақпараттың нарықтық бағасымен анықталады","Моральдық зиянды өтеу үшін тек шарттағы айыппұл мөлшері есептеледі","Құпия ақпараттың жариялануы туралы дерексіз талап толық қанағаттандырылады"],"answer":[2],"explanation":"ҚР АК 951, 952-баптар. Заңда көзделген негіздің және жеке мүліктік емес құқықтың бұзылуының болуы. Кейсте осы құқықтық негізге сәйкес міндеттеме мен оның орындалуы бағаланады.","basis":"ҚР АК 951, 952-баптар"},{"num":2,"type":"multi","q":"Моральдық зиян туралы дауда қандай мән-жайлар ескеріледі?","options":["Моральдық зиян мөлшері талапкер көрсеткен сомамен міндетті тең болады","Құпия мәліметтің жариялануы құқық бұзушылықты зерттемей-ақ расталады","Моральдық зиянды өтеу үшін тек шарттағы айыппұл мөлшері есептеледі","Азаматтың шеккен жан азабының мән-жайлары","Жан азабының сипатын бағалау моральдық зиян туралы дауға қатыссыз","Құқыққа қайшы әрекеттің сипаты","Құпия ақпараттың жариялануы туралы дерексіз талап толық қанағаттандырылады"],"answer":[3,5],"explanation":"ҚР АК 951, 952-баптар. Құқыққа қайшы әрекеттің сипаты; Азаматтың шеккен жан азабының мән-жайлары. Бұл талаптар көрсетілген жағдайдағы құқықтық салдарды анықтайды.","basis":"ҚР АК 951, 952-баптар"},{"num":3,"type":"single","q":"Сот талапты қанағаттандыру мәселесін қалай шешеді?","options":["Моральдық зиянды өтеудің заңды негізін және дәлелденген мән-жайларды бағалайды","Жеке мүліктік емес құқық бұзылмаса да кез келген шарттық шығын өтеледі","Құқыққа қайшы әрекеттің сипаты өтем мөлшеріне әсер етпейді","Моральдық зиян мөлшері талапкер көрсеткен сомамен міндетті тең болады","Құпия мәліметтің жариялануы құқық бұзушылықты зерттемей-ақ расталады","Жан азабының сипатын бағалау моральдық зиян туралы дауға қатыссыз"],"answer":[0],"explanation":"ҚР АК 951, 952-баптар. Моральдық зиянды өтеудің заңды негізін және дәлелденген мән-жайларды бағалайды. Сот осы мән-жайды талаптың нысанасына қатысты дәлелдемелермен салыстырады.","basis":"ҚР АК 951, 952-баптар"},{"num":4,"type":"multi","q":"Сот қандай дәлелдемелерді зерттейді?","options":["Құпия мәліметтің жариялануы құқық бұзушылықты зерттемей-ақ расталады","Құпия ақпараттың жарияланғанын көрсететін деректер","Жеке құқықтың бұзылғанын растайтын құжаттар","Клиенттің жеке құқықтарының бұзылуын тек қызмет бағасы дәлелдейді","Моральдық зиянның мөлшері жарияланған ақпараттың нарықтық бағасымен анықталады","Зардаптың сипатына қатысты ұсынылған дәлелдер","Жеке мүліктік емес құқық бұзылмаса да кез келген шарттық шығын өтеледі","Құқыққа қайшы әрекеттің сипаты өтем мөлшеріне әсер етпейді"],"answer":[1,2,5],"explanation":"ҚР АК 951, 952-баптар. Маңызды дәлелдемелер: Жеке құқықтың бұзылғанын растайтын құжаттар; Құпия ақпараттың жарияланғанын көрсететін деректер; Зардаптың сипатына қатысты ұсынылған дәлелдер. Олардың қатыстылығы мен анықтығы істің нақты мән-жайлары арқылы бағаланады.","basis":"ҚР АК 951, 952-баптар"}]},{"id":116,"title":"Жауапкершіліктің түрлері.","material":"Бірнеше тұлға бірге залал келтірді. Жәбірленуші олардың бірінен толық өтемақы талап етті. Жауапкер залалдың тек бір бөлігін өтеуге міндетті екенін айтты.","procedure":"Сот бірлесіп зиян келтіру жағдайында жауапкершіліктің сипатын және әр тұлғаның қатысуын анықтайды.","questions":[{"num":1,"type":"single","q":"Бірлесіп зиян келтірген тұлғалардың жауаптылығы қандай болуы мүмкін?","options":["Бірнеше зиян келтіруші болса жауаптылық міндетті түрде үлестік болады","Ортақтас жауаптылықта кредитор әр тұлғадан тек тең үлесті талап етеді","Заңда көзделген жағдайларда ортақтас жауаптылық","Ортақтас жауаптылық әр жауапкердің кінәсіне қарамастан кез келген дауда туындайды","Үлестік жауаптылықта әр тұлғадан борыштың толық сомасы өндіріледі","Бірлескен зиян үшін ортақтас жауаптылық шартта жазылса ғана туындайды"],"answer":[2],"explanation":"ҚР АК 287-бап; ҚР АК зиян келтіруден туындайтын міндеттемелер туралы нормалары. Заңда көзделген жағдайларда ортақтас жауаптылық. Кейсте осы құқықтық негізге сәйкес міндеттеме мен оның орындалуы бағаланады.","basis":"ҚР АК 287-бап; ҚР АК зиян келтіруден туындайтын міндеттемелер туралы нормалары"},{"num":2,"type":"multi","q":"Жауапкершілік түрлерін ажырататын тұжырымдарды таңдаңыз.","options":["Ортақтас жауаптылық әр жауапкердің кінәсіне қарамастан кез келген дауда туындайды","Үлестік жауаптылықта әр борышкердің үлесі ескеріледі","Үлестік жауаптылықта әр тұлғадан борыштың толық сомасы өндіріледі","Зиян мөлшерін анықтау жауаптылық түрін белгілеуге қатыссыз","Ортақтас жауаптылықта толық талап қою мүмкіндігі заңмен анықталады","Бірнеше жауапкердің болуы ортақтас жауаптылықты өздігінен дәлелдейді","Ортақтас жауаптылықта кредитор әр тұлғадан тек тең үлесті талап етеді"],"answer":[1,4],"explanation":"ҚР АК 287-бап; ҚР АК зиян келтіруден туындайтын міндеттемелер туралы нормалары. Үлестік жауаптылықта әр борышкердің үлесі ескеріледі; Ортақтас жауаптылықта толық талап қою мүмкіндігі заңмен анықталады. Бұл талаптар көрсетілген жағдайдағы құқықтық салдарды анықтайды.","basis":"ҚР АК 287-бап; ҚР АК зиян келтіруден туындайтын міндеттемелер туралы нормалары"},{"num":3,"type":"single","q":"Сот жауаптылық түрін анықтағанда нені тексереді?","options":["Жауапкерлердің ортақ әрекетін дәлелдеу жауаптылық сипатына әсер етпейді","Ортақтас жауаптылыққа негіз болатын заңдық мән-жайларды","Ортақтас жауаптылық әр жауапкердің кінәсіне қарамастан кез келген дауда туындайды","Бірнеше жауапкердің болуы ортақтас жауаптылықты өздігінен дәлелдейді","Зиян мөлшерін анықтау жауаптылық түрін белгілеуге қатыссыз","Бір жауапкердің төлемі басқа жауапкерлердің міндетін еш өзгерпейді"],"answer":[1],"explanation":"ҚР АК 287-бап; ҚР АК зиян келтіруден туындайтын міндеттемелер туралы нормалары. Ортақтас жауаптылыққа негіз болатын заңдық мән-жайларды. Сот осы мән-жайды талаптың нысанасына қатысты дәлелдемелермен салыстырады.","basis":"ҚР АК 287-бап; ҚР АК зиян келтіруден туындайтын міндеттемелер туралы нормалары"},{"num":4,"type":"multi","q":"Сот қандай дәлелдемелерді бағалайды?","options":["Зиян келтіру әрекеттерінің өзара байланысы","Зиян мөлшерін анықтау жауаптылық түрін белгілеуге қатыссыз","Зиянның нақты мөлшері","Бір жауапкердің төлемі басқа жауапкерлердің міндетін еш өзгерпейді","Бірнеше зиян келтіруші болса жауаптылық міндетті түрде үлестік болады","Әр жауапкердің зиян келтіруге қатысуы","Зиянның бірлесіп келтірілуі жеке әрекеттерді тексеруді қажет етпейді","Жауапкерлердің ортақ әрекетін дәлелдеу жауаптылық сипатына әсер етпейді"],"answer":[0,2,5],"explanation":"ҚР АК 287-бап; ҚР АК зиян келтіруден туындайтын міндеттемелер туралы нормалары. Маңызды дәлелдемелер: Зиян келтіру әрекеттерінің өзара байланысы; Зиянның нақты мөлшері; Әр жауапкердің зиян келтіруге қатысуы. Олардың қатыстылығы мен анықтығы істің нақты мән-жайлары арқылы бағаланады.","basis":"ҚР АК 287-бап; ҚР АК зиян келтіруден туындайтын міндеттемелер туралы нормалары"}]},{"id":117,"title":"Азаматтық–құқықтық жауапкершіліктің жағдаяттары. Азаматтық құқық бұзушылықтың құрамы. Құқыққа қайшылық. Зиянның (залал) болуы, Себепті байланыс. Несие берушiнiң кiнәсi.","material":"Қойма иесі тауарды сақтауға қабылдап, оны бүлдірді. Тауар иесі залал келтірілгенін айтты. Қойма иесі бүлінуіне тауар иесінің дұрыс қаптамауы да әсер еткенін мәлімдеді.","procedure":"Сот әрекеттің құқыққа қайшылығын, залалдың мөлшерін, себептік байланысты және кредитордың кінәсінің ықпалын зерттейді.","questions":[{"num":1,"type":"single","q":"Азаматтық жауапкершілік негіздерін бағалауда қандай байланыс маңызды?","options":["Кредитордың кез келген әрекеті борышкерді толық жауаптылықтан босатады","Залалдың туындауы мен ұлғаюына кредитор ықпалы бірдей бағаланады","Қоймада бүліну фактісі сақтаушының барлық жауаптылық негізін дәлелдейді","Себептік байланыс залалдың мөлшері анықталмай тұрып болжаммен белгіленеді","Құқық бұзушылық пен келтірілген залал арасындағы себептік байланыс","Кредитордың қаптамаға қатысты кінәсі жауаптылыққа әсер ете алмайды"],"answer":[4],"explanation":"ҚР АК 359, 364-баптар. Құқық бұзушылық пен келтірілген залал арасындағы себептік байланыс. Кейсте осы құқықтық негізге сәйкес міндеттеме мен оның орындалуы бағаланады.","basis":"ҚР АК 359, 364-баптар"},{"num":2,"type":"multi","q":"Жауапкершілікке әсер ететін мән-жайларды таңдаңыз.","options":["Қоймада бүліну фактісі сақтаушының барлық жауаптылық негізін дәлелдейді","Тауар тапсырылған кездегі күйі оның бүліну себептеріне қатыссыз","Залалдың туындауы мен ұлғаюына кредитор ықпалы бірдей бағаланады","Кредитордың залалдың ұлғаюына ықпал еткен кінәсі","Борышкердің міндеттемені бұзуы","Сақтаушының кінәсі бар-жоғын сақтау шартының атауы ғана анықтайды","Кредитордың кез келген әрекеті борышкерді толық жауаптылықтан босатады"],"answer":[3,4],"explanation":"ҚР АК 359, 364-баптар. Борышкердің міндеттемені бұзуы; Кредитордың залалдың ұлғаюына ықпал еткен кінәсі. Бұл талаптар көрсетілген жағдайдағы құқықтық салдарды анықтайды.","basis":"ҚР АК 359, 364-баптар"},{"num":3,"type":"single","q":"Кредитордың кінәсі туралы уәжді сот қалай бағалайды?","options":["Тауар тапсырылған кездегі күйі оның бүліну себептеріне қатыссыз","Оның залалдың пайда болуына не ұлғаюына нақты ықпалын анықтайды","Залал сомасын дәлелдеу себептік байланысты анықтауды алмастырады","Залалдың туындауы мен ұлғаюына кредитор ықпалы бірдей бағаланады","Сақтаушының кінәсі бар-жоғын сақтау шартының атауы ғана анықтайды","Қаптаманың кемшілігі болса сақтаушының әрекеттері тексерілмейді"],"answer":[1],"explanation":"ҚР АК 359, 364-баптар. Оның залалдың пайда болуына не ұлғаюына нақты ықпалын анықтайды. Сот осы мән-жайды талаптың нысанасына қатысты дәлелдемелермен салыстырады.","basis":"ҚР АК 359, 364-баптар"},{"num":4,"type":"multi","q":"Сот қандай дәлелдемелерді зерттейді?","options":["Қаптаманың кемшілігі болса сақтаушының әрекеттері тексерілмейді","Себептік байланыс залалдың мөлшері анықталмай тұрып болжаммен белгіленеді","Тауардың бүлінуі туралы акт оның себебін әрқашан толық дәлелдейді","Тауар бүлінуінің себептері туралы деректер","Тауар тапсырылған кездегі күйі оның бүліну себептеріне қатыссыз","Тауардың қоймаға тапсырылған күйі","Залал сомасын дәлелдеу себептік байланысты анықтауды алмастырады","Келтірілген залалдың мөлшері туралы құжаттар"],"answer":[3,5,7],"explanation":"ҚР АК 359, 364-баптар. Маңызды дәлелдемелер: Келтірілген залалдың мөлшері туралы құжаттар; Тауардың қоймаға тапсырылған күйі; Тауар бүлінуінің себептері туралы деректер. Олардың қатыстылығы мен анықтығы істің нақты мән-жайлары арқылы бағаланады.","basis":"ҚР АК 359, 364-баптар"}]},{"id":118,"title":"Шарт ұғымы, оның ережелері мен түрлері.","material":"Екі кәсіпкер кеңсе жиһазын жеткізуге келісіп, тауардың атауын, санын және бағасын белгіледі. Кейін жеткізу тәсілі туралы қосымша ереже енгізуді талқылады.","procedure":"Тараптар шарттың жасалған-жасалмағанын даулады. Сот елеулі талаптар бойынша келісімнің бар-жоғын анықтайды.","questions":[{"num":1,"type":"single","q":"Шарт ұғымының негізгі белгісі қандай?","options":["Тараптардың хат алмасуы шарттың жасалуын дәлелдеуге жарамсыз","Шарт жасалу үшін тауардың нарықтық бағасы туралы жарнама жеткілікті","Екі немесе одан көп тұлғаның азаматтық құқықтар мен міндеттерді белгілеу, өзгерту не тоқтату туралы келісімі","Шарт тараптар арасында келісім болмаса да міндеттемені туындатады","Шарт бір тараптың еркімен екінші тарапқа міндет жүктейтін акт болып табылады","Шарттың нысанасы туралы келісім кез келген жағдайда қажет болмайды"],"answer":[2],"explanation":"ҚР АК 378, 393-баптар. Екі немесе одан көп тұлғаның азаматтық құқықтар мен міндеттерді белгілеу, өзгерту не тоқтату туралы келісімі. Кейсте осы құқықтық негізге сәйкес міндеттеме мен оның орындалуы бағаланады.","basis":"ҚР АК 378, 393-баптар"},{"num":2,"type":"multi","q":"Шартқа қатысты дұрыс тұжырымдарды таңдаңыз.","options":["Шарт тараптар арасында келісім болмаса да міндеттемені туындатады","Шартта тараптар үшін құқықтар мен міндеттер белгіленуі мүмкін","Тауар саны анықталмаса да жеткізу шартының нысанасы толық келісілген","Шарт тараптардың келісіміне негізделеді","Тараптардың хат алмасуы шарттың жасалуын дәлелдеуге жарамсыз","Қол қойылған шарт болса елеулі талаптарды келісу мәселесі зерттелмейді","Шарттың нысанасы туралы келісім кез келген жағдайда қажет болмайды"],"answer":[1,3],"explanation":"ҚР АК 378, 393-баптар. Шарт тараптардың келісіміне негізделеді; Шартта тараптар үшін құқықтар мен міндеттер белгіленуі мүмкін. Бұл талаптар көрсетілген жағдайдағы құқықтық салдарды анықтайды.","basis":"ҚР АК 378, 393-баптар"},{"num":3,"type":"single","q":"Сот шарттың жасалуын қалай бағалайды?","options":["Қол қойылған шарт болса елеулі талаптарды келісу мәселесі зерттелмейді","Бір тараптың офертасы екінші тарап қабылдамаса да шарт жасайды","Тараптардың хат алмасуы шарттың жасалуын дәлелдеуге жарамсыз","Елеулі талаптар бойынша тиісті нысанда келісімге қол жеткізілгенін тексереді","Тауар саны анықталмаса да жеткізу шартының нысанасы толық келісілген","Кез келген шартта барлық қосымша талаптар міндетті елеулі болады"],"answer":[3],"explanation":"ҚР АК 378, 393-баптар. Елеулі талаптар бойынша тиісті нысанда келісімге қол жеткізілгенін тексереді. Сот осы мән-жайды талаптың нысанасына қатысты дәлелдемелермен салыстырады.","basis":"ҚР АК 378, 393-баптар"},{"num":4,"type":"multi","q":"Сот қандай құжаттар мен деректерді қарайды?","options":["Бір тараптың офертасы екінші тарап қабылдамаса да шарт жасайды","Шарт жасалғанын анықтауда заңда талап етілген нысан ескерілмейді","Шарт бір тараптың еркімен екінші тарапқа міндет жүктейтін акт болып табылады","Тараптардың хат алмасуы мен акцепт деректері","Тауар атауы мен саны туралы келісім","Қол қойылған шарт болса елеулі талаптарды келісу мәселесі зерттелмейді","Тараптардың шарт жобасы мен қол қойылған нұсқасы","Кез келген шартта барлық қосымша талаптар міндетті елеулі болады"],"answer":[3,4,6],"explanation":"ҚР АК 378, 393-баптар. Маңызды дәлелдемелер: Тараптардың хат алмасуы мен акцепт деректері; Тауар атауы мен саны туралы келісім; Тараптардың шарт жобасы мен қол қойылған нұсқасы. Олардың қатыстылығы мен анықтығы істің нақты мән-жайлары арқылы бағаланады.","basis":"ҚР АК 378, 393-баптар"}]},{"id":119,"title":"Шарттың негізгі жағдаяттары. Әдеттегі алғышарттар. Кездейсоқ жағдайлар. Шарт жағдайларын анықтау. Шарттың болжамды жағдаяттары.","material":"Сатушы мен сатып алушы шартта тауардың атауын, санын және жеткізу күнін белгіледі. Сатушы қосымша қаптаманың түсін шарттың елеулі талабы деп санап, ол келісілмегендіктен шарт жасалмағанын мәлімдеді.","procedure":"Сот тараптардың қай талапты елеулі деп санағанын, заңдағы талаптарды және келіссөз құжаттарын зерттейді.","questions":[{"num":1,"type":"single","q":"Шарттың елеулі талаптарына не жатады?","options":["Тараптардың бірі келісуді талап еткен талап елеулі болып есептелмейді","Шарттың кез келген техникалық бөлшегі заң бойынша елеулі талап болады","Тауар нысанасы туралы келісім шарт жасалуына құқықтық әсер етпейді","Елеулі талаптар тек шартта жеке «елеулі» деп аталғанда пайда болады","Кездейсоқ талаптар заңда белгіленген барлық шартқа міндетті қолданылады","Заңда елеулі деп танылған және тараптың мәлімдеуімен келісуді қажет ететін талаптар"],"answer":[5],"explanation":"ҚР АК 382, 393-баптар. Заңда елеулі деп танылған және тараптың мәлімдеуімен келісуді қажет ететін талаптар. Кейсте осы құқықтық негізге сәйкес міндеттеме мен оның орындалуы бағаланады.","basis":"ҚР АК 382, 393-баптар"},{"num":2,"type":"multi","q":"Шарт талаптарын бағалауда қандай ережелер маңызды?","options":["Шарттың нысанасы туралы келісімнің болуы","Тараптардың бірі келісуді талап еткен талаптардың анықталуы","Келіссөздегі маңызды ұсынысқа қарсылық білдіру келісімге әсер етпейді","Тауар нысанасы туралы келісім шарт жасалуына құқықтық әсер етпейді","Кездейсоқ талаптар заңда белгіленген барлық шартқа міндетті қолданылады","Тараптардың бірі келісуді талап еткен талап елеулі болып есептелмейді","Қаптама түсі кез келген жеткізу шартында міндетті елеулі талап болады"],"answer":[0,1],"explanation":"ҚР АК 382, 393-баптар. Шарттың нысанасы туралы келісімнің болуы; Тараптардың бірі келісуді талап еткен талаптардың анықталуы. Бұл талаптар көрсетілген жағдайдағы құқықтық салдарды анықтайды.","basis":"ҚР АК 382, 393-баптар"},{"num":3,"type":"single","q":"Қаптама түсі туралы дауда сот нені анықтайды?","options":["Осы талаптың заң бойынша не тараптардың келіссөзі бойынша елеулі болғанын","Елеулі талаптың мазмұны тараптардың келіссөзінен анықталмайды","Кездейсоқ талаптар заңда белгіленген барлық шартқа міндетті қолданылады","Қаптама түсі кез келген жеткізу шартында міндетті елеулі талап болады","Шарттағы әдеттегі талаптарды тараптар ешқашан өзгерте алмайды","Келіссөздегі маңызды ұсынысқа қарсылық білдіру келісімге әсер етпейді"],"answer":[0],"explanation":"ҚР АК 382, 393-баптар. Осы талаптың заң бойынша не тараптардың келіссөзі бойынша елеулі болғанын. Сот осы мән-жайды талаптың нысанасына қатысты дәлелдемелермен салыстырады.","basis":"ҚР АК 382, 393-баптар"},{"num":4,"type":"multi","q":"Сот қандай дәлелдемелерді қарайды?","options":["Тараптардың келіссөз хаттары","Келіссөздегі маңызды ұсынысқа қарсылық білдіру келісімге әсер етпейді","Қаптама түсіне қатысты ұсыныстар мен қарсылықтар","Елеулі талаптың мазмұны тараптардың келіссөзінен анықталмайды","Шарттың келісілген мәтіні","Елеулі талап бойынша келісімге келмеу шарттың жасалуына әсер етпейді","Елеулі талаптар тек шартта жеке «елеулі» деп аталғанда пайда болады","Шарттағы әдеттегі талаптарды тараптар ешқашан өзгерте алмайды"],"answer":[0,2,4],"explanation":"ҚР АК 382, 393-баптар. Маңызды дәлелдемелер: Қаптама түсіне қатысты ұсыныстар мен қарсылықтар; Тараптардың келіссөз хаттары; Шарттың келісілген мәтіні. Олардың қатыстылығы мен анықтығы істің нақты мән-жайлары арқылы бағаланады.","basis":"ҚР АК 382, 393-баптар"}]},{"id":120,"title":"Шарт еркiндiгi.","material":"Екі кәсіпкер қызмет көрсету шартын жасасуға келісті. Бір тарап шартқа заңда тыйым салынбаған қосымша төлем тәртібін ұсынды. Екінші тарап мұндай шарт жасауға болмайды деп мәлімдеді.","procedure":"Сот шарт еркіндігі қағидаты мен заңның императивтік талаптарының арақатынасын бағалайды.","questions":[{"num":1,"type":"single","q":"Шарт еркіндігі қағидаты нені білдіреді?","options":["Шарт еркіндігі заңның міндетті нормаларын тараптарға қолдандырмайды","Шарттың мазмұнын анықтауға бір тараптың еркі жеткілікті болады","Тараптардың заң шегінде шарт жасасуға және оның талаптарын айқындауға еріктілігін","Императивтік талаптар шарт еркіндігі жағдайында қолданылмайды","Шарт еркіндігі кез келген азаматты шарт жасасуға мәжбүрлейді","Тараптар келіскен кез келген талап заңдағы тыйымды жоя алады"],"answer":[2],"explanation":"ҚР АК 380, 383-баптар. Тараптардың заң шегінде шарт жасасуға және оның талаптарын айқындауға еріктілігін. Кейсте осы құқықтық негізге сәйкес міндеттеме мен оның орындалуы бағаланады.","basis":"ҚР АК 380, 383-баптар"},{"num":2,"type":"multi","q":"Шарт еркіндігі туралы дұрыс тұжырымдарды таңдаңыз.","options":["Шарт еркіндігі кез келген азаматты шарт жасасуға мәжбүрлейді","Шарттың мазмұнын анықтауға бір тараптың еркі жеткілікті болады","Қосымша төлем тәртібі заңға қайшы болса да міндетті қолданылады","Тараптардың келісімі жоқ болса да төлем тәртібі келісілген саналады","Заңда көзделген шектеулер шарт еркіндігіне қолданылады","Тараптар заңға қайшы келмейтін талаптарды келісе алады","Императивтік талаптар шарт еркіндігі жағдайында қолданылмайды"],"answer":[4,5],"explanation":"ҚР АК 380, 383-баптар. Заңда көзделген шектеулер шарт еркіндігіне қолданылады; Тараптар заңға қайшы келмейтін талаптарды келісе алады. Бұл талаптар көрсетілген жағдайдағы құқықтық салдарды анықтайды.","basis":"ҚР АК 380, 383-баптар"},{"num":3,"type":"single","q":"Сот қосымша төлем тәртібінің заңдылығын қалай анықтайды?","options":["Оның заңның міндетті талаптарына қайшы келетін-келмейтінін тексереді","Императивтік талаптар шарт еркіндігі жағдайында қолданылмайды","Тараптардың келісімі жоқ болса да төлем тәртібі келісілген саналады","Заңға қайшы шарт талабы тараптардың келісімімен заңды болып кетеді","Келіссөздегі бір тараптың ұсынысы автоматты шарт талабына айналады","Қосымша төлем тәртібі заңға қайшы болса да міндетті қолданылады"],"answer":[0],"explanation":"ҚР АК 380, 383-баптар. Оның заңның міндетті талаптарына қайшы келетін-келмейтінін тексереді. Сот осы мән-жайды талаптың нысанасына қатысты дәлелдемелермен салыстырады.","basis":"ҚР АК 380, 383-баптар"},{"num":4,"type":"multi","q":"Сот қандай құжаттарды зерттейді?","options":["Қосымша төлем туралы келіссөздер","Заңға қайшы шарт талабы тараптардың келісімімен заңды болып кетеді","Шарт еркіндігі соттың шарттың заңдылығын тексеруіне кедергі жасайды","Тараптардың келісімі жоқ болса да төлем тәртібі келісілген саналады","Шарт еркіндігі заңның міндетті нормаларын тараптарға қолдандырмайды","Тараптардың шарт мәтіні","Келіссөздегі бір тараптың ұсынысы автоматты шарт талабына айналады","Қолданылатын міндетті құқықтық талаптар"],"answer":[0,5,7],"explanation":"ҚР АК 380, 383-баптар. Маңызды дәлелдемелер: Қосымша төлем туралы келіссөздер; Қолданылатын міндетті құқықтық талаптар; Тараптардың шарт мәтіні. Олардың қатыстылығы мен анықтығы істің нақты мән-жайлары арқылы бағаланады.","basis":"ҚР АК 380, 383-баптар"}]},{"id":121,"title":"Шарттың түрлері. Негізгі және алдын-ала шарт. Үшiншi жақтың пайдасына жасалатын шарт. Ақылы және ақысыз шарт. Взаимосогласованные договоры и договоры присоединения. Аралас шарт. Зависимые договоры. Жария шарт. Өзара шарт пен қосылу шарты. Қосылу шарт.","material":"Кәсіпкер болашақта қойманы сату туралы құжатқа қол қойды. Құжатта тараптардың кейін негізгі сатып алу-сату шартын жасау міндеті мен оның маңызды талаптары көрсетілді.","procedure":"Кәсіпкер болашақта қойманы сату туралы құжатқа қол қойды. Құжатта тараптардың кейін негізгі сатып алу-сату шартын жасау міндеті мен оның маңызды талаптары көрсетілді.","questions":[{"num":1,"type":"single","q":"Бұл құжаттың құқықтық табиғаты қандай?","options":["Алдын ала шарт негізгі шартты жасасу міндетін туғызбайды","Алдын ала шартқа қатысты мерзім мен талаптар бағаланбайды","Алдын ала шарт негізгі шарт жасалғаннан кейін ғана күшіне енеді","Алдын ала шарт барлық жағдайда мүлікті дереу беруді талап етеді","Алдын ала шарт","Алдын ала шарттың нысанына ешқандай талап қойылмайды"],"answer":[4],"explanation":"Алдын ала шарт тараптарға болашақта негізгі шартты келісілген талаптармен жасасу міндетін жүктейді.","basis":"ҚР АК 387, 389–391-баптар"},{"num":2,"type":"multi","q":"Шарт түрін дұрыс анықтауға не көмектеседі?","options":["Кейін негізгі шарт жасасу міндеті","Алдын ала шарттың нысанына ешқандай талап қойылмайды","Алдын ала шарт негізгі шартты жасасу міндетін туғызбайды","Құжаттың қолданылу мерзімі","Алдын ала шарт барлық жағдайда мүлікті дереу беруді талап етеді","Тараптардың міндеттемелерінің мазмұны","Алдын ала шартқа қатысты мерзім мен талаптар бағаланбайды"],"answer":[0,3,5],"explanation":"Алдын ала шарт тараптарға болашақта негізгі шартты келісілген талаптармен жасасу міндетін жүктейді.","basis":"ҚР АК 387, 389–391-баптар"},{"num":3,"type":"single","q":"Осы тақырып бойынша қандай құқықтық тұжырым дұрыс?","options":["Алдын ала шарт болашақта негізгі шарт жасасу міндетін белгілейді","Алдын ала шарттың нысанына ешқандай талап қойылмайды","Алдын ала шарт барлық жағдайда мүлікті дереу беруді талап етеді","Алдын ала шарт негізгі шартты жасасу міндетін туғызбайды","Алдын ала шартқа қатысты мерзім мен талаптар бағаланбайды","Алдын ала шарт негізгі шарт жасалғаннан кейін ғана күшіне енеді"],"answer":[0],"explanation":"ҚР АК 387, 389–391-баптар. Алдын ала шарт болашақта негізгі шарт жасасу міндетін белгілейді. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 387, 389–391-баптар"},{"num":4,"type":"multi","q":"Дауды шешу кезінде қандай құқықтық мән-жайлар ескеріледі?","options":["Алдын ала шарттың нысанына ешқандай талап қойылмайды","Алдын ала шартқа қатысты мерзім мен талаптар бағаланбайды","Алдын ала шарт негізгі шартты жасасу міндетін туғызбайды","Алдын ала шартта негізгі шартты жасасу талаптары көрсетіледі","Алдын ала шарттың нысаны негізгі шарттың нысанына сәйкес болуы тиіс","Алдын ала шарт негізгі шарт жасалғаннан кейін ғана күшіне енеді","Алдын ала шарт барлық жағдайда мүлікті дереу беруді талап етеді"],"answer":[3,4],"explanation":"ҚР АК 387, 389–391-баптар. Алдын ала шарттың нысаны негізгі шарттың нысанына сәйкес болуы тиіс; Алдын ала шартта негізгі шартты жасасу талаптары көрсетіледі. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 387, 389–391-баптар"}]},{"id":122,"title":"Шарт жасасу тәртібі. Оферта. Акцепт.","material":"Жабдық сатушысы сатып алушыға тауар, саны, бағасы және жеткізу шарттары көрсетілген нақты ұсыныс жіберді. Сатып алушы барлық талаппен келісетінін мерзімінде хабарлады.","procedure":"Жабдық сатушысы сатып алушыға тауар, саны, бағасы және жеткізу шарттары көрсетілген нақты ұсыныс жіберді. Сатып алушы барлық талаппен келісетінін мерзімінде хабарлады.","questions":[{"num":1,"type":"single","q":"Сатып алушының жауабы қалай бағаланады?","options":["Акцепт офертаның мазмұнына сай келмесе де шарт жасалады","Оферта шарттың елеулі талаптарын қамтуға міндетті емес","Кез келген жарнама міндетті түрде жария оферта саналады","Шарт талаптарын өзгерткен жауап әрқашан акцепт саналады","Оферта жіберілген бойда шарт екі тарап үшін жасалған саналады","Толық әрі сөзсіз акцепт"],"answer":[5],"explanation":"Оферта елеулі талаптарды қамтитын және шарт жасасуға ниетті білдіретін ұсыныс; акцепт оның толық әрі сөзсіз қабылдануы.","basis":"ҚР АК 393, 395–397-баптар"},{"num":2,"type":"multi","q":"Шарттың жасалуын бағалағанда не маңызды?","options":["Жауаптың толық әрі сөзсіз болуы","Шарт талаптарын өзгерткен жауап әрқашан акцепт саналады","Оферта шарттың елеулі талаптарын қамтуға міндетті емес","Офертаның елеулі талаптары","Акцепттің уақытында берілуі","Акцепт офертаның мазмұнына сай келмесе де шарт жасалады","Оферта жіберілген бойда шарт екі тарап үшін жасалған саналады"],"answer":[0,3,4],"explanation":"Оферта елеулі талаптарды қамтитын және шарт жасасуға ниетті білдіретін ұсыныс; акцепт оның толық әрі сөзсіз қабылдануы.","basis":"ҚР АК 393, 395–397-баптар"},{"num":3,"type":"single","q":"Осы тақырып бойынша қандай құқықтық тұжырым дұрыс?","options":["Оферта шарттың елеулі талаптарын немесе оларды анықтау тәртібін қамтиды","Оферта шарттың елеулі талаптарын қамтуға міндетті емес","Кез келген жарнама міндетті түрде жария оферта саналады","Акцепт офертаның мазмұнына сай келмесе де шарт жасалады","Оферта жіберілген бойда шарт екі тарап үшін жасалған саналады","Шарт талаптарын өзгерткен жауап әрқашан акцепт саналады"],"answer":[0],"explanation":"ҚР АК 393, 395–397-баптар. Оферта шарттың елеулі талаптарын немесе оларды анықтау тәртібін қамтиды. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 393, 395–397-баптар"},{"num":4,"type":"multi","q":"Дауды шешу кезінде қандай құқықтық мән-жайлар ескеріледі?","options":["Кез келген жарнама міндетті түрде жария оферта саналады","Өзге талаппен берілген жауап жаңа оферта ретінде бағаланады","Оферта шарттың елеулі талаптарын қамтуға міндетті емес","Шарт талаптарын өзгерткен жауап әрқашан акцепт саналады","Оферта жіберілген бойда шарт екі тарап үшін жасалған саналады","Акцепт офертаның мазмұнына сай келмесе де шарт жасалады","Акцепт офертаның талаптарына толық әрі бұлтарыссыз келісуді білдіреді"],"answer":[1,6],"explanation":"ҚР АК 393, 395–397-баптар. Акцепт офертаның талаптарына толық әрі бұлтарыссыз келісуді білдіреді; Өзге талаппен берілген жауап жаңа оферта ретінде бағаланады. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 393, 395–397-баптар"}]},{"id":123,"title":"Шарттың нысаны.","material":"Екі компания ірі жабдық жеткізуге ауызша келісті. Кейін бір тарап жазбаша шарт талап етілетін мәміленің дәлелдемелері туралы дау көтерді.","procedure":"Екі компания ірі жабдық жеткізуге ауызша келісті. Кейін бір тарап жазбаша шарт талап етілетін мәміленің дәлелдемелері туралы дау көтерді.","questions":[{"num":1,"type":"single","q":"Бұл дауда бірінші кезекте не анықталады?","options":["Жазбаша нысан талап етілсе де ауызша шарт әрқашан жеткілікті","Нысан бұзылғанда оның салдары заңға қарамастан бірдей болады","Тараптар келіскен шарт нысанының құқықтық маңызы болмайды","Электрондық хабар алмасу жазбаша нысанды ешқашан сақтамайды","Шарттың нысаны оның жасалу сәтіне ешқашан әсер етпейді","Мәмілеге заң талап ететін нысан"],"answer":[5],"explanation":"Шарттың нысанына қойылатын талаптар мәміленің түріне және заңға байланысты; нысанды сақтамаудың салдары бөлек бағаланады.","basis":"ҚР АК 394-бап"},{"num":2,"type":"multi","q":"Шарт нысанына қатысты қандай мәселелер қаралады?","options":["Тараптар келіскен шарт нысанының құқықтық маңызы болмайды","Электрондық құжаттың қолданылуы","Электрондық хабар алмасу жазбаша нысанды ешқашан сақтамайды","Шарттың нысаны оның жасалу сәтіне ешқашан әсер етпейді","Нысанды сақтамаудың құқықтық салдары","Тараптардың қол қою өкілеттігі","Жазбаша нысан талап етілсе де ауызша шарт әрқашан жеткілікті"],"answer":[1,4,5],"explanation":"Шарттың нысанына қойылатын талаптар мәміленің түріне және заңға байланысты; нысанды сақтамаудың салдары бөлек бағаланады.","basis":"ҚР АК 394-бап"},{"num":3,"type":"single","q":"Осы тақырып бойынша қандай құқықтық тұжырым дұрыс?","options":["Электрондық хабар алмасу жазбаша нысанды ешқашан сақтамайды","Тараптар келісілген нысан сақталған кезде шарт жасалды деп есептелуі мүмкін","Шарттың нысаны оның жасалу сәтіне ешқашан әсер етпейді","Тараптар келіскен шарт нысанының құқықтық маңызы болмайды","Жазбаша нысан талап етілсе де ауызша шарт әрқашан жеткілікті","Нысан бұзылғанда оның салдары заңға қарамастан бірдей болады"],"answer":[1],"explanation":"ҚР АК 394-бап. Тараптар келісілген нысан сақталған кезде шарт жасалды деп есептелуі мүмкін. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 394-бап"},{"num":4,"type":"multi","q":"Дауды шешу кезінде қандай құқықтық мән-жайлар ескеріледі?","options":["Шарттың нысаны оның жасалу сәтіне ешқашан әсер етпейді","Электрондық хабар алмасу жазбаша нысанды ешқашан сақтамайды","Тараптар келіскен шарт нысанының құқықтық маңызы болмайды","Нысан бұзылғанда оның салдары заңға қарамастан бірдей болады","Жазбаша нысан талап етілсе де ауызша шарт әрқашан жеткілікті","Нысанға қатысты дауда тараптардың келісімі мен заң талаптары тексеріледі","Шарттың жазбаша нысаны заңда көзделген тәсілмен сақталуы мүмкін"],"answer":[5,6],"explanation":"ҚР АК 394-бап. Шарттың жазбаша нысаны заңда көзделген тәсілмен сақталуы мүмкін; Нысанға қатысты дауда тараптардың келісімі мен заң талаптары тексеріледі. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 394-бап"}]},{"id":124,"title":"Шартты мiндеттi түрде жасасу.","material":"Қызмет көрсетуші ұйым заңда белгіленген жағдайларда шарт жасасуға міндетті. Ол өтініш берушіге ешқандай негіз көрсетпей шарт жасаудан бас тартты.","procedure":"Қызмет көрсетуші ұйым заңда белгіленген жағдайларда шарт жасасуға міндетті. Ол өтініш берушіге ешқандай негіз көрсетпей шарт жасаудан бас тартты.","questions":[{"num":1,"type":"single","q":"Қандай құқықтық мәселе туындайды?","options":["Міндетті шарт жасасу туралы талап әрқашан заңсыз болады","Негізсіз жалтару жағдайында сотқа жүгінуге болмайды","Келіспеушілік хаттамасы шарт жасасуда құқықтық мәнге ие емес","Шарт жасасудан негізсіз жалтару","Міндетті шарт бойынша офертаға жауап берудің мерзімі болмайды","Заң міндеттеген тарап шарттан ешбір себепсіз бас тарта алады"],"answer":[3],"explanation":"Заң міндет жүктеген жағдайларда шарт жасасудан бас тартудың негізділігі мен құқықтық салдары тексеріледі.","basis":"ҚР АК 399-бап"},{"num":2,"type":"multi","q":"Міндетті шарт жасасу жөніндегі дауда не зерттеледі?","options":["Міндетті шарт бойынша офертаға жауап берудің мерзімі болмайды","Негізсіз жалтару жағдайында сотқа жүгінуге болмайды","Міндетті шарт жасасу туралы талап әрқашан заңсыз болады","Заңдағы шарт жасасу міндеті","Өтініш берушінің тиісті ұсынысы","Заң міндеттеген тарап шарттан ешбір себепсіз бас тарта алады","Заңдағы дауды шешу тәртібі"],"answer":[3,4,6],"explanation":"Заң міндет жүктеген жағдайларда шарт жасасудан бас тартудың негізділігі мен құқықтық салдары тексеріледі.","basis":"ҚР АК 399-бап"},{"num":3,"type":"single","q":"Осы тақырып бойынша қандай құқықтық тұжырым дұрыс?","options":["Заң шарт жасасуды міндеттесе, негізсіз жалтаруға жол берілмейді","Міндетті шарт бойынша офертаға жауап берудің мерзімі болмайды","Келіспеушілік хаттамасы шарт жасасуда құқықтық мәнге ие емес","Негізсіз жалтару жағдайында сотқа жүгінуге болмайды","Заң міндеттеген тарап шарттан ешбір себепсіз бас тарта алады","Міндетті шарт жасасу туралы талап әрқашан заңсыз болады"],"answer":[0],"explanation":"ҚР АК 399-бап. Заң шарт жасасуды міндеттесе, негізсіз жалтаруға жол берілмейді. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 399-бап"},{"num":4,"type":"multi","q":"Дауды шешу кезінде қандай құқықтық мән-жайлар ескеріледі?","options":["Келіспеушілік хаттамасы шарт жасасуда құқықтық мәнге ие емес","Міндетті шарт бойынша офертаға жауап берудің мерзімі болмайды","Заңда өзгеше белгіленбесе, офертаға жауап беру үшін отыз күн беріледі","Негізсіз жалтару сотта шарт жасасуға мәжбүрлеу талабына негіз болуы мүмкін","Негізсіз жалтару жағдайында сотқа жүгінуге болмайды","Заң міндеттеген тарап шарттан ешбір себепсіз бас тарта алады","Міндетті шарт жасасу туралы талап әрқашан заңсыз болады"],"answer":[2,3],"explanation":"ҚР АК 399-бап. Заңда өзгеше белгіленбесе, офертаға жауап беру үшін отыз күн беріледі; Негізсіз жалтару сотта шарт жасасуға мәжбүрлеу талабына негіз болуы мүмкін. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 399-бап"}]},{"id":125,"title":"Шарт жасасу алдындағы даулар.","material":"Екі кәсіпорын міндетті түрде жасалуға тиіс шарттың бағасы жөнінде келісе алмады. Бір тарап келіспеушілік хаттамасын жіберді.","procedure":"Екі кәсіпорын міндетті түрде жасалуға тиіс шарттың бағасы жөнінде келісе алмады. Бір тарап келіспеушілік хаттамасын жіберді.","questions":[{"num":1,"type":"single","q":"Даудың құқықтық сипаты қандай?","options":["Келіспеушілік хаттамасының мазмұны дауда зерттелмейді","Сот келіспеген шарт талаптарын ешбір жағдайда қарай алмайды","Шарт жасасу алдындағы барлық дау сотта қаралуға жатпайды","Шарт жасасу алдындағы дау тек шарт орындалғаннан кейін туады","Тараптардың келісімі дауды сотқа беруге негіз бола алмайды","Шарт жасасу алдындағы келіспеушілік"],"answer":[5],"explanation":"Шарт жасасу алдындағы дауларда тараптардың келіспеген талаптары және дауды қараудың заңды негізі шешуші.","basis":"ҚР АК 399–400-баптар"},{"num":2,"type":"multi","q":"Дауды қарауда қандай жайттар маңызды?","options":["Шарт жасасу алдындағы дау тек шарт орындалғаннан кейін туады","Заңда көзделген сотқа жүгіну мүмкіндігі","Ұсыныстар мен жауаптардың мерзімі","Тараптардың келісімі дауды сотқа беруге негіз бола алмайды","Келіспеушілік хаттамасының мазмұны дауда зерттелмейді","Шарт жасасу алдындағы барлық дау сотта қаралуға жатпайды","Келіспеушілік туғызған талаптар"],"answer":[1,2,6],"explanation":"Шарт жасасу алдындағы дауларда тараптардың келіспеген талаптары және дауды қараудың заңды негізі шешуші.","basis":"ҚР АК 399–400-баптар"},{"num":3,"type":"single","q":"Осы тақырып бойынша қандай құқықтық тұжырым дұрыс?","options":["Сот келіспеген шарт талаптарын ешбір жағдайда қарай алмайды","Шарт жасасу алдындағы барлық дау сотта қаралуға жатпайды","Тараптардың келісімі дауды сотқа беруге негіз бола алмайды","Шарт жасасу алдындағы дау тек шарт орындалғаннан кейін туады","Келіспеушілік хаттамасының мазмұны дауда зерттелмейді","Шарт жасасу алдындағы дау заңда көзделген жағдайда сотта қаралады"],"answer":[5],"explanation":"ҚР АК 399–400-баптар. Шарт жасасу алдындағы дау заңда көзделген жағдайда сотта қаралады. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 399–400-баптар"},{"num":4,"type":"multi","q":"Дауды шешу кезінде қандай құқықтық мән-жайлар ескеріледі?","options":["Шарт жасасу алдындағы дау тек шарт орындалғаннан кейін туады","Келіспеушілік хаттамасы даудың нысанасын айқындауға көмектеседі","Тараптардың келісімі дауды сотқа беру негізі бола алады","Шарт жасасу алдындағы барлық дау сотта қаралуға жатпайды","Тараптардың келісімі дауды сотқа беруге негіз бола алмайды","Сот келіспеген шарт талаптарын ешбір жағдайда қарай алмайды","Келіспеушілік хаттамасының мазмұны дауда зерттелмейді"],"answer":[1,2],"explanation":"ҚР АК 399–400-баптар. Тараптардың келісімі дауды сотқа беру негізі бола алады; Келіспеушілік хаттамасы даудың нысанасын айқындауға көмектеседі. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 399–400-баптар"}]},{"id":126,"title":"Сауда мен аукциондардағы шартарды жасау","material":"Мемлекеттік емес ұйым өз мүлкін аукцион арқылы сатуға шығарды. Сауда туралы хабарландыруда өткізу тәртібі мен жеңімпазды анықтау шарттары жарияланды.","procedure":"Мемлекеттік емес ұйым өз мүлкін аукцион арқылы сатуға шығарды. Сауда туралы хабарландыруда өткізу тәртібі мен жеңімпазды анықтау шарттары жарияланды.","questions":[{"num":1,"type":"single","q":"Аукцион қорытындысын бағалауда не маңызды?","options":["Жеңімпазды анықтау рәсімі шартқа ешқашан әсер етпейді","Сауда өткізу тәртібінің бұзылуы ешқашан дауланбайды","Аукционда қатысушылардың теңдігі бағаланбайды","Аукцион хабарландыруындағы талаптар құқықтық мәнге ие емес","Жарияланған сауда тәртібінің сақталуы","Сауда қорытындысын рәсімдейтін құжаттар қажет емес"],"answer":[4],"explanation":"Сауда-саттық арқылы шарт жасасқанда хабарландыру, өткізу тәртібі және қорытындыны рәсімдеу талаптары ескеріледі.","basis":"ҚР АК 910–916-баптар және қолданылатын арнайы заңнама"},{"num":2,"type":"multi","q":"Сауда нәтижесінде шарт жасасуды бағалауға не қажет?","options":["Заңдағы сауда-саттық ережелері","Сауда қорытындысын рәсімдейтін құжаттар қажет емес","Нәтижені рәсімдеу құжаттары","Аукцион хабарландыруындағы талаптар құқықтық мәнге ие емес","Сауда өткізу тәртібінің бұзылуы ешқашан дауланбайды","Жеңімпазды анықтау рәсімі шартқа ешқашан әсер етпейді","Сауда өткізу шарттары"],"answer":[0,2,6],"explanation":"Сауда-саттық арқылы шарт жасасқанда хабарландыру, өткізу тәртібі және қорытындыны рәсімдеу талаптары ескеріледі.","basis":"ҚР АК 910–916-баптар және қолданылатын арнайы заңнама"},{"num":3,"type":"single","q":"Осы тақырып бойынша қандай құқықтық тұжырым дұрыс?","options":["Сауда өткізу тәртібінің бұзылуы ешқашан дауланбайды","Жеңімпазды анықтау рәсімі шартқа ешқашан әсер етпейді","Аукцион хабарландыруындағы талаптар құқықтық мәнге ие емес","Сауда қорытындысын рәсімдейтін құжаттар қажет емес","Сауда-саттықтың жарияланған талаптары құқықтық маңызға ие","Аукционда қатысушылардың теңдігі бағаланбайды"],"answer":[4],"explanation":"ҚР АК 910–916-баптар және қолданылатын арнайы заңнама. Сауда-саттықтың жарияланған талаптары құқықтық маңызға ие. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 910–916-баптар және қолданылатын арнайы заңнама"},{"num":4,"type":"multi","q":"Дауды шешу кезінде қандай құқықтық мән-жайлар ескеріледі?","options":["Аукционда қатысушылардың теңдігі бағаланбайды","Сауда нәтижесін рәсімдеу құжаттары тексеріледі","Аукцион хабарландыруындағы талаптар құқықтық мәнге ие емес","Сауда өткізу тәртібінің бұзылуы ешқашан дауланбайды","Жеңімпазды анықтау рәсімі шартқа ешқашан әсер етпейді","Жеңімпазды айқындау тәртібінің сақталуы бағаланады","Сауда қорытындысын рәсімдейтін құжаттар қажет емес"],"answer":[1,5],"explanation":"ҚР АК 910–916-баптар және қолданылатын арнайы заңнама. Жеңімпазды айқындау тәртібінің сақталуы бағаланады; Сауда нәтижесін рәсімдеу құжаттары тексеріледі. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 910–916-баптар және қолданылатын арнайы заңнама"}]},{"id":127,"title":"Шартты өзгерту және бұзу негiздерi.","material":"Мердігер шартты елеулі түрде бұзды. Тапсырыс беруші шартты бұзуды талап етті, ал мердігер оған қарсы болды.","procedure":"Мердігер шартты елеулі түрде бұзды. Тапсырыс беруші шартты бұзуды талап етті, ал мердігер оған қарсы болды.","questions":[{"num":1,"type":"single","q":"Шартты бұзу туралы талапты бағалауда қандай негіз маңызды?","options":["Шарт тараптардың келісімімен ешқашан өзгертілмейді","Шартты бұзу үшін заңда негіз болуы талап етілмейді","Шартты елеулі бұзу сотта шартты бұзуға негіз бола алмайды","Шартты бұзу туралы талапта оның салдары бағаланбайды","Кез келген ұсақ бұзушылық шартты міндетті түрде тоқтатады","Шарттың елеулі бұзылуы"],"answer":[5],"explanation":"Шартты өзгерту немесе бұзу тараптардың келісімімен, ал заңда көзделген негіздер бойынша өзге тәртіппен жүзеге асуы мүмкін.","basis":"ҚР АК 401-бап"},{"num":2,"type":"multi","q":"Шартты бұзу негіздерін анықтауда не тексеріледі?","options":["Шарт тараптардың келісімімен ешқашан өзгертілмейді","Шартты елеулі бұзу сотта шартты бұзуға негіз бола алмайды","Шартты бұзу үшін заңда негіз болуы талап етілмейді","Заң мен шарттағы бұзу негіздері","Талаптың құқықтық салдары","Кез келген ұсақ бұзушылық шартты міндетті түрде тоқтатады","Бұзушылықтың сипаты"],"answer":[3,4,6],"explanation":"Шартты өзгерту немесе бұзу тараптардың келісімімен, ал заңда көзделген негіздер бойынша өзге тәртіппен жүзеге асуы мүмкін.","basis":"ҚР АК 401-бап"},{"num":3,"type":"single","q":"Осы тақырып бойынша қандай құқықтық тұжырым дұрыс?","options":["Кез келген ұсақ бұзушылық шартты міндетті түрде тоқтатады","Шартты бұзу үшін заңда негіз болуы талап етілмейді","Шарт тараптардың келісімімен өзгертілуі немесе бұзылуы мүмкін","Шарт тараптардың келісімімен ешқашан өзгертілмейді","Шартты елеулі бұзу сотта шартты бұзуға негіз бола алмайды","Шартты бұзу туралы талапта оның салдары бағаланбайды"],"answer":[2],"explanation":"ҚР АК 401-бап. Шарт тараптардың келісімімен өзгертілуі немесе бұзылуы мүмкін. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 401-бап"},{"num":4,"type":"multi","q":"Дауды шешу кезінде қандай құқықтық мән-жайлар ескеріледі?","options":["Шартты елеулі бұзу сотта шартты бұзуға негіз бола алмайды","Заңда не шартта көрсетілген өзге негіздер де ескеріледі","Шартты бұзу үшін заңда негіз болуы талап етілмейді","Шартты бұзу туралы талапта оның салдары бағаланбайды","Кез келген ұсақ бұзушылық шартты міндетті түрде тоқтатады","Шарт тараптардың келісімімен ешқашан өзгертілмейді","Шарттың елеулі бұзылуы сот тәртібімен бұзуға негіз бола алады"],"answer":[1,6],"explanation":"ҚР АК 401-бап. Шарттың елеулі бұзылуы сот тәртібімен бұзуға негіз бола алады; Заңда не шартта көрсетілген өзге негіздер де ескеріледі. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 401-бап"}]},{"id":128,"title":"Шартты өзгерту және бұзу тәртiбi.","material":"Жалдаушы шартты мерзімінен бұрын бұзғысы келді. Жалға беруші келіспеді. Жалдаушы заңда көзделген рәсімді сақтамай бірден сотқа жүгінді.","procedure":"Жалдаушы шартты мерзімінен бұрын бұзғысы келді. Жалға беруші келіспеді. Жалдаушы заңда көзделген рәсімді сақтамай бірден сотқа жүгінді.","questions":[{"num":1,"type":"single","q":"Сотқа жүгінер алдында не бағалануы тиіс?","options":["Шартты өзгерту туралы келісім кез келген нысанда жасалады","Шартты өзгерту рәсімі тараптардың келісіміне тәуелді емес","Шартты өзгерту не бұзу туралы ұсыныс тәртібі","Отыз күндік мерзім заңда ешбір жағдайда көзделмеген","Шартты бұзу ұсынысын жіберу сот үшін ешқашан маңызды емес","Екінші тараптың жауабын күтудің құқықтық мәні жоқ"],"answer":[2],"explanation":"Шартты сот тәртібімен өзгерту не бұзу алдында заңда көзделген ұсыныс пен жауап беру рәсімі маңызды болуы мүмкін.","basis":"ҚР АК 402-бап"},{"num":2,"type":"multi","q":"Рәсімнің сақталуын қандай деректер көрсетеді?","options":["Ұсынысты алғанын растайтын дерек","Отыз күндік мерзім заңда ешбір жағдайда көзделмеген","Екінші тараптың жауабын күтудің құқықтық мәні жоқ","Жауап беру мерзімінің өтуі","Шартты өзгерту туралы келісім кез келген нысанда жасалады","Шартты бұзу ұсынысын жіберу сот үшін ешқашан маңызды емес","Заңдағы немесе шарттағы ерекше тәртіп"],"answer":[0,3,6],"explanation":"Шартты сот тәртібімен өзгерту не бұзу алдында заңда көзделген ұсыныс пен жауап беру рәсімі маңызды болуы мүмкін.","basis":"ҚР АК 402-бап"},{"num":3,"type":"single","q":"Осы тақырып бойынша қандай құқықтық тұжырым дұрыс?","options":["Өзгерту не бұзу туралы ұсыныстың жіберілгені анықталады","Шартты өзгерту рәсімі тараптардың келісіміне тәуелді емес","Екінші тараптың жауабын күтудің құқықтық мәні жоқ","Шартты өзгерту туралы келісім кез келген нысанда жасалады","Отыз күндік мерзім заңда ешбір жағдайда көзделмеген","Шартты бұзу ұсынысын жіберу сот үшін ешқашан маңызды емес"],"answer":[0],"explanation":"ҚР АК 402-бап. Өзгерту не бұзу туралы ұсыныстың жіберілгені анықталады. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 402-бап"},{"num":4,"type":"multi","q":"Дауды шешу кезінде қандай құқықтық мән-жайлар ескеріледі?","options":["Өзгерту туралы келісімнің нысаны бастапқы шартқа сәйкес тексеріледі","Отыз күндік мерзім заңда ешбір жағдайда көзделмеген","Бас тарту жауабы немесе жауап мерзімінің аяқталуы бағаланады","Шартты бұзу ұсынысын жіберу сот үшін ешқашан маңызды емес","Екінші тараптың жауабын күтудің құқықтық мәні жоқ","Шартты өзгерту туралы келісім кез келген нысанда жасалады","Шартты өзгерту рәсімі тараптардың келісіміне тәуелді емес"],"answer":[0,2],"explanation":"ҚР АК 402-бап. Бас тарту жауабы немесе жауап мерзімінің аяқталуы бағаланады; Өзгерту туралы келісімнің нысаны бастапқы шартқа сәйкес тексеріледі. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 402-бап"}]},{"id":129,"title":"Шартты орындаудан бiржақты бас тарту.","material":"Қызмет көрсету шартында тапсырыс берушіге белгілі жағдайларда біржақты бас тарту құқығы берілген. Тапсырыс беруші тиісті хабарлама жіберді.","procedure":"Қызмет көрсету шартында тапсырыс берушіге белгілі жағдайларда біржақты бас тарту құқығы берілген. Тапсырыс беруші тиісті хабарлама жіберді.","questions":[{"num":1,"type":"single","q":"Біржақты бас тартудың заңдылығы неге тәуелді?","options":["Заңды біржақты бас тарту шарттың мазмұнын өзгерте алмайды","Шарттан біржақты бас тартуға ешқандай негіз қажет емес","Бас тарту туралы хабарлама шартқа әсер етпейді","Заң мен шарттағы негіздерге және рәсімге","Бас тарту туралы шарт талаптары ешқашан ескерілмейді","Біржақты бас тарту барлық шартта шектеусіз рұқсат етіледі"],"answer":[3],"explanation":"Біржақты бас тарту заң немесе шарт рұқсат еткен жағдайларда және тиісті рәсіммен жүзеге асырылады.","basis":"ҚР АК 404-бап"},{"num":2,"type":"multi","q":"Бас тартудың салдарын анықтау үшін не қажет?","options":["Орындалған қызметтің көлемі","Заң мен шарттағы есеп айырысу салдары","Бас тарту туралы шарт талаптары ешқашан ескерілмейді","Шарттан біржақты бас тартуға ешқандай негіз қажет емес","Біржақты бас тарту барлық шартта шектеусіз рұқсат етіледі","Бас тарту құқығының негізі","Бас тарту туралы хабарлама шартқа әсер етпейді"],"answer":[0,1,5],"explanation":"Біржақты бас тарту заң немесе шарт рұқсат еткен жағдайларда және тиісті рәсіммен жүзеге асырылады.","basis":"ҚР АК 404-бап"},{"num":3,"type":"single","q":"Осы тақырып бойынша қандай құқықтық тұжырым дұрыс?","options":["Бас тарту туралы хабарлама шартқа әсер етпейді","Біржақты бас тартуға заңда немесе шартта негіз болуы қажет","Шарттан біржақты бас тартуға ешқандай негіз қажет емес","Бас тарту туралы шарт талаптары ешқашан ескерілмейді","Заңды біржақты бас тарту шарттың мазмұнын өзгерте алмайды","Біржақты бас тарту барлық шартта шектеусіз рұқсат етіледі"],"answer":[1],"explanation":"ҚР АК 404-бап. Біржақты бас тартуға заңда немесе шартта негіз болуы қажет. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 404-бап"},{"num":4,"type":"multi","q":"Дауды шешу кезінде қандай құқықтық мән-жайлар ескеріледі?","options":["Заңды бас тарту шарттың тоқтауына немесе өзгеруіне әкелуі мүмкін","Заңды біржақты бас тарту шарттың мазмұнын өзгерте алмайды","Бас тарту туралы шарт талаптары ешқашан ескерілмейді","Бас тарту туралы хабарлау тәртібі құқықтық маңызға ие","Шарттан біржақты бас тартуға ешқандай негіз қажет емес","Бас тарту туралы хабарлама шартқа әсер етпейді","Біржақты бас тарту барлық шартта шектеусіз рұқсат етіледі"],"answer":[0,3],"explanation":"ҚР АК 404-бап. Бас тарту туралы хабарлау тәртібі құқықтық маңызға ие; Заңды бас тарту шарттың тоқтауына немесе өзгеруіне әкелуі мүмкін. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 404-бап"}]},{"id":130,"title":"Шарттың қолданылу мерзiмiн ұзарту.","material":"Тараптар қызмет көрсету шартын 31 желтоқсанға дейін жасады. Мерзім бітер алдында екі тарап жазбаша қосымша келісім жасап, оны келесі жылға ұзартты.","procedure":"Тараптар қызмет көрсету шартын 31 желтоқсанға дейін жасады. Мерзім бітер алдында екі тарап жазбаша қосымша келісім жасап, оны келесі жылға ұзартты.","questions":[{"num":1,"type":"single","q":"Мерзімді ұзартудың қандай негізі көрсетілген?","options":["Шарт мерзімін ұзарту тек сот шешімімен жүзеге асады","Автоматты ұзарту туралы ереже құқықтық мәнге ие емес","Шарт мерзімін өзгерту міндеттемелерге ешқашан әсер етпейді","Мерзім аяқталғанда барлық бұрынғы міндеттеме автоматты жойылады","Тараптардың өзара келісімі","Шарт мерзімі тараптардың келісімімен ешқашан ұзартылмайды"],"answer":[4],"explanation":"Шарттың қолданылу мерзімі заңға және шартқа сәйкес тараптардың келісімімен немесе шартта көзделген өзге тетікпен ұзартылуы мүмкін.","basis":"ҚР АК 386, 401–403-баптар"},{"num":2,"type":"multi","q":"Шарт мерзімін ұзартуды бағалауда не маңызды?","options":["Ұзарту нысанына қатысты талаптар","Қосымша келісімнің мазмұны","Бастапқы шарттағы мерзім ережесі","Мерзім аяқталғанда барлық бұрынғы міндеттеме автоматты жойылады","Шарт мерзімін өзгерту міндеттемелерге ешқашан әсер етпейді","Шарт мерзімі тараптардың келісімімен ешқашан ұзартылмайды","Автоматты ұзарту туралы ереже құқықтық мәнге ие емес"],"answer":[0,1,2],"explanation":"Шарттың қолданылу мерзімі заңға және шартқа сәйкес тараптардың келісімімен немесе шартта көзделген өзге тетікпен ұзартылуы мүмкін.","basis":"ҚР АК 386, 401–403-баптар"},{"num":3,"type":"single","q":"Осы тақырып бойынша қандай құқықтық тұжырым дұрыс?","options":["Шарт мерзімі тараптардың келісімімен ешқашан ұзартылмайды","Шарт мерзімін ұзарту тек сот шешімімен жүзеге асады","Шарт мерзімін өзгерту міндеттемелерге ешқашан әсер етпейді","Мерзім аяқталғанда барлық бұрынғы міндеттеме автоматты жойылады","Автоматты ұзарту туралы ереже құқықтық мәнге ие емес","Шарт мерзімін ұзарту туралы тараптардың келісімі ескеріледі"],"answer":[5],"explanation":"ҚР АК 386, 401–403-баптар. Шарт мерзімін ұзарту туралы тараптардың келісімі ескеріледі. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 386, 401–403-баптар"},{"num":4,"type":"multi","q":"Дауды шешу кезінде қандай құқықтық мән-жайлар ескеріледі?","options":["Ұзартудың шартта көзделген автоматты тәртібі тексеріледі","Шарт мерзімін ұзарту тек сот шешімімен жүзеге асады","Мерзім өзгерісі тараптардың міндеттемелеріне әсер етуі мүмкін","Автоматты ұзарту туралы ереже құқықтық мәнге ие емес","Мерзім аяқталғанда барлық бұрынғы міндеттеме автоматты жойылады","Шарт мерзімін өзгерту міндеттемелерге ешқашан әсер етпейді","Шарт мерзімі тараптардың келісімімен ешқашан ұзартылмайды"],"answer":[0,2],"explanation":"ҚР АК 386, 401–403-баптар. Ұзартудың шартта көзделген автоматты тәртібі тексеріледі; Мерзім өзгерісі тараптардың міндеттемелеріне әсер етуі мүмкін. Нақты шарт пен ұсынылған құжаттардың мазмұны ескеріледі.","basis":"ҚР АК 386, 401–403-баптар"}]}];let mode='quiz',responses={};const app=document.getElementById('app');
function render(){app.innerHTML='';DATA.forEach(c=>{const section=document.createElement('section');section.className='case';section.innerHTML='<h2>'+c.id+'-тақырып. '+esc(c.title)+'</h2>';section.appendChild(story('Материалдық-құқықтық фабула',c.material));c.questions.slice(0,2).forEach(q=>section.appendChild(question(c.id,q)));section.appendChild(story('Процестік фабула',c.procedure));c.questions.slice(2).forEach(q=>section.appendChild(question(c.id,q)));app.appendChild(section)});if(mode==='test'){const b=document.createElement('button');b.className='primary';b.textContent='Нәтижені көрсету';b.onclick=showResults;app.appendChild(b)}}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function story(label,content){const el=document.createElement('div');el.className='story';el.innerHTML='<strong>'+label+'</strong>'+esc(content);return el}
function key(id,q){return id+'-'+q.num}
function question(id,q){const el=document.createElement('div');el.className='q';el.id='q-'+key(id,q);el.innerHTML='<h3>'+q.num+'. '+esc(q.q)+'</h3><div class="hint">'+(q.type==='single'?'Бір дұрыс жауап':'Бірнеше дұрыс жауап (ең көбі 3)')+'</div>';q.options.forEach((o,i)=>{const lab=document.createElement('label');lab.className='opt';lab.innerHTML='<input type="'+(q.type==='single'?'radio':'checkbox')+'" name="'+key(id,q)+'" value="'+i+'"><span><b>'+String.fromCharCode(65+i)+')</b> '+esc(o)+'</span>';lab.querySelector('input').onchange=ev=>{if(q.type==='multi'){const checked=el.querySelectorAll('input:checked');if(checked.length>3){ev.target.checked=false;return}}};el.appendChild(lab)});if(mode==='quiz'){const b=document.createElement('button');b.textContent='Тексеру';b.onclick=()=>check(id,q,el);el.appendChild(b)}return el}
function selected(el){return [...el.querySelectorAll('input:checked')].map(e=>+e.value).sort((a,b)=>a-b)}
function check(id,q,el){const got=selected(el);if(!got.length)return;const good=JSON.stringify(got)===JSON.stringify(q.answer);el.querySelectorAll('.opt').forEach((lab,i)=>{if(q.answer.includes(i))lab.classList.add('correct');else if(got.includes(i))lab.classList.add('wrong')});el.querySelectorAll('input').forEach(x=>x.disabled=true);const b=el.querySelector('button');if(b)b.disabled=true;const box=document.createElement('div');box.className='feedback '+(good?'good':'bad');box.innerHTML='<strong>'+(good?'Дұрыс!':'Қате жауап')+'</strong><div>Дұрыс жауап: '+q.answer.map(i=>String.fromCharCode(65+i)).join(', ')+'</div><div>'+esc(q.explanation)+'</div><div class="small">'+esc(q.basis)+'</div>';el.appendChild(box);responses[key(id,q)]=good}
function showResults(){let total=0,good=0;DATA.forEach(c=>c.questions.forEach(q=>{total++;const el=document.getElementById('q-'+key(c.id,q));const got=selected(el);const ok=JSON.stringify(got)===JSON.stringify(q.answer);if(ok)good++;el.querySelectorAll('.opt').forEach((lab,i)=>{if(q.answer.includes(i))lab.classList.add('correct');else if(got.includes(i))lab.classList.add('wrong')});el.querySelectorAll('input').forEach(x=>x.disabled=true);const feedback=document.createElement('div');feedback.className='feedback '+(ok?'good':'bad');feedback.innerHTML='<strong>Дұрыс жауап: '+q.answer.map(i=>String.fromCharCode(65+i)).join(', ')+'</strong><div>'+esc(q.explanation)+'</div><div class="small">'+esc(q.basis)+'</div>';el.appendChild(feedback)}));const s=document.createElement('div');s.className='score';s.textContent='Нәтиже: '+good+' / '+total;app.appendChild(s);const b=app.querySelector('button.primary');if(b)b.disabled=true}
function setMode(m){mode=m;responses={};document.getElementById('quiz').classList.toggle('active',m==='quiz');document.getElementById('test').classList.toggle('active',m==='test');render()}document.getElementById('quiz').onclick=()=>setMode('quiz');document.getElementById('test').onclick=()=>setMode('test');document.getElementById('reset').onclick=()=>setMode(mode);render();
</script></body></html>
