const DATA=[{"id":1,"title":"Азаматтық құқық ғылым құқық саласы, ғылым және оқу пәні ретінде","material":"«Арна» ЖШС мен «Самал» ЖШС кеңсе жабдығын жеткізу туралы жазбаша шарт жасасты. «Арна» жабдықты шартта белгіленген күні берді, оны қабылдау актісіне екі тарап та қол қойды. «Самал» шартта көрсетілген төлем мерзімі өткеннен кейін де 2 400 000 теңгені төлемеді. Тараптар арасында бағыныстылық қатынасы жоқ. «Самал» өкілі «мұндай дауды компаниялардың ішкі тәртіп ережелері бойынша шешу қажет» деп мәлімдеді. «Арна» заңгері дауды ғылыми мақалалармен емес, қолданыстағы азаматтық құқық нормаларымен шешуді ұсынды.","procedure":"«Арна» ЖШС берешекті өндіріп алу туралы азаматтық талап қою берді. Талапқа шарттың көшірмесін, жабдықты қабылдау актісін және төлем мерзімінің өткенін көрсететін құжаттарды қосты. «Самал» қабылдау актісіне қойылған қолдың өзіне тиесілі екенін жоққа шығармайды, бірақ төлем жасағанын дәлелдейтін құжат ұсынбай, тек компанияның ішкі ережесіне сілтеме жасайды. Сот тараптарға талаптары мен қарсылықтарының негіздерін дәлелдеуді түсіндірді.","questions":[{"num":1,"type":"single","q":"«Арна» заңгері даудың құқықтық табиғатын қалай саралауы керек?","options":["Қызметкерлердің тәртіптік жауаптылығы туралы еңбек дауы ретінде","Тараптардың теңдігіне негізделген шарттық мүліктік қатынас ретінде","Мемлекеттік органның өкімін орындау туралы әкімшілік дау ретінде","Заңды тұлғаның құрылтай құжаттарын тіркеу туралы дау ретінде","Бюджетке міндетті төлемді өндіріп алу туралы жария-құқықтық дау ретінде","Корпоративтік органның мүшелігін тоқтату туралы ішкі дау ретінде"],"answer":[1],"explanation":"Тауар беру мен оның ақысын төлеу жөніндегі міндеттемелер заңды тұлғалар арасындағы теңдікке негізделген мүліктік қатынас болып табылады. Ғылыми пікір құқықтық талдауға көмектесуі мүмкін, бірақ қолданыстағы заңның орнына жүрмейді.","basis":"ҚР АК (Жалпы бөлім), 1 және 2-баптар."},{"num":2,"type":"multi","q":"Заңгер құқық саласы, құқық ғылымы және оқу пәнінің рөлін ажыратқанда қай тұжырымдарды қолдана алады?","options":["Ғылыми мақала тараптардың келісімінсіз жаңа төлем міндетін белгілейді","Азаматтық құқық нормалары мүліктік қатынасты құқықтық реттейді","Оқу бағдарламасы нақты дауда соттың шешімін алмастырады","Азаматтық құқық ғылымы нормалар мен тәжірибені зерттеп, талдайды","Оқу пәні азаматтық құқық институттарын жүйелі түрде меңгертеді","Ғылыми қорытынды шартты сот қарауынсыз жарамсыз етеді","Компанияның ішкі нұсқаулығы азаматтық кодекстің күшін жояды"],"answer":[1,3,4],"explanation":"Құқық саласы міндетті нормалар жүйесін, ғылым зерттеу қызметін, оқу пәні білімді меңгеру мазмұнын білдіреді. Бұл үш рөлді шатастыру құқықтық саралауға әкелмейді.","basis":"ҚР АК, 1 және 2-баптар; ғылым мен оқу пәнінің арақатынасы - құқық теориясының түсіндірмесі."},{"num":3,"type":"single","q":"Сот дәлелдеу міндетін қалай бөлуі тиіс?","options":["Талап қоюшы барлық қарсылықтың негізін де өзі дәлелдеуге міндетті","Жауапкердің ішкі ережесі ұсынылса, талап автоматты түрде қабылданбайды","Әр тарап өзі сілтеме жасайтын талаптар мен қарсылықтардың негізін дәлелдейді","Жауапкер талапқа қарсы шыққаннан кейін талап қоюшы дәлел ұсынбайды","Қол қойылған қабылдау актісі болса, сот дәлелдемелерді бағаламайды","Тараптардың біреуі келіспесе, сот жазбаша дәлелдемелерді зерттемейді"],"answer":[2],"explanation":"Әр тарап өзінің талаптары мен қарсылықтарының негізі ретінде көрсеткен мән-жайларын дәлелдеуі керек; сот дәлелдемелерді жиынтығында бағалайды.","basis":"ҚР АПК, 68 және 72-баптар."},{"num":4,"type":"multi","q":"Осы дауда сот дәлелдемелерді зерттегенде қандай әрекеттер процессуалдық тұрғыдан орынды?","options":["Шарт пен қабылдау актісінің іске қатыстылығын бағалау","Тараптардың бірінің ғылыми пікірін міндетті сот актісі деп тану","Төлем жасалғанын растайтын құжаттың бар-жоғын анықтау","Жауапкердің ішкі ережесін заңнан жоғары міндетті акт деп қолдану","Тараптар ұсынған дәлелдемелердің анықтығы мен жеткіліктілігін бағалау","Қол қойылған актіге байланысты барлық өзге дәлелдемені қабылдамау","Төлем жасалғанын жауапкер мәлімдесе де, оны дәлелдеуден босату","Дәлелдемелерді тараптардың процессуалдық мәртебесіне қарай автоматты қабылдау"],"answer":[0,2,4],"explanation":"Сот дәлелдемелердің қатыстылығын, анықтығын және жеткіліктілігін бағалайды; тараптар өздері сілтеме жасаған фактілерді негіздеуі керек. Процестік сұрақтар материалдық фабуладағы шарттық берешекке тікелей байланысты.","basis":"ҚР АПК, 68, 72 және 73-баптар."}]},{"id":2,"title":"Азаматтық-құқықтық реттеудің пәні","material":"«Жайық» ЖШС «Дарын» ЖШС-ге өндірістік жабдықты 3 600 000 теңгеге сатты. Тараптар жазбаша шарт жасасты, жабдық сатып алушыға қабылдау-тапсыру актісімен берілді. Шарт бойынша сатып алушы ақыны жабдық берілген күннен бастап он күн ішінде төлеуге міндеттенді. «Дарын» төлемді жасамады. Сонымен қатар «Дарын» қызметкері жабдықты қабылдаған кезде сатушы компания директорының жеке беделіне нұқсан келтіретін, шындыққа сәйкес келмейтін мәліметті ашық таратты. «Жайық» ЖШС жабдық үшін төлемді өндіріп алуды, ал директор өз атынан ар-намысы мен қадір-қасиетін қорғауды талап етпек. Бұл талаптардың құқықтық табиғатын бөлек бағалау қажет.","procedure":"«Жайық» ЖШС жабдық ақысын өндіріп алу туралы талап қою арызын сотқа берді. Арызға сатып алу-сату шартын, қабылдау-тапсыру актісін және төлем мерзімін көрсететін құжатты қосты. «Дарын» ЖШС төлемді қолма-қол жасағанын мәлімдеді, бірақ әзірге растайтын құжат ұсынбады. Директор өзінің жеке беделін қорғау талабын компанияның төлем туралы талабынан бөлек қоюды жоспарлап отыр. Сот жабдық ақысын төлеу фактісіне қатысты тараптардың дәлелдемелерін зерттейді.","questions":[{"num":1,"type":"single","q":"«Жайық» ЖШС-нің жабдық ақысын өндіріп алу туралы талабын қалай саралау керек?","options":["Тараптардың теңдігіне негізделген шарттық мүліктік талап ретінде","Жұмыс берушінің қызметкерге қолданатын тәртіптік шарасы ретінде","Мемлекеттік органның міндетті өкіміне байланысты жария дау ретінде","Кәсіпорынның ішкі басқару органдары арасындағы корпоративтік дау ретінде","Бюджетке міндетті төлемді өндіріп алу туралы салықтық талап ретінде","Қызметкерді лауазымынан босату туралы жеке еңбек дауы ретінде"],"answer":[0],"explanation":"Сатып алу-сату шарты бойынша тауардың ақысын төлеу міндеті тараптардың теңдігіне негізделген мүліктік қатынасқа жатады. Бұл азаматтық құқық реттейтін қатынастардың негізгі түрі.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), 1-бап."},{"num":2,"type":"multi","q":"Берілген жағдайдағы азаматтық-құқықтық реттеудің пәніне қатысты қандай тұжырымдар дұрыс?","options":["Тауар ақысын төлеу міндеті шарттан туындайтын мүліктік қатынасқа жатады","Директордың ар-намысы мен қадір-қасиетін қорғау мүліктік емес жеке құқыққа қатысты","Компанияның ішкі жұмыс тәртібі барлық азаматтық талаптардың құқықтық негізін алмастырады","Шарт жасасқан екі заңды тұлғаның қатынасы қызметтік бағыныстылыққа міндетті түрде негізделеді","Сатушының төлем туралы талабы мен директордың жеке талабы құқықтық тұрғыдан ажыратылады","Жеке беделге қатысты талап әрқашан сатып алу-сату шартының бағасына қосылады","Тауар берілген соң азаматтық-құқықтық міндеттеменің орындалуын талап ету мүмкіндігі жойылады"],"answer":[0,1,4],"explanation":"Азаматтық құқық мүліктік қатынастарды және заңда көзделген жеке мүліктік емес қатынастарды реттейді. Заңды тұлғаның шарттық талабы мен жеке адамның ар-намысын қорғау талабы әртүрлі құқықтық объектілерге қатысты.","basis":"ҚР АК (Жалпы бөлім), 1 және 9-баптар; жеке мүліктік емес игіліктерді қорғауға қатысты нормалар."},{"num":3,"type":"single","q":"«Дарын» ЖШС төлем жасалғанын қарсылық негізі ретінде көрсетсе, процестік тұрғыдан қандай әрекет жасауы керек?","options":["Төлем туралы мәлімдемені дәлелсіз қалдырып, қарсы тараптың мойындауын күту","Төлемнің жасалғанын растайтын дәлелдемелерді сотқа ұсыну","Сатып алу-сату шартының пәнін әкімшілік шешіммен қайта анықтау","Қабылдау-тапсыру актісін сот зерттемей тұрып жарамсыз деп жариялау","Компанияның ішкі хаттамасын заңның орнына міндетті түрде қолдану","Талап қоюшының барлық құжаттарын өз қарсылығына қарамастан жоққа шығару"],"answer":[1],"explanation":"Тарап өз талаптары мен қарсылықтарының негізіне сілтеме жасайтын мән-жайларды дәлелдеуге тиіс. Төлем жасалды деген қарсылық тиісті дәлелдемемен негізделеді.","basis":"ҚР Азаматтық процестік кодексі, дәлелдеу міндеті мен дәлелдемелерге қатысты нормалар."},{"num":4,"type":"multi","q":"Жабдық ақысын өндіріп алу туралы істі қарағанда сот қандай мән-жайларды анықтауға және бағалауға тиіс?","options":["Жазбаша шарттың жасалғанын және онда төлем міндетінің көзделгенін","Жабдықтың қабылдау-тапсыру актісімен берілгенін","Сатып алушының төлем жасады деген уәжін растайтын дәлелдемелерді","Директордың жеке беделі туралы мәліметті төлемнің автоматты дәлелі ретінде","Компанияның ішкі ережесін азаматтық шарттың міндетті заңдық алмастырушысы ретінде","Тараптардың ұйымдық бағыныстылығын төлем міндетінің міндетті шарты ретінде","Талап қойылған сәттен бастап қабылдау актісінің заңдық күшінің жойылғанын","Тауар бағасының орнына қызметкердің еңбек тәртібі туралы ережені"],"answer":[0,1,2],"explanation":"Төлем туралы дауда шарттың мазмұны, тауардың берілгені және төлемнің орындалған-орындалмағаны маңызды. Директордың жеке мүліктік емес талабы бұл шарттық міндеттемені дәлелдеудің орнына жүрмейді.","basis":"ҚР АК (Жалпы бөлім), 1-бап; ҚР АПК, дәлелдемелерді зерттеу және бағалау жөніндегі нормалар."}]},{"id":3,"title":"Азаматтық-құқықтық қатынастарды реттеу әдістері","material":"«Алатау» ЖШС мен «Сарыарқа» ЖШС 2026 жылғы 5 қазанда кеңсе жиһазын жеткізу туралы шарт жасасты. Шартта жиһаздың бағасы 1 800 000 теңге, жеткізу күні 20 қазан, төлем мерзімі жеткізілгеннен кейін бес күн деп белгіленді. Жеткізуші жиһазды 20 қазанда тапсырды, ал сатып алушы оны актімен қабылдады. 25 қазанда сатып алушы төлем жасамады және өз директорларының ішкі бұйрығымен шарт бағасын 1 200 000 теңгеге түсіргенін хабарлады. Жеткізуші бағаның өзгеруіне келісім берген жоқ. Шартта бағаны біржақты өзгерту құқығы көзделмеген.","procedure":"«Алатау» ЖШС шартта көрсетілген 1 800 000 теңгені өндіріп алу туралы сотқа талап қойды. Талапқа шартты, қабылдау актісін және төлемді талап еткен хатты тіркеді. «Сарыарқа» ЖШС ішкі бұйрықтың көшірмесін ұсынып, шарт бағасы төмендеді деп қарсылық білдірді. Сот шарт талаптарын, тараптардың келісімін және берешектің орындалуына қатысты дәлелдемелерді зерттеуге кірісті.","questions":[{"num":1,"type":"single","q":"Сатып алушының ішкі бұйрығына байланысты жеткізуші қандай құқықтық ұстаным таңдауы керек?","options":["Баға өзгермегенін негіздеп, шарттағы төлемді талап ету","Ішкі бұйрықты екі тараптың келісімі ретінде қабылдау","Директор бұйрығын шартқа қосымша келісім деп тану","Төлем мөлшерін сатып алушының есебіне сай өзгерту","Жеткізу актісін бағаны өзгертуге берілген келісім деу","Ішкі бұйрықты жеткізуші үшін міндетті шарт санау"],"answer":[0],"explanation":"Азаматтық-құқықтық реттеу тараптардың заңдық теңдігі мен ерік дербестігіне негізделеді. Бір тараптың ішкі бұйрығы екінші тараппен жасалған шарттың бағасын өздігінен өзгертпейді.","basis":"ҚР АК (Жалпы бөлім), 2, 272 және 273-баптар; шартты өзгерту туралы ережелер."},{"num":2,"type":"multi","q":"Осы дауды шешуде азаматтық-құқықтық реттеу әдісінің қандай белгілерін ескеру қажет?","options":["Тараптардың шарт жасасудағы заңдық теңдігін","Шарт талаптарын келісім арқылы белгілеу мүмкіндігін","Міндеттемені тиісті түрде орындау қажеттігін","Сатып алушы бұйрығының сатушыға билік жүргізу күшін","Шарт бағасын бір тараптың ішкі актісімен ауыстыруды","Шарттағы төлемді қызметтік тәртіптік жаза деп тануды","Жеткізушінің еркін сатып алушы нұсқауына бағындыруды"],"answer":[0,1,2],"explanation":"Азаматтық құқықта тараптар заңдық жағынан тең, мүліктік дербес және шарттық қатынастарды өз еркімен қалыптастырады. Шарттан туған міндеттеме тиісті түрде орындалуы тиіс.","basis":"ҚР АК (Жалпы бөлім), 2, 272 және 273-баптар."},{"num":3,"type":"single","q":"Сатып алушы бағаның төмендегенін ішкі бұйрықпен дәлелдесе, сот ең алдымен нені тексеруі керек?","options":["Тараптардың шарт бағасын өзгертуге келісім берген-бермегенін","Сатып алушы директорының бұйрықты кімге жібергенін","Жеткізуші кеңсесінде ішкі бұйрық тіркелген-тіркелмегенін","Сатып алушының ұйымдық құрылымында бөлім саны қанша екенін","Бұйрықтың қызметкерлерге қай күні жарияланғанын","Жеткізушінің өз ішкі нұсқаулығын қашан жаңартқанын"],"answer":[0],"explanation":"Даудың мәні - шарт бағасының тараптар үшін заңды түрде өзгерген-өзгермегені. Ішкі бұйрықтың болуы шартты өзгерту жөніндегі тараптар келісімін өздігінен дәлелдемейді.","basis":"ҚР АК, міндеттемені орындау және шартты өзгерту нормалары; ҚР АПК, дәлелдеу мен дәлелдемелерді бағалау нормалары."},{"num":4,"type":"multi","q":"Сот шарттық берешек туралы дауды қарағанда қандай мән-жайларды анықтауы тиіс?","options":["Шартта бастапқы бағаның қалай белгіленгенін","Жиһаздың акт бойынша берілген-берілмегенін","Бағаны өзгертуге екі тарап келіскен-келіспегенін","Сатып алушының ішкі бұйрығы заңды автоматты ауыстырғанын","Жеткізушінің талап қою құқығы бұйрықпен жойылғанын","Сатып алушы директорының лауазымдық нұсқаулығы шартқа тең екенін","Ішкі бұйрықтың өзі төлем жасалғанын толық растайтынын","Төлемді кешіктіру тек еңбек тәртібімен реттелетінін"],"answer":[0,1,2],"explanation":"Сот талап пен қарсылық үшін маңызды шартты, тауардың берілуін және бағаны өзгерту жөніндегі келісімнің бар-жоғын зерттейді. Әр тарап өзі сілтеме жасайтын мән-жайларды дәлелдейді.","basis":"ҚР АК, 272, 273-баптар; ҚР АПК, 72 және 73-баптар."}]},{"id":4,"title":"Азаматтық құқықтың негізгі қағидаттары","material":"2026 жылғы 10 қыркүйекте «Бәйтерек» ЖШС «Өркен» ЖШС-мен 4 500 000 теңгеге өндірістік жабдық жеткізу туралы жазбаша шарт жасасты. Жеткізу мерзімі 1 қазан, төлем мерзімі жабдық қабылданғаннан кейін 10 күн деп белгіленді. «Бәйтерек» жабдықты уақытында берді, «Өркен» оны ескертусіз қабылдап, актіге қол қойды. Төлем мерзімі өткеннен кейін «Өркен» төлемнен бас тартты: оның директоры сатушының басқа жеткізушілермен жұмыс істегеніне наразы екенін мәлімдеді. Шартта сатып алушыға осы негіз бойынша төлемнен бас тарту құқығы берілмеген. Сатушы шарт бойынша ақыны талап етті.","procedure":"«Бәйтерек» ЖШС сотқа шарттық берешекті өндіріп алу туралы талап қою арызын берді. Сатушы шартты, қабылдау-тапсыру актісін және төлемді талап ету туралы хатты ұсынды. Сатып алушы шарт пен актідегі қолдарды мойындады, бірақ директордың сатушыға наразылығын және өз ішкі саясатын қарсылық негізі ретінде көрсетті. Сот тараптардың дәлелдерін қарап, төлем міндетінің орындалғанын немесе оны орындамаудың заңды негізі барын анықтауы қажет.","questions":[{"num":1,"type":"single","q":"Сатушы азаматтық құқық қағидаттарына сүйеніп қандай шешімді негіздей алады?","options":["Сатып алушының ішкі наразылығына қарамастан шарттағы төлемді талап ету","Сатып алушының ішкі саясатын шарттың жаңа талабы ретінде қабылдау","Директордың наразылығын шартты тоқтататын өзара келісім деп есептеу","Сатушының өзге серіктестері болғандықтан төлем талабынан бас тарту","Сатып алушының ауызша қарсылығын шарт бағасының өзгеруі деп тану","Сатушының іскерлік таңдауы төлем міндетін өздігінен тоқтатады деп санау"],"answer":[0],"explanation":"Азаматтық құқық қатысушылардың теңдігіне, шарт еркіндігіне, құқықтарды кедергісіз жүзеге асыруға және бұзылған құқықтарды қорғауға негізделеді. Тараптың жеке наразылығы шарттағы төлем міндетін өздігінен жоймайды.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), 2-бап; міндеттемені тиісінше орындау туралы 272–273-баптар."},{"num":2,"type":"multi","q":"Осы шарттық дауда азаматтық құқықтың қандай негізгі қағидаттары маңызды?","options":["Тараптардың азаматтық-құқықтық теңдігі","Шарт жасасу және контрагентті таңдау еркіндігі","Бұзылған азаматтық құқықтарды сот арқылы қорғау","Сатып алушының ішкі саясатының сатушыға биліктік күші","Тараптың жеке наразылығымен міндеттемені біржақты тоқтату","Шарт талаптарын директордың бұйрығымен міндетті өзгерту","Келісім болмаған кезде сатып алушыға артықшылық беру"],"answer":[0,1,2],"explanation":"Азаматтық заңнама тараптардың теңдігін, шарт еркіндігін және құқықтарды қорғауды таниды. Бір тарап екінші тарапқа ішкі басқару шешімдерін міндетті етіп таңбайды.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), 2 және 9-баптар."},{"num":3,"type":"single","q":"Сатып алушы төлемнен босатылғанын мәлімдесе, сот дәлелдеу міндетін қалай бөлуі керек?","options":["Әр тарап өз талабы мен қарсылығына негіз еткен мән-жайларды дәлелдеуі тиіс","Сатушы сатып алушының барлық ішкі шешімдерінің заңдылығын дәлелдеуі тиіс","Сатып алушы шартқа қол қойғандықтан ешбір қарсылығын дәлелдеуге міндетті емес","Сот тараптар ұсынған құжаттарды зерттемей ішкі саясатқа басымдық беруі тиіс","Сатып алушы наразылығын айтқандықтан төлем жасалған деп есептелуі тиіс","Сатушы шартты ұсынғандықтан жауапкердің қарсылығы автоматты дәлелденеді"],"answer":[0],"explanation":"Азаматтық процесте әр тарап өзі сілтеме жасайтын талаптар мен қарсылықтардың негізіндегі мән-жайларды дәлелдейді. Қарсылықты жай мәлімдеу оны дәлелденген факт етпейді.","basis":"ҚР Азаматтық процестік кодексі, 72-бап (дәлелдеу міндеті)."},{"num":4,"type":"multi","q":"Сот берешекті өндіріп алу туралы істі шешу үшін қандай дәлелдемелер мен мән-жайларды бағалауы қажет?","options":["Шарттағы баға мен төлем мерзімін растайтын талаптарды","Жабдықтың берілгенін растайтын қабылдау-тапсыру актісін","Төлем жасалғаны не міндеттеменің тоқтағаны жөніндегі дәлелдерді","Сатып алушы директорының сатушыға жеке көзқарасын төлем құжаты ретінде","Компанияның ішкі саясатын шартқа жасалған қосымша келісімнің орнына","Сатушының басқа серіктестерін төлемнен босатудың жеткілікті негізі ретінде","Қызметкердің ауызша пікірін шартты өзгерткен екіжақты келісім ретінде","Сатып алушының наразылығын міндеттеменің орындалғанын растайтын акт ретінде"],"answer":[0,1,2],"explanation":"Сот талапқа қатысты шарттың мазмұнын, тауардың берілгенін және міндеттеменің орындалуы немесе тоқтатылуы жөніндегі дәлелдерді бағалайды. Ішкі наразылық төлемнің жасалғанын дәлелдемейді.","basis":"ҚР Азаматтық процестік кодексі, дәлелдемелер мен дәлелдеу туралы нормалар; ҚР АК, 272–273-баптар."}]},{"id":5,"title":"Азаматтық құқық қайнар көздері және оның нормаларының әрекет етуі","material":"«Алтын» ЖШС мен «Нұр» ЖШС 2026 жылғы 3 қыркүйекте жабдық жеткізу шартын жасады. Шартта төлем мерзімі 15 қазан деп көрсетілді. Сатып алушы мерзімінде төлем жасамады. Жауапкер өзінің ішкі ережесінде төлемді кейінге қалдыруға рұқсат берілгенін және министрліктің түсіндірме хатын шарттан жоғары қою керегін мәлімдеді. Тараптар шартты өзгерту туралы қосымша келісім жасамаған.","procedure":"Жеткізуші сотқа берешекті өндіріп алу туралы талап қойды. Сотқа шарт, жеткізу актісі, төлем талап етілген хат және жауапкердің ішкі ережесі ұсынылды. Жауапкер министрлік хатын ұсынды, бірақ оның нормативтік құқықтық акт екендігін көрсететін дерек жоқ.","questions":[{"num":1,"type":"single","q":"Берілген материалдық-құқықтық жағдайда қандай шешім дұрыс?","options":["Шартты тараптардың келісімінсіз күшін жойған деп таниды","Жауапкердің біржақты түсіндірмесін шартқа енгізеді","Сот құқықтық норманы таңдағанда қандай ұстанымды негізге алады?","Қолданыстағы азаматтық заңнаманың міндетті нормаларын қолданады","Министрліктің кез келген хатын заңның орнына қолданады","Берешекті ұйымның ішкі тәртібі бойынша ғана шешеді","Компанияның ішкі ережесін кодекстен жоғары қояды"],"answer":[2],"explanation":"Бұл жауап берілген фабуладағы шарттық құқықтар мен міндеттерді және қолданылатын заң талаптарын ескереді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті нормалар."},{"num":2,"type":"multi","q":"Қандай құжаттар дауды шешуде құқықтық маңызға ие болуы мүмкін?","options":["Ішкі бұйрықтың барлық контрагентке міндетті күші","Тараптың ауызша пікірімен заңның күшін жою","Кез келген түсіндірме хаттың кодекстен жоғары күші","Қолданыстағы азаматтық заңнаманың тиісті нормалары","Шарт талаптарын өзгерткен заңды қосымша келісім","Компанияның нормативтік күші жоқ ішкі хабарламасы","Тараптар жасасқан жазбаша жеткізу шарты"],"answer":[3,4,6],"explanation":"Бұл жауап берілген фабуладағы шарттық құқықтар мен міндеттерді және қолданылатын заң талаптарын ескереді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті нормалар."},{"num":3,"type":"single","q":"Берілген процестік жағдайда сот қандай әрекет жасауы тиіс?","options":["Хат бар болғандықтан талап қоюды тоқтатады","Жауапкердің пікірін нормативтік түсіндірме деп алады","Хаттың құқықтық мәртебесі мен қолданылу мүмкіндігін тексереді","Ішкі құжатты міндетті сот актісі деп есептейді","Сот жауапкердің министрлік хатына сілтемесін қалай бағалауы керек?","Хаттың мазмұнын тараптар келісімінен жоғары қояды","Хатты дәлелдемелерді зерттемей заң деп таниды"],"answer":[4],"explanation":"Процесте сот іске қатысты мән-жайларды анықтап, тараптар ұсынған дәлелдемелерді бағалайды.","basis":"ҚР Азаматтық процестік кодексі, дәлелдеу және дәлелдемелер туралы нормалар."},{"num":4,"type":"multi","q":"Сот қандай мән-жайларды анықтауға тиіс?","options":["Шарт бағасының министрлік хатпен өзгергенін","Төлем мерзімінің өтіп, ақының төленбегенін","Төлем міндетінің шартта көзделгенін","Жауапкердің ішкі ережесі төлемді тоқтатқанын","Жабдықтың шарт бойынша тапсырылғанын","Тараптардың бірі сот актісін өзі шығарғанын","Компания хатының кодексті автоматты өзгерткенін"],"answer":[1,2,4],"explanation":"Процесте сот іске қатысты мән-жайларды анықтап, тараптар ұсынған дәлелдемелерді бағалайды.","basis":"ҚР Азаматтық процестік кодексі, дәлелдеу және дәлелдемелер туралы нормалар."}]},{"id":6,"title":"ҚР азаматтық заңнамасы: түсінігі мен жүйесі","material":"«Болашақ» ЖШС «Қазына» ЖШС-мен қойма жабдығын сату туралы шарт жасады. Жабдық тапсырылды, алайда сатып алушы ақы төлемеді. Ол ұйымның ішкі регламенті шарттың орындалу тәртібін өзгертеді деп мәлімдеді. Шартта мұндай өзгерту құқығы берілмеген, қосымша келісім жасалмаған.","procedure":"Сатушы сотқа жүгініп, шарт пен қабылдау актісін ұсынды. Сатып алушы ішкі регламентті қоса берді. Сот дауға қолданылатын азаматтық заңнаманың жүйесін және шарт талаптарын салыстырып, төлем міндетін анықтайды.","questions":[{"num":1,"type":"single","q":"Берілген материалдық-құқықтық жағдайда қандай шешім дұрыс?","options":["Тараптар қол қоймаған шарт жобасының талаптары","Компанияның бұрынғы коммерциялық ұсыныстары","Жеткізушінің басқа клиенттермен жасаған келісімдері","Сатып алушының кеңсе қызметкерлерінің нұсқаулығы","Қандай құқықтық негіз бірінші кезекте тексеріледі?","ҚР азаматтық заңнамасының қолданылатын нормалары мен шарт","Сатып алушының ішкі регламенті мен қызметтік бұйрығы"],"answer":[4],"explanation":"Бұл жауап берілген фабуладағы шарттық құқықтар мен міндеттерді және қолданылатын заң талаптарын ескереді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті нормалар."},{"num":2,"type":"multi","q":"Азаматтық заңнаманы қолдануда қандай тұжырымдар дұрыс?","options":["Заңға сәйкес қабылданған нормативтік актілер қолданылуы мүмкін","Ішкі регламент барлық заң талаптарының орнын басады","Азаматтық кодекс азаматтық заңнама жүйесінде маңызды орын алады","Шарт талаптары міндетті заң нормаларына қайшы келмеуге тиіс","Компанияның пікірі азаматтық кодекстің күшін жояды","Әрбір қызметтік хат нормативтік заң ретінде қолданылады","Шарттың болмауы кез келген міндеттемені растайды"],"answer":[0,2,3],"explanation":"Бұл жауап берілген фабуладағы шарттық құқықтар мен міндеттерді және қолданылатын заң талаптарын ескереді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті нормалар."},{"num":3,"type":"single","q":"Берілген процестік жағдайда сот қандай әрекет жасауы тиіс?","options":["Оны барлық контрагент үшін міндетті заң деп таниды","Сот сатып алушының ішкі регламентін қалай бағалауы тиіс?","Оның бар болуы төлемнің жасалғанын дәлелдейді","Ол шартты өздігінен өзгерткен деп есептейді","Оны қабылдау актісінен жоғары қояды","Ол талап қою құқығын автоматты тоқтатады","Оның шартқа және қолданылатын заңға қатыстылығын анықтайды"],"answer":[1],"explanation":"Процесте сот іске қатысты мән-жайларды анықтап, тараптар ұсынған дәлелдемелерді бағалайды.","basis":"ҚР Азаматтық процестік кодексі, дәлелдеу және дәлелдемелер туралы нормалар."},{"num":4,"type":"multi","q":"Істі шешу үшін қандай деректер маңызды?","options":["Ішкі регламенттің шартты өздігінен бұзуы","Компанияның атауының төлемге тікелей әсері","Жазбаша шарттың мазмұны мен бағасы","Төлемді растайтын не жоққа шығаратын дәлелдер","Жабдықтың қабылдау актісімен берілгені","Жауапкердің жарнамалық материалдарының көлемі","Кеңсе қызметкерлерінің жеке көзқарасы"],"answer":[2,3,4],"explanation":"Процесте сот іске қатысты мән-жайларды анықтап, тараптар ұсынған дәлелдемелерді бағалайды.","basis":"ҚР Азаматтық процестік кодексі, дәлелдеу және дәлелдемелер туралы нормалар."}]},{"id":7,"title":"Азаматтық заңдардың уақытқа, кеңістікке және тұлғалар шеңбері бойынша қолданылуы","material":"Екі қазақстандық компания 2026 жылғы қаңтарда қызмет көрсету шартын жасасты. Қызмет наурызда толық көрсетілді, бірақ ақы төленбеді. Қыркүйекте тараптардың бірі жаңа заң нормасы күшіне енгенін айтып, ол бұрын орындалған қызмет бойынша төлем міндетін автоматты түрде жояды деді. Жаңа нормада кері күш туралы ереже көрсетілмеген.","procedure":"Орындаушы сотқа берешек туралы талап берді. Сот шарттың жасалуын, қызметтің орындалуын, төлем мерзімін және жауапкер сілтеме жасаған норманың күшіне ену уақытын зерттейді.","questions":[{"num":1,"type":"single","q":"Берілген материалдық-құқықтық жағдайда қандай шешім дұрыс?","options":["Жаңа заңның барлық шартты автоматты жоятынын қабылдау","Компанияның ішкі хаттамасымен заңның уақытын белгілеу","Жаңа норманың бұрынғы қатынасқа ықпалын қалай анықтау керек?","Шарт жасалған күнді елемей жаңа талапты таңдау","Заңның күшіне енуі мен кері күші туралы ережелерді тексеру","Кез келген жаңа норманы өткен кезеңге міндетті қолдану","Жауапкердің пікірін заңның күшіне ену күні деп алу"],"answer":[2],"explanation":"Бұл жауап берілген фабуладағы шарттық құқықтар мен міндеттерді және қолданылатын заң талаптарын ескереді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті нормалар."},{"num":2,"type":"multi","q":"Норманың қолданылуын бағалауда қандай факторлар маңызды?","options":["Шарттық қатынас пайда болған уақыт","Тараптың жаңа заңды ұнату деңгейі","Тиісті норманың күшіне енген күні","Заң күшін компанияның ауызша келісімімен өзгерту","Компания қызметкерлерінің орташа еңбек өтілі","Кері күшке қатысты заңдағы арнайы ережелер","Жауапкердің бұрынғы жарнамалық саясаты"],"answer":[0,2,5],"explanation":"Бұл жауап берілген фабуладағы шарттық құқықтар мен міндеттерді және қолданылатын заң талаптарын ескереді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті нормалар."},{"num":3,"type":"single","q":"Берілген процестік жағдайда сот қандай әрекет жасауы тиіс?","options":["Орындаушының құжаттарын қараусыз қалдырады","Төлемді жауапкердің мәлімдемесімен дәлелденді деп таниды","Талап пен қарсылық үшін маңызды фактілерді анықтайды","Сот төлем туралы дауда алдымен қандай процессуалдық әрекет жасайды?","Тараптың түсіндірмесін нормативтік акт деп таниды","Кез келген жаңа заңға сүйеніп талапты қайтаруға міндеттенеді","Шарттың бар-жоғын зерттемей шешім қабылдайды"],"answer":[3],"explanation":"Процесте сот іске қатысты мән-жайларды анықтап, тараптар ұсынған дәлелдемелерді бағалайды.","basis":"ҚР Азаматтық процестік кодексі, дәлелдеу және дәлелдемелер туралы нормалар."},{"num":4,"type":"multi","q":"Сот қандай дәлелдемелерді салыстырады?","options":["Жауапкердің жарнамасын шарт өзгерісі ретінде","Қызметкерлердің жеке жазбаларын міндетті заң ретінде","Тараптардың үнсіздігін сот шешімі ретінде","Төлем мерзімі мен орындалуын көрсететін деректерді","Компания пікірінің заңды кері күшпен алмастыруын","Қызмет көрсетілгенін растайтын актілерді","Шарт жасалған күнді растайтын құжаттарды"],"answer":[3,5,6],"explanation":"Процесте сот іске қатысты мән-жайларды анықтап, тараптар ұсынған дәлелдемелерді бағалайды.","basis":"ҚР Азаматтық процестік кодексі, дәлелдеу және дәлелдемелер туралы нормалар."}]},{"id":8,"title":"Азаматтық заңдардың ұқсастығына қарай қолданылуы","material":"«Ертіс» ЖШС мен «Сенім» ЖШС жаңа цифрлық қызмет туралы келісім жасады. Қызмет көрсетіліп, ақы төлеу мерзімі өтті. Тараптар арасындағы нақты қосымша техникалық рәсім шартта егжей-тегжейлі реттелмеген. Дауды шешуге тікелей арналған арнайы норма табылмады, бірақ ұқсас шарттық қатынасты реттейтін ережелер бар.","procedure":"Орындаушы сотқа талап қойды. Сот алдымен қолданылатын тікелей нормаларды, шарт талаптарын және тараптардың дәлелдерін тексереді; тиісті тікелей норма болмаса, ұқсас қатынастарды реттейтін нормалардың қолданылуын бағалайды.","questions":[{"num":1,"type":"single","q":"Берілген материалдық-құқықтық жағдайда қандай шешім дұрыс?","options":["Дауды құқықтық бағалаусыз бірден тоқтату","Ұқсас қатынастарды реттейтін норманы қолдану мүмкіндігі","Шартқа қатыссыз қылмыстық санкцияны қолдану","Соттың кез келген ережені еркін ойлап табуы","Тараптың жарнамалық мәлімдемесін міндетті норма ету","Тікелей норма болмаған жағдайда қандай тәсіл алдымен қаралады?","Жауапкердің ішкі хаттамасын заң ретінде қолдану"],"answer":[5],"explanation":"Бұл жауап берілген фабуладағы шарттық құқықтар мен міндеттерді және қолданылатын заң талаптарын ескереді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті нормалар."},{"num":2,"type":"multi","q":"Заң ұқсастығын қолдануға қатысты қандай тұжырымдар орынды?","options":["Ұқсастық азаматтық қатынастың мәніне қайшы келмеуі керек","Алдымен тікелей қолданылатын норма бар-жоғы тексеріледі","Кез келген ішкі ереже заң нормасының орнын басады","Ұқсастық әрқашан жаңа міндетті салық белгілейді","Ұқсастық арқылы сот дәлелдеу міндетін жояды","Ұқсастықпен тараптың келісімін толық елемеуге болады","Ұқсас қатынасты реттейтін норманың мазмұны бағаланады"],"answer":[0,1,6],"explanation":"Бұл жауап берілген фабуладағы шарттық құқықтар мен міндеттерді және қолданылатын заң талаптарын ескереді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті нормалар."},{"num":3,"type":"single","q":"Берілген процестік жағдайда сот қандай әрекет жасауы тиіс?","options":["Сот ұқсастыққа жүгінер алдында не істеуі керек?","Дауды реттейтін тікелей норма мен шарт талаптарын тексеру","Жауапкердің пікірін ресми құқықтық норма деп алу","Тараптардың барлық дәлелдерін қараудан бас тарту","Ұқсас нормаларды іздеуге бірден тыйым салу","Орындау актісін іс материалдарынан алып тастау","Шарт жасалғанын зерттемей талапты қанағаттандыру"],"answer":[0],"explanation":"Процесте сот іске қатысты мән-жайларды анықтап, тараптар ұсынған дәлелдемелерді бағалайды.","basis":"ҚР Азаматтық процестік кодексі, дәлелдеу және дәлелдемелер туралы нормалар."},{"num":4,"type":"multi","q":"Қандай мән-жайлар істі шешуде маңызға ие?","options":["Компанияның маркетингтік ұранының ұзындығы","Орындаушының кеңсе жиһазының түрі","Шартта қызмет пен төлем тәртібінің белгіленуі","Тікелей не ұқсас құқықтық норманың қолданылуы","Қызметтің іс жүзінде көрсетілгені","Тараптың әлеуметтік желідегі жазылушылары","Жауапкердің ұйымдық құрылымының бөлім саны"],"answer":[2,3,4],"explanation":"Процесте сот іске қатысты мән-жайларды анықтап, тараптар ұсынған дәлелдемелерді бағалайды.","basis":"ҚР Азаматтық процестік кодексі, дәлелдеу және дәлелдемелер туралы нормалар."}]},{"id":9,"title":"Азаматтық заңдардағы нормаларды талқылау","material":"Екі компания жеткізу шартында төлем мерзімін «тауар қабылданғаннан кейін он күн ішінде» деп белгіледі. Тауар 2 қарашада актімен қабылданды. Сатып алушы бұл мерзім өз ішкі ережесі бойынша басқа күннен есептеледі деп мәлімдеді. Тараптар шарт мәтінін өзгерткен жоқ.","procedure":"Сатушы сотқа төлемді өндіріп алу туралы талап қойды. Сот шарт мәтінін, қабылдау актісінің күнін және мерзімге қатысты қолданылатын азаматтық нормаларды зерделейді. Жауапкер ішкі ережесін дәлел ретінде ұсынды.","questions":[{"num":1,"type":"single","q":"Берілген материалдық-құқықтық жағдайда қандай шешім дұрыс?","options":["Жауапкердің ішкі ережесін заңнан жоғары","Шарт мерзімін түсіндіруде сот нені негізге алады?","Тараптардың бірінің жарнамалық материалдарын","Сотқа қатысы жоқ өзге шарттың бағасын","Қызметкерлердің бейресми хабарламаларын","Шарт мәтінін және қолданылатын құқық нормаларын","Сатып алушының ауызша пікірін ғана"],"answer":[1],"explanation":"Бұл жауап берілген фабуладағы шарттық құқықтар мен міндеттерді және қолданылатын заң талаптарын ескереді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті нормалар."},{"num":2,"type":"multi","q":"Норманы түсіндіру кезінде қандай амалдар орынды?","options":["Ішкі ережені нормативтік заң деп тану","Норманы азаматтық заңнама жүйесімен байланыстыру","Құқықтық норманың сөздік мағынасын ескеру","Құқықтық түсіндірумен төлемді дәлелсіз жою","Қолданылатын норманы мүлде оқымау","Заң мәтінін бір тараптың еркімен алмастыру","Норманың мақсаты мен құқықтық мәнін бағалау"],"answer":[1,2,6],"explanation":"Бұл жауап берілген фабуладағы шарттық құқықтар мен міндеттерді және қолданылатын заң талаптарын ескереді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), тиісті нормалар."},{"num":3,"type":"single","q":"Берілген процестік жағдайда сот қандай әрекет жасауы тиіс?","options":["Қабылдау актісін зерттемей талапты шешеді","Жауапкердің пікірін жеткілікті дәлел деп есептейді","Қабылдау күнін және шарттағы мерзім талабын анықтайды","Төлем мерзімін қызметкердің қалауы бойынша өзгертеді","Мерзімді компанияның жарнамасы бойынша есептейді","Сот шарттағы мерзім жөніндегі дауды қалай тексеруі тиіс?","Шартты автоматты жарамсыз деп таниды"],"answer":[5],"explanation":"Процесте сот іске қатысты мән-жайларды анықтап, тараптар ұсынған дәлелдемелерді бағалайды.","basis":"ҚР Азаматтық процестік кодексі, дәлелдеу және дәлелдемелер туралы нормалар."},{"num":4,"type":"multi","q":"Қандай дәлелдемелер осы дауға тікелей қатысты?","options":["Төлем жасалғанын растайтын құжаттар","Жауапкердің кеңсе бөлмесінің жоспары","Тараптардың басқа тауарға арналған жарнамасы","Қызметкерлердің жұмыс киімінің үлгісі","Тауарды қабылдау актісіндегі күн  анықталады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Айгүл шарт бойынша талапты кімге бағыттауы керек?","options":["Ерланға жауапкер ретінде","Жеке кәсіпкерді тіркеген мемлекеттік органға","Жөндеу жұмысын орындауға тиіс қызметкерге","Кәсіпкердің жабдық жеткізушісіне","Шеберханаға дербес заңды тұлға ретінде","Тапсырысты қабылдаған агентке дербес"],"answer":[0],"explanation":"Жеке кәсіпкер өз атынан мәміле жасайды және кәсіпкерлік қызметі заңды тұлғаның автоматты түрде пайда болуына әкелмейді. Дауда шарт тарапы мен төлемді растайтын дәлелдемелер анықталады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Айгүл талабын негіздеуге қандай дәлелдемелер ұсына алады?","options":["Жөндеушінің жалпы біліктілік куәлігін","Шеберхананың өзге клиенттермен есептерін","Тарапқа қатысы жоқ өзге тапсырыс шартын","Кәсіпкердің қызметке тіркелгені туралы анықтаманы","Тапсырысқа қатысы жоқ жеткізу актісін","Тараптар жасасқан шартты","Аванстың аударылғанын растайтын құжатты"],"answer":[5,6],"explanation":"Жеке кәсіпкер өз атынан мәміле жасайды және кәсіпкерлік қызметі заңды тұлғаның автоматты түрде пайда болуына әкелмейді. Дауда шарт тарапы мен төлемді растайтын дәлелдемелер анықталады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."}]},{"id":22,"title":"Заңды тұлғаның түсінігі мен белгілері","material":"«Самал» ЖШС өз атынан кеңсе жалдады және кеңсе жиһазын сатып алды. Құрылтайшы шарттағы қарызды қоғамның емес, директордың жеке борышы деп көрсетті.","procedure":"Жиһаз жеткізуші қоғамнан төлем талап етті. Сотқа қоғамның тіркелу деректері, шарт және қабылдау актісі ұсынылды.","questions":[{"num":1,"type":"single","q":"Жиһаз сатып алу шартының тарапы кім?","options":["Қоғамның жалғыз құрылтайшысы","Шартқа қол қойған директордың өзі","Жиһазды қабылдаған қызметкер","Қоғам атынан келіссөз жүргізген өкіл","Қоғамның құрылымдық бөлімшесі","Өз атынан шарт жасасқан ЖШС"],"answer":[5],"explanation":"ЖШС өз атынан азаматтық құқықтар мен міндеттер иеленетін заңды тұлға. Қоғамның шарты бойынша талап тиісті заңды тұлғаға қойылады; шарт пен қабылдау құжаттары мән-жайды дәлелдейді.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Заңды тұлғаны сипаттайтын белгілерді таңдаңыз.","options":["Ұйымдық бірлігінің болуы","Қоғам міндеттемелерінің қызметкерлерге өтуі","Қатысушылардың міндетті жеке жауапкершілігі","Қоғамның тіркеусіз құқық субъектісі болуы","Қоғамның мүлкін қатысушылармен теңестіру","Директордың қоғам мүлкіне жеке меншік құқығы","Өз атынан құқықтар мен міндеттер иеленуі"],"answer":[0,6],"explanation":"ЖШС өз атынан азаматтық құқықтар мен міндеттер иеленетін заңды тұлға. Қоғамның шарты бойынша талап тиісті заңды тұлғаға қойылады; шарт пен қабылдау құжаттары мән-жайды дәлелдейді.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Төлемді өндіру талабында негізгі жауапкер кім?","options":["Қоғамның мүлкін басқарған қызметкер","Шарт жасасқан «Самал» ЖШС","Қоғамды тіркеген мемлекеттік орган","Жиһазды жеткізген тасымалдаушы","Шартты бекіткен директор жеке өзі","Қоғамның әрбір қатысушысы бөлек"],"answer":[1],"explanation":"ЖШС өз атынан азаматтық құқықтар мен міндеттер иеленетін заңды тұлға. Қоғамның шарты бойынша талап тиісті заңды тұлғаға қойылады; шарт пен қабылдау құжаттары мән-жайды дәлелдейді.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Талапты дәлелдеуге қандай материалдар тікелей қатысты?","options":["Директордың жеке сатып алу келісімі","Сатып алу шарты","Төлемнің болмағанын көрсететін есеп құжаттары","Жиһаздың нарықтағы орташа бағасы","Тауарды қабылдау актісі","Құрылтайшының жеке борышы туралы мәлімет","Қоғамның өзге жеткізушілермен шарттары"],"answer":[1,2,4],"explanation":"ЖШС өз атынан азаматтық құқықтар мен міндеттер иеленетін заңды тұлға. Қоғамның шарты бойынша талап тиісті заңды тұлғаға қойылады; шарт пен қабылдау құжаттары мән-жайды дәлелдейді.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."}]},{"id":23,"title":"Заңды тұлғалардың түрлері мен нысандары","material":"Үш азамат табыс табу үшін серіктестік құруды шешті. Олар ұйымды «қоғамдық қор» деп атауды ұсынып, пайданы қатысушылар арасында тұрақты бөлуді жоспарлады.","procedure":"Тіркеу құжаттарын дайындау кезінде құрылтайшылар таңдаған ұйымдық-құқықтық нысан мен жоспарланған қызмет мақсаты арасындағы қайшылық анықталды.","questions":[{"num":1,"type":"single","q":"Пайданы қатысушыларға бөлу мақсатына қандай ұйым түрі сәйкес келеді?","options":["Қоғамдық бірлестіктің басқарушы органы","Коммерциялық емес ұйымның филиалы","Қайырымдылық мақсаттағы қоғамдық қор","Мемлекеттік мекеменің шаруашылық бөлімі","Коммерциялық ұйым","Коммерциялық емес қордың қатысушылар жиналысы"],"answer":[4],"explanation":"Пайданы қатысушылар арасында бөлу мақсаты коммерциялық ұйымға тән. Қоғамдық қордың коммерциялық емес мәртебесі мен құрылтайшылар көздеген мақсат өзара сәйкес келуге тиіс.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Нысанды таңдағанда қандай өлшемдер ескеріледі?","options":["Ұйым мүлкін сақтандыру тәсілі","Ұйым кеңсесінің меншік нысаны","Жарнамалық қызметті ұйымдастыру тәсілі","Ұйымның атауын тіркеу тілінің таңдалуы","Қатысушылардың еңбек шарттарының саны","Пайданы бөлу тәртібі","Ұйымның қызмет мақсаты"],"answer":[5,6],"explanation":"Пайданы қатысушылар арасында бөлу мақсаты коммерциялық ұйымға тән. Қоғамдық қордың коммерциялық емес мәртебесі мен құрылтайшылар көздеген мақсат өзара сәйкес келуге тиіс.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Құрылтайшылар тіркеу алдында не істеуі орынды?","options":["Пайда бөлу талабын жарғыдан тыс келісу","Коммерциялық емес нысанды құжатта ғана сақтау","Қор нысанын сақтап, табысты қатысушыларға бөлу","Ұйым мақсатын тіркеуден кейін ауызша өзгерту","Мақсатына сәйкес ұйымдық-құқықтық нысанды нақтылау","Құрылтайшылардың жеке шартын тіркеуге теңестіру"],"answer":[4],"explanation":"Пайданы қатысушылар арасында бөлу мақсаты коммерциялық ұйымға тән. Қоғамдық қордың коммерциялық емес мәртебесі мен құрылтайшылар көздеген мақсат өзара сәйкес келуге тиіс.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Тіркеу мәселесін қарағанда қандай құжаттар маңызды?","options":["Құрылтай құжаттары","Ұйымдық-құқықтық нысан туралы мәліметтер","Қатысушылардың жеке табыс декларациялары","Ұйымның жоспарланған жарнама шарттары","Құрылтайшылардың өзара қарыз шарттары","Болашақ қызметкерлердің еңбек шарттары","Кеңсені жалдау шартының қосымшалары"],"answer":[0,1],"explanation":"Пайданы қатысушылар арасында бөлу мақсаты коммерциялық ұйымға тән. Қоғамдық қордың коммерциялық емес мәртебесі мен құрылтайшылар көздеген мақсат өзара сәйкес келуге тиіс.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."}]},{"id":24,"title":"Заңды тұлғаның құқық қабілеттілігі","material":"«Арман» ЖШС директоры қоғам атынан жеткізу шартына қол қойды. Жарғыда директордың мәміле жасау өкілеттігі көзделген. Қоғам кейін шартты директордың жеке мәмілесі деп атады.","procedure":"Жеткізуші шарттың орындалуын талап етті. Тараптар жарғыны, директорды тағайындау құжатын және қол қойылған шартты ұсынды.","questions":[{"num":1,"type":"single","q":"Директор тиісті өкілеттік шегінде кімнің атынан әрекет етті?","options":["Директордың жеке кәсіпкерлігі атынан","«Арман» ЖШС атынан","Қоғамның жалғыз қатысушысы атынан","Қоғамның қызметкерлері атынан бөлек","Жеткізушінің өкілі ретінде","Қоғамның құрылтайшысы атынан"],"answer":[1],"explanation":"Заңды тұлғаның органы тиісті өкілеттік шегінде ұйым атынан әрекет етеді. Өкілеттік жарғы, тағайындау құжаты және мәміленің мазмұны арқылы бағаланады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Қоғам атынан әрекет етуді бағалауға не қатысты?","options":["Органның өкілеттік шегі","Қоғам қатысушыларының жеке шарттары","Жеткізушінің ішкі басқару өкілеттігі","Қоғамның құрылтайшыларының кредиттері","Директордың жеке мүліктік міндеттемесі","Қоғамның басқа мәмілелеріндегі бағалар","Заңды тұлғаның құқық қабілеттілігі"],"answer":[0,6],"explanation":"Заңды тұлғаның органы тиісті өкілеттік шегінде ұйым атынан әрекет етеді. Өкілеттік жарғы, тағайындау құжаты және мәміленің мазмұны арқылы бағаланады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот өкілеттікті анықтағанда ең алдымен нені зерттейді?","options":["Қоғам қатысушыларының жеке қарыздарын","Қоғамның жарнамаға қатысты шешімдерін","Жеткізушінің басқа тауар бағаларын","Қоғамның басқа жеткізушілермен есептерін","Жарғы мен директордың мәртебесін растайтын құжаттарды","Директордың жеке азаматтық шарттарын"],"answer":[4],"explanation":"Заңды тұлғаның органы тиісті өкілеттік шегінде ұйым атынан әрекет етеді. Өкілеттік жарғы, тағайындау құжаты және мәміленің мазмұны арқылы бағаланады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Талапты қарауға қандай дәлелдемелер қатысты?","options":["Жеткізушінің басқа тапсырыстар тізімі","Қол қойылған шарт","Директордың жеке банктік міндеттемесі","Қоғамның үшінші тұлғалармен келісімдері","Директорды тағайындау туралы құжат","Жарғыдағы өкілеттік туралы ереже","Қоғамның жарнамалық қызмет шарттары"],"answer":[1,4,5],"explanation":"Заңды тұлғаның органы тиісті өкілеттік шегінде ұйым атынан әрекет етеді. Өкілеттік жарғы, тағайындау құжаты және мәміленің мазмұны арқылы бағаланады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."}]},{"id":25,"title":"Заңды тұлғаның органдары","material":"«Дала» ЖШС-нің директоры қоғам атынан қызмет көрсету шартын жасады. Қатысушылар жиналысы директорды бұрын қызметтен босатқан, бірақ контрагент бұл шешім туралы білмеген.","procedure":"Қызмет көрсетуші ақы өндіру туралы талап қойды. Сотқа жиналыс хаттамасы, шарт және директордың өкілеттігі туралы мәліметтер берілді.","questions":[{"num":1,"type":"single","q":"Дауда шешуші мәнге ие мәселе қайсы?","options":["Шартты жасаудың келіссөз тәртібі","Қызмет көрсетушінің ұйымдық нысаны","Шартқа қол қойған тұлғаның өкілеттігі","Қызметтің шарт бойынша нарықтық бағасы","Қызмет көрсетушінің салық мәртебесі","Қоғамның жылдық кірісінің мөлшері"],"answer":[2],"explanation":"Директор өкілеттігінің тоқтатылуы мен үшінші тұлғаның бұл туралы хабардар болуы құқықтық бағалауға әсер етуі мүмкін. Сот шарт жасалған сәттегі өкілеттікті және тараптардың адалдығын анықтайды.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Орган өкілеттігін бағалауға не қатысты?","options":["Заңды тұлғаның құрылтай құжаттары","Қоғамның басқа шарттар бойынша төлемдері","Директордың жеке қарыз міндеттемелері","Қоғамның жарғылық капиталының мөлшері","Органды тағайындау не босату туралы шешім","Қызмет көрсетушінің өзге клиенттері","Қоғам қызметкерлерінің еңбек өтілі"],"answer":[0,4],"explanation":"Директор өкілеттігінің тоқтатылуы мен үшінші тұлғаның бұл туралы хабардар болуы құқықтық бағалауға әсер етуі мүмкін. Сот шарт жасалған сәттегі өкілеттікті және тараптардың адалдығын анықтайды.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот алдымен қандай даулы фактіні анықтауы қажет?","options":["Қызмет көрсетушінің тіркелген мекенжайын","Шарттағы айыппұл мөлшерін","Қоғамның қызмет түрін өзгерткенін","Қатысушылардың пайда бөлу тәртібін","Шарттағы қызметтің орташа бағасын","Шарт жасалған күні қол қоюшының өкілеттігі болған-болмағанын"],"answer":[5],"explanation":"Директор өкілеттігінің тоқтатылуы мен үшінші тұлғаның бұл туралы хабардар болуы құқықтық бағалауға әсер етуі мүмкін. Сот шарт жасалған сәттегі өкілеттікті және тараптардың адалдығын анықтайды.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Қандай дәлелдемелер өкілеттік мәселесін шешуге көмектеседі?","options":["Директордың жеке мүліктік шарттарын","Өкілеттік туралы ресми деректер","Қатысушылар жиналысының хаттамасы","Қызмет көрсетушінің жеке салық есебін","Қоғамның басқа клиенттермен шарттарын","Қоғамның өзге мәмілелерінің бағасын","Қол қойылған шарт"],"answer":[1,2,6],"explanation":"Директор өкілеттігінің тоқтатылуы мен үшінші тұлғаның бұл туралы хабардар болуы құқықтық бағалауға әсер етуі мүмкін. Сот шарт жасалған сәттегі өкілеттікті және тараптардың адалдығын анықтайды.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."}]},{"id":26,"title":"Заңды тұлғаның атауы","material":"«Тұлпар Сервис» ЖШС нарықта осы атаумен жұмыс істейді. Басқа ұйым өз атауын соған өте ұқсас етіп тіркеп, клиенттерді шатастыратын жарнама жариялады.","procedure":"Бірінші ұйым атауды пайдалануға қатысты дауды сотқа жеткізді. Ол тіркеу мәліметтерін, жарнамаларды және клиенттердің шатасуын растайтын құжаттарды ұсынды.","questions":[{"num":1,"type":"single","q":"Даудың негізгі нысанасы қандай?","options":["Ұйымның корпоративтік басқару тәртібі","Жұмыскерлердің еңбек қатынастары","Тараптар арасындағы жалдау шартын орындау","Тауар жеткізу шартының орындалуы","Компанияның жарғылық капиталын өзгерту","Заңды тұлғаны дараландыратын атауды пайдалану"],"answer":[5],"explanation":"Заңды тұлғаның фирмалық атауы оны дараландырады. Дауда атаулардың ұқсастығы, қолданылуы және шатастыру ықтималдығы нақты дәлелдемелермен бағаланады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Атауға қатысты дауда қандай жағдайлар маңызды?","options":["Компаниялардың шарттық берешектерінің мөлшері","Ұйымдардың қызметкерлер санының айырмасы","Ұйымдардың жарғылық капиталының теңдігі","Екі қоғамның қатысушылар құрамының бірдейлігі","Компаниялардың басшыларының өкілеттіктері","Атауларды пайдалану арқылы шатастыру ықтималдығы","Ұйымдардың ресми атаулары"],"answer":[5,6],"explanation":"Заңды тұлғаның фирмалық атауы оны дараландырады. Дауда атаулардың ұқсастығы, қолданылуы және шатастыру ықтималдығы нақты дәлелдемелермен бағаланады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Талап қоюшы қандай қорғау тәсілін сұрауы мүмкін?","options":["Қарсы тараптың өзге брендтерін түгел жоюды","Екінші қоғамның барлық мүлкін өзіне беруді","Компанияның құрылтайшысын жауапкер деп ауыстыруды","Қарсы тараптың барлық шарттарын жарамсыз тануды","Компанияның тіркелген қызметін толық тоқтатуды","Құқық бұзатын атауды пайдалануды тоқтатуды"],"answer":[5],"explanation":"Заңды тұлғаның фирмалық атауы оны дараландырады. Дауда атаулардың ұқсастығы, қолданылуы және шатастыру ықтималдығы нақты дәлелдемелермен бағаланады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Қандай дәлелдемелер тікелей қатысты?","options":["Қызметкерлердің еңбек шарттарын","Заңды тұлғаларды тіркеу деректері","Компаниялардың салық төлеу тарихын","Компаниялардың өзге жеткізу шарттарын","Даулы атау көрсетілген жарнамалар","Шатасу фактісін растайтын материалдар","Қатысушылардың жеке мүлік тізімдерін"],"answer":[1,4,5],"explanation":"Заңды тұлғаның фирмалық атауы оны дараландырады. Дауда атаулардың ұқсастығы, қолданылуы және шатастыру ықтималдығы нақты дәлелдемелермен бағаланады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."}]},{"id":27,"title":"Филиалдар мен өкілдіктер","material":"«Орда» ЖШС басқа қалада филиал ашты. Филиал басшысы берілген сенімхат шегінде жабдық сатып алу шартын жасады. Сатушы ақысын ала алмады.","procedure":"Сатушы талапты филиалға дербес заңды тұлға ретінде берді. Сот филиалдың құқықтық мәртебесін және негізгі қоғамның қатысуын анықтауы керек.","questions":[{"num":1,"type":"single","q":"Филиалдың құқықтық мәртебесі қандай?","options":["Тіркеуші органның жергілікті бөлімшесі","Негізгі қоғамның дербес кредиторы","Ол заңды тұлғаның оқшауланған бөлімшесі","Басшыға тиесілі дербес кәсіпорын","Сатушының шарттық өкілдігі","Негізгі қоғамның жеке құрылтайшысы"],"answer":[2],"explanation":"Филиал дербес заңды тұлға емес. Сенімхат шегінде филиал басшысы жасаған мәміледен туатын құқықтар мен міндеттер негізгі заңды тұлғаға қатысты қаралады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Филиал жасаған мәмілені бағалауға не қатысты?","options":["Филиал басшысының сенімхаты","Филиалдың қоғамға қатысушы болуы","Негізгі заңды тұлғаның мәртебесі","Филиалдың дербес заңды тұлға мәртебесі","Филиалдың жеке жарғылық капиталы","Филиалдың қоғамнан бөлек меншік құқығы","Басшының өз атынан шартқа отыруы"],"answer":[0,2],"explanation":"Филиал дербес заңды тұлға емес. Сенімхат шегінде филиал басшысы жасаған мәміледен туатын құқықтар мен міндеттер негізгі заңды тұлғаға қатысты қаралады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сатушы талапты кімге бағыттауы тиіс?","options":["Қоғамның барлық қатысушыларына бөлек","Негізгі «Орда» ЖШС-не","Филиал басшысына жеке борышкер ретінде","Қоғамды тіркеген мемлекеттік органға"," роцестік кодексі."},{"num":2,"type":"multi","q":"Заңды тұлғаның құрылуын бағалауға қандай деректер қатысты?","options":["Болашақ директордың еңбек өтілі","Мемлекеттік тіркеу күні","Сатушының өзге шарттарының саны","Жарғы жобасының дайындалған күні","Тауардың жеткізілген жері","Құрылтайшылардың жеке кредиттері","Құрылтайшылардың құру туралы шешімі"],"answer":[1,6],"explanation":"Заңды тұлға мемлекеттік тіркеуден өткеннен кейін құқық субъектісі болады. Тіркеуге дейінгі мәміледе кімнің әрекет еткені және кейін міндеттемені кім қабылдағаны маңызды.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Сот алдымен қандай мәселені анықтауы тиіс?","options":["Құрылтайшылардың жоспарланған үлестерін ғана","Жеткізудің болжамды мерзімін ғана","Шарт жасалған сәтте кім құқықтар мен міндеттер қабылдағанын","Тауардың келісілген бағасын ғана","Қоғамның болашақ атауын ғана","Сатушының өзге клиенттерін ғана"],"answer":[2],"explanation":"Заңды тұлға мемлекеттік тіркеуден өткеннен кейін құқық субъектісі болады. Тіркеуге дейінгі мәміледе кімнің әрекет еткені және кейін міндеттемені кім қабылдағаны маңызды.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Дауды шешуге қандай дәлелдемелер қажет?","options":["Құрылтайшылардың жеке қарыз шарттары","Сатушының басқа тауарлар бойынша актілері","Болашақ директордың жеке шарттары","Қоғамның жарнамалық қызмет шарттары","Шарттың түпнұсқасы","Мемлекеттік тіркеу туралы мәліметтер","Құрылтайшылардың шешімі"],"answer":[4,5,6],"explanation":"Заңды тұлға мемлекеттік тіркеуден өткеннен кейін құқық субъектісі болады. Тіркеуге дейінгі мәміледе кімнің әрекет еткені және кейін міндеттемені кім қабылдағаны маңызды.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."}]},{"id":29,"title":"Заңды тұлға қызметінің тоқтатылуы","material":"«Көктем» ЖШС қатысушылары қоғамды тарату туралы шешім қабылдады. Тарату басталғаннан кейін қоғамның жеткізуші алдындағы төленбеген берешегі анықталды.","procedure":"Жеткізуші талаптарын тарату рәсімінде мәлімдеді. Тарату комиссиясы берешекті даулы деп есептеп, растайтын құжаттарды сұратты.","questions":[{"num":1,"type":"single","q":"Тарату туралы шешім берешекке қалай әсер етеді?","options":["Берешек қоғам тіркелген органға ауысады","Берешек таратуды бастаған күні тоқтайды","Берешек қатысушылардың үлесіне автоматты бөлінеді","Берешек директордың жеке міндетіне көшеді","Берешек комиссия мүшелерінің борышына айналады","Берешек тарату рәсімінде ескерілуге тиіс"],"answer":[5],"explanation":"Тарату туралы шешім кредитор алдындағы берешекті автоматты түрде жоймайды. Тарату комиссиясы кредиторлардың талаптарын заңда көзделген тәртіппен қарауға тиіс.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":2,"type":"multi","q":"Тарату кезінде қандай міндеттер маңызды?","options":["Қоғамның берешектерін дәлелсіз есептен шығару","Кредиторлардың талаптарын қарау","Барлық берешекті қатысушыларға жеке бөлу","Тарату туралы шешіммен барлық шартты жою","Қоғамның мүлкі мен міндеттемелерін анықтау","Кредиторлардың талаптарын бірден жою","Қоғамның міндеттемелерін директорға автоматты өткізу"],"answer":[1,4],"explanation":"Тарату туралы шешім кредитор алдындағы берешекті автоматты түрде жоймайды. Тарату комиссиясы кредиторлардың талаптарын заңда көзделген тәртіппен қарауға тиіс.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Жеткізуші өз талабын қандай негізбен мәлімдейді?","options":["Құрылтайшылардың жеке дивиденді ретінде","Қоғамның жарғылық капиталын ұлғайту ретінде","Қоғамның салықтық міндеттемесі ретінде","Комиссия мүшесінің жеке қарызы ретінде","Шарттан туындаған берешек ретінде","Қатысушылардың жеке жарнасы ретінде"],"answer":[4],"explanation":"Тарату туралы шеші не қатысты?","options":["Кредитор талабын қатысушыларға жеке ауыстыру","Тарату шешімімен талапты есептен шығару","Берешекті директордың жеке шотына енгізу","Комиссия шешімін сот актісі деп тану","Тарату құжаттарындағы берешек туралы мәліметтер","Кредитордың талабын қарау тәртібі","Талапты тіркеуші органға автоматты жіберу"],"answer":[4,5],"explanation":"Тарату комиссиясы кредитордың құжатпен расталған талабын белгіленген рәсімде қарайды. Келіспеген кредитор заңда көзделген қорғау тәсілдерін қолдана алады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":3,"type":"single","q":"Кредитор комиссия шешімімен келіспесе қандай әрекет орынды?","options":["Комиссия шешімін сот шешімімен теңестіру","Өзге кредитордан берешекті өндіріп алу","Тіркеу жазбасын кредитордың өзі өзгертуі","Қоғам мүлкін сотқа жүгінбей иелену","Заңда көзделген тәртіппен құқықтарын қорғауға жүгіну","Қоғам директорына жеке айыппұл салу"],"answer":[4],"explanation":"Тарату комиссиясы кредитордың құжатпен расталған талабын белгіленген рәсімде қарайды. Келіспеген кредитор заңда көзделген қорғау тәсілдерін қолдана алады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."},{"num":4,"type":"multi","q":"Кредитор өз талабын негіздеуге не ұсына алады?","options":["Комиссияға жіберілген талап пен жауабын","Тауарды қабылдау актісін","Қоғамның өзге жеткізушілермен есептерін","Қатысушылардың жеке табыс құжаттарын","Тараптар жасасқан шартты","Басқа кредиторлардың жеке қарыздарын","Компанияның басқа шарттық міндеттерін"],"answer":[0,1,4],"explanation":"Тарату комиссиясы кредитордың құжатпен расталған талабын белгіленген рәсімде қарайды. Келіспеген кредитор заңда көзделген қорғау тәсілдерін қолдана алады.","basis":"Құқықтық негіз: ҚР Азаматтық кодексінің жалпы бөлімі және ҚР Азаматтық процестік кодексі."}]},{"id":31,"title":"Заңды тұлғаны қайта құру","material":"«Арна» ЖШС қатысушылары қоғамды екі заңды тұлғаға бөлуді ұйғарды. Бөлу балансы жасалды. Бұрынғы қоғамның жеткізушіге 8 млн теңге берешегі бар; құжатта бұл борыштың кімге өтетіні көрсетілмеген.","procedure":"Жеткізуші төлемді талап етіп сотқа жүгінді. Қайта құрылған ұйымдар борыш бір-біріне жүктелгенін айтып, жауапкершілікті мойындамады.","questions":[{"num":1,"type":"single","q":"Бұл қайта құрудың қай нысаны?","options":["Ерікті тарату","Түрлендіру","Біріктіру","Қосу","Бөлу","Бөліп шығару"],"answer":[4],"explanation":"Бір заңды тұлғаның орнына екі жаңа ұйым құрылатын жағдай бөлуге жатады (АК 45-46-баптар).","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."},{"num":2,"type":"multi","q":"Бөлу кезіндегі құқықтық мирасқорлыққа қатысты қандай тұжырымдар дұрыс?","options":["Қайта құру кредитордың талабын жояды","Құқықтар мен міндеттер құқық мирасқорларына өтеді","Құқық мирасқорлығы құрылтайшыларға жеке жүктеледі","Борыш бөлу балансында көрсетілмесе тоқтатылады","Құқықтар жаңа ұйымдарға тіркеусіз өтеді","Бөлу балансы міндеттемелердің бөлінуін көрсетуге тиіс","Бөлу балансы дау туғызған борышты қамтымайды"],"answer":[1,5],"explanation":"Бөлу кезінде құқықтар мен міндеттер бөлу балансы арқылы мирасқорларға өтеді; даулы міндеттемелер де көрсетілуге тиіс (АК 46-47-баптар).","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."},{"num":3,"type":"single","q":"Борыштың құқық мирасқорын анықтау мүмкін болмаса кредитор қандай талап қоя алады?","options":["Борышты бұрынғы директордан жеке өндіріп алу","Борышты бөлу балансы бекіткен органнан өндіріп алу","Борышты тіркеуші органнан өндіріп алу","Кредитор талабын қайта тіркеуге дейін тоқтату","Қайта құрылған заңды тұлғаларға ортақ жауапкершілік туралы талап","Борышты қатысушылардың үлесіне қарай өндіріп алу"],"answer":[4],"explanation":"Мирасқорды бөлу балансынан анықтау мүмкін болмаса, жаңадан құрылған заңды тұлғалардың ортақ жауапкершілігі туындайды (АК 48-бап).","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."},{"num":4,"type":"multi","q":"Сотта құқық мирасқорлығын анықтау үшін қай құжаттар мәнді?","options":["Бөлуге қатыспаған компанияның жарғысы","Қайта құру туралы шешім","Қоғамның бұрынғы жарнама бюджеті","Мемлекеттік тіркеу деректері","Бөлу балансы","Директордың жеке шот көшірмесі","Жеткізушінің өзге мәмілелері","Құрылтайшылардың жеке мүлік тізімі"],"answer":[1,3,4],"explanation":"Бөлу балансы, қайта ұйымдастыру туралы шешім және тіркеу деректері мирасқорлықтың кімге өткенін анықтауға көмектеседі (АК 45-48-баптар).","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."}]},{"id":32,"title":"Заңды тұлғаның банкроттығы","material":"«Береке» ЖШС бірнеше кредиторға мерзімі өткен ақшалай міндеттемелерін орындай алмай отыр. Компанияның мүлкі мен төлем қабілеттілігі туралы құжаттар дайындалды. Директор жай ғана қарызды мойындау банкроттықты автоматты түрде білдіреді деп мәлімдеді.","procedure":"Кредитор сотқа жүгініп, борышкерге банкроттық рәсімін қолдануды сұрады. Борышкер өзінің қаржылық жағдайын және талаптардың негізін тексеруді талап етті.","questions":[{"num":1,"type":"single","q":"Банкроттықты тану туралы шешімді қандай орган қабылдайды?","options":["Борышкердің құрылтайшылар жиналысы","Кредиторлар комитеті","Мемлекеттік тіркеу органы","Борышкердің аудиторы","Сот","Банкроттық басқарушы"],"answer":[4],"explanation":"Банкрот деп тану сот тәртібімен жүзеге асырылады; директордың мәлімдемесі сот шешімін алмастырмайды.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."},{"num":2,"type":"multi","q":"Банкроттық мәселесін шешуде нелер құқықтық маңызға ие?","options":["Борышкердің кез келген бір төлемді кешіктіруі","Кредитор талаптарының негізділігі","Директордың банкроттық туралы хаты","Құрылтайшының жеке төлем қабілеттілігі","Кредитордың ауызша мәлімдемесі","Борышкердің төлем қабілеттілігі","Заңда көзделген рәсімдік алғышарттар"],"answer":[1,5,6],"explanation":"Банкроттық үшін төлем қабілетсіздігі, кредитор талаптары және заңда көзделген рәсімдік алғышарттар зерттеледі.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."},{"num":3,"type":"single","q":"Кредитордың талаптарын сот қандай тәртіппен бағалайды?","options":["Кредитордың барлық талабын автоматты бекітеді","Директордың мәлімдемесін жеткілікті деп таниды","Соттан тыс есепті сот шешімімен теңестіреді","Борышкердің қарсылығын елемейді","Берешек сомасын ғана негізге алады","Талаптың негізін және заңдағы рәсімдік шарттарды тексереді"],"answer":[5],"explanation":"Сот кредитор талабын және банкроттық туралы арнайы заң талаптарының сақталуын бағалайды.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."},{"num":4,"type":"multi","q":"Сотқа қандай материалдар ұсыну орынды?","options":["Қаржылық жағдай туралы деректер","Берешекті растайтын шарттар","Директордың жеке депозит шарты","Борышкердің өзге клиенттерге ұсынысы","Борышкердің болжамды жарнама жоспары","Кредитордың басқа компанияға берген қарызы","Орындау мерзімін көрсететін құжаттар","Құрылтайшылардың жеке кредит тарихы"],"answer":[0,1,6],"explanation":"Шарт, орындау мерзімі және қаржылық құжаттар берешек пен төлем қабілеттілігін бағалауға қатысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."}]},{"id":33,"title":"Мемлекет азаматтық құқықтық қатынастың қатысушысы ретінде","material":"Қалалық мемлекеттік орган коммуналдық қажеттілік үшін жеткізушімен жабдық сатып алу шартын жасады. Жабдық жеткізілді, бірақ ақы шартта белгіленген мерзімде төленбеді. Орган мемлекет қатысқандықтан азаматтық шарт міндетті емес деп мәлімдеді.","procedure":"Жеткізуші төлемді өндіру туралы талап қойды. Тараптар шартты кім жасасқанын және өкілетті органның қандай міндеттеме алғанын дауласты.","questions":[{"num":1,"type":"single","q":"Бұл дауда мемлекеттің қатысуы шарттың қандай сипатын өзгертпейді?","options":["Жеткізушінің талап қою құқығын тоқтатады","Шартты әкімшілік бұйрыққа айналдырады","Төлем мерзімін біржақты алып тастайды","Шарттың міндеттілігін толық жояды","Қабылданған тауардың бағасын жояды","Азаматтық міндеттеменің орындалу қажеттілігін"],"answer":[5],"explanation":"Мемлекеттің азаматтық айналымға қатысуы шарттық міндеттемелердің орындалуын өздігінен жоққа шығармайды.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."},{"num":2,"type":"multi","q":"Мемлекеттің азаматтық қатынастарға қатысуына қатысты қандай тұжырымдар дұрыс?","options":["Құзыретті органдар мемлекет атынан әрекет етеді","Мемлекет атынан кез келген қызметкер әрекет ете алады","Мемлекеттік шартқа азаматтық құқық қолданылмайды","Мемлекеттік орган шарт бойынша ақы төлеуден босатылады","Мемлекет шартқа қатысқанда әрдайым билік өкілеттігін қолданады","Жеткізуші мемлекеттік органға талап қоя алмайды","Мемлекет азаматтық құқық қатынастарына қатыса алады"],"answer":[0,6],"explanation":"Мемлекет азаматтық құқық қатынастарына қатысады, оның атынан заңда айқындалған құзыреттегі органдар әрекет етеді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."},{"num":3,"type":"single","q":"Сот дауды шешкенде алдымен нені анықтауға тиіс?","options":["Қабылдау актісіне қол қойған адамның жеке табысын","Қала бюджетінің барлық кірісін","Шарт тарапы мен органның өкілеттігін","Орган қызметкерлерінің жеке борышын","Жабдықтың нарықтағы орташа құнын","Жеткізушінің басқа шарттарындағы бағаны"],"answer":[2],"explanation":"Талаптың кімге қойылатыны шарт тарабы мен оны жасасқан органның өкілеттігіне байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."},{"num":4,"type":"multi","q":"Жеткізуші талапты негіздеу үшін нені ұсына алады?","options":["Жеткізушінің басқа тауарлар тізімін","Органның өзге шарттар бойынша есебін","Жасалған шартты","Төлем мерзімін растайтын құжаттарды","Жеткізу және қабылдау актілерін","Органның өзге сатып алуларын","Басқа жеткізушінің баға ұсынысын","Қызметкердің жеке банктік көшірмесін"],"answer":[2,3,4],"explanation":"Шарт, қабылдау актілері және төлем мерзімі туралы құжаттар талаптың негізі мен мөлшерін дәлелдейді.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."}]},{"id":34,"title":"Азаматтық құқық объектілерінің түсінігі және түрлері","material":"«Айша» компаниясы дизайнерден логотипке айрықша құқықты алуға және дайын материалдық макеттерді беруге шарт жасасты. Тараптар логотипке құқық пен қағаздағы макеттер бір объект деп есептеп, шартта олардың берілуін бөлек көрсетпеді.","procedure":"Компания соттан шарт бойынша қандай құқықтар берілгенін анықтауды сұрады. Дизайнер материалдық макеттер берілгенімен, айрықша құқықтың берілуі бөлек қаралуы керегін айтты.","questions":[{"num":1,"type":"single","q":"Материалдық макетті беру нені автоматты түрде білдірмейді?","options":["Макеттің саны туралы келісімді","Макеттің сақталу міндетін","Макеттің нақты тапсырылғанын","Макеттің тасымалдау тәуекелін","Макеттің меншік құқығының берілуін","Логотипке айрықша құқықтың берілуін"],"answer":[5],"explanation":"Материалдық тасымалдағышты тапсыру айрықша құқықты беру мәселесінен ажыратылады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."},{"num":2,"type":"multi","q":"Азаматтық құқық объектілеріне қатысты қай тұжырымдар дұрыс?","options":["Барлық материалдық тасымалдағыш авторлық құқықты автоматты береді","Макеттің қабылдануы лицензияның барлық шартын алмастырады","Зияткерлік қызмет нәтижелері құқық объектісі бола алады","Логотиптің файлын беру айрықша құқықты міндетті өткізеді","Материалдық затқа құқық айрықша құқықпен әрқашан бірдей","Мүліктік құқықтар азаматтық айналымға қатыса алады","Заттар азаматтық құқық объектісі бола алады"],"answer":[2,5,6],"explanation":"Заттар, мүліктік құқықтар және зияткерлік қызмет нәтижелері азаматтық құқық объектілері бола алады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."},{"num":3,"type":"single","q":"Сот құқықтардың берілуін анықтау үшін нені талдайды?","options":["Дизайнердің басқа клиенттерге жасаған макеттерін","Шарттағы құқық беру туралы талаптарды","Логотиптің баспа сапасын","Макеттердің кеңседе сақталу мерзімін","Компанияның басқа тауарларға құқығын","Қағаз макеттерді тасымалдау құнын"],"answer":[1],"explanation":"Айрықша құқықтың ауысу көлемі тараптар жасасқан құқық беру талаптарымен анықталады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."},{"num":4,"type":"multi","q":"Қандай дәлелдемелер құқықтың берілу көлемін анықтауға көмектеседі?","options":["Макеттің кеңседе сақталу актісі","Шарт мәтіні","Баспа қызметінің басқа тапсырыстары","Құқық беру туралы қосымша келісім","Қабылдау-тапсыру құжаттары","Дизайнердің басқа клиенттермен шарттары","Компанияның басқа тауар белгілері","Дизайнердің жеке банк шоты"],"answer":[1,3,4],"explanation":"Шарт пен қосымша келісім құқық беру көлемін, ал қабылдау актісі тапсырылған материалдарды анықтауға көмектеседі.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."}]},{"id":35,"title":"Азаматтық құқықтағы мүлік түсінігі","material":"Борышкердің кредитор алдындағы ақшалай міндеттемесі бар. Борышкерге үшінші тұлға да шарт бойынша қарыз. Кредитор борышкердің мүлкіне тек қоймадағы заттар жатады деп санап, талап ету құқығын есепке алмады.","procedure":"Сотта борышкердің мүліктік құқықтарының құрамы және берешекті өндіріп алудың заңды тәсілдері туралы дау туды.","questions":[{"num":1,"type":"single","q":"Борышкердің үшінші тұлғадан ақша талап ету құқығы қалай сипатталады?","options":["Борышкердің заттай мүлкі ретінде","Мүліктік құқық ретінде","Кредитордың борышкерге қоятын талабы ретінде","Борышкердің жеке басына қатысты құқық ретінде","Үшінші тұлғаның борышкерге меншік құқығы ретінде","Борышкердің міндеттемені орындау тәсілі ретінде"],"answer":[1],"explanation":"Үшінші тұлғадан ақша өндіру мүмкіндігі борышкердің мүліктік талап ету құқығы болып саналады.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."},{"num":2,"type":"multi","q":"Мүлік ұғымына қатысты қай тұжырымдар дұрыс?","options":["Мүлікке міндетті түрде физикалық нысан қажет","Мүлікке мүліктік құқықтар жатуы мүмкін","Мүлікке заттар жатуы мүмкін","Мүлікке ғана жылжымайтын заттар жатады","Мүлікке борышкердің барлық жеке құқықтары жатады","Мүліктік құқықтар азаматтық айналымға түспейді","Мүлік ұғымы ақшалай талаптарды қамтымайды"],"answer":[1,2],"explanation":"Азаматтық құқықтағы мүлік ұғымы заттармен қатар мүліктік құқықтарды да қамтуы мүмкін.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі; қажет болғанда арнайы заңнама."},{"num":3,"type":"single","q":"Сот мүліктік құқықтың барын қандай құжат арқылы тексере алады?","options":["Борышкердің қызметкерлер тізімі арқылы","Үшінші тұлғамен жасалған шарт арқылы","Кредитордың жарнамалық хаты арқылы","Басқа тұлғаның еңбек шарты арқылы","Қоймадағы барлық заттың фотосы арқылы","Борышкердің жеке төлқұжаты арқылы"],"answer":[1],"explanation":"Нақты шешім материалдық құқықтағы құқықтар мен міндеттерді, ал процессуалдық бөлікте талаптың негізін және ұсынылған дәлелдемелерді бағалауға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі және қолданылатын арнайы заңдар."},{"num":4,"type":"multi","q":"Талап ету құқығын бағалауда не маңызды?","options":["Талаптың нақты мөлшері","Борышкердің қызметкерлер саны","Тараптардың жарнамалық шығыны","Шартқа қатысы жоқ жеткізу актісі","Талаптың орындалу мерзімі","Кредитордың кеңсе мекенжайы","Міндеттеменің туындау негізі","Компания логотипінің түсі"],"answer":[0,4,6],"explanation":"Нақты шешім материалдық құқықтағы құқықтар мен міндеттерді, ал процессуалдық бөлікте талаптың негізін және ұсынылған дәлелдемелерді бағалауға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі және қолданылатын арнайы заңдар."}]},{"id":36,"title":"Заттың түсінігі","material":"Екі кәсіпкер бірегей өндірістік станокты сатып алу шартын жасады. Шартта станоктың сериялық нөмірі көрсетілді. Сатушы дәл сондай үлгідегі басқа станокты бергісі келді, ал сатып алушы нақты белгіленген затты талап етті.","procedure":"Сатып алушы шартта көрсетілген станокты беруді талап етіп сотқа жүгінді. Сатушы модель бірдей болғандықтан кез келген станок жарамды деп қарсылық білдірді.","questions":[{"num":1,"type":"single","q":"Сериялық нөмірмен дараланған станок қалай сипатталады?","options":["Тектік белгілерімен ғана анықталған зат","Жеке-дара белгілерімен анықталған зат","Бөлінбейтін мүліктік құқық","Тұтынылатын бір реттік зат","Жеке мүліктік емес игілік","Ақшалай міндеттеме"],"answer":[1],"explanation":"Нақты шешім материалдық құқықтағы құқықтар мен міндеттерді, ал процессуалдық бөлікте талаптың негізін және ұсынылған дәлелдемелерді бағалауға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі және қолданылатын арнайы заңдар."},{"num":2,"type":"multi","q":"Шарттағы затты даралау үшін не мәнді?","options":["Станокқа қатысы жоқ жарнама","Нақты сипаттамасы","Сатып алушының қызметкерлер саны","Сериялық нөмір","Тараптардың дара затты беру жөніндегі келісімі","Сатушының басқа клиенттері","Компанияның салық режимі"],"answer":[1,3,4],"explanation":"Нақты шешім материалдық құқықтағы құқықтар мен міндеттерді, ал процессуалдық бөлікте талаптың негізін және ұсынылған дәлелдемелерді бағалауға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі және қолданылатын арнайы заңдар."},{"num":3,"type":"single","q":"Сот шарттың орындалуын бағалағанда нені тексереді?","options":["Станоктың нарықтағы жалпы танымалдығын","Компания қызметкерлерінің санын","Сатушының жарнама стратегиясын","Сатушының өзге тауарлар бағасын","Сатып алушының кеңсе шығынын","Шартта дәл сол станокты беру көзделгенін"],"answer":[5],"explanation":"Нақты шешім материалдық құқықтағы құқықтар мен міндеттерді, ал процессуалдық бөлікте талаптың негізін және ұсынылған дәлелдемелерді бағалауға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі және қолданылатын арнайы заңдар."},{"num":4,"type":"multi","q":"Дәл сол затты беру міндетін дәлелдейтін не?","options":["Сатушының басқа шарттары","Басқа модельдің жарнамасы","Станокты даралайтын қосымша","Қызметкерлердің еңбек шарттары","Компанияның өзге мүлік тізімі","Кеңсені жалдау актісі","Тараптардың нақты зат туралы хат алмасуы","Сериялық нөмірі бар шарт"],"answer":[2,6,7],"explanation":"Нақты шешім материалдық құқықтағы құқықтар мен міндеттерді, ал процессуалдық бөлікте талаптың негізін және ұсынылған дәлелдемелерді бағалауға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі және қолданылатын арнайы заңдар."}]},{"id":37,"title":"Ақша (валюта). Валюталық қазыналар","material":"Қазақстандағы екі кәсіпкер қызмет көрсету шартында төлем сомасын теңгемен белгіледі. Тапсырыс беруші төлемді келісілген сомадан аз аударып, айырманы шетел валютасы бағамымен өз бетінше қайта есептегенін айтты.","procedure":"Орындаушы соттан төленбеген соманы өндіріп беруді сұрады. Тараптар шарттағы валюта мен нақты төлем мөлшерін дауласты.","questions":[{"num":1,"type":"single","q":"Төлем міндеттемесінің мөлшерін анықтауда бастапқы негіз қандай?","options":["Шарттағы төлем туралы келісім","Төлеушінің жарнамалық бағасы","Төлеушінің кейінгі біржақты есебі","Төлеушінің ішкі бухгалтерлік хаты","Банк қызметкерінің бейресми пікірі","Басқа клиенттің валюта бағамы"],"answer":[0],"explanation":"Нақты шешім материалдық құқықтағы құқықтар мен міндеттерді, ал процессуалдық бөлікте талаптың негізін және ұсынылған дәлелдемелерді бағалауға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі және қолданылатын арнайы заңдар."},{"num":2,"type":"multi","q":"Ақшалай міндеттемені бағалауда қандай деректер маңызды?","options":["Компанияның логотипі","Шартта көрсетілген валюта","Орындаушының кеңсе мекенжайы","Төлем күні мен мерзімі","Басқа тапсырыстың бағасы","Төлемнің нақты сомасы","Қызметкерлердің саны"],"answer":[1,3,5],"explanation":"Нақты шешім материалдық құқықтағы құқықтар мен міндеттерді, ал процессуалдық бөлікте талаптың негізін және ұсынылған дәлелдемелерді бағалауға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі және қолданылатын арнайы заңдар."},{"num":3,"type":"single","q":"Сот дауды шешкенде қандай мәселені анықтайды?","options":["Компанияның жарнамалық шығынын","Шарт бойынша төленуге тиіс және нақты төленген соманы","Орындаушының басқа қызмет бағаларын","Компанияның барлық шетелдік клиенттерін","Тараптардың кеңсе жалдау құнын","Банк қызметкерлерінің еңбек шарттарын"],"answer":[1],"explanation":"Нақты шешім материалдық құқықтағы құқықтар мен міндеттерді, ал процессуалдық бөлікте талаптың негізін және ұсынылған дәлелдемелерді бағалауға байланысты.","basis":"ҚР Азаматтық кодексі (Жалпы бөлім), ҚР Азаматтық процестік кодексі және қолданылатын арнайы заңдар."},{"num":4,"type":"multi","q":"Төлем айырмасын дәлелдеуге не қажет?","options":["Қызметкерлердің демалыс кестесі","Шарт және оның қосымшалары","Компанияның ішкі жарнама жоспары","Басқа клиенттердің төлемдері","Кеңсе жиһазының түгендеу актісі","Есеп айырысу туралы құжаттар","Басшының жеке сапар құжаттары","Банктік төлем құжаттары"],"answer":[1,5,7],"explanation":"Нақты шешім материалдық құқықтағы құқықтар мен міндеттерді, ал процессуалдық бөлікте талаптың негізін және ұсынылған дәлелдемелерді бағалауға байланысты.","basis":"ҚР
